; Uploadlimieten voor PHP-FPM / CGI (mod_php leest dezelfde waarden uit de
; root-.htaccess). Het formulier zelf weigert meer dan 10 MB per bestand en
; 20 MB in totaal met een duidelijke melding; deze limieten liggen daarboven,
; zodat de bezoeker die melding ziet en geen lege foutpagina.
upload_max_filesize = 12M
post_max_size = 24M
max_file_uploads = 10
max_execution_time = 120
