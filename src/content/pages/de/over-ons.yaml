proza:
  - "Von Twente aus arbeiten wir für Maschinenbauer, Apparatebauer und die Industrie in den gesamten Niederlanden. Viele Bearbeitungsschritte — vom Laserschneiden bis zur Oberflächenbehandlung — führen wir im eigenen Haus aus. Das hält die Durchlaufzeiten kurz und macht Qualität nachweisbar."
  - "Von Einzelstücken bis zur Serie und vom einzelnen Bauteil bis zur kompletten Baugruppe: Sie haben einen Ansprechpartner, der den gesamten Prozess überblickt — von der Konstruktion bis zur fertigen Baugruppe."
