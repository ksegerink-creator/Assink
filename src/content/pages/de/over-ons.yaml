proza:
  - >-
    Assink & Schipholt bearbeitet seit 1919 Metall und wuchs mit der Industrie
    in Twente. Auf der ältesten Fassadenaufnahme in unserem Archiv steht
    „Constructies · Plaatwerken en Sanitair“ — Konstruktionen, Blecharbeiten und
    Sanitär; auf einer späteren Aufnahme steht „IJzerconstructies“,
    Eisenkonstruktionen. Zwischen diesen beiden Schriftzügen liegt die
    Entwicklung des Betriebs: von breitem Installations- und Konstruktionsbau
    für die Umgebung zu Blechbearbeitung und Konstruktionen für die Industrie.
  - >-
    Die Frage ist im Kern dieselbe geblieben: jemand braucht Metall, das in
    seine Maschine oder Anlage passt. Die Art der Herstellung nicht. Wo die
    Arbeit früher von Hand angerissen, geschnitten und geschweißt wurde, läuft
    sie heute über Laserschneiden, Rohrlaserschneiden, Abkanten sowie Roboter-
    und Laserschweißen, mit der Nachbearbeitung im eigenen Haus.
  - >-
    Unsere Fachkräfte bilden wir selbst aus, als SBB-anerkannter
    Ausbildungsbetrieb. Deshalb stehen nach mehr als hundert Jahren noch immer
    Menschen in der Halle, die wissen, wie sich Metall verhält.
