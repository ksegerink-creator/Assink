# Duitse vertaling. Foto's bewust weggelaten: beeld komt uit de NL-bron.
seoTitel: Über uns
seoOmschrijving: >-
  Assink & Schipholt bearbeitet seit 1919 Metall in Hengelo: Blechbearbeitung,
  Konstruktionen und Baugruppen für Maschinenbau und Industrie. Erfahrene
  Fachkräfte, moderner Maschinenpark, ein Ansprechpartner.
heroKicker: "Über uns · Hengelo (NL)"
heroTitelRegel1: "Mehr als ein Jahrhundert"
heroTitelRegel2: "Metallbearbeitung"
lead: "Assink & Schipholt ist ein Metallbearbeitungsbetrieb in Hengelo (Twente, Overijssel), der seit 1919 Metall bearbeitet. Die Kombination aus erfahrenen Fachkräften, einem modernen Maschinenpark und kurzen Wegen macht uns zu einem zuverlässigen Produktionspartner — vom einzelnen Bauteil bis zur kompletten Baugruppe."
