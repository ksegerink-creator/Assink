seoOmschrijving: >-
  Assink & Schipholt bearbeitet seit 1919 Metall in Hengelo: Blechbearbeitung,
  Konstruktionen und Baugruppen für Maschinenbau und Industrie. Erfahrene
  Fachkräfte, moderner Maschinenpark, ein Ansprechpartner.
