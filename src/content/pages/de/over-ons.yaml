proza:
  - >-
    Assink & Schipholt begann 1919 mit Konstruktionsbau, Blecharbeiten und
    Sanitär. Was einst breites Handwerk für Betriebe und Privatkunden war, wuchs
    mit der Twenter Industrie. Heute konzentrieren wir uns auf Präzisionsblech
    und Konstruktionen für Maschinenbau und Industrie.
  - >-
    Die Technik hat sich verändert, der Ausgangspunkt nicht: Teile herstellen,
    die stimmen und in die Anwendung passen, für die sie gedacht sind.
  - >-
    Wo Blech früher von Hand angerissen, geschnitten und geschweißt wurde,
    verfügen wir heute über moderne Technik für Laserschneiden,
    Rohrlaserschneiden, Abkanten, Roboterschweißen und Laserschweißen. Von
    einzelnen Edelstahlteilen bis zu zusammengesetzten Blechbaugruppen:
    Fertigung und Nachbearbeitung übernehmen wir so weit wie möglich im eigenen
    Haus.
  - >-
    Auch das Handwerk halten wir nah. Als SBB-anerkannter Ausbildungsbetrieb
    bilden wir neue Fachkräfte selbst aus. So verbinden wir mehr als ein
    Jahrhundert Erfahrung mit der Produktionstechnik von heute.
