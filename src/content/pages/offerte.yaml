seoTitel: "Vraag een offerte aan"
seoOmschrijving: "Vraag een offerte aan voor plaatwerk, constructies of samenstellingen. Deel uw tekening of onderdeel met de specialisten van Assink & Schipholt in Hengelo."
kicker: "Offerte aanvragen"
titel: "Tekening klaar? Wij ook."
lead: "Bespreek uw tekening, onderdeel of samenstelling met onze specialisten. Van enkelstuks tot serie — u krijgt een concrete offerte met levertijdindicatie."
werkFoto: "/src/assets/uploads/offerte/werkFoto.jpg"
stappen:
  - { titel: "Deel uw tekening", tekst: "Stuur een PDF-tekening en een 3D STEP-bestand — met of zonder materiaalkeuze." }
  - { titel: "Maakbaarheidscheck", tekst: "Wij beoordelen maakbaarheid, materiaal en bewerkingen." }
  - { titel: "Offerte", tekst: "U ontvangt een heldere offerte met levertijdindicatie." }

# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  seoTitel: Request a quote
  seoOmschrijving: Send us your drawing, part or assembly and receive a clear quotation with an indication
    of lead time. From one-offs to series — Assink & Schipholt, Hengelo.
  kicker: Request a quote
  titel: Drawing ready? So are we.
  lead: Discuss your drawing, part or assembly with our specialists. From one-offs to series — you will
    receive a concrete quotation with an indication of lead time.
  stappen:
  - titel: Share your drawing
    tekst: Send a PDF drawing and a 3D STEP file — with or without a specified material.
  - titel: Manufacturability check
    tekst: We assess manufacturability, material and required operations.
  - titel: Quotation
    tekst: You receive a clear quotation with an indication of lead time.

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  seoTitel: Angebot anfragen
  seoOmschrijving: Senden Sie uns Ihre Zeichnung, Ihr Bauteil oder Ihre Baugruppe und erhalten Sie ein klares
    Angebot mit Lieferzeitangabe. Von Einzelstücken bis zur Serie — Assink & Schipholt, Hengelo.
  kicker: Angebot anfragen
  titel: Zeichnung fertig? Wir auch.
  lead: Besprechen Sie Ihre Zeichnung, Ihr Bauteil oder Ihre Baugruppe mit unseren Spezialisten. Von Einzelstücken
    bis zur Serie — Sie erhalten ein konkretes Angebot mit Lieferzeitangabe.
  stappen:
  - titel: Zeichnung übermitteln
    tekst: Senden Sie eine PDF-Zeichnung und eine 3D-STEP-Datei — mit oder ohne Materialangabe.
  - titel: Fertigbarkeitsprüfung
    tekst: Wir prüfen Fertigbarkeit, Material und erforderliche Bearbeitungsschritte.
  - titel: Angebot
    tekst: Sie erhalten ein klares Angebot mit Lieferzeitangabe.
