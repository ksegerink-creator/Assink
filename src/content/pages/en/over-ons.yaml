  - { jaar: "20th century", tekst: "Grew into an all-round specialist in sheet metal and structural work for regional industry." }
  - { jaar: "Today", tekst: "Modern, partly automated production: laser cutting, tube laser, laser welding and in-house finishing." }
  - { jaar: "Now", tekst: "One production partner from engineering to finished assembly for machine building and industry." }
