proza:
  - >-
    Assink & Schipholt has been working metal since 1919 and grew along with
    industry in Twente. The oldest facade photograph in our archive reads
    “Constructies · Plaatwerken en Sanitair” — structures, sheet metal work and
    sanitary installations; a later photograph reads “IJzerconstructies”, iron
    structures. Between those two signs lies the development of the company:
    from broad installation and construction work for the region to sheet metal
    and structures for industry.
  - >-
    The question has stayed much the same: someone needs metal that fits their
    machine or installation. The way it is made has not. Where the work used to
    be laid out, cut and welded by hand, it now runs through laser cutting, tube
    laser cutting, press braking and robot and laser welding, with finishing in
    house.
  - >-
    We train our own skilled professionals as an SBB-accredited training
    company. That is why, after more than a hundred years, there are still
    people on the floor who know how metal behaves.
