seoTitel: Over ons
seoOmschrijving: >-
  Assink & Schipholt is een metaalbedrijf in Hengelo, actief in metaalbewerking
  sinds 1919. Traditioneel vakmanschap met moderne, geautomatiseerde productie.
heroKicker: Over ons · Hengelo (Ov.)
heroTitelRegel1: Meer dan een eeuw
heroTitelRegel2: metaalbewerking
heroFoto: /src/assets/uploads/over-ons/heroFoto.jpg
lead: >-
  Van constructiewerk naar precisieplaatwerk — sinds 1919
