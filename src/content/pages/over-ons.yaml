proza:
  - >-
    Assink & Schipholt bestaat sinds 1919 en groeide mee met de industrie in
    Twente. Op de oudste gevelfoto uit ons archief staat “Constructies ·
    Plaatwerken en Sanitair”; op een latere foto is dat “IJzerconstructies”
    geworden. Tussen die twee opschriften zit de ontwikkeling van het bedrijf:
    van breed installatie- en constructiewerk voor de omgeving naar plaatwerk
    en constructies voor de industrie.
  - >-
    De vraag is in de kern dezelfde gebleven: iemand heeft metaal nodig dat past
    in zijn machine of installatie. De manier waarop het gemaakt wordt niet.
    Waar het werk vroeger met de hand werd uitgezet, geknipt en gelast, gaat het
    nu via lasersnijden, buislasersnijden, kanten en robot- en laserlassen, met
    de afwerking in eigen huis.
  - >-
    Onze vakmensen leiden we zelf op, als SBB-erkend leerbedrijf. Daarom staan er
    na ruim honderd jaar nog steeds mensen op de vloer die weten hoe metaal zich
    gedraagt.
