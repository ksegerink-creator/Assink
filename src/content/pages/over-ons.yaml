lead: "Assink & Schipholt bewerkt al sinds 1919 metaal in Hengelo. De combinatie van ervaren vakmensen, een modern machinepark en korte lijnen maakt ons een betrouwbare productiepartner — van enkel onderdeel tot complete samenstelling."
