proza:
  - "Vanuit Twente werken wij voor machinebouwers, apparatenbouwers en industrie in heel Nederland. Veel bewerkingen — van lasersnijden tot oppervlaktebehandeling — doen we in eigen huis. Dat houdt doorlooptijden kort en kwaliteit aantoonbaar."
  - "Van enkelstuks tot serie en van los onderdeel tot complete samenstelling: u heeft één aanspreekpunt dat het hele traject overziet — van engineering tot afgewerkte samenstelling."
