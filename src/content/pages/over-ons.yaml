lead: "Assink & Schipholt is een metaalbedrijf in Hengelo (Twente, Overijssel) dat al sinds 1919 metaal bewerkt. De combinatie van ervaren vakmensen, een modern machinepark en korte lijnen maakt ons een betrouwbare productiepartner — van enkel onderdeel tot complete samenstelling."
