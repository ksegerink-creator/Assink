  - waarde: 8 m
    label: max. bouwhoogte
proza:
  - >-
    Assink & Schipholt begon in 1919 met constructiewerk, plaatwerk en sanitair.
    Wat ooit breed vakwerk voor bedrijven en particulieren was, groeide mee met
    de Twentse industrie. Vandaag richten we ons op precisieplaatwerk en
    constructies voor de machinebouw en industrie.
  - >-
    De techniek veranderde, het uitgangspunt niet: onderdelen maken die kloppen
    en passen in de toepassing waarvoor ze bedoeld zijn.
  - >-
    Waar plaatwerk vroeger met de hand werd uitgezet, geknipt en gelast,
    beschikken we nu over moderne technieken voor lasersnijden,
    buislasersnijden, kanten, robotlassen en laserlassen. Van losse
    RVS-onderdelen tot samengesteld plaatwerk: productie en afwerking verzorgen
    we zoveel mogelijk in eigen huis.
  - >-
    Ook het vakmanschap houden we dichtbij. Als SBB-erkend leerbedrijf leiden we
    nieuwe vakmensen zelf op. Zo combineren we meer dan een eeuw ervaring met de
    productietechniek van nu.
