    Experienced professionals, a modern machine park, one point of contact.
de:
  heroKicker: Über uns · Hengelo (NL)
  heroTitelRegel1: Mehr als ein Jahrhundert
  heroTitelRegel2: Metallbearbeitung
  lead: Von Konstruktionsbau zu Präzisionsblech — seit 1919
  feiten:
    - waarde: '{jaren}'
      label: Jahre Erfahrung
    - waarde: 10 t
      label: max. Stückgewicht
    - waarde: 8 m
      label: max. Bauhöhe
  proza:
    - >-
      Assink & Schipholt begann 1919 mit Konstruktionsbau, Blecharbeiten und
      Sanitär. Was einst breites Handwerk für Betriebe und Privatkunden war,
      wuchs mit der Twenter Industrie. Heute konzentrieren wir uns auf
      Präzisionsblech und Konstruktionen für Maschinenbau und Industrie.
    - >-
      Die Technik hat sich verändert, der Ausgangspunkt nicht: Teile herstellen,
      die stimmen und in die Anwendung passen, für die sie gedacht sind.
    - >-
      Wo Blech früher von Hand angerissen, geschnitten und geschweißt wurde,
      verfügen wir heute über moderne Technik für Laserschneiden,
      Rohrlaserschneiden, Abkanten, Roboterschweißen und Laserschweißen. Von
      einzelnen Edelstahlteilen bis zu zusammengesetzten Blechbaugruppen:
      Fertigung und Nachbearbeitung übernehmen wir so weit wie möglich im
      eigenen Haus.
    - >-
      Auch das Handwerk halten wir nah. Als SBB-anerkannter Ausbildungsbetrieb
      bilden wir neue Fachkräfte selbst aus. So verbinden wir mehr als ein
      Jahrhundert Erfahrung mit der Produktionstechnik von heute.
  historieKop1: Von der Schmiede
  historieKop2: zur modernen Fertigung
  tijdlijn:
    - jaar: '1919'
      tekst: >-
        Gründung in Hengelo — der Beginn von mehr als einem Jahrhundert
        Metallbearbeitung.
    - jaar: 20. Jahrhundert
      tekst: >-
        Entwicklung zum Allround-Spezialisten für Blech- und
        Konstruktionsarbeiten für die regionale Industrie.
    - jaar: Heute
      tekst: >-
        Moderne, teilweise automatisierte Fertigung: Laserschneiden, Rohrlaser,
        Laserschweißen und eigene Nachbearbeitung.
    - jaar: Jetzt
      tekst: >-
        Ein Produktionspartner von der Konstruktion bis zur fertigen Baugruppe
        für Maschinenbau und Industrie.
  archiefKop: Aus dem Archiv
  archiefTekst: >-
    Bilder aus dem eigenen Archiv: die Halle, die Maschinen und die Menschen,
    die hier gearbeitet haben.
  archief:
    - bijschrift: 'Fassadenschrift: Konstruktionen, Blecharbeiten und Sanitär'
    - bijschrift: Eigene Produktionshalle mit Vakuumheber und Blechbearbeitungsmaschinen
  vakEyebrow: Qualität & Handwerkskunst
  vakKop: Nachweisbar gute Arbeit
  vakTekst: >-
    Qualität sichern wir im Prozess: qualifizierte Schweißverfahren,
    Maßkontrolle und Dokumentation pro Auftrag. Als SBB-anerkannter
    Ausbildungsbetrieb bilden wir zudem unsere eigenen Fachkräfte aus.
  pandBijschrift: Oosterveldsingel 18 · 7558 PK Hengelo
  pandArchiefBijschrift: 'Fassadenschrift: Eisenkonstruktionen — Assink & Schipholt'
  seoTitel: Über uns
  seoOmschrijving: >-
    Assink & Schipholt bearbeitet seit 1919 Metall in Hengelo: Blechbearbeitung,
    Konstruktionen und Baugruppen für Maschinenbau und Industrie. Erfahrene
    Fachkräfte, moderner Maschinenpark, ein Ansprechpartner.
