seoTitel: Over ons
seoOmschrijving: >-
  Assink & Schipholt is een metaalbedrijf in Hengelo, actief in metaalbewerking
  sinds 1919. Traditioneel vakmanschap met moderne, geautomatiseerde productie.
en:
  heroKicker: About us · Hengelo, the Netherlands
  heroTitelRegel1: More than a century
  heroTitelRegel2: of metalworking
  lead: From structural work to precision sheet metal — since 1919
  feiten:
    - waarde: '{jaren}'
      label: years of experience
    - waarde: 10 t
      label: max. unit weight
    - waarde: 8 m
      label: max. build height
  proza:
    - >-
      Assink & Schipholt started out in 1919 in structural work, sheet metal and
      sanitary installations. What was once broad craftsmanship for companies
      and private customers grew along with industry in Twente. Today we focus
      on precision sheet metal and structures for machine building and industry.
    - >-
      The technology changed, the principle did not: making parts that are right
      and that fit the application they are meant for.
    - >-
      Where sheet metal used to be laid out, cut and welded by hand, we now have
      modern techniques for laser cutting, tube laser cutting, press braking,
      robot welding and laser welding. From individual stainless steel parts to
      assembled sheet metal work: we carry out production and finishing in house
      wherever possible.
    - >-
      We keep the craft close as well. As an SBB-accredited training company we
      train new professionals ourselves. That is how we combine more than a
      century of experience with today's production technology.
  historieKop1: From forge
  historieKop2: to modern production
  tijdlijn:
