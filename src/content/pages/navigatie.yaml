# De kolommen van het menu "Mogelijkheden".
#
# Alleen de kopjes staan hier. Welke pagina's eronder komen te staan, bepaalt de
# dienstpagina zelf: het veld "Menugroep" kiest de kolom, "Volgorde" de plek
# daarbinnen en "Menunaam" de korte naam. Het sectorenmenu komt uit de
# collectie "Sectoren", en de footer uit het vinkje "In de footer" op de
# dienstpagina's.
megaKolommen:
  - groep: plaatwerk
    titel: Plaatwerk
  - groep: snijden
    titel: Snijden
  - groep: lastechniek
    titel: Lastechniek
  - groep: samenstellen
    titel: Samenstellen

# Komt achter de naam van de overzichtspagina bovenaan een kolom.
overzichtAchtervoegsel: (overzicht)

# Engelse vertaling. Alleen tekst: de groep en de volgorde komen uit het Nederlands hierboven.
en:
  megaKolommen:
    - titel: Sheet metal
    - titel: Cutting
    - titel: Welding
    - titel: Assembly
  overzichtAchtervoegsel: (overview)

# Duitse vertaling. Alleen tekst: de groep en de volgorde komen uit het Nederlands hierboven.
de:
  megaKolommen:
    - titel: Blechbearbeitung
    - titel: Schneiden
    - titel: Schweißtechnik
    - titel: Zusammenbau
  overzichtAchtervoegsel: (Übersicht)
