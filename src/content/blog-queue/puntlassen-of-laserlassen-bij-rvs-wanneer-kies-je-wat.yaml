titel: "Puntlassen of laserlassen bij RVS: wanneer kies je wat?"
onderwerp: >-
  Zoekdata: 'puntlassen rvs' en 'rvs puntlassen' halen samen 283 vertoningen op positie 44, laserlassen 326 vertoningen op positie 22. Er is dus vraag naar het onderscheid.

  Leg technisch uit waarvoor puntlassen (weerstandlassen) geschikt is en waarvoor laserlassen: warmte-inbreng, vervorming, zichtbaarheid van de naad, dikte en materiaalcombinatie. LET OP: of Assink & Schipholt zelf puntlassen aanbiedt is niet vastgesteld. Beweer daarom niet dat wij het wel of niet doen. Beschrijf de technieken neutraal en verwijs voor wat wél in eigen huis gebeurt met één link naar /plaatwerk/laserlassen/. De redacteur bepaalt bij het aftekenen of hier nog een positionering bij moet.
