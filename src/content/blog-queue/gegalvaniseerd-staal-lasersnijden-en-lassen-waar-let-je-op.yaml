titel: 'Gegalvaniseerd staal lasersnijden en lassen: waar let je op?'
onderwerp: 'Leg uit wat er gebeurt met de zinklaag bij lasersnijden en lassen van gegalvaniseerd staal,
  en wat dat betekent voor de nabewerking en voor coaten. Gebruik de bevestigde diktereeks: gegalvaniseerd
  staal 0,5–10 mm op de Trumpf TruLaser 3040. Leg uit waarom een inkoper vooraf moet aangeven of het deel
  daarna gelast of gecoat wordt. Eén link naar /plaatwerk/staal/.'
kernwoord: gegalvaniseerd staal lasersnijden
