titel: 'Precisieplaatwerk voor de semiconindustrie: afwerking en maatvoering'
onderwerp: 'Voor equipmentbouwers in de semicon. Leg uit waarom een gelijkmatige afwerking en maatvastheid
  tellen bij frames, afschermpanelen, montageplaten en behuizingen, en welke afwerkingen er zijn: geslepen
  RVS met consistente korrel, glasparelstralen van RVS en aluminium, passiveren. Kanten volgens ISO 2768;
  noem geen tolerantie in mm. Assemblage in een cleanroom doen wij NIET: zeg dat waar het past. Eén link
  naar /semicon/.'
kernwoord: plaatwerk semicon
