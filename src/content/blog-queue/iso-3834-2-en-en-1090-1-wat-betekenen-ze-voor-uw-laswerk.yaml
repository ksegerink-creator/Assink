titel: 'ISO 3834-2 en EN 1090-1: wat betekenen ze voor uw laswerk?'
onderwerp: 'Leg in gewone taal uit wat ISO 3834-2 (kwaliteitseisen voor smeltlassen) en EN 1090-1 (CE-markering
  van staalconstructies) inhouden, en wat een inkoper eraan heeft: vastgelegde lasmethodes, gekwalificeerde
  lassers, maatcontrole en herleidbaarheid per order. Wij zijn gecertificeerd volgens ISO 9001, ISO 3834-2
  en EN 1090-1; noem geen uitvoeringsklasse (EXC) of andere normen die niet in de geverifieerde feiten
  staan. Eén link naar /kwaliteit/.'
kernwoord: iso 3834-2 en en 1090-1
