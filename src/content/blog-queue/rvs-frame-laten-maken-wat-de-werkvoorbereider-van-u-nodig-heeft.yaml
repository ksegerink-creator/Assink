titel: "RVS frame laten maken: wat de werkvoorbereider van u nodig heeft"
onderwerp: >-
  Zoekdata: 310 vertoningen, nul kliks, gemiddelde positie 57 — koopintentie, maar wij staan te laag.

  Schrijf een praktische aanlevercheck voor wie een RVS-frame of -samenstelling wil laten maken: tekening of 3D-model en welk formaat, materiaalkeuze (304 of 316), plaatdikte en profielkeuze, toleranties die echt nodig zijn, gewenste nabewerking (ontbramen, stralen, passiveren), aantallen en toepassing. Leg per punt uit waarom het uitmaakt voor maakbaarheid en prijs. Het doel is dat een aanvraag in één keer compleet binnenkomt. Eén link naar /rvs-constructies/ en verwijs naar het offerteformulier. Gebruik voor gewicht en hoogte alleen de geverifieerde cijfers (10 ton, 8 m).
kernwoord: "rvs frame laten maken"
