titel: Waarom RVS passiveren na het lassen?
onderwerp: Leg uit wat passiveren van RVS inhoudt en waarom dit na laswerk
  relevant is voor corrosiebestendigheid. Blijf algemeen en technisch, verzin
  geen specifieke chemische processen, normen of cijfers die niet al op de site
  staan.
