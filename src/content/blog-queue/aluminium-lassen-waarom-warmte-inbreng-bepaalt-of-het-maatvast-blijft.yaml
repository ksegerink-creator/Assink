titel: "Aluminium lassen: waarom warmte-inbreng bepaalt of het maatvast blijft"
onderwerp: >-
  Zoekdata: het aluminiumcluster haalt 1.049 vertoningen en NUL kliks op positie 35. 'aluminium lassen' zelf 195 vertoningen op positie 41; /aluminium-lassen/ krijgt 548 vertoningen en nul kliks.

  Leg uit waarom aluminium anders reageert dan staal: hoge warmtegeleiding, oxidehuid, groter risico op vervorming en op poreusheid bij verkeerde voorbereiding. Wat dat betekent voor voorbereiding, opspannen, naadopbouw en het controleren van maten na het lassen. Praktisch en zonder parameters te verzinnen (geen stroomsterktes, gassoorten of voorwarmtemperaturen die niet in de geverifieerde feiten staan). Eén link naar /aluminium-lassen/.
