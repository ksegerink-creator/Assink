titel: 'Verspaning uitbesteden: wat wij zelf doen en wat de partner doet'
onderwerp: 'LET OP — de dienstpagina /verspaning/ is verdiept en mikt zelf op de commerciele zoektermen
  (verspaningsbedrijf 246 vertoningen op positie 7, verspaning hengelo 159 op positie 8,7, cnc draaien
  overijssel 135 op positie 9,5). Dit artikel moet die pagina aanvullen, niet beconcurreren: schrijf het
  informatief, niet als dienstenpagina.

  Invalshoek: wat komt er kijken bij het uitbesteden van draai- en freeswerk, gezien vanuit een werkvoorbereider
  of inkoper. Welke informatie moet mee met een aanvraag (tekening of 3D-model, materiaal, aantallen,
  toleranties, nabewerking), waarom het uitmaakt of een verspaand deel onderdeel is van een grotere samenstelling,
  en wat een keten met een vaste partner betekent voor doorlooptijd en aanspreekpunt.

  Wees expliciet en zonder omhaal dat Assink & Schipholt het verspaningswerk niet zelf uitvoert maar laat
  maken door een vaste partner, en dat wij de regie, het plaat- en constructiewerk en de samenstelling
  verzorgen. Niet suggereren dat er eigen CNC-machines staan. Eén link naar /verspaning/.'
