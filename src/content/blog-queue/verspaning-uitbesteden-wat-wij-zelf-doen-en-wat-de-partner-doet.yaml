titel: "Verspaning uitbesteden: wat wij zelf doen en wat de partner doet"
onderwerp: >-
  Zoekdata: het verspaningscluster haalt 1.435 vertoningen op gemiddeld positie 20, en /verspaning/ is met 2.186 vertoningen de tweede grootste pagina van de site — voor werk dat wij niet zelf uitvoeren. Die combinatie vraagt om een eerlijk artikel in plaats van meer zoekwoorden.

  Leg uit hoe het werkt: draai- en freeswerk laten wij maken door een vaste partner, wij verzorgen de regie, de plaat- en constructiedelen en de samenstelling. Waarom dat voor een inkoper juist praktisch kan zijn (één aanspreekpunt, één levering, samenstelling in één hand) en wat je moet aanleveren. Wees hierover expliciet en zonder omhaal — niet suggereren dat er eigen CNC-machines staan. Eén link naar /verspaning/ en één naar /machinebouw/.
kernwoord: "verspaningsbedrijf"
