titel: 'Glasparelstralen van RVS en aluminium: wanneer kies je ervoor?'
onderwerp: 'Leg uit wat glasparelstralen doet: een egaal, mat oppervlak en het weghalen van aanloopkleuren
  en verontreiniging. Gebruik de bevestigde gegevens van de straalcabine (8 × 4 × 3 m, glasparels 100–200
  μm, 3,0 bar, voor aluminium en RVS). Maak het verschil duidelijk met passiveren: stralen herstelt de
  oxidelaag niet, passiveren wel; bij RVS en laswerk dus allebei noemen. Eén link naar ons artikel over
  passiveren: /kennisbank/waarom-rvs-passiveren-na-het-lassen/.'
kernwoord: glasparelstralen rvs
