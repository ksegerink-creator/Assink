titel: "Lasersnijden versus buislasersnijden: wanneer kiest u wat?"
onderwerp: >-
  Leg voor een technische inkoper of werkvoorbereider uit wanneer 2D-lasersnijden
  (plaat) de voorkeur heeft en wanneer buislasersnijden (profiel/buis) beter past.
  Baseer je op de machines die Assink & Schipholt zelf heeft: Trumpf TruLaser 3040
  (2D) en Trumpf TruLaser Tube 3000 (buis). Geen nieuwe technische claims of cijfers
  verzinnen die niet al op de site staan.
kernwoord: "buislasersnijden versus lasersnijden"
gebruikt: false
