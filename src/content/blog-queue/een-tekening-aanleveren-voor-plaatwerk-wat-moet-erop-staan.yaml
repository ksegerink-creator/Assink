titel: 'Een tekening aanleveren voor plaatwerk: wat moet erop staan?'
onderwerp: 'Praktisch artikel voor werkvoorbereiders en inkopers: wat heeft een metaalbedrijf nodig om
  snel en juist te kunnen offreren. Wij vragen ALTIJD een PDF-tekening én een 3D STEP-bestand (schrijf
  nooit ''of''). Verder: materiaalsoort en plaatdikte, aantal stuks, gewenste afwerking, welke maten kritisch
  zijn, en of het zichtwerk betreft. Toleranties bij kanten volgens ISO 2768; noem geen tolerantie in
  mm. Eén link naar /offerte/.'
kernwoord: tekening aanleveren plaatwerk
