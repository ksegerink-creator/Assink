titel: 'RVS-plaatwerk voor medische apparatuur: waar let je op?'
onderwerp: 'Voor technische inkopers en engineers bij bouwers van medische en laboratoriumapparatuur.
  Leg uit waar je bij frames, onderstellen, omkastingen en behuizingen op let: materiaalkeuze RVS 304
  of 316, glad afgewerkte lasnaden, passiveren na het lassen en glasparelstralen waar een egaal oppervlak
  gewenst is. Benadruk dat het om de constructie en de buitenkant van apparatuur gaat. Wij zijn NIET gecertificeerd
  volgens ISO 13485, maken geen implantaten of instrumenten en assembleren niet in een cleanroom: zeg
  dat expliciet waar het past, en claim nooit het tegendeel. Eén link naar /medische-industrie/.'
