titel: 'Een staalconstructie laten maken: van tekening tot gelaste samenstelling'
onderwerp: 'Beschrijf de route van een gelaste constructie: beoordeling van de tekening en de lasvolgorde,
  lasersnijden en buislasersnijden, kanten, lassen en samenstellen, maatcontrole en afwerking. Gebruik
  de bevestigde capaciteit: maximaal stukgewicht 10 ton, maximale bouwhoogte 8 m, vijf bovenloopkranen
  van 5 ton (in tandem tot 10 ton). Noem EN 1090-1 voor staalconstructies. Oppervlaktebehandeling zoals
  coaten besteden wij uit. Eén link naar /constructies/.'
kernwoord: staalconstructie laten maken
volgorde: 90
