titel: 'TIG, MIG of MAG lassen: welk lasproces past bij welk materiaal?'
onderwerp: 'Leg het verschil uit tussen TIG, MIG en MAG lassen en wanneer je welk proces kiest: TIG voor
  dunne plaat en zichtwerk in RVS en aluminium, MIG met inert gas voor RVS en aluminium, MAG met actief
  gas voor staal. Noem laserlassen als vierde mogelijkheid in huis. Geen robotlassen of cobot noemen als
  eigen dienst (dat gebeurt binnen de groep bij Baas Metaal). Eén link naar /plaatwerk/lassen/.'
