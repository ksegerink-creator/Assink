h1: Messing plaatwerk
intro: Messing is een koperzink-legering met een warme kleur. Wij verwerken het met behoud van de natuurlijke
  glans voor techniek én zichttoepassingen.
heroPhoto:
  subject: Messing plaatwerkonderdeel met warme glans, detail
  orient: Liggend 16:10
  crop: Detailcrop
  comp: Strijklicht over messing oppervlak
body:
- Messing wordt gewaardeerd om zijn warme kleur en bewerkbaarheid. Wij verwerken messing voor interieurbouw,
  kunstobjecten en decoratieve technische componenten, met aandacht voor het behoud van de natuurlijke
  glans.
- 'Messing is een legering van koper en zink. De verhouding bepaalt het gedrag: meer zink maakt het materiaal
  sterker en beter vervormbaar, meer koper geeft een warmere, rodere kleur. Voor plaatwerk wordt meestal
  een goed vervormbare kwaliteit gekozen, zodat het materiaal bij het kanten niet scheurt.'
- Waar messing zich onderscheidt, is de uitstraling. Het oppervlak heeft een warme, gele glans die met
  geen enkele coating op RVS te benaderen is. Dat maakt het aantrekkelijk voor zichtwerk in interieurs,
  voor kunstobjecten en voor decoratieve technische onderdelen — maar het maakt het oppervlak ook het
  kwetsbaarste deel van het product.
- Messing verkleurt namelijk. In contact met lucht en vocht vormt zich een donkerder patina, eerst geelbruin
  en later bruin tot groenig. Voor sommige toepassingen is dat juist gewenst; voor andere niet. Wilt u
  de glans behouden, dan is een beschermende laklaag nodig — of moet u rekenen op periodiek poetsen. Geef
  bij uw aanvraag door welke van de twee u wilt, want dat bepaalt de afwerking.
- 'In de bewerking vraagt messing vooral zorg voor het oppervlak. Het is zachter dan RVS en staal en krast
  dus makkelijker: wij houden beschermfolie tot en met de laatste bewerking op het materiaal, werken met
  schoon gereedschap en houden messing gescheiden van staal om ijzerinslag te voorkomen. Bij het kanten
  letten wij op de walsrichting, omdat een buiging dwars op de vezel eerder scheurt.'
- 'Welke snijmethode voor uw messing onderdeel het meest geschikt is, bepalen wij per aanvraag: de reflectie
  en de warmtegeleiding van koperlegeringen maken messing lastiger te snijden dan staal of RVS. Stuur
  uw tekening mee met de plaatdikte, de gewenste messingkwaliteit en de eis aan het oppervlak; dan geven
  wij aan wat haalbaar is en welke route wij daarvoor kiezen.'
- Messing laat zich goed combineren met andere materialen. Zoekt u corrosiebestendig zichtwerk zonder
  de warme kleur, dan is <a href="/plaatwerk/rvs/">geslepen RVS</a> vaak de logische keuze; is licht gewicht
  doorslaggevend, dan komt <a href="/plaatwerk/aluminium/">aluminium</a> in beeld. Wij verwerken alle
  drie, dus de materiaalkeuze hoeft niet door de leverancier bepaald te worden.
materials:
- Messing (koperzink-legering)
process:
- step: Snijden
  desc: Nauwkeurig uitsnijden van messing plaat.
- step: Kanten
  desc: Kanten zonder beschadiging van het oppervlak.
- step: Afwerking
