- Kunstobjecten
- Decoratieve technische componenten
faq:
- vraag: Welke plaatdiktes messing kunnen jullie verwerken?
  antwoord: Dat bepalen wij per aanvraag. De snijdiktes die wij op onze fiberlaser bevestigd hebben, gelden
    voor staal, RVS, aluminium en gegalvaniseerd staal; messing is een koperlegering en gedraagt zich
    onder de laser anders. Stuur uw tekening met de plaatdikte en de messingkwaliteit mee, dan geven wij
    aan wat haalbaar is.
- vraag: Verkleurt messing na verloop van tijd?
  antwoord: 'Ja. In contact met lucht en vocht vormt zich een patina: eerst geelbruin, later bruin tot
    groenig. Voor sommige toepassingen is dat juist gewenst. Wilt u de oorspronkelijke glans behouden,
    dan is een beschermende laklaag nodig of moet er periodiek gepoetst worden.'
- vraag: Kunnen jullie messing kanten zonder het oppervlak te beschadigen?
  antwoord: Ja. Messing is zachter dan RVS en staal en krast dus sneller. Wij laten beschermfolie tot
    en met de laatste bewerking zitten, werken met schoon gereedschap en houden rekening met de walsrichting,
    omdat een buiging dwars op de vezel eerder scheurt.
- vraag: Waarvoor wordt messing plaatwerk vooral gebruikt?
  antwoord: Voor interieurbouw, kunstobjecten en decoratieve technische componenten — toepassingen waarin
    de warme, gele glans het verschil maakt. Voor puur functionele delen zonder zichteis is RVS of aluminium
    meestal voordeliger.
- vraag: Kunnen jullie messing lassen?
  antwoord: Messing staat bij ons als materiaal voor laserlassen. Wel vraagt het vanwege het zink in de
    legering om aangepaste parameters en goede afzuiging. Leg uw verbinding voor met de plaatdikte en
    de naadvorm, dan geven wij aan of lassen, solderen of een mechanische verbinding in uw geval de betere
    route is.
