h1: "Plaatwerk voor de elektrotechniek"
intro: "Besturingskasten, montageplaten en behuizingen vragen maatvast plaatwerk: deuren die sluiten, uitsparingen die passen en randen die veilig zijn. Wij snijden, kanten en lassen die delen in staal, RVS en aluminium."
