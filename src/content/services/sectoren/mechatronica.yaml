faq:
- vraag: Welke profielen kunnen jullie buislasersnijden?
  antwoord: Op de Trumpf TruLaser Tube 3000 snijden wij ronde buis tot ø 150 mm en vierkant en rechthoekig profiel
    tot 120 × 120 mm, met een buislengte tot 6500 mm. De wanddikte gaat tot 6 mm in staal en tot 4 mm in RVS. Ligt
    uw profiel daarbuiten, leg het dan voor aan onze werkvoorbereiding.
- vraag: Hoe houden jullie een gelast frame maatvast?
  antwoord: Uitsparingen, gaten en verstekken komen al uit de buislaser, zodat delen bij het hechten op hun plek
    vallen. Wij lassen vervormingsarm met TIG of laser en controleren de maten na het lassen, omdat warmte-inbreng
    een samenstelling kan laten werken.
- vraag: Leveren jullie ook verspaande delen mee?
  antwoord: Verspaande delen betrekken wij van een vaste partner. Zo kunt u een frame met bijbehorende delen bij
    één aanspreekpunt bestellen.
seo:
  title: Plaatwerk voor mechatronica
  description: "Maatvaste machineframes, montagebeugels en afschermpanelen voor mechatronica in aluminium, staal en RVS. Buislasersnijden, kanten tot ± 0,2 mm en vervormingsarm lassen."
