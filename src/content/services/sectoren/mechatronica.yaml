# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Mechatronics
  kicker: Sector
  h1: Sheet metal and frames for mechatronics
  intro: In mechatronics, mechanics, electronics and control come together in very little space. That calls
    for dimensionally stable frames, brackets and panels in which everything falls into place.
  heroPhoto:
    subject: Production engineering at the machine control panel
  body:
  - 'We make machine frames, mounting brackets, cable trays and guard panels — in steel, stainless steel
    and aluminium. Tube laser cutting is often the fastest route here: cut-outs, holes and mitres are already
    in the profile before any welding starts.'
  - For the build-up, dimensional stability is decisive. We bend to ± 0.2 mm and check dimensions after
    welding, because heat input can make an assembly move. Machined parts are sourced from a regular partner.
  materials:
  - Aluminium
  - Steel
  - Stainless steel 304
  - Stainless steel 316
  process:
  - step: Tube laser cutting
    desc: Profiles with cut-outs and mitres.
  - step: Bending
    desc: Dimensionally stable panels and brackets, ± 0.2 mm.
  - step: Welding
    desc: Low-distortion TIG or laser welding.
  - step: Dimensional check
    desc: Measuring after welding.
  applications:
  - Machine frames
  - Mounting brackets
  - Guard panels
  - Cable trays
  related:
  - label: Tube laser cutting
    desc: Profiles in a single operation.
  - label: Machine building
    desc: Complete sub-assemblies.
  - label: Laser welding
    desc: Low-distortion seams.
  kerncijfers:
  - waarde: ± 0.2 mm
    label: bending accuracy
  - waarde: ø 150 mm
    label: max. round tube
  - waarde: 120 × 120 mm
    label: max. box section
  - waarde: 6500 mm
    label: max. tube length
  aanleveren:
  - PDF drawing and a 3D STEP file
  - Material and sheet thickness
  - Number of parts
  - Which dimensions are critical for the assembly
  faq:
  - vraag: Which profiles can you tube laser cut?
    antwoord: On the Trumpf TruLaser Tube 3000 we cut round tube up to ø 150 mm and square and rectangular sections
      up to 120 × 120 mm, with a tube length of up to 6500 mm. Wall thickness goes up to 6 mm in steel and up to 4
      mm in stainless steel. If your profile falls outside that range, put it to our production engineering team.
  - vraag: How do you keep a welded frame dimensionally accurate?
    antwoord: Cut-outs, holes and mitres already come off the tube laser, so parts fall into place when tacking. We
      weld with low distortion using TIG or laser and check the dimensions after welding, because heat input can make
      an assembly move.
  - vraag: Do you also supply machined parts?
    antwoord: Machined parts are sourced from a regular partner. That way you can order a frame and its associated
      parts through a single point of contact.
  seo:
    title: Sheet metal for mechatronics
    description: Dimensionally stable machine frames, mounting brackets and guard panels for mechatronics
      in aluminium, steel and stainless steel. Tube laser cutting, bending to ± 0.2 mm and low-distortion
      welding.

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Mechatronik
  kicker: Branche
  h1: Blechbearbeitung und Rahmen für die Mechatronik
  intro: In der Mechatronik treffen Mechanik, Elektronik und Steuerung auf engem Raum zusammen. Das verlangt
    maßhaltige Rahmen, Winkel und Paneele, in denen alles an seinen Platz fällt.
  heroPhoto:
    subject: Arbeitsvorbereitung an der Maschinensteuerung
  body:
  - 'Wir fertigen Maschinenrahmen, Montagewinkel, Kabelkanäle und Schutzpaneele — in Stahl, Edelstahl und
    Aluminium. Rohrlaserschneiden ist hier oft der schnellste Weg: Ausschnitte, Bohrungen und Gehrungen
    sitzen bereits im Profil, bevor geschweißt wird.'
  - Für den Aufbau ist Maßhaltigkeit entscheidend. Wir kanten auf ± 0,2 mm und prüfen die Maße nach dem
    Schweißen, weil die Wärmeeinbringung eine Baugruppe arbeiten lassen kann. Zerspante Teile beziehen wir
    von einem festen Partner.
  materials:
  - Aluminium
  - Stahl
  - Edelstahl 304
  - Edelstahl 316
  process:
  - step: Rohrlaserschneiden
    desc: Profile mit Ausschnitten und Gehrungen.
  - step: Abkanten
    desc: Maßhaltige Paneele und Winkel, ± 0,2 mm.
  - step: Schweißen
    desc: Verzugsarmes WIG- oder Laserschweißen.
  - step: Maßkontrolle
    desc: Messen nach dem Schweißen.
  applications:
  - Maschinenrahmen
  - Montagewinkel
  - Schutzpaneele
  - Kabelkanäle
  related:
  - label: Rohrlaserschneiden
    desc: Profile in einem Arbeitsgang.
  - label: Maschinenbau
    desc: Komplette Baugruppen.
  - label: Laserschweißen
    desc: Verzugsarme Nähte.
  kerncijfers:
  - waarde: ± 0,2 mm
    label: Abkantgenauigkeit
  - waarde: ø 150 mm
    label: max. Rundrohr
  - waarde: 120 × 120 mm
    label: max. Vierkantprofil
  - waarde: 6500 mm
    label: max. Rohrlänge
  aanleveren:
  - PDF-Zeichnung und eine 3D-STEP-Datei
  - Werkstoff und Blechdicke
  - Stückzahl
  - Welche Maße für den Aufbau kritisch sind
  faq:
  - vraag: Welche Profile können Sie rohrlaserschneiden?
    antwoord: Auf der Trumpf TruLaser Tube 3000 schneiden wir Rundrohr bis ø 150 mm sowie Vierkant- und Rechteckprofil
      bis 120 × 120 mm bei einer Rohrlänge bis 6500 mm. Die Wanddicke reicht bis 6 mm in Stahl und bis 4 mm in Edelstahl.
      Liegt Ihr Profil außerhalb dieses Bereichs, legen Sie es unserer Arbeitsvorbereitung vor.
  - vraag: Wie halten Sie einen geschweißten Rahmen maßhaltig?
    antwoord: Ausschnitte, Bohrungen und Gehrungen kommen bereits aus dem Rohrlaser, sodass die Teile beim Heften
      an ihren Platz fallen. Wir schweißen verzugsarm mit WIG oder Laser und kontrollieren die Maße nach dem Schweißen,
      weil der Wärmeeintrag eine Baugruppe arbeiten lassen kann.
  - vraag: Liefern Sie auch zerspante Teile mit?
    antwoord: Zerspante Teile beziehen wir von einem festen Partner. So können Sie einen Rahmen mit den zugehörigen
      Teilen bei einem Ansprechpartner bestellen.
  seo:
    title: Blech für die Mechatronik
    description: Maßhaltige Maschinenrahmen, Montagewinkel und Schutzpaneele für die Mechatronik in Aluminium,
      Stahl und Edelstahl. Rohrlaserschneiden, Abkanten bis ± 0,2 mm und verzugsarmes Schweißen.
