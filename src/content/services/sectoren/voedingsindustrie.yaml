en:
  title: Food industry
  kicker: Sector
  h1: Hygienic stainless steel sheet metal for the food industry
  intro: >-
    Hygienic, corrosion-resistant and cleanable stainless steel sheet metal work
    for the food industry — where accuracy and finishing are essential.
  heroPhoto:
    subject: Stainless steel part for food-processing machinery, hygienically finished
  body:
    - >-
      For the food industry we supply stainless steel sheet metal parts and
      welded constructions with smooth, cleanable surfaces and carefully
      finished weld seams: conveyor guards, cover plates, enclosures and frames
      for process equipment. Stainless steel forms a hard, non-absorbent surface
      that resists chemical cleaning agents — provided the finish is right.
      Scratches, unevenness and weld residue make a surface harder to clean.
    - >-
      Cleanability starts in the design. Chamfered edges, rounded corners and as
      few horizontal surfaces as possible prevent food residue from collecting.
      We choose tolerances so that seams and gaps stay small. For enclosures we
      include access points, removable panels and condensate drainage at the
      engineering stage, so that installation and maintenance stay simple.
    - >-
      Laser welding produces narrow, clean seams with little spatter and minimal
      distortion. We then remove weld oxides, burrs, sharp edges and weld
      spatter, and passivate the stainless steel for corrosion resistance.
      Automated welding for series production is outsourced to a regular
      partner.
    - >-
      Which certification is required differs per customer, but regulations such
      as the European regulation on food contact materials (EU 1935/2004) often
      play a role. We document material choices and processes so that they can
      contribute to meeting them. If you need traceability of stainless steel
      grades and welding consumables for audits, please state this in your
      request.
  materials:
    - Stainless steel 304
    - Stainless steel 316
  process:
    - step: Design
      desc: 'Hygienic detailing: rounded corners, few gaps, no horizontal surfaces.'
    - step: Laser cutting & bending
      desc: Dimensionally accurate parts, so that seams stay small.
    - step: Laser welding
      desc: Narrow, clean seams with minimal distortion.
    - step: Post-processing
      desc: Removing weld oxides, burrs and weld spatter.
    - step: Passivation
      desc: Corrosion protection of the stainless steel.
  specs: []
  kerncijfers: []
  aanleveren: []
  applications:
    - Food processing machinery
    - Process equipment
    - Conveyor guards
    - Enclosures
  faq:
    - vraag: Why is stainless steel the preferred material in the food industry?
      antwoord: >-
        Stainless steel is corrosion-resistant and relatively easy to clean,
        which limits the growth of micro-organisms. It does not react with food
        and resists chemical cleaning agents.
    - vraag: Which surface finish is most suitable?
      antwoord: >-
        Often a smooth, finely ground to matt polished finish with a low
        roughness value. It prevents food residue from building up and makes
        cleaning easier. We match the finish to the product and the cleaning
        process.
    - vraag: How does custom work improve the cleanability of machine parts?
      antwoord: >-
        Custom work lets the design be tailored to ease of cleaning: minimising
        gaps and seams, avoiding sharp corners and keeping inspection and
        maintenance points easy to reach. This reduces the risk of
        contamination.
  related:
    - label: Stainless steel
      desc: Stainless steel sheet metal work.
    - label: Laser welding
      desc: Hygienic seams.
    - label: Stainless steel constructions
      desc: Welded stainless steel assemblies.
  cards: []
  seo:
    title: Hygienic stainless sheet for food
    description: >-
      Hygienic, cleanable stainless steel sheet metal work and welded
      constructions for the food industry: hygienic design, laser welding,
      passivation and documentation for audits.
de:
  title: Lebensmittelindustrie
  kicker: Branche
  h1: Hygienisches Edelstahlblech für die Lebensmittelindustrie
  intro: >-
    Hygienische, korrosionsbeständige und reinigbare Blechbearbeitung in
    Edelstahl für die Lebensmittelindustrie — wo Genauigkeit und Verarbeitung
    entscheidend sind.
  heroPhoto:
    subject: Edelstahlteil für eine Lebensmittelmaschine, hygienisch ausgeführt
  body:
    - >-
      Für die Lebensmittelindustrie liefern wir Blechteile und Konstruktionen
      aus Edelstahl mit glatten, reinigbaren Oberflächen und sorgfältig
      ausgearbeiteten Schweißnähten: Förderbandabdeckungen, Verkleidungsbleche,
      Gehäuse und Rahmen für Prozessanlagen. Edelstahl bildet eine harte, nicht
      saugende Oberfläche, die chemischen Reinigungsmitteln standhält —
      vorausgesetzt, die Oberfläche stimmt. Kratzer, Unebenheiten und
      Schweißrückstände erschweren die Reinigung.
    - >-
      Reinigbarkeit beginnt in der Konstruktion. Angefaste Kanten, abgerundete
      Ecken und möglichst wenige waagerechte Flächen verhindern, dass
      Lebensmittelreste zurückbleiben. Toleranzen wählen wir so, dass Nähte und
      Spalten klein bleiben. Bei Gehäusen berücksichtigen wir schon im
      Engineering Zugänge, herausnehmbare Paneele und Kondensatablauf, damit
      Montage und Wartung einfach bleiben.
    - >-
      Laserschweißen ergibt schmale, saubere Nähte mit wenig Spritzern und
      minimalem Verzug. Danach entfernen wir Anlauffarben, Grate, scharfe Kanten
      und Schweißspritzer und passivieren den Edelstahl für die
      Korrosionsbeständigkeit. Automatisiertes Schweißen für die Serienfertigung
      vergeben wir an einen festen Partner.
    - >-
      Welche Zertifizierung nötig ist, ist von Kunde zu Kunde verschieden, doch
      Vorschriften wie die europäische Verordnung über
      Lebensmittelkontaktmaterialien (EU 1935/2004) spielen oft eine Rolle. Wir
      dokumentieren Werkstoffwahl und Prozesse so, dass sie dazu beitragen
      können. Benötigen Sie für Audits die Rückverfolgbarkeit von Edelstahlgüten
      und Schweißzusätzen, geben Sie das bitte bei der Anfrage an.
  materials:
    - Edelstahl 304
    - Edelstahl 316
  process:
    - step: Konstruktion
      desc: >-
        Hygienische Detaillierung: abgerundete Ecken, wenige Spalten, keine
        waagerechten Flächen.
    - step: Laserschneiden & Abkanten
      desc: Maßhaltige Teile, damit Nähte klein bleiben.
    - step: Laserschweißen
      desc: Schmale, saubere Nähte mit minimalem Verzug.
    - step: Nachbearbeitung
      desc: Anlauffarben, Grate und Schweißspritzer entfernen.
    - step: Passivieren
      desc: Korrosionsschutz des Edelstahls.
  specs: []
  kerncijfers: []
  aanleveren: []
  applications:
    - Lebensmittelmaschinen
    - Prozessanlagen
    - Förderbandabdeckungen
    - Gehäuse
  faq:
    - vraag: >-
        Warum ist Edelstahl in der Lebensmittelindustrie der bevorzugte
        Werkstoff?
      antwoord: >-
        Edelstahl ist korrosionsbeständig und relativ leicht zu reinigen, was
        das Wachstum von Mikroorganismen begrenzt. Er reagiert nicht mit
        Lebensmitteln und ist beständig gegen chemische Reinigungsmittel.
    - vraag: Welche Oberfläche ist am besten geeignet?
      antwoord: >-
        Häufig eine glatte, fein geschliffene bis matt polierte Oberfläche mit
        niedrigem Rauheitswert. Sie verhindert Ablagerungen von
        Lebensmittelresten und erleichtert die Reinigung. Die passende
        Oberfläche stimmen wir auf Produkt und Reinigungsprozess ab.
    - vraag: Wie trägt Maßarbeit zur Reinigbarkeit von Maschinenteilen bei?
      antwoord: >-
        Mit Maßarbeit lässt sich die Konstruktion auf leichte Reinigung
        auslegen: Spalten und Nähte minimieren, scharfe Ecken vermeiden und
        Inspektions- und Wartungspunkte gut zugänglich machen. Das verringert
        das Kontaminationsrisiko.
  related:
    - label: Edelstahl
      desc: Blechbearbeitung in Edelstahl.
    - label: Laserschweißen
      desc: Hygienische Nähte.
    - label: Edelstahlkonstruktionen
      desc: Geschweißte Edelstahl-Baugruppen.
  cards: []
