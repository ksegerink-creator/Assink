faq:
  - vraag: Waarom is RVS een voorkeursmateriaal in de voedingsmiddelenindustrie?
    antwoord: >-
      RVS is corrosiebestendig en relatief eenvoudig te reinigen, waardoor het
      de groei van micro-organismen beperkt. Het reageert niet met
      voedingsmiddelen en is bestand tegen chemische schoonmaakmiddelen.
  - vraag: Welke oppervlakteafwerking is het meest geschikt?
    antwoord: >-
      Vaak een gladde, fijn geslepen tot mat gepolijste afwerking met een lage
      ruwheidswaarde. Die voorkomt ophoping van voedselresten en maakt reinigen
      eenvoudiger. Welke afwerking past, stemmen we af op het product en het
      reinigingsproces.
  - vraag: Hoe draagt maatwerk bij aan de reinigbaarheid van machineonderdelen?
    antwoord: >-
      Met maatwerk kan het ontwerp worden afgestemd op schoonmaakgemak: kieren
      en naden minimaliseren, scherpe hoeken vermijden en inspectie- en
      onderhoudspunten goed bereikbaar maken. Dat beperkt het risico op
      contaminatie.
