h1: Hygiënisch RVS-plaatwerk voor de voedingsindustrie
intro: >-
  Hygiënisch, corrosiebestendig en reinigbaar plaatwerk in RVS voor de
  voedingsindustrie — waar nauwkeurigheid en afwerking essentieel zijn.
fotobank: rvs-product
foto: /src/assets/uploads/services/voedingsindustrie/foto.jpg
heroPhoto:
  subject: RVS-onderdeel voor voedingsmiddelenmachine, hygiënisch afgewerkt
  orient: Liggend 16:10
  crop: Product centraal
  comp: Glad, gepassiveerd RVS
body:
  - >-
    Voor de voedingsindustrie leveren wij RVS-plaatwerk en constructies met
    gladde, reinigbare oppervlakken en zorgvuldig afgewerkte lasnaden:
    transportbandschermen, omkappingsplaten, behuizingen en frames voor
    procesapparatuur. RVS vormt een harde, niet-absorberende oppervlaktelaag die
    bestand is tegen chemische schoonmaakmiddelen — mits de afwerking klopt.
    Krassen, oneffenheden en lasresten maken een oppervlak lastiger te reinigen.
  - >-
    Reinigbaarheid begint in het ontwerp. Afgeschuinde randen, afgeronde hoeken
    en zo min mogelijk horizontale vlakken voorkomen dat voedselresten
    achterblijven. Toleranties kiezen we zo dat naden en kieren klein blijven.
    Bij behuizingen nemen we in de engineering al toegangspunten, uitneembare
    panelen en condensafvoer mee, zodat installatie en onderhoud eenvoudig
    blijven.
  - >-
    Laserlassen geeft smalle, schone naden met weinig spatten en minimale
    vervorming. Daarna verwijderen we lasoxiden, bramen, scherpe randen en
    lasdruppels, en passiveren we het RVS voor de corrosiebestendigheid.
    Geautomatiseerd lassen voor serieproductie besteden we uit aan een vaste
    partner.
  - >-
    Welke certificering nodig is verschilt per klant, maar richtlijnen zoals de
    Europese verordening voor levensmiddelencontactmaterialen (EU 1935/2004)
    spelen vaak mee. Wij documenteren materiaalkeuzes en processen zo dat ze
    daaraan kunnen bijdragen. Heeft u traceerbaarheid van RVS-kwaliteiten en
    lasmaterialen nodig voor audits, geef dat dan vooraf aan bij de aanvraag.
materials:
  - RVS 304
  - RVS 316
process:
  - step: Ontwerp
    desc: >-
      Hygiënisch detailleren: afgeronde hoeken, weinig kieren, geen horizontale
      vlakken.
  - step: Lasersnijden & kanten
    desc: Maatvaste delen, zodat naden klein blijven.
  - step: Laserlassen
    desc: Smalle, schone naden met minimale vervorming.
  - step: Nabewerken
    desc: Lasoxiden, bramen en lasdruppels verwijderen.
  - step: Passiveren
    desc: Corrosiebescherming van het RVS.
