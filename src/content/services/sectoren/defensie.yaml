# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Defence
  kicker: Industry
  h1: Welded structures and sheet metal for defence
  intro: Defence applications call for robust, dimensionally accurate structures with documented welding
    procedures. We make frames, enclosures and welded assemblies in steel, stainless steel and aluminium,
    with dimensional inspection and documentation per order.
  heroPhoto:
    subject: TIG welding close-up
  body:
  - For defence applications we make frames, enclosures and welded assemblies up to 10 tonnes in steel,
    stainless steel and aluminium. Sheet metal is laser cut and bent on the servo-electric press brake;
    assembly and welding take place in house in Hengelo.
  - Our welding falls under ISO 3834-2 and our steel structures are certified to EN 1090-1. Welding
    procedures are documented and dimensional inspections recorded per order, so it stays traceable how a
    part was made. Surface treatment is outsourced to a regular partner.
  materials:
  - Steel
  - Stainless steel 304
  - Stainless steel 316
  - Aluminium
  process:
  - step: Engineering
    desc: Review of drawing, welding sequence and manufacturability.
  - step: Cutting & bending
    desc: Laser cutting from sheet and tube, bending to size.
  - step: Welding & assembly
    desc: Manual and laser welding to documented procedures.
  - step: Inspection & documentation
    desc: Dimensional inspection and records per order.
  applications:
  - Frames
  - Enclosures
  - Welded assemblies up to 10 tonnes
  related:
  - label: Structures
    desc: Welded structural work up to 10 tonnes.
  - label: Stainless steel structures
    desc: Corrosion-resistant assemblies.
  - label: Quality
    desc: Certification and inspection.
  kerncijfers:
  - waarde: 10 t
    label: max. piece weight
  - waarde: 8 m
    label: max. build height
  - waarde: ISO 3834-2
    label: welding
  - waarde: EN 1090-1
    label: steel structures
  aanleveren:
  - PDF drawing and a 3D STEP file
  - Material and sheet thickness
  - Number of parts
  - Which documentation and inspection are required
  faq:
  - vraag: Which standards do you work to?
    antwoord: We work under ISO 9001. Our welding falls under ISO 3834-2, and for steel structures we are certified
      to EN 1090-1. If your project has additional requirements, state them in advance and we will assess whether
      and how we can meet them.
  - vraag: Is it traceable how a part was made?
    antwoord: Yes. We document welding procedures, check material certificates on arrival and record dimensional inspections
      per order. That keeps it traceable which material and which weld are in a part.
  - vraag: Do you also take care of surface treatment?
    antwoord: Surface treatment is outsourced to a regular partner. Glass bead blasting of aluminium and stainless
      steel can be done in house.
  seo:
    title: Welded structures for defence
    description: Frames, enclosures and welded assemblies up to 10 tonnes for defence in steel, stainless steel and aluminium. Welding under ISO 3834-2, EN 1090-1 certified.

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Wehrtechnik
  kicker: Branche
  h1: Geschweißte Konstruktionen und Blech für die Wehrtechnik
  intro: Wehrtechnische Anwendungen verlangen robuste, maßhaltige Konstruktionen mit dokumentierten
    Schweißanweisungen. Wir fertigen Rahmen, Gehäuse und geschweißte Baugruppen aus Stahl, Edelstahl und
    Aluminium, mit Maßkontrolle und Dokumentation je Auftrag.
  heroPhoto:
    subject: WIG-Schweißen in Nahaufnahme
  body:
  - Für wehrtechnische Anwendungen fertigen wir Rahmen, Gehäuse und geschweißte Baugruppen bis 10 Tonnen
    aus Stahl, Edelstahl und Aluminium. Das Blech schneiden wir auf dem Laser und kanten es auf der
    servoelektrischen Abkantpresse; Zusammenbau und Schweißen erfolgen im eigenen Haus in Hengelo.
  - Unsere Schweißarbeiten fallen unter ISO 3834-2, für Stahlkonstruktionen sind wir nach EN 1090-1
    zertifiziert. Schweißanweisungen werden festgelegt und Maßkontrollen je Auftrag erfasst, sodass
    nachvollziehbar bleibt, wie ein Teil gefertigt wurde. Die Oberflächenbehandlung vergeben wir an einen
    festen Partner.
  materials:
  - Stahl
  - Edelstahl 304
  - Edelstahl 316
  - Aluminium
  process:
  - step: Engineering
    desc: Beurteilung von Zeichnung, Schweißfolge und Fertigbarkeit.
  - step: Schneiden & Kanten
    desc: Laserschneiden aus Blech und Rohr, Kanten auf Maß.
  - step: Schweißen & Zusammenbau
    desc: Hand- und Laserschweißen nach festgelegten Verfahren.
  - step: Prüfung & Dokumentation
    desc: Maßkontrolle und Erfassung je Auftrag.
  applications:
  - Rahmen
  - Gehäuse
  - Geschweißte Baugruppen bis 10 Tonnen
  related:
  - label: Konstruktionen
    desc: Geschweißte Konstruktionen bis 10 Tonnen.
  - label: Edelstahlkonstruktionen
    desc: Korrosionsbeständige Baugruppen.
  - label: Qualität
    desc: Zertifizierung und Prüfung.
  kerncijfers:
  - waarde: 10 t
    label: max. Stückgewicht
  - waarde: 8 m
    label: max. Bauhöhe
  - waarde: ISO 3834-2
    label: Schweißen
  - waarde: EN 1090-1
    label: Stahlkonstruktionen
  aanleveren:
  - PDF-Zeichnung und eine 3D-STEP-Datei
  - Werkstoff und Blechdicke
  - Stückzahl
  - Welche Dokumentation und Prüfung erforderlich sind
  faq:
  - vraag: Nach welchen Normen arbeiten Sie?
    antwoord: Wir arbeiten nach ISO 9001. Unsere Schweißarbeiten fallen unter ISO 3834-2, und für Stahlkonstruktionen
      sind wir nach EN 1090-1 zertifiziert. Stellt Ihr Projekt zusätzliche Anforderungen, geben Sie diese vorab an,
      dann prüfen wir, ob und wie wir sie erfüllen können.
  - vraag: Ist nachvollziehbar, wie ein Teil hergestellt wurde?
    antwoord: Ja. Schweißverfahren legen wir fest, Werkstoffzeugnisse prüfen wir bei Eingang und Maßkontrollen dokumentieren
      wir je Auftrag. So bleibt nachvollziehbar, welcher Werkstoff und welche Schweißnaht in einem Teil stecken.
  - vraag: Übernehmen Sie auch die Oberflächenbehandlung?
    antwoord: Die Oberflächenbehandlung vergeben wir an einen festen Partner. Glasperlstrahlen von Aluminium und Edelstahl
      können wir im eigenen Haus erledigen.
  seo:
    title: Schweißkonstruktionen für Wehrtechnik
    description: Rahmen, Gehäuse und Schweißbaugruppen bis 10 t für die Wehrtechnik in Stahl, Edelstahl und Aluminium. Schweißen nach ISO 3834-2, EN 1090-1 zertifiziert.
