  - step: Befestigung
    desc: Einpress- und Blindnietmuttern setzen.
  - step: Nachbearbeitung
    desc: Entgraten, Schleifen oder Strahlen.
  applications:
  - Instrumentengehäuse
  - Montageplatten und Winkel
  - Paneele
  - Kleine Serien
  related:
