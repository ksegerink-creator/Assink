# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Instrumentation & control
  kicker: Sector
  h1: Precision sheet metal for instrumentation and control
  intro: In instrumentation and control the parts are small and the tolerances tight. We cut and bend enclosures,
    mounting frames and panels where a tenth of a millimetre counts.
  heroPhoto:
    subject: Press brake tooling with a sheet metal part
  body:
  - We make instrument enclosures, mounting plates, brackets and frames — often in small series and in stainless
    steel or aluminium. Fits for sensors, glands and connectors are cut along with the part, so assembly
    needs no reworking.
  - 'With thin sheet, fixing needs attention: we set self-clinching and rivet nuts in place, so no loose
    tapped holes or nuts are needed. Edges are deburred by machine, and where the part is on show we supply
    it ground or blasted.'
  materials:
  - Stainless steel 304
  - Stainless steel 316
  - Aluminium
  - Steel
  - Brass
  process:
  - step: Laser cutting
    desc: Fits for sensors and connectors.
  - step: Bending
    desc: Tolerances to ISO 2768.
  - step: Fixings
    desc: Setting self-clinching and rivet nuts.
  - step: Finishing
    desc: Deburring, grinding or blasting.
  applications:
  - Instrument enclosures
  - Mounting plates and brackets
  - Panels
  - Small series
  related:
  - label: Sheet metal work
    desc: Tight tolerances.
  - label: Self-clinching & rivet nuts
    desc: Fixings in thin sheet.
  - label: Bending & forming
    desc: Dimensionally stable bending.
  kerncijfers:
  - waarde: ISO 2768
    label: bending tolerances
  - waarde: 0.5 mm
    label: min. sheet thickness
  - waarde: 3100 mm
    label: press brake length
  aanleveren:
  - PDF drawing and a 3D STEP file
  - Material and sheet thickness
  - Number of parts
  - Which dimensions are critical, and whether it is visible work
  faq:
  - vraag: Do you also make small series?
    antwoord: Yes. One-offs and small series run on the same machines as larger series. With small quantities the
      emphasis is on thinking along about manufacturability, so that an enclosure is right first time.
  - vraag: How do you fasten components in thin sheet metal?
    antwoord: With self-clinching or rivet nuts, which we insert in house. A self-clinching nut gives the strongest
      and flattest connection; we choose a rivet nut when the back is not accessible. In stainless steel sheet metal
      we use stainless steel nuts, to prevent contact corrosion.
  - vraag: What accuracy do you achieve when bending?
    antwoord: On our servo-electric press brake we bend with tolerances to ISO 2768.
      State on the drawing which dimensions are critical and we will focus our inspection on them.
  seo:
    title: Sheet metal for instrumentation
    description: Instrument enclosures, mounting plates and panels for instrumentation in stainless steel and aluminium. Laser cutting and bending to ISO 2768, small series too.

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Mess- & Regeltechnik
  kicker: Branche
  h1: Präzisionsblech für die Mess- und Regeltechnik
  intro: In der Mess- und Regeltechnik sind die Teile klein und die Toleranzen eng. Wir schneiden und kanten
    Gehäuse, Montagerahmen und Paneele, bei denen ein Zehntelmillimeter zählt.
  heroPhoto:
    subject: Abkantwerkzeug mit einem Blechteil
  body:
  - Wir fertigen Instrumentengehäuse, Montageplatten, Winkel und Rahmen — häufig in kleinen Serien und in
    Edelstahl oder Aluminium. Passungen für Sensoren, Verschraubungen und Steckverbinder schneiden wir mit,
    sodass die Montage ohne Nacharbeit möglich ist.
  - 'Bei dünnem Blech ist die Befestigung ein Aufmerksamkeitspunkt: Einpress- und Blindnietmuttern setzen
    wir mit ein, sodass keine losen Gewindebohrungen oder Muttern nötig sind. Kanten werden maschinell entgratet,
    und wo es Sichtflächen sind, liefern wir geschliffen oder gestrahlt.'
  materials:
  - Edelstahl 304
  - Edelstahl 316
  - Aluminium
  - Stahl
  - Messing
  process:
  - step: Laserschneiden
    desc: Passungen für Sensoren und Steckverbinder.
  - step: Abkanten
    desc: Toleranzen nach ISO 2768.
  - step: Befestigung
    desc: Einpress- und Blindnietmuttern setzen.
  - step: Nachbearbeitung
    desc: Entgraten, Schleifen oder Strahlen.
  applications:
  - Instrumentengehäuse
  - Montageplatten und Winkel
  - Paneele
  - Kleine Serien
  related:
  - label: Blechbearbeitung
    desc: Enge Toleranzen.
  - label: Einpress- & Blindnietmuttern
    desc: Befestigung in dünnem Blech.
  - label: Kanten & Biegen
    desc: Maßhaltiges Abkanten.
  kerncijfers:
  - waarde: ISO 2768
    label: Abkanttoleranzen
  - waarde: 0,5 mm
    label: min. Blechdicke
  - waarde: 3100 mm
    label: Abkantlänge
  aanleveren:
  - PDF-Zeichnung und eine 3D-STEP-Datei
  - Werkstoff und Blechdicke
  - Stückzahl
  - Welche Maße kritisch sind und ob es sich um Sichtteile handelt
  faq:
  - vraag: Fertigen Sie auch kleine Serien?
    antwoord: Ja. Einzelstücke und kleine Serien laufen über dieselben Maschinen wie größere Serien. Bei kleinen Stückzahlen
      liegt der Schwerpunkt auf der Fertigungsgerechtheit, damit ein Gehäuse auf Anhieb stimmt.
  - vraag: Wie befestigen Sie Komponenten in dünnem Blech?
    antwoord: Mit Einpress- oder Blindnietmuttern, die wir im eigenen Haus setzen. Eine Einpressmutter ergibt die
      stärkste und flachste Verbindung; eine Blindnietmutter wählen wir, wenn die Rückseite nicht zugänglich ist.
      In Edelstahlblech verwenden wir Edelstahlmuttern, gegen Kontaktkorrosion.
  - vraag: Welche Genauigkeit erreichen Sie beim Abkanten?
    antwoord: Auf unserer servoelektrischen Abkantpresse kanten wir mit Toleranzen nach ISO 2768. Geben Sie auf der Zeichnung an, welche Maße kritisch sind, dann richten wir die Kontrolle darauf
      aus.
  seo:
    title: Blech für die Mess- und Regeltechnik
    description: Instrumentengehäuse, Montageplatten und Paneele für die Mess- und Regeltechnik in Edelstahl und Aluminium. Abkanten nach ISO 2768, auch in kleinen Serien.
