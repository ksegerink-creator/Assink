faq:
- vraag: Maken jullie ook kleine series?
  antwoord: Ja. Enkelstuks en kleine series lopen bij ons over dezelfde machines als grotere series. Bij kleine
    aantallen ligt het accent op meedenken over maakbaarheid, zodat een behuizing in één keer goed is.
- vraag: Hoe bevestigen jullie componenten in dun plaatwerk?
  antwoord: Met pers- of trekmoeren, die wij in eigen huis inzetten. Een persmoer geeft de sterkste en vlakste verbinding;
    een trekmoer kiezen we als de achterzijde niet bereikbaar is. In RVS-plaatwerk gebruiken we RVS-moeren, tegen
    contactcorrosie.
- vraag: Welke nauwkeurigheid halen jullie bij het kanten?
  antwoord: Op onze servo-elektrische kantbank kanten wij met toleranties volgens ISO 2768. Vermeld op de tekening welke maten kritisch zijn, dan richten we de controle daarop in.
seo:
  title: Plaatwerk voor meet- en regeltechniek
  description: "Instrumentbehuizingen, montageplaten en panelen voor meet- en regeltechniek in RVS en aluminium. Lasersnijden en kanten volgens ISO 2768, ook in kleine series."
