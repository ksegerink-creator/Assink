en:
  title: Semiconductor
  kicker: Sector
  h1: Precision sheet metal for the semiconductor industry
  intro: >-
    Equipment builders in the semiconductor industry ask for tight tolerances
    and a clean, even finish. We supply precision sheet metal, frames and panels
    in stainless steel and aluminium.
  heroPhoto:
    subject: Operator at the blasting cabin
  body:
    - >-
      We make frames, guard panels, mounting plates and enclosures for machines
      and modules. Cutting is done on the laser, bending on the servo-electric
      press brake with an accuracy of ± 0.2 mm, and edges are deburred by
      machine.
    - >-
      Evenness of the surface matters here: we supply ground stainless steel
      with a consistent grain, or glass-bead blasted aluminium and stainless
      steel. Where required, we passivate. Assembly in a cleanroom is not part
      of our work; we supply the parts and assemblies.
  materials:
    - Stainless steel 304
    - Stainless steel 316
    - Aluminium
  process:
    - step: Laser cutting
      desc: Dimensionally stable parts and cut-outs.
    - step: Bending
      desc: Tight tolerances, ± 0.2 mm.
    - step: Deburring
      desc: Machine-deburred, burr-free and safe edges.
    - step: Surface
      desc: Grinding, glass-bead blasting or passivation.
  specs: []
  kerncijfers:
    - waarde: ± 0.2 mm
      label: bending accuracy
    - waarde: 8 × 4 × 3 m
      label: blast cabin
    - waarde: 100–200 μm
      label: glass beads
    - waarde: 304 / 316
      label: stainless steel grades
  kenmerken: []
  aanleveren:
    - PDF drawing and a 3D STEP file
    - Material and sheet thickness
    - Number of parts
    - Required surface finish per part
  applications:
    - Frames and modules
    - Guard panels
    - Mounting plates
    - Enclosures
  faq:
    - vraag: Do you assemble in a cleanroom?
      antwoord: >-
        No. Cleanroom assembly is not part of our work. We supply the parts and
        assemblies with the finish you specify.
    - vraag: Which surface finishes do you supply?
      antwoord: >-
        Ground stainless steel with a consistent grain, and glass bead blasted
        stainless steel and aluminium in our 8 × 4 × 3 metre blast cabin, using
        glass beads of 100 to 200 μm. Where necessary we passivate stainless
        steel after welding.
    - vraag: Does the finish stay the same across several series?
      antwoord: >-
        That is what we aim for: every batch gets the same grain and the same
        tolerances, and in assemblies the grain direction runs continuously
        across the individual parts.
  related:
    - label: Sheet metal work
      desc: Tight tolerances.
    - label: Stainless steel sheet metal
      desc: Ground stainless steel for visible surfaces.
    - label: Aluminium
      desc: Lightweight sheet metal.
  cards: []
  seo:
    title: Precision sheet metal for semiconductor
    description: >-
      Precision sheet metal, frames and guard panels for semiconductor equipment
      in stainless steel and aluminium. Bending to ± 0.2 mm and an even surface
      finish.
de:
  title: Halbleiterindustrie
  kicker: Branche
  h1: Präzisionsblech für die Halbleiterindustrie
  intro: >-
    Anlagenbauer in der Halbleiterindustrie verlangen enge Toleranzen und eine
    saubere, gleichmäßige Oberfläche. Wir liefern Präzisionsblech, Rahmen und
    Paneele in Edelstahl und Aluminium.
  heroPhoto:
    subject: Mitarbeiter an der Strahlkabine
  body:
    - >-
      Wir fertigen Rahmen, Schutzpaneele, Montageplatten und Gehäuse für
      Maschinen und Module. Geschnitten wird am Laser, gekantet auf der
      servoelektrischen Abkantpresse mit einer Genauigkeit von ± 0,2 mm, und die
      Kanten werden maschinell entgratet.
    - >-
      Bei der Oberfläche zählt Gleichmäßigkeit: Wir liefern geschliffenen
      Edelstahl mit einheitlicher Körnung oder glasperlgestrahltes Aluminium und
      Edelstahl. Wo nötig, passivieren wir. Die Montage im Reinraum gehört nicht
      zu unserer Arbeit; wir liefern die Teile und Baugruppen an.
  materials:
    - Edelstahl 304
    - Edelstahl 316
    - Aluminium
  process:
    - step: Laserschneiden
      desc: Maßhaltige Teile und Ausschnitte.
    - step: Abkanten
      desc: Enge Toleranzen, ± 0,2 mm.
    - step: Entgraten
      desc: Maschinell gratfreie, sichere Kanten.
    - step: Oberfläche
      desc: Schleifen, Glasperlstrahlen oder Passivieren.
  specs: []
  kerncijfers:
    - waarde: ± 0,2 mm
      label: Abkantgenauigkeit
    - waarde: 8 × 4 × 3 m
      label: Strahlkabine
    - waarde: 100–200 μm
      label: Glasperlen
    - waarde: 304 / 316
      label: Edelstahlgüten
  kenmerken: []
  aanleveren:
    - PDF-Zeichnung und eine 3D-STEP-Datei
    - Werkstoff und Blechdicke
    - Stückzahl
    - Gewünschte Oberfläche je Teil
  applications:
    - Rahmen und Module
    - Schutzpaneele
    - Montageplatten
    - Gehäuse
  faq:
    - vraag: Montieren Sie im Reinraum?
      antwoord: >-
        Nein. Die Montage im Reinraum gehört nicht zu unserer Arbeit. Wir
        liefern die Teile und Baugruppen mit der von Ihnen vorgeschriebenen
        Oberfläche.
    - vraag: Welche Oberflächen liefern Sie?
      antwoord: >-
        Geschliffenen Edelstahl mit gleichmäßigem Schliff sowie
        glasperlgestrahlten Edelstahl und Aluminium aus unserer Strahlkabine von
        8 × 4 × 3 Metern mit Glasperlen von 100 bis 200 μm. Bei Bedarf
        passivieren wir Edelstahl nach dem Schweißen.
    - vraag: Bleibt die Oberfläche über mehrere Serien gleich?
      antwoord: >-
        Darauf achten wir: Jede Charge erhält denselben Schliff und dieselben
        Toleranzen, und bei Baugruppen läuft die Schliffrichtung über die
        einzelnen Teile durch.
  related:
    - label: Blechbearbeitung
      desc: Enge Toleranzen.
    - label: Edelstahl-Blechbearbeitung
      desc: Geschliffener Edelstahl für Sichtflächen.
    - label: Aluminium
      desc: Leichte Blechbearbeitung.
  cards: []
  seo:
    title: Präzisionsblech für Halbleitertechnik
    description: >-
      Präzisionsblech, Rahmen und Schutzpaneele für die Halbleiterindustrie in
      Edelstahl und Aluminium. Abkanten bis ± 0,2 mm und gleichmäßige
      Oberflächen.
