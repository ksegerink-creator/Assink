# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Semiconductor
  kicker: Sector
  h1: Precision sheet metal for the semiconductor industry
  intro: Equipment builders in the semiconductor industry ask for tight tolerances and a clean, even finish.
    We supply precision sheet metal, frames and panels in stainless steel and aluminium.
  heroPhoto:
    subject: Operator at the blasting cabin
  body:
  - We make frames, guard panels, mounting plates and enclosures for machines and modules. Cutting is done
    on the laser, bending on the servo-electric press brake with an accuracy of ± 0.2 mm, and edges are
    deburred by machine.
  - 'Evenness of the surface matters here: we supply ground stainless steel with a consistent grain, or
    glass-bead blasted aluminium and stainless steel. Where required, we passivate. Assembly in a cleanroom
    is not part of our work; we supply the parts and assemblies.'
  materials:
  - Stainless steel 304
  - Stainless steel 316
  - Aluminium
  process:
  - step: Laser cutting
    desc: Dimensionally stable parts and cut-outs.
  - step: Bending
    desc: Tight tolerances, ± 0.2 mm.
  - step: Deburring
    desc: Machine-deburred, burr-free and safe edges.
  - step: Surface
    desc: Grinding, glass-bead blasting or passivation.
  applications:
  - Frames and modules
  - Guard panels
  - Mounting plates
  - Enclosures
  related:
  - label: Precision sheet metal
    desc: Tight tolerances.
  - label: Stainless steel sheet metal
    desc: Ground stainless steel for visible surfaces.
  - label: Aluminium
    desc: Lightweight sheet metal.
  seo:
    title: Precision sheet metal for semiconductor
    description: Precision sheet metal, frames and guard panels for the semiconductor industry in stainless
      steel and aluminium. Bending to ± 0.2 mm, machine deburring and an even surface finish.

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Halbleiterindustrie
  kicker: Branche
  h1: Präzisionsblech für die Halbleiterindustrie
  intro: Anlagenbauer in der Halbleiterindustrie verlangen enge Toleranzen und eine saubere, gleichmäßige
    Oberfläche. Wir liefern Präzisionsblech, Rahmen und Paneele in Edelstahl und Aluminium.
  heroPhoto:
    subject: Mitarbeiter an der Strahlkabine
  body:
  - Wir fertigen Rahmen, Schutzpaneele, Montageplatten und Gehäuse für Maschinen und Module. Geschnitten
    wird am Laser, gekantet auf der servoelektrischen Abkantpresse mit einer Genauigkeit von ± 0,2 mm, und
    die Kanten werden maschinell entgratet.
  - 'Bei der Oberfläche zählt Gleichmäßigkeit: Wir liefern geschliffenen Edelstahl mit einheitlicher Körnung
    oder glasperlgestrahltes Aluminium und Edelstahl. Wo nötig, passivieren wir. Die Montage im Reinraum
    gehört nicht zu unserer Arbeit; wir liefern die Teile und Baugruppen an.'
  materials:
  - Edelstahl 304
  - Edelstahl 316
  - Aluminium
  process:
  - step: Laserschneiden
    desc: Maßhaltige Teile und Ausschnitte.
  - step: Abkanten
    desc: Enge Toleranzen, ± 0,2 mm.
  - step: Entgraten
    desc: Maschinell gratfreie, sichere Kanten.
  - step: Oberfläche
    desc: Schleifen, Glasperlstrahlen oder Passivieren.
  applications:
  - Rahmen und Module
  - Schutzpaneele
  - Montageplatten
  - Gehäuse
  related:
  - label: Präzisionsblech
    desc: Enge Toleranzen.
  - label: Edelstahl-Blechbearbeitung
    desc: Geschliffener Edelstahl für Sichtflächen.
  - label: Aluminium
    desc: Leichte Blechbearbeitung.
  seo:
    title: Präzisionsblech für Halbleitertechnik
    description: Präzisionsblech, Rahmen und Schutzpaneele für die Halbleiterindustrie in Edelstahl und
      Aluminium. Abkanten bis ± 0,2 mm, maschinelles Entgraten und gleichmäßige Oberflächenqualität.
