title: Semicon
slug: semicon
template: service
group: sector
order: 70
inFooter: false
kicker: Sector
h1: Precisieplaatwerk voor de semiconindustrie
intro: >-
  Equipmentbouwers in de semicon vragen krappe toleranties en een schone,
  gelijkmatige afwerking. Wij leveren precisieplaatwerk, frames en panelen in
  RVS en aluminium.
fotobank: straalcabine
foto: /src/assets/uploads/services/semicon/foto.png
heroPhoto:
  subject: Medewerker bij de straalcabine
  orient: Liggend 16:10
  crop: Werkstuk of productie
  comp: Representatief werk uit deze sector
body:
  - >-
    We maken frames, afschermpanelen, montageplaten en behuizingen voor machines
    en modules. Snijden gebeurt op de laser, kanten op de servo-elektrische
    kantbank met een nauwkeurigheid van ± 0,2 mm, en randen worden machinaal
    ontbraamd.
  - >-
    Voor het oppervlak is gelijkmatigheid belangrijk: we leveren geslepen RVS
    met een consistente korrel of glasparelgestraald aluminium en RVS. Waar
    nodig passiveren we. Assemblage in een cleanroom hoort niet bij ons werk;
    wij leveren de delen en samenstellingen aan.
materials:
  - RVS 304
  - RVS 316
  - Aluminium
process:
  - step: Lasersnijden
    desc: Maatvaste delen en uitsparingen.
  - step: Kanten
    desc: Krappe toleranties, ± 0,2 mm.
  - step: Ontbramen
    desc: Machinaal gratvrije, veilige randen.
  - step: Oppervlak
    desc: Slijpen, glasparelstralen of passiveren.
