# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Semiconductor
  kicker: Semiconductor
  h1: Precision without compromise
  intro: In the semiconductor industry every detail counts. Complex structures, tight tolerances and high
    demands on dimensions and finish call for specialist craftsmanship.
  heroPhoto:
    subject: Semiconductor equipment cabinet
  body:
    - At Assink & Schipholt we put our specialist knowledge and craftsmanship to work to realise even the most
      complex structures. From precision sheet metal and high-quality enclosures to complex frames and
      complete assemblies in stainless steel, aluminium and steel. We think along from the first drawing,
      advise on manufacturability and choice of material, and combine smart production techniques with
      accurate finishing and controlled quality.
    - A technically challenging project? Challenge us. Together we make it possible.
    - We make frames, guard panels, mounting plates and enclosures for machines and modules. Cutting is done
      on the laser, bending on the servo-electric press brake with tolerances to ISO 2768, and edges are
      deburred by machine.
    - "Evenness of the surface matters here: we supply ground stainless steel with a consistent grain, or
      glass-bead blasted aluminium and stainless steel. Where required, we passivate. Assembly in a cleanroom
      is not part of our work; we supply the parts and assemblies."
  materials:
    - Steel
    - Stainless steel 304
    - Stainless steel 316
    - Aluminium
  process:
    - step: Laser cutting
      desc: Dimensionally stable parts and cut-outs.
    - step: Bending
      desc: Tolerances to ISO 2768.
    - step: Deburring
      desc: Machine-deburred, burr-free and safe edges.
    - step: Surface
      desc: Grinding, glass-bead blasting or passivation.
  applications:
    - Frames and modules
    - Guard panels
    - Mounting plates
    - Enclosures
  related:
    - label: Sheet metal work
      desc: Tight tolerances.
    - label: Stainless steel sheet metal
      desc: Ground stainless steel for visible surfaces.
    - label: Aluminium
      desc: Lightweight sheet metal.
  kerncijfers:
    - waarde: ISO 2768
      label: bending tolerances
    - waarde: 8 × 4 × 3 m
      label: blast cabin
    - waarde: 100–200 μm
      label: glass beads
    - waarde: 304 / 316
      label: stainless steel grades
  aanleveren:
    - PDF drawing and a 3D STEP file
    - Material and sheet thickness
    - Number of parts
    - Required surface finish per part
  faq:
    - vraag: Do you assemble in a cleanroom?
      antwoord: No. Cleanroom assembly is not part of our work. We supply the parts and assemblies with the finish
        you specify.
    - vraag: Which surface finishes do you supply?
      antwoord: Ground stainless steel with a consistent grain, and glass bead blasted stainless steel and aluminium
        in our 8 × 4 × 3 metre blast cabin, using glass beads of 100 to 200 μm. Where necessary we passivate
        stainless steel after welding.
    - vraag: Does the finish stay the same across several series?
      antwoord: 'That is what we aim for: every batch gets the same grain and the same tolerances, and in assemblies
        the grain direction runs continuously across the individual parts.'
  seo:
    title: Precision sheet metal for semiconductor
    description: Precision sheet metal, frames and guard panels for semiconductor equipment in stainless steel and
      aluminium. Bending to ISO 2768 and an even surface finish.

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Halbleiterindustrie
  kicker: Halbleiterindustrie
  h1: Präzision ohne Kompromisse
  intro: In der Halbleiterindustrie zählt jedes Detail. Komplexe Konstruktionen, enge Toleranzen und hohe
    Anforderungen an Maßhaltigkeit und Oberfläche verlangen spezialisiertes Handwerk.
  heroPhoto:
    subject: Schrank für die Halbleiterindustrie
  body:
    - Bei Assink & Schipholt setzen wir unser Fachwissen und Handwerk ein, um auch die komplexesten
      Konstruktionen umzusetzen. Von Präzisionsblech und hochwertigen Gehäusen bis zu komplexen Rahmen und
      kompletten Baugruppen in Edelstahl, Aluminium und Stahl. Wir denken ab der ersten Zeichnung mit, beraten
      zu Fertigbarkeit und Werkstoffwahl und verbinden durchdachte Fertigungstechniken mit präziser
      Nachbearbeitung und kontrollierter Qualität.
    - Ein technisch anspruchsvolles Projekt? Fordern Sie uns heraus. Gemeinsam machen wir es möglich.
    - Wir fertigen Rahmen, Schutzpaneele, Montageplatten und Gehäuse für Maschinen und Module. Geschnitten
      wird am Laser, gekantet auf der servoelektrischen Abkantpresse mit Toleranzen nach ISO 2768, und die
      Kanten werden maschinell entgratet.
    - "Bei der Oberfläche zählt Gleichmäßigkeit: Wir liefern geschliffenen Edelstahl mit einheitlicher Körnung
      oder glasperlgestrahltes Aluminium und Edelstahl. Wo nötig, passivieren wir. Die Montage im Reinraum
      gehört nicht zu unserer Arbeit; wir liefern die Teile und Baugruppen an."
  materials:
    - Stahl
    - Edelstahl 304
    - Edelstahl 316
    - Aluminium
  process:
    - step: Laserschneiden
      desc: Maßhaltige Teile und Ausschnitte.
    - step: Abkanten
      desc: Toleranzen nach ISO 2768.
    - step: Entgraten
      desc: Maschinell gratfreie, sichere Kanten.
    - step: Oberfläche
      desc: Schleifen, Glasperlstrahlen oder Passivieren.
  applications:
    - Rahmen und Module
    - Schutzpaneele
    - Montageplatten
    - Gehäuse
  related:
    - label: Blechbearbeitung
      desc: Enge Toleranzen.
    - label: Edelstahl-Blechbearbeitung
      desc: Geschliffener Edelstahl für Sichtflächen.
    - label: Aluminium
      desc: Leichte Blechbearbeitung.
  kerncijfers:
    - waarde: ISO 2768
      label: Abkanttoleranzen
    - waarde: 8 × 4 × 3 m
      label: Strahlkabine
    - waarde: 100–200 μm
      label: Glasperlen
    - waarde: 304 / 316
      label: Edelstahlgüten
  aanleveren:
    - PDF-Zeichnung und eine 3D-STEP-Datei
    - Werkstoff und Blechdicke
    - Stückzahl
    - Gewünschte Oberfläche je Teil
  faq:
    - vraag: Montieren Sie im Reinraum?
      antwoord: Nein. Die Montage im Reinraum gehört nicht zu unserer Arbeit. Wir liefern die Teile und Baugruppen
        mit der von Ihnen vorgeschriebenen Oberfläche.
    - vraag: Welche Oberflächen liefern Sie?
      antwoord: Geschliffenen Edelstahl mit gleichmäßigem Schliff sowie glasperlgestrahlten Edelstahl und Aluminium
        aus unserer Strahlkabine von 8 × 4 × 3 Metern mit Glasperlen von 100 bis 200 μm. Bei Bedarf
        passivieren wir Edelstahl nach dem Schweißen.
    - vraag: Bleibt die Oberfläche über mehrere Serien gleich?
      antwoord: 'Darauf achten wir: Jede Charge erhält denselben Schliff und dieselben Toleranzen, und bei
        Baugruppen läuft die Schliffrichtung über die einzelnen Teile durch.'
  seo:
    title: Präzisionsblech für Halbleitertechnik
    description: Präzisionsblech, Rahmen und Schutzpaneele für die Halbleiterindustrie in Edelstahl und Aluminium.
      Abkanten nach ISO 2768 und gleichmäßige Oberflächen.
