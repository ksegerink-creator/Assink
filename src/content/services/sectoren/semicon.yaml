heroPhoto:
  subject: "Semicon kast"
  orient: "Liggend 16:10"
  crop: "Werkstuk of productie"
  comp: "Representatief werk uit deze sector"
body:
  - Bij Assink & Schipholt zetten we onze specialistische kennis en vakmanschap in om ook de meest complexe
    constructies te realiseren. Van precisieplaatwerk en hoogwaardige behuizingen tot complexe frames en
    complete samenstellingen in RVS, aluminium en staal. Wij denken mee vanaf de eerste tekening, adviseren
    over maakbaarheid en materiaalkeuze en combineren slimme productietechnieken met nauwkeurige afwerking en
    gecontroleerde kwaliteit.
  - Een technisch uitdagend project? Daag ons uit. Samen maken we het mogelijk.
  - We maken frames, afschermpanelen, montageplaten en behuizingen voor machines en modules. Snijden gebeurt
    op de laser, kanten op de servo-elektrische kantbank met toleranties volgens ISO 2768, en randen worden
    machinaal ontbraamd.
  - "Voor het oppervlak is gelijkmatigheid belangrijk: we leveren geslepen RVS met een consistente korrel of
    glasparelgestraald aluminium en RVS. Waar nodig passiveren we. Assemblage in een cleanroom hoort niet bij
    ons werk; wij leveren de delen en samenstellingen aan."
