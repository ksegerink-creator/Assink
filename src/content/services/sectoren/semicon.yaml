    label: RVS-kwaliteiten
kenmerken: []
aanleveren:
  - PDF-tekening en een 3D STEP-bestand
  - Materiaalsoort en plaatdikte
  - Aantal stuks
  - Gewenste oppervlakteafwerking per deel
applications:
  - Frames en modules
  - Afschermpanelen
  - Montageplaten
  - Behuizingen
faq:
  - vraag: Assembleren jullie in een cleanroom?
    antwoord: >-
      Nee. Assemblage in een cleanroom hoort niet bij ons werk. Wij leveren de
      delen en samenstellingen aan, met de afwerking die u voorschrijft.
  - vraag: Welke oppervlakteafwerkingen leveren jullie?
    antwoord: >-
      Geslepen RVS met een consistente korrel, en glasparelgestraald RVS en
      aluminium in onze straalcabine van 8 × 4 × 3 meter, met glasparels van 100
      tot 200 μm. Waar nodig passiveren we RVS na het lassen.
  - vraag: Blijft de afwerking gelijk over meerdere series?
    antwoord: >-
      Daar sturen we op: iedere batch krijgt dezelfde korrel en dezelfde
      toleranties, en bij samenstellingen loopt de korrelrichting door over de
      losse delen.
