de:
  title: Offshore
  kicker: Branche
  h1: Konstruktionen und Blechbearbeitung für Offshore
  intro: Offshore ist eine salzige, nasse Umgebung, in der Korrosion und Vibrationen die Arbeit bestimmen.
    Wir fertigen geschweißte Konstruktionen und Blechbauteile in Edelstahl 316 und Stahl, mit qualifizierten
    Schweißverfahren und Dokumentation pro Auftrag.
  heroPhoto:
    subject: Schweißabteilung mit zwei Arbeitsplätzen
  body:
  - 'Für Offshore-Anwendungen liefern wir Rahmen, Gehäuse, Bühnen und geschweißte Baugruppen bis 10 Tonnen.
    Die Materialwahl bestimmt die Lebensdauer: Wo Seewasser hinzukommt, empfehlen wir Edelstahl 316 statt
    304.'
  - Unsere Schweißarbeiten fallen unter ISO 3834-2, für Stahlkonstruktionen sind wir nach EN 1090-1 zertifiziert.
    Materialzeugnisse und Maßkontrollen halten wir pro Auftrag fest, sodass die Nachvollziehbarkeit geregelt
    ist. Konservieren und Beschichten geben wir an einen festen Partner.
  materials:
  - Edelstahl 316
  - Edelstahl 304
  - Stahl
  - Aluminium
  process:
  - step: Materialwahl
    desc: Beratung nach Korrosionsklasse und Anwendung.
  - step: Schneiden & Abkanten
    desc: Laser- und Rohrlaserschneiden, Abkanten.
  - step: Schweißen
    desc: Qualifizierte Verfahren nach ISO 3834-2.
  - step: Prüfung & Dokumentation
    desc: Maßkontrolle und Aufzeichnung pro Auftrag.
  applications:
  - Rahmen und Bühnen
  - Gehäuse
  - Geschweißte Baugruppen bis 10 Tonnen
  related:
  - label: Konstruktionen
    desc: Geschweißte Konstruktionsarbeit bis 10 Tonnen.
  - label: Edelstahlkonstruktionen
    desc: Korrosionsbeständiger Zusammenbau.
  - label: Qualität
    desc: Zertifizierung und Prüfung.
  kerncijfers:
  - waarde: 10 t
    label: max. Stückgewicht
  - waarde: '316'
    label: Edelstahl bei Meerwasser
  - waarde: ISO 3834-2
    label: Schweißen
  - waarde: EN 1090-1
    label: Stahlkonstruktionen
  aanleveren:
  - PDF-Zeichnung und eine 3D-STEP-Datei
  - Werkstoff und Blechdicke
  - Stückzahl
  - Die Umgebung des Bauteils und die gewünschte Dokumentation
  faq:
  - vraag: Edelstahl 304 oder 316 für Offshore?
    antwoord: Wo Meerwasser ins Spiel kommt, empfehlen wir 316 statt 304. In salzhaltiger Umgebung bestimmt die Werkstoffwahl
      weitgehend die Lebensdauer; dazu beraten wir gerne, bevor die Zeichnung endgültig ist.
  - vraag: Welche Zertifizierung haben Sie für Schweißarbeiten?
    antwoord: Unsere Schweißarbeiten fallen unter ISO 3834-2, und für Stahlkonstruktionen sind wir nach EN 1090-1
      zertifiziert. Außerdem arbeiten wir nach ISO 9001.
  - vraag: Übernehmen Sie auch Konservierung und Beschichtung?
    antwoord: Konservieren und Beschichten vergeben wir an einen festen Partner. Sie behalten einen Ansprechpartner;
      wir liefern die Arbeit komplett ab.
  seo:
    title: Offshore — Konstruktionen und Blech
    description: Rahmen, Gehäuse und geschweißte Baugruppen bis 10 Tonnen für Offshore, in Edelstahl 316
      und Stahl. Schweißen unter ISO 3834-2, Stahlkonstruktionen nach EN 1090-1.
