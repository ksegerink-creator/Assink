- vraag: Welke certificering hebben jullie voor laswerk?
  antwoord: Ons laswerk valt onder ISO 3834-2, en voor staalconstructies zijn we gecertificeerd volgens EN 1090-1.
    Daarnaast werken we onder ISO 9001.
- vraag: Verzorgen jullie ook het conserveren en coaten?
  antwoord: Conserveren en coaten besteden wij uit aan een vaste partner. U houdt één aanspreekpunt; wij leveren
    het werk compleet af.
