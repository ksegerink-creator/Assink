# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Equipment manufacturing
  kicker: Sector
  h1: Sheet metal and constructions for equipment manufacturing
  intro: Equipment manufacturers need sheet metal and welded assemblies that fit first time. We make frames,
    casings and enclosures up to 10 tonnes, from a loose part to a finished assembly.
  heroPhoto:
    subject: Welder at the welding bench in the production hall
  body:
  - We supply welded frames, casings, hoppers and enclosures. Because laser cutting, tube laser cutting,
    bending and welding are all under one roof, lead times stay short and any dimensional deviation is quickly
    traced back to its source.
  - For parts that come into contact with product or cleaning agents, we work in stainless steel 304 or
    316 and finish the seams smooth. Passivation and pickling are done in house; powder coating is outsourced.
  materials:
  - Stainless steel 304
  - Stainless steel 316
  - Steel
  - Aluminium
  process:
  - step: Engineering
    desc: Thinking along on manufacturability and welding sequence.
  - step: Cutting & bending
    desc: Laser, tube laser and press brake.
  - step: Welding & assembly
    desc: TIG, MIG/MAG or laser welding up to 10 tonnes.
  - step: Finishing
    desc: Grinding, pickling, passivation or blasting.
  applications:
  - Welded frames
  - Casings and enclosures
  - Hoppers
  - Assemblies up to 10 tonnes
  related:
  - label: Welded constructions
    desc: Structural welded work.
  - label: Stainless steel sheet metal
    desc: Corrosion-resistant sheet metal.
  - label: Industrial enclosures
    desc: Enclosures made to measure.
  seo:
    title: Sheet metal for equipment manufacturing
    description: Frames, casings and enclosures for equipment manufacturing in stainless steel, steel and
      aluminium. Laser cutting, bending and welding up to 10 tonnes under one roof.

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Apparatebau
  kicker: Branche
  h1: Blechbearbeitung und Konstruktionen für den Apparatebau
  intro: Apparatebauer brauchen Blechteile und geschweißte Baugruppen, die auf Anhieb passen. Wir fertigen
    Rahmen, Einhausungen und Gehäuse bis 10 Tonnen, vom einzelnen Bauteil bis zur fertigen Baugruppe.
  heroPhoto:
    subject: Schweißer am Schweißtisch in der Produktionshalle
  body:
  - Wir liefern geschweißte Rahmen, Einhausungen, Trichter und Gehäuse. Weil Laserschneiden, Rohrlaserschneiden,
    Abkanten und Schweißen unter einem Dach stehen, bleiben die Durchlaufzeiten kurz und lassen sich Maßabweichungen
    schnell zur Quelle zurückführen.
  - Für Bauteile, die mit Produkt oder Reinigungsmitteln in Berührung kommen, arbeiten wir in Edelstahl
    304 oder 316 und arbeiten die Nähte glatt aus. Passivieren und Beizen erledigen wir im eigenen Haus;
    Pulverbeschichten geben wir extern.
  materials:
  - Edelstahl 304
  - Edelstahl 316
  - Stahl
  - Aluminium
  process:
  - step: Arbeitsvorbereitung
    desc: Mitdenken bei Fertigbarkeit und Schweißfolge.
  - step: Schneiden & Abkanten
    desc: Laser, Rohrlaser und Abkantpresse.
  - step: Schweißen & Zusammenbau
    desc: WIG-, MIG/MAG- oder Laserschweißen bis 10 Tonnen.
  - step: Nachbearbeitung
    desc: Schleifen, Beizen, Passivieren oder Strahlen.
  applications:
  - Geschweißte Rahmen
  - Einhausungen und Gehäuse
  - Trichter
  - Baugruppen bis 10 Tonnen
  related:
  - label: Konstruktionen
    desc: Geschweißte Konstruktionsarbeit.
  - label: Edelstahl-Blechbearbeitung
    desc: Korrosionsbeständiges Blech.
  - label: Industriegehäuse
    desc: Gehäuse nach Maß.
  seo:
    title: Blechbearbeitung für den Apparatebau
    description: Rahmen, Einhausungen und Gehäuse für den Apparatebau in Edelstahl, Stahl und Aluminium.
      Laserschneiden, Abkanten und Schweißen bis 10 Tonnen unter einem Dach.
