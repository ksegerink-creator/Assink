faq:
- vraag: Wat is het voordeel van alles onder één dak?
  antwoord: Lasersnijden, buislasersnijden, kanten en lassen staan bij ons in dezelfde hal. Dat houdt de doorlooptijd
    kort, en als er een maatafwijking is, is die snel terug te leiden naar de bewerking waar hij ontstond.
- vraag: Hoe groot mag een samenstelling zijn?
  antwoord: Tot 10 ton per stuk en 8 meter bouwhoogte. Met vijf bovenloopkranen van 5 ton verplaatsen we zware delen;
    boven 5 ton hijsen we in tandem met twee kranen.
- vraag: Welke afwerking doen jullie zelf?
  antwoord: Slijpen, glasparelstralen, beitsen en passiveren doen wij in eigen huis. Poedercoaten besteden wij uit
    aan een vaste partner, zodat u één aanspreekpunt houdt.
