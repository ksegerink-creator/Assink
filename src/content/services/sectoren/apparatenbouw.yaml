body:
  - "We leveren gelaste frames, omkastingen, trechters en behuizingen. Doordat lasersnijden, buislasersnijden, kanten en lassen onder één dak staan, blijven de doorlooptijden kort en zijn maatafwijkingen snel terug te leiden naar de bron."
  - "Voor onderdelen die met product of reinigingsmiddelen in aanraking komen, werken we in RVS 304 of 316 en werken we naden glad af. Passiveren en beitsen doen we in eigen huis; poedercoaten besteden we uit."
