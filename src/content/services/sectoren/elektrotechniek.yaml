faq:
- vraag: Kunnen jullie uitsparingen voor wartels en displays meesnijden?
  antwoord: Ja. Uitsparingen voor wartels, displays, koeling en ventilatie snijden we mee op de laser, zodat er
    achteraf niets bijgewerkt hoeft te worden. Zet ze op de tekening of in het STEP-bestand.
- vraag: Hoe worden montagepunten in een kast aangebracht?
  antwoord: Met pers- en trekmoeren die we in eigen huis inzetten, dus zonder losse bewerkingen achteraf. Wordt de kast gepoedercoat, dan moet de schroefdraad worden afgedekt of nabewerkt; dat nemen we mee in de planning.
- vraag: Hoe zorgen jullie dat een kastdeur goed sluit?
  antwoord: 'Door maatvast te kanten: onze servo-elektrische kantbank haalt ± 0,2 mm, en lange panelen tot 3100
    mm kanten we in één keer. Na het kanten ontbramen we de randen machinaal.'
seo:
  title: Plaatwerk voor de elektrotechniek
  description: "Maatvaste kastdelen, montageplaten en behuizingen voor de elektrotechniek in staal, RVS en aluminium. Lasersnijden, kanten tot ± 0,2 mm en lassen in eigen huis."
