# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Electrical engineering
  kicker: Sector
  h1: Sheet metal for electrical engineering
  intro: 'Control cabinets, mounting plates and enclosures call for dimensionally stable sheet metal: doors
    that close, cut-outs that fit and edges that are safe. We cut, bend and weld those parts in steel, stainless
    steel and aluminium.'
  heroPhoto:
    subject: Press-braked stainless steel parts for enclosures, close-up
  body:
  - For electrical engineering we make cabinet parts, mounting plates, front panels and enclosures. Cut-outs
    for glands, displays and ventilation are cut on the laser, so nothing needs reworking afterwards.
  - 'Dimensional accuracy matters more here than speed: a cabinet half a millimetre out of true will not
    close. Our press brake is servo-electric with an accuracy of ± 0.2 mm, and after bending we deburr the
    edges by machine.'
  materials:
  - Steel
  - Stainless steel 304
  - Stainless steel 316
  - Aluminium
  process:
  - step: Laser cutting
    desc: Cut-outs for glands, displays and ventilation.
  - step: Bending
    desc: Dimensionally stable cabinet parts, ± 0.2 mm.
  - step: Welding & assembly
    desc: TIG, MIG or laser welding through to the complete enclosure.
  - step: Finishing
    desc: Deburring, blasting or passivation.
  applications:
  - Control cabinets
  - Mounting plates
  - Front panels
  - Industrial enclosures
  related:
  - label: Industrial enclosures
    desc: Enclosures made to measure.
  - label: Stainless steel sheet metal
    desc: Ground stainless steel for visible surfaces.
  - label: Self-clinching & rivet nuts
    desc: Fixings in thin sheet.
  kerncijfers:
  - waarde: ± 0.2 mm
    label: bending accuracy
  - waarde: 3100 mm
    label: press brake length
  - waarde: 4000 × 2000 mm
    label: max. sheet size
  aanleveren:
  - PDF drawing and a 3D STEP file
  - Material and sheet thickness
  - Number of parts
  - Positions of cut-outs and mounting points
  faq:
  - vraag: Can you cut cut-outs for cable glands and displays at the same time?
    antwoord: Yes. Cut-outs for cable glands, displays, cooling and ventilation are cut on the laser in the same operation,
      so nothing needs reworking afterwards. Show them on the drawing or in the STEP file.
  - vraag: How are mounting points added to a cabinet?
    antwoord: With self-clinching and rivet nuts that we insert in house, so without separate operations afterwards.
      If the cabinet is powder coated, the threads have to be masked or reworked; we take that into account in the planning.
  - vraag: How do you make sure a cabinet door closes properly?
    antwoord: 'By bending accurately: our servo-electric press brake achieves ± 0.2 mm, and long panels up to 3100
      mm are bent in one go. After bending we deburr the edges by machine.'
  seo:
    title: Sheet metal for electrical engineering
    description: Dimensionally stable cabinet parts, mounting plates and enclosures for electrical engineering
      in steel, stainless steel and aluminium. Laser cutting, bending to ± 0.2 mm and welding in house.

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Elektrotechnik
  kicker: Branche
  h1: Blechbearbeitung für die Elektrotechnik
  intro: 'Schaltschränke, Montageplatten und Gehäuse verlangen maßhaltiges Blech: Türen, die schließen,
    Ausschnitte, die passen, und Kanten, die sicher sind. Wir schneiden, kanten und schweißen diese Teile
    in Stahl, Edelstahl und Aluminium.'
  heroPhoto:
    subject: Abgekantete Edelstahlteile für Gehäuse, Nahaufnahme
  body:
  - Für die Elektrotechnik fertigen wir unter anderem Schrankteile, Montageplatten, Frontpaneele und Gehäuse.
    Ausschnitte für Kabelverschraubungen, Displays und Belüftung schneiden wir am Laser mit, sodass später
    nichts nachgearbeitet werden muss.
  - 'Maßhaltigkeit ist hier wichtiger als Geschwindigkeit: Ein Schrank, der einen halben Millimeter aus
    dem Lot steht, schließt nicht. Unsere Abkantpresse arbeitet servoelektrisch mit einer Genauigkeit von
    ± 0,2 mm, und nach dem Kanten entgraten wir die Kanten maschinell.'
  materials:
  - Stahl
  - Edelstahl 304
  - Edelstahl 316
  - Aluminium
  process:
  - step: Laserschneiden
    desc: Ausschnitte für Verschraubungen, Displays und Belüftung.
  - step: Abkanten
    desc: Maßhaltige Schrankteile, ± 0,2 mm.
  - step: Schweißen & Zusammenbau
    desc: WIG-, MIG- oder Laserschweißen bis zum kompletten Gehäuse.
  - step: Nachbearbeitung
    desc: Entgraten, Strahlen oder Passivieren.
  applications:
  - Schaltschränke
  - Montageplatten
  - Frontpaneele
  - Industriegehäuse
  related:
  - label: Industriegehäuse
    desc: Gehäuse nach Maß.
  - label: Edelstahl-Blechbearbeitung
    desc: Geschliffener Edelstahl für Sichtflächen.
  - label: Einpress- & Blindnietmuttern
    desc: Befestigung in dünnem Blech.
  kerncijfers:
  - waarde: ± 0,2 mm
    label: Abkantgenauigkeit
  - waarde: 3100 mm
    label: Abkantlänge
  - waarde: 4000 × 2000 mm
    label: max. Blechformat
  aanleveren:
  - PDF-Zeichnung und eine 3D-STEP-Datei
  - Werkstoff und Blechdicke
  - Stückzahl
  - Positionen von Ausschnitten und Montagepunkten
  faq:
  - vraag: Können Sie Ausschnitte für Kabelverschraubungen und Displays mitschneiden?
    antwoord: Ja. Ausschnitte für Kabelverschraubungen, Displays, Kühlung und Lüftung schneiden wir auf dem Laser
      mit, sodass nachträglich nichts nachgearbeitet werden muss. Tragen Sie sie in die Zeichnung oder die STEP-Datei
      ein.
  - vraag: Wie werden Montagepunkte in einem Schrank angebracht?
    antwoord: Mit Einpress- und Blindnietmuttern, die wir im eigenen Haus setzen, also ohne separate Arbeitsgänge
      im Nachhinein. Wird der Schrank pulverbeschichtet, muss das Gewinde abgedeckt oder nachgearbeitet werden; das berücksichtigen wir in der Planung.
  - vraag: Wie sorgen Sie dafür, dass eine Schranktür gut schließt?
    antwoord: 'Durch maßhaltiges Abkanten: Unsere servoelektrische Abkantpresse erreicht ± 0,2 mm, und lange Paneele
      bis 3100 mm kanten wir in einem Zug. Nach dem Abkanten entgraten wir die Kanten maschinell.'
  seo:
    title: Blechbearbeitung für die Elektrotechnik
    description: Maßhaltige Schrankteile, Montageplatten und Gehäuse für die Elektrotechnik in Stahl, Edelstahl
      und Aluminium. Laserschneiden, Abkanten bis ± 0,2 mm und Schweißen im eigenen Haus.
