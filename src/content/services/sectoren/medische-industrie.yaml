faq:
- vraag: Zijn jullie gecertificeerd volgens ISO 13485?
  antwoord: Nee. Wij zijn gecertificeerd volgens ISO 9001, ISO 3834-2 en EN 1090-1. ISO 13485 geldt voor de fabrikant van
    het medische hulpmiddel; wij leveren de metalen delen en samenstellingen volgens uw tekening en specificatie.
- vraag: Welke afwerking leveren jullie voor medische apparatuur?
  antwoord: Meestal RVS 304 of 316 met glad afgewerkte lasnaden. Na het lassen passiveren we; waar een egaal oppervlak
    gewenst is, stralen we met glasparels van 100 tot 200 μm in onze straalcabine.
- vraag: Assembleren jullie in een cleanroom?
  antwoord: Nee. Wij leveren de delen en samenstellingen aan, met de afwerking die u voorschrijft. De eindassemblage
    gebeurt bij u of uw assemblagepartner.
