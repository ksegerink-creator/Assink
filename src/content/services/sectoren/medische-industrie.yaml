body:
  - "Voor bouwers van medische apparatuur en laboratoriumapparatuur maken we frames, onderstellen, omkastingen, panelen en behuizingen. Het gaat om de constructie en de buitenkant van de apparatuur: implantaten en instrumenten die in het lichaam komen maken wij niet."
  - "Apparatuur in een medische omgeving wordt vaak gereinigd en gedesinfecteerd. Daarom werken we meestal in RVS 304 of 316, lassen we met TIG en werken we naden en randen glad af. Na het lassen passiveren we, zodat de beschermende oxidelaag zich herstelt; waar een egaal oppervlak gewenst is, stralen we met glasparels."
  - "Lasersnijden, kanten, lassen en nabewerken gebeuren onder één dak in Hengelo. Kanten doen we volgens ISO 2768 en het laswerk valt onder ISO 3834-2, met maatcontrole voordat een serie doorloopt."
  - "Wij zijn niet gecertificeerd volgens ISO 13485 en assembleren niet in een cleanroom. Wij leveren de metalen delen en samenstellingen aan; de eindassemblage en de medische registratie liggen bij de fabrikant van het apparaat."
