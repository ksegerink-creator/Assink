faq:
- vraag: Wat is het verschil tussen een persmoer en een trekmoer?
  antwoord: Een persmoer wordt koud in de plaat geperst; de kartel verdringt materiaal dat in een groef
    terugvloeit, waardoor de moer uittrek- en verdraaiingsvast zit. Een trekmoer wordt vanaf één zijde
    vervormd en klemt achter de plaat. De persmoer geeft de sterkste en vlakste verbinding, de trekmoer
    is de keuze als de achterzijde niet bereikbaar is.
- vraag: Vanaf welke plaatdikte kunnen jullie een persmoer plaatsen?
  antwoord: Dat hangt af van het moertype, het plaatmateriaal en de schroefdraadmaat. Het plaatmateriaal
    moet zachter zijn dan de moer, dus een harde plaat of een fijne draad in dun materiaal kan reden zijn
    om voor een andere maat of voor een trekmoer te kiezen. Wij beoordelen die combinatie per aanvraag
    op tekening.
- vraag: In welke materialen plaatsen jullie pers- en trekmoeren?
  antwoord: 'In RVS, aluminium en staal. Wij stemmen het moermateriaal af op de plaat: in RVS-plaatwerk
    RVS-moeren om contactcorrosie te voorkomen, in aluminium afhankelijk van de omgeving RVS of verzinkt
    staal.'
- vraag: Blijft de schroefdraad zitten bij herhaald demonteren?
  antwoord: Ja, mits de moer haaks en met de juiste perskracht is geplaatst. Een correct ingeperste moer
    is uittrek- en verdraaiingsvast en is daarmee geschikt voor onderdelen die in gebruik regelmatig open
    moeten. Wij controleren na het inpersen op vlakheid en op de zit van de draad.
- vraag: Kan er nog gepoedercoat worden nadat de moeren erin zitten?
  antwoord: Ja, maar de schroefdraad moet dan afgedekt worden of na het coaten worden nabewerkt, anders
    loopt de coating in de draad. Geef bij uw aanvraag door welke nabehandeling het deel krijgt, dan leggen
    wij de volgorde daarop vast.
