faq:
- vraag: Wat is het voordeel van laserlassen ten opzichte van TIG-lassen?
  antwoord: De warmte-inbreng is veel lager, waardoor de warmte-beïnvloede zone klein blijft en het werkstuk
    nauwelijks vervormt. De naad is smal en egaal en vraagt bij zichtwerk weinig nabewerking. TIG blijft
    de betere keuze bij grotere spleten of wanneer de naad volume moet opvullen.
- vraag: Welke materialen kunnen jullie laserlassen?
  antwoord: RVS 304 en 316, aluminium en messing. Welk materiaal en welke naadvorm haalbaar zijn, hangt
    samen met de plaatdikte en de pasnauwkeurigheid van de delen; dat beoordelen wij op tekening.
- vraag: Moet een lasergelaste naad nog nabewerkt worden?
  antwoord: 'Meestal weinig: de naad is smal en egaal, dus slijpen is vaak niet nodig. Bij RVS hoort er
    altijd een stap bij — aanloopkleuren verwijderen en passiveren — omdat de warmte de beschermende oxidelaag
    rond de naad aantast.'
- vraag: Hoe nauwkeurig moeten de delen passen bij laserlassen?
  antwoord: Nauwkeuriger dan bij TIG. De laserbundel is klein en overbrugt weinig spleet, dus de delen
    moeten strak passen en gefixeerd zijn. Wij snijden ze daarom op de laser en gebruiken waar nodig opspangereedschap.
    Is een strakke pasvorm niet haalbaar, dan adviseren wij TIG of MIG.
- vraag: Doen jullie ook robotlassen?
  antwoord: Niet in eigen huis. Robotlassen gebeurt binnen onze groep bij Baas Metaal. Wij verzorgen de
    regie en de samenstelling, zodat het voor u één opdracht blijft. Voor kleinere series en zichtwerk
    is laserlassen bij ons vaak de logischere route.
