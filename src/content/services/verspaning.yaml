h1: Verspaning bij uw plaatwerk en constructies
intro: Naast ons eigen plaatwerk en constructiewerk leveren we ook gedraaide en gefreesde onderdelen.
  Het verspaningswerk laten we maken door een vaste partner; wij verzorgen de engineering, de afstemming
  en de levering. Zo bestelt u een compleet product op één adres.
heroPhoto:
  subject: Fijnmechanisch gedraaid en gefreesd onderdeel
  orient: Liggend 16:10
  crop: Onderdeel-detail
  comp: Gedraaid deel naast plaatwerk uit eigen productie
body:
- Verspaning omvat frezen, draaien, boren en kotteren om nauwkeurige metaaldelen te produceren. Dit werk
  laten we uitvoeren op CNC-gestuurde machines bij een vaste partner — voor herhaalbare kwaliteit en hoge
  nauwkeurigheid.
- Werkbaar in staal, RVS, aluminium, messing en gietaluminium — van prototype tot serie, gecombineerd
  met ons eigen plaatwerk en constructiewerk voor complete producten uit één hand.
- 'In de praktijk gaat het om assen, bussen, flenzen en bevestigingsdelen die samen met plaatwerk of een
  gelaste constructie één product moeten vormen. Juist die combinatie is de reden om het verspaningswerk
  via ons te laten lopen: u heeft één aanspreekpunt en één levering in plaats van losse onderdelen die
  u zelf moet samenbrengen.'
- Wij verzorgen de werkvoorbereiding, de afstemming met de partner en de controle bij binnenkomst, en
  bouwen de verspaande delen daarna in bij ons eigen <a href="/plaatwerk/">plaatwerk</a> en <a href="/constructies/">constructiewerk</a>.
  Voor <a href="/machinebouw/">machinebouw</a> betekent dat een compleet samengestelde bouwgroep in plaats
  van een doos met componenten.
- 'Wat wij nodig hebben voor een aanvraag: een tekening of 3D-model met de maatvoering, het materiaal,
  de gewenste toleranties en oppervlakte-eisen, het aantal stuks, en of het onderdeel deel uitmaakt van
  een grotere samenstelling. Dat laatste bepaalt vaak de volgorde waarin we het traject inplannen.'
- 'Onze werkplaats staat in Hengelo, midden in Twente, en wij werken voor machinebouwers en industriële
  bedrijven in heel Nederland. Voor verspaand werk dat bij een samenstelling hoort, houdt dat de lijnen
  kort: het onderdeel komt bij ons binnen, wordt gecontroleerd en gaat als onderdeel van het eindproduct
  de deur uit.'
