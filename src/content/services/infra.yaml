  comp: "Representatief werk uit deze sector"
body:
  - "Voor infratechniek maken we gelaste staalconstructies, frames, luiken en behuizingen. Onderdelen tot 10 ton en constructies tot 8 meter hoogte kunnen we in eigen hal produceren en met vijf bovenloopkranen van 5 ton veilig verplaatsen."
  - "ISO 1090-1 regelt de uitvoering van staal- en aluminiumconstructies met CE-markering; ISO 3834-2 regelt de lasprocessen. Van ingangscontrole tot eindkeuring documenteren we de stappen, zodat een opdrachtgever kan zien wat er is gedaan."
