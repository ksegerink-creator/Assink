faq:
- vraag: Welke buigradius kunnen jullie kanten?
  antwoord: Dat hangt af van materiaal, plaatdikte en gereedschap. Als vuistregel houdt men bij staal
    een binnenradius aan die minstens gelijk is aan de materiaaldikte; bij aluminium ligt dat hoger en
    bij RVS telt de walsrichting mee. Ligt uw radius vast, geef hem dan door — dan beoordelen wij of hij
    haalbaar is voordat de tekening definitief wordt.
- vraag: Moet ik zelf de uitslag berekenen?
  antwoord: Nee. Wij berekenen de buigcompensatie zelf, dus een PDF-tekening en een 3D STEP-bestand van het eindproduct
    zijn genoeg. Levert u wel een platte uitslag aan, geef dan door met welke compensatie die gemaakt is,
    anders wijkt de eindmaat af.
- vraag: Hoe lang mag een zetting zijn?
  antwoord: Tot 3100 mm in één zetting, de werklengte van onze Safan Darley E-Brake 150-3100 T3 met 150
    ton perskracht. Langere delen bouwen wij op uit meerdere stukken of lossen we in overleg anders op.
- vraag: Waarom veert RVS sterker terug dan staal?
  antwoord: RVS heeft een hogere rekgrens en veert daardoor na het kanten verder terug, waardoor de gemeten
    hoek groter uitvalt dan de ingestelde. Hoe dikker en harder het materiaal, hoe groter het verschil.
    Wij compenseren daarop bij het instellen en controleren de eerste zetting voordat de serie doorloopt.
- vraag: Kan er gekant worden zonder krassen op zichtwerk?
  antwoord: Ja. Wij laten de beschermfolie tot en met de laatste bewerking zitten en werken waar nodig
    met aangepast gereedschap. Geef bij uw aanvraag door welke zijde de zichtzijde is, dan houden wij
    daar bij de zetvolgorde rekening mee.
