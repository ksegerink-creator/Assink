title: Kanten
slug: plaatwerk/zetten
template: service
group: plaatwerk
order: 25
kicker: Plaatwerk 1.4
h1: Kanten
intro: Nauwkeurige buighoeken en constante maatvoering op onze servo-elektrische kantbank.
heroPhoto:
  subject: Kantbank in bedrijf — plaat wordt gekant
  orient: Liggend 16:10
  crop: Machine + hand van operator
  comp: Kantbank, plaat onder de pers
body:
- Kanten (ook wel zetten genoemd) bepaalt de vorm van het plaatwerkdeel. Op onze Safan Darley E-Brake 150-3100 T3 zetten
  we maatvast, met aandacht voor terugvering en buigradius per materiaal.
- 'RVS kanten vraagt om een andere aanpak dan staal: RVS veert sterker terug en is gevoeliger voor krassen
  op het zichtoppervlak. Wij passen de buigradius en gereedschapkeuze daarop aan, zodat de hoek klopt
  en het oppervlak intact blijft.'
- De buigradius is bij kanten geen bijzaak maar een ontwerpkeuze. Een te krappe radius laat het materiaal
  aan de buitenzijde scheuren, een ruime radius maakt de hoek moeilijker te beheersen. Als vuistregel
  houdt men bij staal een binnenradius aan die minstens gelijk is aan de materiaaldikte; bij aluminium
  ligt dat hoger, omdat het minder rekt, en bij RVS speelt de walsrichting mee. Wij bepalen de radius
  per aanvraag op basis van materiaal, dikte en het gereedschap dat we inzetten, en geven het door als
  uw tekening een radius vraagt die niet haalbaar is.
- Terugvering is de tweede factor. Elk materiaal veert na het kanten een stukje terug, waardoor de gemeten
  hoek groter uitvalt dan de ingestelde. RVS veert sterker terug dan staal, en hoe dikker en harder het
  materiaal, hoe groter het verschil. Op een servo-elektrische kantbank is dat goed te compenseren omdat
  de aandrijving nauwkeurig en herhaalbaar positioneert; wij stellen daarop in en controleren de eerste
  zetting voordat de serie doorloopt.
- 'De uitslag is waar het in de werkvoorbereiding om draait. Bij het buigen rekt het materiaal aan de
  buitenkant en stuikt het aan de binnenkant, waardoor de platte lengte niet simpelweg de som van de benen
  is. Wij berekenen die buigcompensatie zelf, dus u hoeft geen uitgeslagen tekening aan te leveren: een
  PDF-tekening en een 3D STEP-bestand van het eindproduct volstaan. Levert u wel een platte uitslag aan, geef dan
  door met welke compensatie die is gemaakt, anders wijkt de maat af.'
- Ook de volgorde telt. Een zetting kan een eerdere zetting in de weg zitten, en een flens die te dicht
  op een gat of uitsparing ligt vervormt de rand. Daarom beoordelen wij de zetvolgorde en de afstand van
  gaten tot de buiglijn al op tekening, samen met de vraag of het gereedschap er überhaupt bij kan. Dat
  voorkomt dat een deel pas op de pers onmaakbaar blijkt.
- 'Bij zichtwerk komt er een laag bij. Het oppervlak is het kwetsbaarste deel van een gekant product: gereedschap
  laat sporen na en RVS en messing krassen snel. Wij laten de beschermfolie tot en met de laatste bewerking
  zitten en werken waar nodig met aangepast gereedschap. Meer over de materiaalkant staat op onze pagina''s
  over <a href="/plaatwerk/rvs/">RVS-plaatwerk</a> en <a href="/plaatwerk/messing/">messing</a>.'
- 'Wat wij nodig hebben om kantwerk te beoordelen: een PDF-tekening en een 3D STEP-bestand van het eindproduct, het materiaal
  en de plaatdikte, de gewenste buigradius als die vastligt, of het zichtwerk betreft, en het aantal stuks.
  De maximale lengte van één zetting is bij ons 3100 mm; langere delen bouwen we op uit meerdere stukken
  of lossen we anders op.'
