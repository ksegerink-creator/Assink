body:
  - "Wij maken machineframes, montagebeugels, kabelgoten en afschermpanelen — in staal, RVS en aluminium. Buislasersnijden is hier vaak de snelste route: uitsparingen, gaten en verstekken zitten al in het profiel voordat er gelast wordt."
  - "Voor de opbouw is maatvastheid bepalend. We kanten op ± 0,2 mm en controleren de maten na het lassen, omdat warmte-inbreng een samenstelling kan laten werken. Verspaande delen betrekken we van een vaste partner."
