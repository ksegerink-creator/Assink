  comp: "Representatief werk uit deze sector"
body:
  - "Voor offshore-toepassingen leveren we frames, behuizingen, bordessen en gelaste samenstellingen tot 10 ton. De materiaalkeuze bepaalt de levensduur: waar zeewater bij komt, adviseren we RVS 316 in plaats van 304."
  - "Ons laswerk valt onder ISO 3834-2 en voor staalconstructies zijn we gecertificeerd volgens ISO 1090-1. Materiaalcertificaten en maatcontroles leggen we per order vast, zodat de herleidbaarheid geregeld is. Conserveren en coaten besteden we uit aan een vaste partner."
