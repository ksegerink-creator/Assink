body:
- Aluminium geleidt warmte snel en oxideert makkelijk. Met de juiste voorbereiding en techniek (TIG/MIG)
  leggen wij sterke, nette naden — geschikt voor machinebouw, behuizingen en lichtgewicht constructies.
- 'Als metaalbedrijf met ervaring in aluminium lassen kennen wij de valkuilen: te veel warmte-inbreng
  geeft vervorming, een verkeerde voorbereiding geeft poreuze naden. Wij stemmen stroom, draadkeuze en
  volgorde af op plaatdikte en legering.'
- 'Aluminium gedraagt zich bij het lassen wezenlijk anders dan staal of RVS. Het geleidt warmte veel sneller,
  waardoor er meer warmte nodig is om te smelten en die warmte zich verder door het werkstuk verspreidt.
  Daar komt de oxidehuid bij: die smelt pas bij een veel hogere temperatuur dan het aluminium eronder
  en moet vóór het lassen worden verwijderd.'
- Wij lassen aluminium met TIG en MIG. TIG geeft de meeste controle over de warmte-inbreng en past bij
  dun materiaal en zichtnaden; MIG is sneller en past bij dikker materiaal en grotere series. Welke van
  de twee we kiezen, bepalen we per opdracht op basis van plaatdikte, naadvorm en de eis aan het uiterlijk.
- Om vervorming te beperken spannen we delen op, hechten we eerst en bepalen we de lasvolgorde vooraf;
  na het lassen controleren we de maten. Het plaatwerk dat aan zo'n samenstelling voorafgaat — snijden,
  zetten en afwerken — beschrijven we op onze pagina over <a href="/plaatwerk/aluminium/">aluminium plaatwerk</a>.
- Na het lassen bepaalt de toepassing hoever we gaan met de afwerking. Waar het uiterlijk telt, stralen
  we in onze straalcabine met glasparels, wat een egaal mat oppervlak geeft. Waar de naad functioneel
  is en uit het zicht blijft, volstaat ontbramen en visueel controleren. Geef bij de aanvraag door welke
  zijde zichtzijde is; dat bepaalt zowel de laskeuze als de nabehandeling.
