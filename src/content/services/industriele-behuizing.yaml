faq:
- vraag: In welke materialen maken jullie behuizingen?
  antwoord: In RVS 304 en 316 en in aluminium. RVS is de logische keuze bij vocht, reiniging of buitenopstelling;
    aluminium is aanmerkelijk lichter en daarmee prettiger bij deuren en panelen die met de hand worden
    gehanteerd.
- vraag: Kunnen jullie uitsparingen en montagepunten meenemen?
  antwoord: Ja. Uitsparingen voor wartels, displays en koeling worden meegesneden op de laser, en voor
    montagepunten werken wij met pers- en trekmoeren. Dat scheelt losse bewerkingen achteraf en houdt
    de maatvoering onder controle.
- vraag: Leveren jullie enkelstuks of alleen series?
  antwoord: Beide. Van een enkele besturingskast tot seriematige productie van dezelfde behuizing. Bij
    series letten we er extra op dat de afwerking en de korrelrichting over alle exemplaren gelijk blijven.
- vraag: Hoe wordt een behuizing afgewerkt?
  antwoord: Dat hangt af van materiaal en toepassing. RVS-zichtwerk leveren wij geslepen, en na laswerk
    verwijderen wij aanloopkleuren en passiveren wij. Aluminium kan glasparelgestraald worden voor een
    egaal mat oppervlak.

# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Industrial enclosures
  kicker: Sector 4.4
  h1: Innovative in industrial stainless steel enclosures
  intro: Do you need custom or series-produced craftsmanship for stainless steel or aluminium enclosures?
    Then Assink & Schipholt takes care of everything, from design and engineering to the finished product.
  heroPhoto:
    subject: Finished stainless steel machine enclosure, ready for assembly
  bodyHeading: About stainless steel enclosures
  body:
  - We specialise in high-quality stainless steel enclosures for control systems, machines and demanding
    environments — both single pieces and series production, with support from design and engineering through
    to assembly and finishing.
  - We also advise on material selection, fastening techniques and component integration.
  - 'With an enclosure, the dimensions determine whether the whole thing works: doors and panels have to
    stay flat, cut-outs have to fit to the millimetre and latches have to operate smoothly after assembly.
    We bend on a servo-electric press brake with a working length of up to 3100 mm, so that long panels
    can be formed in one go rather than assembled from parts.'
  - The choice of material follows from the environment. <a href="/en/plaatwerk/rvs/">Stainless steel</a>
    in grade 304 or 316 is the logical choice where there is moisture, cleaning or outdoor exposure; <a
    href="/en/plaatwerk/aluminium/">aluminium</a> is considerably lighter and therefore more pleasant for
    doors and panels handled by hand. Where there is doubt, we look at the load and the cleaning method.
  - 'Component integration happens in the same run: cut-outs for glands, displays and cooling are cut on
    the laser, and for mounting points we work with <a href="/en/plaatwerk/persmoeren-trekmoeren/">self-clinching
    and rivet nuts</a>. That saves separate operations afterwards and keeps the dimensions under control.'
  - Machine cladding calls for something different from a closed enclosure. Panels that clad a machine have
    to stay removable for maintenance, must not resonate, and have to still fit the frame after coating.
    We supply that cladding to match the structure underneath, with fixings that mount without adjustment
    on site.
  - 'Once the enclosure stands outdoors, the requirements shift. For a kiosk, a charging point or an installation
    in infrastructure, what counts most is keeping water out: overlapping seams, a sloping top and well-considered
    cable glands do more than a heavier sheet thickness. Stainless steel 316 is the obvious choice in those
    environments because of road salt and rain. Tell us with your request whether the enclosure will stand
    outdoors, as that determines both the material choice and the seam execution.'
  - 'What we need: the outer dimensions, the positions of cut-outs and mounting points, the material, whether
    it concerns visible surfaces and which finishing that requires, and the quantity. Our knowledge base
    article on <a href="/kennisbank/industriele-behuizingen-op-maat-rvs-aluminium/">custom industrial enclosures</a>
    goes into the trade-offs in more depth (in Dutch).'
  process:
  - step: Custom stainless steel control cabinets
    desc: Resistant to moisture, dust and chemicals.
  - step: Custom work & integration
    desc: For control systems, machine building, offshore and maritime.
  - step: Advice
    desc: Material selection, fastening and component integration.
  materials:
  - Stainless steel 304 / 316
  - Aluminium
  applications:
  - Industrial control systems
  - Machine building
  - Food industry
  - Offshore & maritime
  - Process industry & chemicals
  related:
  - label: Machine building
    desc: Complete machines and assemblies.
  - label: Stainless steel
    desc: Stainless sheet metal work and visible work.
  - label: Laser welding
    desc: Clean seams for visible work.
  seo:
    title: Custom industrial enclosures
    description: High-quality stainless steel and aluminium enclosures for control systems, machines and
      demanding environments. Custom work and series.
  faq:
  - vraag: In which materials do you make enclosures?
    antwoord: In stainless steel 304 and 316 and in aluminium. Stainless steel is the logical choice where
      there is moisture, cleaning or outdoor exposure; aluminium is considerably lighter and therefore more
      pleasant for doors and panels handled by hand.
  - vraag: Can you include cut-outs and mounting points?
    antwoord: Yes. Cut-outs for glands, displays and cooling are cut on the laser, and for mounting points
      we work with self-clinching and rivet nuts. That saves separate operations afterwards and keeps the
      dimensions under control.
  - vraag: Do you supply one-offs or only series?
    antwoord: Both. From a single control cabinet to series production of the same enclosure. With series
      we pay extra attention to keeping the finish and the grain direction identical across all units.
  - vraag: How is an enclosure finished?
    antwoord: That depends on the material and the application. Visible stainless steel is supplied ground,
      and after welding we remove heat tint and passivate. Aluminium can be glass-bead blasted for an even
      matt surface.

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Industriegehäuse
  kicker: Sektor 4.4
  h1: Innovativ bei Industriegehäusen aus Edelstahl
  intro: Benötigen Sie Einzelanfertigungen oder Serienarbeit für Gehäuse aus Edelstahl oder Aluminium? Dann
    nimmt Ihnen Assink & Schipholt von Entwurf und Engineering bis zum Endprodukt die Arbeit ab.
  heroPhoto:
    subject: Fertiges Edelstahl-Maschinengehäuse, montagefertig
  bodyHeading: Über Edelstahlgehäuse
  body:
  - Wir sind auf hochwertige Gehäuse aus Edelstahl für Steuerungssysteme, Maschinen und anspruchsvolle Umgebungen
    spezialisiert — sowohl Einzelstücke als auch Serienproduktion, mit Begleitung von Entwurf und Engineering
    bis zu Montage und Endbearbeitung.
  - Außerdem beraten wir Sie zu Materialwahl, Befestigungstechniken und Komponentenintegration.
  - 'Bei einem Gehäuse entscheidet die Bemaßung, ob das Ganze stimmt: Türen und Paneele müssen eben bleiben,
    Ausschnitte müssen auf den Millimeter passen und Verschlüsse müssen nach der Montage noch leichtgängig
    sein. Wir kanten auf einer servoelektrischen Abkantpresse mit einer Arbeitslänge bis 3100 mm, sodass
    lange Paneele in einem Zug gekantet werden können, statt aus Teilen zusammengesetzt zu werden.'
  - Die Werkstoffwahl ergibt sich aus der Umgebung. <a href="/de/plaatwerk/rvs/">Edelstahl</a> in der Güte
    304 oder 316 ist die logische Wahl bei Feuchtigkeit, Reinigung oder Außenaufstellung; <a href="/de/plaatwerk/aluminium/">Aluminium</a>
    ist deutlich leichter und damit angenehmer bei Türen und Paneelen, die von Hand gehandhabt werden. Im
    Zweifel betrachten wir die Belastung und die Reinigungsmethode.
  - 'Die Komponentenintegration erfolgt im selben Durchlauf: Ausschnitte für Verschraubungen, Displays und
    Kühlung werden auf dem Laser mitgeschnitten, und für Montagepunkte arbeiten wir mit <a href="/de/plaatwerk/persmoeren-trekmoeren/">Einpress-
    und Blindnietmuttern</a>. Das erspart separate Arbeitsgänge im Nachhinein und hält die Maßhaltigkeit
    unter Kontrolle.'
  - Eine Maschinenverkleidung stellt andere Anforderungen als ein geschlossenes Gehäuse. Paneele, die eine
    Maschine umkleiden, müssen für die Wartung demontierbar bleiben, dürfen nicht schwingen und müssen nach
    dem Beschichten noch auf den Rahmen passen. Wir liefern diese Verkleidung passend zur darunterliegenden
    Konstruktion, mit Befestigungen, die sich ohne Nacharbeit vor Ort montieren lassen.
  - 'Steht das Gehäuse im Freien, verschieben sich die Anforderungen. Bei einem Kiosk, einer Ladesäule oder
    einer Anlage in der Infrastruktur zählt vor allem, wie das Wasser draußen bleibt: überlappende Nähte,
    eine abfallende Oberseite und durchdachte Kabeldurchführungen bewirken mehr als eine höhere Blechdicke.
    In solchen Umgebungen liegt Edelstahl 316 wegen Streusalz und Regen nahe. Teilen Sie uns bei Ihrer Anfrage
    mit, ob das Gehäuse im Freien aufgestellt wird, denn das bestimmt sowohl die Werkstoffwahl als auch
    die Nahtausführung.'
  - 'Was wir benötigen: die Außenmaße, die Positionen von Ausschnitten und Montagepunkten, den Werkstoff,
    ob es sich um Sichtflächen handelt und welche Oberfläche dazugehört, sowie die Stückzahl. In unserem
    Wissensbeitrag über <a href="/kennisbank/industriele-behuizingen-op-maat-rvs-aluminium/">Industriegehäuse
    nach Maß</a> gehen wir tiefer auf die Abwägungen ein (niederländisch).'
  process:
  - step: Edelstahl-Schaltschränke nach Maß
    desc: Widerstandsfähig gegen Feuchtigkeit, Staub und Chemikalien.
  - step: Maßarbeit & Integration
    desc: Für Steuerungssysteme, Maschinenbau, Offshore und Maritim.
  - step: Beratung
    desc: Materialwahl, Befestigung und Komponentenintegration.
  materials:
  - Edelstahl 304 / 316
  - Aluminium
  applications:
  - Industrielle Steuerungssysteme
  - Maschinenbau
  - Lebensmittelindustrie
  - Offshore & Maritim
  - Prozessindustrie & Chemie
  related:
  - label: Maschinenbau
    desc: Komplette Maschinen und Baugruppen.
  - label: Edelstahl
    desc: Edelstahlblech und Sichtflächen.
  - label: Laserschweißen
    desc: Saubere Nähte für Sichtflächen.
  seo:
    title: Industriegehäuse nach Maß
    description: Hochwertige Gehäuse aus Edelstahl und Aluminium für Steuerungssysteme, Maschinen und anspruchsvolle
      Umgebungen. Maßarbeit und Serie.
  faq:
  - vraag: In welchen Werkstoffen fertigen Sie Gehäuse?
    antwoord: In Edelstahl 304 und 316 sowie in Aluminium. Edelstahl ist die logische Wahl bei Feuchtigkeit,
      Reinigung oder Außenaufstellung; Aluminium ist deutlich leichter und damit angenehmer bei Türen und
      Paneelen, die von Hand gehandhabt werden.
  - vraag: Können Sie Ausschnitte und Montagepunkte mit ausführen?
    antwoord: Ja. Ausschnitte für Verschraubungen, Displays und Kühlung werden auf dem Laser mitgeschnitten,
      und für Montagepunkte arbeiten wir mit Einpress- und Blindnietmuttern. Das erspart separate Arbeitsgänge
      im Nachhinein und hält die Maßhaltigkeit unter Kontrolle.
  - vraag: Liefern Sie Einzelstücke oder nur Serien?
    antwoord: Beides. Vom einzelnen Schaltschrank bis zur Serienfertigung desselben Gehäuses. Bei Serien
      achten wir besonders darauf, dass Oberfläche und Schliffrichtung über alle Exemplare gleich bleiben.
  - vraag: Wie wird ein Gehäuse nachbehandelt?
    antwoord: Das hängt von Werkstoff und Anwendung ab. Edelstahl-Sichtflächen liefern wir geschliffen,
      und nach dem Schweißen entfernen wir Anlauffarben und passivieren. Aluminium kann glasperlgestrahlt
      werden für eine gleichmäßig matte Oberfläche.
