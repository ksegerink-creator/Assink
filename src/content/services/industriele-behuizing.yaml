kicker: Sector 4.4
h1: Innovatief in industriële RVS-behuizing
intro: Heeft u behoefte aan maatwerk of seriematig vakwerk voor RVS- of aluminium behuizingen? Dan wordt
  u bij Assink & Schipholt van ontwerp en engineering tot eindproduct ontzorgd.
heroPhoto:
  subject: Afgewerkte RVS machineomkasting, montageklaar
  orient: Liggend 16:10
  crop: Product centraal
  comp: Behuizing op neutrale ondergrond
bodyHeading: Over RVS-behuizingen
body:
- Wij specialiseren ons in hoogwaardige roestvrijstalen behuizingen voor besturingssystemen, machines
  en veeleisende omgevingen — zowel individuele stukken als serieproductie, met begeleiding van ontwerp
  en engineering tot assemblage en afwerking.
- Ook adviseren wij over materiaalkeuze, bevestigingstechnieken en componentintegratie.
- 'Bij een behuizing bepaalt de maatvoering of het geheel klopt: deuren en panelen moeten vlak blijven,
  uitsparingen moeten op de millimeter passen en sluitingen moeten na montage nog soepel werken. Wij kanten
  op een servo-elektrische kantbank met een werklengte tot 3100 mm, zodat lange panelen in één keer gekant
  kunnen worden in plaats van uit delen te worden samengesteld.'
- De materiaalkeuze volgt uit de omgeving. <a href="/plaatwerk/rvs/">RVS</a> in kwaliteit 304 of 316 is
  de logische keuze bij vocht, reiniging of buitenopstelling; <a href="/plaatwerk/aluminium/">aluminium</a>
  is aanmerkelijk lichter en daarmee prettiger bij deuren en panelen die met de hand worden gehanteerd.
  Bij twijfel kijken we naar de belasting en de reinigingsmethode.
- 'Componentintegratie doen we in dezelfde doorloop: uitsparingen voor wartels, displays en koeling worden
  meegesneden op de laser, en voor montagepunten werken we met <a href="/plaatwerk/persmoeren-trekmoeren/">pers-
  en trekmoeren</a>. Dat scheelt losse bewerkingen achteraf en houdt de maatvoering onder controle.'
- Machinebeplating vraagt iets anders dan een gesloten behuizing. Panelen die een machine omkasten moeten
  demontabel blijven voor onderhoud, mogen niet resoneren en moeten na het coaten nog op het frame passen.
  Wij leveren die beplating passend bij de constructie eronder, met bevestigingen die zonder aanpassing
  op locatie te monteren zijn.
- 'Staat de behuizing buiten, dan verschuiven de eisen. Bij een kiosk, een laadpaal of een installatie
  in de infrastructuur telt vooral hoe het water eruit blijft: overlappende naden, een afwaterende bovenzijde
  en doordachte kabeldoorvoeren doen meer dan een zwaardere plaatdikte. In die omgevingen ligt RVS 316
  voor de hand vanwege strooizout en regen. Geef bij uw aanvraag door of de behuizing in de buitenlucht
  komt te staan, want dat bepaalt zowel de materiaalkeuze als de naaduitvoering.'
- 'Wat wij nodig hebben: de buitenmaten, de posities van uitsparingen en montagepunten, het materiaal,
  of het om zichtwerk gaat en welke afwerking daarbij hoort, en het aantal. In ons kennisbankartikel over
  <a href="/kennisbank/industriele-behuizingen-op-maat-rvs-aluminium/">industriële behuizingen op maat</a>
  gaan we dieper in op de afwegingen.'
