faq:
- vraag: What is the advantage of laser welding over TIG welding?
  antwoord: The heat input is far lower, so the heat-affected zone stays small and the workpiece hardly
    distorts. The seam is narrow and even and needs little finishing on visible surfaces. TIG remains
    the better choice for larger gaps or when the seam has to fill volume.
- vraag: Which materials can you laser weld?
  antwoord: Stainless steel 304 and 316, aluminium and brass. Which material and joint geometry are feasible
    depends on the sheet thickness and on how accurately the parts fit together; we assess that on the
    drawing.
- vraag: Does a laser-welded seam still need finishing?
  antwoord: 'Usually very little: the seam is narrow and even, so grinding is often unnecessary. With
    stainless steel one step always applies — removing heat tint and passivating — because the heat attacks
    the protective oxide layer around the seam.'
- vraag: How accurately do the parts have to fit for laser welding?
  antwoord: More accurately than for TIG. The laser beam is small and bridges little gap, so the parts
    have to fit tightly and be fixtured. We therefore cut them on the laser and use fixturing where required.
    If a tight fit is not achievable, we advise TIG or MIG.
- vraag: Do you also offer robot welding?
  antwoord: Not in house. Robot welding is done within our group at Baas Metaal. We handle the coordination
    and the assembly, so that it remains a single order for you. For smaller batches and visible work,
    laser welding with us is often the more logical route.
