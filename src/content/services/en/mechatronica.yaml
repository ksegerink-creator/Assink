  - { step: "Bending", desc: "Dimensionally stable panels and brackets, ± 0.2 mm." }
  - { step: "Welding", desc: "Low-distortion TIG or laser welding." }
  - { step: "Dimensional check", desc: "Measuring after welding." }
applications: ["Machine frames", "Mounting brackets", "Guard panels", "Cable trays"]
