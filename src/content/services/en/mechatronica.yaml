# Engelse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: "Mechatronics"
kicker: "Sector"
h1: "Sheet metal and frames for mechatronics"
intro: "In mechatronics, mechanics, electronics and control come together in very little space. That calls for dimensionally stable frames, brackets and panels in which everything falls into place."
heroPhoto:
  subject: "Work for the mechatronics sector"
body:
  - "We make machine frames, mounting brackets, cable trays and guard panels — in steel, stainless steel and aluminium. Tube laser cutting is often the fastest route here: cut-outs, holes and mitres are already in the profile before any welding starts."
  - "For the build-up, dimensional stability is decisive. We bend to ± 0.2 mm and check dimensions after welding, because heat input can make an assembly move. Machined parts are sourced from a regular partner."
materials: ["Aluminium", "Steel", "Stainless steel 304", "Stainless steel 316"]
process:
