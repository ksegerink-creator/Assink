# Engelse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: Tube laser cutting
kicker: Cutting 2.2
h1: Tube laser cutting
intro: Precision tube laser cutting for dimensionally stable tubes and profiles, with advanced CNC control
  and high accuracy.
heroPhoto:
  subject: Tube laser cutting machine in operation with rotating profile
body:
- We work with a Trumpf tube laser for steel, stainless steel, aluminium, brass and copper — suitable
  for complex contours, holes and joints in a single operation.
- Contactless laser cutting delivers very high dimensional stability and reproducibility, less post-processing
  and shorter lead times. Ideal for one-offs as well as series work. Complex joints come out of a single
  operation — less fitting, faster welding.
- The difference from sawing and drilling lies not in speed but in fit. On the classic route a profile
  is cut to length, then drilled, then ground to fit — and every step adds a deviation that accumulates
  through the structure. On the tube laser the contour, the holes and the joint shape come off the machine
  in a single set-up, which removes that accumulation.
- That carries through into the welding. Parts that drop into place do not have to be made to fit, the
  gap stays small and even, and the welder has less to bridge. Less welding time, less heat input and
  therefore less distortion in the whole. In a frame with dozens of joints, that is the difference between
  a structure that is right and one that has to be straightened afterwards.
- We combine tube laser cutting with <a href="/en/plaatwerk/lasersnijden/">2D laser cutting of sheet</a>
  and with welding and assembly in the same hall in Hengelo. For a frame with sheet metal parts that means
  one production engineering pass, one schedule and one point of contact, instead of coordination between
  a tube supplier, a sheet supplier and a welding shop.
- 'What we need to assess a request: a 3D model or drawing of the profile, the profile type and size,
  the material, the lengths and the quantity. The limits on diameter, wall thickness and length depend
  on the profile and we assess them per request — so put your dimensions to us rather than ruling it out
  in advance. If it concerns a complete structure, send the assembly too and we will look at the welding
  sequence at the same time.'
