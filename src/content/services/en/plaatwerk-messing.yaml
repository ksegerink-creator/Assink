faq:
- vraag: Which brass sheet thicknesses can you process?
  antwoord: We determine that per request. The cutting thicknesses we have confirmed for our fibre laser
    apply to steel, stainless steel, aluminium and galvanised steel; brass is a copper alloy and behaves
    differently under the laser. Send your drawing with the sheet thickness and brass grade and we will
    indicate what is feasible.
- vraag: Does brass discolour over time?
  antwoord: 'Yes. In contact with air and moisture a patina forms: first yellow-brown, later brown to
    greenish. For some applications that is exactly what is wanted. If you want to keep the original lustre,
    a protective lacquer is needed or the part has to be polished periodically.'
- vraag: Can you press brake brass without damaging the surface?
  antwoord: Yes. Brass is softer than stainless steel and steel and therefore scratches more quickly.
    We keep protective film on up to and including the last operation, work with clean tooling and take
    the rolling direction into account, because a bend across the grain is more likely to crack.
- vraag: What is brass sheet metal mainly used for?
  antwoord: For interior construction, art objects and decorative technical components — applications
    in which the warm, yellow lustre makes the difference. For purely functional parts without a visual
    requirement, stainless steel or aluminium is usually more economical.
- vraag: Can you weld brass?
  antwoord: Brass is listed with us as a material for laser welding. Because of the zinc in the alloy
    it does call for adapted parameters and good extraction. Put your joint to us with the sheet thickness
    and the joint geometry and we will indicate whether welding, brazing or a mechanical joint is the
    better route in your case.
