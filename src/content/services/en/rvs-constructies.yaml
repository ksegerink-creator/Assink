body:
  - "Stainless steel constructions combine strength with corrosion resistance. We weld and assemble in stainless steel 304 and 316, with finishing (pickling, passivation) matched to the application — for example in the food industry."
  - "Our stainless steel structural work combines tube laser cutting for ready-to-fit profiles with TIG and laser welding, followed by pickling and passivation so the material's corrosion resistance is preserved after processing."
  - "Would you like a stainless steel frame made? Send us your drawing or sketch — we assess manufacturability and think along on profile choice and welding sequence before production starts."
