# Engelse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: "Electrical engineering"
kicker: "Sector"
h1: "Sheet metal for electrical engineering"
intro: "Control cabinets, mounting plates and enclosures call for dimensionally stable sheet metal: doors that close, cut-outs that fit and edges that are safe. We cut, bend and weld those parts in steel, stainless steel and aluminium."
heroPhoto:
  subject: "Work for the electrical engineering sector"
body:
  - "For electrical engineering we make cabinet parts, mounting plates, front panels and enclosures. Cut-outs for glands, displays and ventilation are cut on the laser, so nothing needs reworking afterwards."
  - "Dimensional accuracy matters more here than speed: a cabinet half a millimetre out of true will not close. Our press brake is servo-electric with an accuracy of ± 0.2 mm, and after bending we deburr the edges by machine."
materials: ["Steel", "Stainless steel 304", "Stainless steel 316", "Aluminium"]
