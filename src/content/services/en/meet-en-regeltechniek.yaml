# Engelse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: "Instrumentation & control"
kicker: "Sector"
h1: "Precision sheet metal for instrumentation and control"
intro: "In instrumentation and control the parts are small and the tolerances tight. We cut and bend enclosures, mounting frames and panels where a tenth of a millimetre counts."
heroPhoto:
  subject: "Work for the instrumentation and control engineering sector"
body:
  - "We make instrument enclosures, mounting plates, brackets and frames — often in small series and in stainless steel or aluminium. Fits for sensors, glands and connectors are cut along with the part, so assembly needs no reworking."
  - "With thin sheet, fixing needs attention: we set self-clinching and rivet nuts in place, so no loose tapped holes or nuts are needed. Edges are deburred by machine, and where the part is on show we supply it ground or blasted."
