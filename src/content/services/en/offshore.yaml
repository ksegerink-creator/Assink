# Engelse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: "Offshore"
kicker: "Sector"
h1: "Constructions and sheet metal for offshore"
intro: "Offshore is a salty, wet environment where corrosion and vibration set the terms. We make welded constructions and sheet metal in stainless steel 316 and steel, with qualified welding procedures and documentation for every order."
body:
  - "For offshore applications we supply frames, enclosures, platforms and welded assemblies up to 10 tonnes. Material choice determines service life: where seawater is involved, we advise stainless steel 316 rather than 304."
  - "Our welding falls under ISO 3834-2, and for steel structures we are certified to ISO 1090-1. Material certificates and dimensional checks are recorded per order, so traceability is covered. Preservation and coating are outsourced to a regular partner."
