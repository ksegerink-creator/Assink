faq:
- vraag: Which bend radius can you achieve?
  antwoord: That depends on material, sheet thickness and tooling. As a rule of thumb, an inside radius
    at least equal to the material thickness is used for steel; for aluminium it is higher, and with stainless
    steel the rolling direction counts. If your radius is fixed, tell us and we will assess whether it
    is achievable before the drawing is finalised.
- vraag: Do I have to calculate the flat pattern myself?
  antwoord: No. We calculate the bend allowance ourselves, so a PDF drawing and a 3D STEP file of the finished
    product is enough. If you do supply a flat pattern, tell us which allowance it was made with, otherwise
    the final dimension will be off.
- vraag: How long may a single bend be?
  antwoord: Up to 3100 mm in one bend, the working length of our Safan Darley E-Brake 150-3100 T3 with
    150 tonnes of press force. Longer parts we build up from several pieces or solve differently in consultation.
- vraag: Why does stainless steel spring back more than steel?
  antwoord: Stainless steel has a higher yield strength and therefore springs back further after bending,
    so the measured angle ends up larger than the set one. The thicker and harder the material, the bigger
    the difference. We compensate for this during set-up and check the first bend before the batch runs
    on.
- vraag: Can you bend without scratching visible surfaces?
  antwoord: Yes. We keep the protective film on up to and including the last operation and use adapted
    tooling where required. Tell us with your request which side is the visible side, and we will take
    that into account in the bending sequence.
