body:
  - "Press braking determines the shape of the sheet metal part. On our Safan Darley E-Brake 150-3100 T3 we bend to size, with attention to springback and bend radius for each material."
  - "Bending stainless steel calls for a different approach than steel: stainless steel springs back more and is more sensitive to scratches on the visible surface. We adjust the bend radius and tooling accordingly, so the angle is correct and the surface stays intact."
