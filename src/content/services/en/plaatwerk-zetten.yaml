# Engelse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: Bending & forming
kicker: Sheet metal work 1.4
h1: Bending & forming
intro: Precise bend angles and consistent dimensioning on our servo-electric press brake.
heroPhoto:
  subject: Press brake in operation — sheet being bent
body:
- Press braking determines the shape of the sheet metal part. On our Safan Darley E-Brake 150-3100 T3
  we bend to size, with attention to springback and bend radius for each material.
- 'Bending stainless steel calls for a different approach than steel: stainless steel springs back more
  and is more sensitive to scratches on the visible surface. We adjust the bend radius and tooling accordingly,
  so the angle is correct and the surface stays intact.'
- The bend radius is not a detail but a design choice. Too tight a radius cracks the material on the outside;
  too generous a radius makes the angle harder to control. As a rule of thumb, an inside radius at least
  equal to the material thickness is used for steel; for aluminium it is higher, because it stretches
  less, and with stainless steel the rolling direction plays a part. We determine the radius per request
  based on material, thickness and the tooling we use, and let you know if your drawing calls for a radius
  that is not achievable.
- Springback is the second factor. Every material springs back a little after bending, so the measured
  angle ends up larger than the set one. Stainless steel springs back more than steel, and the thicker
  and harder the material, the bigger the difference. On a servo-electric press brake this can be compensated
  well because the drive positions accurately and repeatably; we set up for it and check the first bend
  before the batch runs on.
- 'The flat pattern is what production engineering turns on. During bending the material stretches on
  the outside and compresses on the inside, so the flat length is not simply the sum of the legs. We calculate
  that bend allowance ourselves, so you do not have to supply an unfolded drawing: a PDF drawing and a 3D STEP file
  of the finished product is enough. If you do supply a flat pattern, tell us which allowance it was made
  with, otherwise the dimensions will be off.'
- The sequence matters too. One bend can get in the way of another, and a flange that sits too close to
  a hole or cut-out will distort the edge. That is why we assess the bending sequence and the distance
  from holes to the bend line on the drawing, together with the question of whether the tooling can even
  reach. That prevents a part turning out to be unmakeable only once it is on the press.
- 'With visible work there is an extra layer. The surface is the most vulnerable part of a bent product:
  tooling leaves marks, and stainless steel and brass scratch easily. We keep the protective film on up
  to and including the last operation and use adapted tooling where required. There is more on the material
  side on our pages about <a href="/en/plaatwerk/rvs/">stainless steel sheet metal</a> and <a href="/en/plaatwerk/messing/">brass</a>.'
- 'What we need to assess bending work: a PDF drawing and a 3D STEP file of the finished product, the material and
  sheet thickness, the required bend radius if it is fixed, whether it concerns visible surfaces, and
  the quantity. The maximum length of a single bend with us is 3100 mm; longer parts we build up from
  several pieces or solve another way.'
