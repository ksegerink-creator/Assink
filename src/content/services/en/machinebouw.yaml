# Engelse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: Machine building
kicker: Sector 4.3
h1: Custom work in machine building
intro: Whether you are looking for a complete machine solution or need custom assemblies — at Assink &
  Schipholt you are assured of proven craftsmanship and technical expertise.
heroPhoto:
  subject: Assembled unit / mechanical assembly ready for delivery
bodyHeading: A dependable partner
body:
- Assink & Schipholt is a long-term partner for complete machine building and assembly. We supply custom
  sheet metal work, machined parts and mechanical assemblies, with an emphasis on just-in-time delivery.
- We work for companies that outsource production, OEMs and technical partners who value a flexible approach
  and short lines of communication.
- 'In practice such a project usually starts from an existing set of drawings or from an assembly currently
  spread across several suppliers. We then take the lead: sheet metal and welded construction work we
  produce ourselves, machined parts we have made by a regular partner, and the assembly happens with us
  again. You keep a single point of contact and one party responsible for the dimensions of the whole.'
- 'For the sheet metal and construction parts we use our own machinery: a Trumpf TruLaser 3040 fibre laser
  for 2D cutting, a Trumpf TruLaser Tube 3000 for tube and profile, and a servo-electric press brake with
  a working length of up to 3100 mm. Welded assemblies go up to 10 tonnes unit weight and 8 metres in
  height.'
- Machine building imposes requirements that go beyond the individual parts. A frame has to stay flat
  after welding, holes still have to line up after blasting and coating, and an enclosure has to fit without
  anything being adjusted on site. That is why we set the welding sequence and the measuring points during
  production engineering, and check the critical dimensions right after welding rather than only at final
  inspection.
- We work under ISO 9001 and, for welding, under ISO 3834-2; load-bearing structures fall under EN 1090-1.
  For OEMs producing on call-off we deliver just in time, so that called-off assemblies do not sit on
  your shelves as stock. The call-off rhythm and the accompanying arrangements are agreed per customer.
- Considering outsourcing an assembly? Send the drawing set or 3D model along with the required quantities
  and the call-off rhythm. We assess manufacturability, indicate which parts we make ourselves and which
  come from our partner, and record that before production starts.
process:
