# Engelse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: Laser cutting
kicker: Cutting 2.1
h1: Laser cutting
intro: 2D laser cutting of steel, stainless steel and aluminium with high precision and minimal tolerances
  on our Trumpf TruLaser 3040.
heroPhoto:
  subject: Trumpf TruLaser 3040 with a sheet on the shuttle table
body:
- On the Trumpf TruLaser 3040 we cut steel, stainless steel and aluminium with high precision and consistent
  dimensioning. Laser cutting is often the first step in the production process, followed by deburring
  and press braking.
- 'Which sheet thickness is feasible differs per material. On the Trumpf TruLaser 3040, a 4 kW fibre laser,
  we cut steel from 0.5 to 25 mm, stainless steel from 0.5 to 20 mm, aluminium from 0.5 to 15 mm and galvanised
  steel from 0.5 to 10 mm. Aluminium and stainless steel reflect and conduct heat differently from steel,
  which limits the range at the upper end. If your request falls outside these limits, put it to us: within
  our group more is often possible than on our own machine.'
- Laser cutting is contactless, so no mechanical force acts on the material and the workpiece is not deformed
  by the operation itself. That makes fine contours, narrow webs and small holes achievable that punching
  or sawing cannot manage. The heat-affected zone along the cut stays narrow, which matters especially
  when bending or welding follows.
- 'One step precedes cutting that partly determines the price: nesting. By distributing parts cleverly
  across the sheet we make the best possible use of the material and limit the remnant. On series that
  translates directly into material savings, and for one-offs we can often include a part on a sheet that
  is being opened anyway.'
- After cutting there is a burr on the edge. We deburr by machine on a Timesavers 42 Series RB, so that
  edges are safe and burr-free before anyone handles them — that is not only a matter of finish but of
  occupational safety on your line. Bending usually follows, in which the cut edge becomes the outside
  of the bend and therefore stays visible. See our page on <a href="/en/plaatwerk/zetten/">press braking</a>.
- 'What we need to assess laser cutting work: a PDF drawing and a 3D STEP file, the material and sheet thickness,
  the quantity, and whether the parts have to be deburred or processed further. If you are unsure about
  material choice or thickness, we are glad to think along before the drawing is final.'
