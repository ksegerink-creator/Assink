# Engelse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: "Infrastructure"
kicker: "Sector"
h1: "Steel structures for infrastructure"
intro: "Work for public infrastructure is judged on traceability: which material, which weld, which inspection. We are certified to EN 1090-1 and record that for every order."
heroPhoto:
  subject: "Work for the infrastructure sector"
body:
  - "For infrastructure engineering we make welded steel structures, frames, hatches and enclosures. Parts up to 10 tonnes and constructions up to 8 metres high can be produced in our own hall and moved safely with five 5-tonne overhead cranes; above 5 tonnes we lift in tandem with two cranes."
  - "EN 1090-1 governs the execution of steel and aluminium structures with CE marking; ISO 3834-2 governs the welding procedures. From incoming inspection to final inspection we document the steps, so a client can see what has been done."
