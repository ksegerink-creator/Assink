# Engelse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: "Semiconductor"
kicker: "Sector"
h1: "Precision sheet metal for the semiconductor industry"
intro: "Equipment builders in the semiconductor industry ask for tight tolerances and a clean, even finish. We supply precision sheet metal, frames and panels in stainless steel and aluminium."
heroPhoto:
  subject: "Work for the semicon sector"
body:
  - "We make frames, guard panels, mounting plates and enclosures for machines and modules. Cutting is done on the laser, bending on the servo-electric press brake with an accuracy of ± 0.2 mm, and edges are deburred by machine."
  - "Evenness of the surface matters here: we supply ground stainless steel with a consistent grain, or glass-bead blasted aluminium and stainless steel. Where required, we passivate. Assembly in a cleanroom is not part of our work; we supply the parts and assemblies."
materials: ["Stainless steel 304", "Stainless steel 316", "Aluminium"]
