  - { step: "Bending", desc: "Tight tolerances, ± 0.2 mm." }
  - { step: "Deburring", desc: "Machine-deburred, burr-free and safe edges." }
  - { step: "Surface", desc: "Grinding, glass-bead blasting or passivation." }
