seo:
  title: Steel sheet metal work — laser cutting, press braking and welding
  description: 'Steel sheet metal work from Hengelo: laser cutting up to 25 mm from sheet up to 4000 ×
    2000 mm, press braking up to 3100 mm and MAG welding. With or without finishing.'
faq:
- vraag: What steel thickness can you laser cut?
  antwoord: Steel from 0.5 to 25 mm and galvanised steel from 0.5 to 10 mm, on the Trumpf TruLaser 3040,
    a 4 kW fibre laser. Sheet may measure up to 4000 × 2000 mm.
- vraag: What is the difference between MAG and MIG welding on steel?
  antwoord: Both are processes with filler wire; the difference is the shielding gas. MAG uses active
    gas and is the usual process for steel; MIG uses inert gas and is intended for stainless steel and
    aluminium. So for steel we weld with MAG, or with TIG where the seam has to be clean.
- vraag: Do you also arrange powder coating or galvanising?
  antwoord: We arrange it but do not carry it out ourselves. Powder coating, galvanising and wet painting
    go to regular partners. Deburring we do in house, mechanically on the Timesavers 42 Series RB.
- vraag: When do I choose steel and when stainless steel or aluminium?
  antwoord: Steel is stiffer than aluminium at the same thickness and considerably cheaper than stainless
    steel, but it corrodes without protection. If the part goes into moisture, outdoors or somewhere that
    is cleaned, stainless steel is the logical choice. If weight matters, aluminium. If neither applies,
    steel.
- vraag: Can you process galvanised steel?
  antwoord: 'Yes, from 0.5 to 10 mm. One point to note: the zinc layer vaporises during cutting and welding.
    We adjust the cutting parameters accordingly and agree in advance whether the weld zones need restoring
    afterwards.'
