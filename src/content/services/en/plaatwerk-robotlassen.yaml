title: "Robot welding"
kicker: "Welding technology 4.3"
h1: "Robot welding — cobot welding within our group"
intro: "For series welding work, consistency is not a luxury but a requirement. Automated welding (cobot welding) is carried out within our group at Baas Metaal — integrated with our sheet metal work, assembly and finishing."
body:
  - "Cobot welding lays weld seams under preset parameters, with continuous monitoring of current, voltage, travel speed and heat input. This gives an even weld bead shape and consistent penetration, ideal for repetitive production in steel, stainless steel and aluminium."
  - "Advantages: less variation, fewer rejects, less finishing work and reliable lead times. Engineering forms the basis — fixturing, welding sequence, accessibility and material behaviour determine process efficiency. This work is carried out within our group."
