# Engelse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: "Equipment manufacturing"
kicker: "Sector"
h1: "Sheet metal and constructions for equipment manufacturing"
intro: "Equipment manufacturers need sheet metal and welded assemblies that fit first time. We make frames, casings and enclosures up to 10 tonnes, from a loose part to a finished assembly."
heroPhoto:
  subject: "Work for the equipment manufacturing sector"
body:
  - "We supply welded frames, casings, hoppers and enclosures. Because laser cutting, tube laser cutting, bending and welding are all under one roof, lead times stay short and any dimensional deviation is quickly traced back to its source."
  - "For parts that come into contact with product or cleaning agents, we work in stainless steel 304 or 316 and finish the seams smooth. Passivation and pickling are done in house; powder coating is outsourced."
