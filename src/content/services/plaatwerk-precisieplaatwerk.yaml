# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Precision sheet metal
  kicker: Sheet metal work 1.6
  h1: Precision sheet metal
  intro: Accuracy down to the millimetre. From one-offs to series and repeat orders — dimensionally stable
    and reproducible.
  heroPhoto:
    subject: Precision sheet metal part on a measuring table during dimensional inspection
  body:
  - 'Precision sheet metal calls for controlled processes: from laser cutting and press braking through
    to finishing. Thanks to fixed work instructions and dimensional inspection, part one thousand is just
    as good as part one.'
  - 'For precision sheet metal with tight tolerances we combine laser cutting with a servo-electric press
    brake: this gives a more consistent bend angle than a hydraulic press, even over long series.'
  materials:
  - Stainless steel
  - Aluminium
  - Brass
  - Steel
  process:
  - step: Production engineering
    desc: Determining the flat pattern, bend lines and tolerances.
  - step: Laser cutting
    desc: Dimensionally accurate cutting.
  - step: Press braking
    desc: Repeatable bend angles.
  - step: Dimensional inspection
    desc: Inspection during and after production.
  applications:
  - Machine building
  - Electronics
  - Equipment manufacturing
  related:
  - label: Laser cutting
    desc: 2D laser cutting.
  - label: Bending & forming
    desc: Press brake work.
  - label: Quality
    desc: Our quality assurance.
  seo:
    title: Precision sheet metal work
    description: 'Dimensionally stable precision sheet metal: one-offs, series and repeat orders, delivered
      reproducibly thanks to fixed work instructions and dimensional inspection.'

