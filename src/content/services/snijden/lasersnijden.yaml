    - Whether the parts have to be deburred or processed further
    - Unsure about material choice or thickness? We are glad to think along before the drawing is final

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Laserschneiden
  h1: Laserschneiden
  intro: 2D-Laserschneiden von Stahl, Edelstahl und Aluminium mit hoher Präzision und minimalen Toleranzen auf
    unserer Trumpf TruLaser 3040.
  heroPhoto:
    subject: Trumpf TruLaser 3040 mit einer Tafel auf dem Wechseltisch
  body:
    - Laserschneiden erfolgt berührungslos, es wirkt also keine mechanische Kraft auf das Material und das
      Werkstück verformt sich nicht durch die Bearbeitung selbst. Das macht feine Konturen, schmale Stege und
      kleine Bohrungen machbar, die mit Stanzen oder Sägen nicht gelingen. Die Wärmeeinflusszone entlang des
      Schnitts bleibt schmal, was besonders zählt, wenn danach noch gekantet oder geschweißt wird.
    - "Dem Schneiden geht ein Schritt voraus, der den Preis mitbestimmt: das Schachteln. Indem wir die Teile
      geschickt über die Tafel verteilen, nutzen wir das Material bestmöglich aus und begrenzen den
      Verschnitt. Bei Serien bedeutet das unmittelbar Materialersparnis, bei Einzelstücken können wir ein Teil
      oft auf einer ohnehin geöffneten Tafel mitnehmen."
    - Nach dem Schneiden folgt meist das <a href="/de/plaatwerk/zetten/">Abkanten</a>, wobei die Schnittkante
      zur Außenseite der Biegung wird und damit sichtbar bleibt. Das berücksichtigen wir in der Reihenfolge.
  materials:
    - Stahl
    - Edelstahl
    - Aluminium
    - Verzinkter Stahl
  process:
    - step: Schachteln
      desc: "Teile geschickt über die Tafel verteilen: das nutzt das Material aus und begrenzt den Verschnitt — und
        bestimmt damit den Preis mit."
    - step: Schneiden
      desc: Berührungsloses Laserschneiden, ohne mechanische Kraft auf das Material und mit schmaler
        Wärmeeinflusszone.
    - step: Entgraten
      desc: Maschinell auf einer Timesavers 42 Series RB, damit die Kanten sicher und gratfrei sind, bevor jemand
        damit weiterarbeitet.
  specs:
    - label: Maschine
      value: Trumpf TruLaser 3040
    - label: Typ
      value: 2D-Lasermaschine
    - label: Laserquelle
      value: Faserlaser mit 4 kW
    - label: Werkstoffe
      value: Stahl, Edelstahl, Aluminium, verzinkter Stahl
    - label: Maximales Tafelformat
      value: 4000 × 2000 mm
    - label: Blechdicke Stahl
      value: 0,5–25 mm
    - label: Blechdicke Edelstahl
      value: 0,5–20 mm
    - label: Blechdicke Aluminium
      value: 0,5–15 mm
    - label: Blechdicke verzinkter Stahl
      value: 0,5–10 mm
    - label: Obergrenze
      value: Aluminium und Edelstahl reflektieren und leiten Wärme anders als Stahl, was den Bereich nach oben
        begrenzt
    - label: Außerhalb dieses Bereichs
      value: uns vorlegen — innerhalb unserer Gruppe ist oft mehr möglich als auf unserer eigenen Maschine
  applications:
    - Blechbearbeitung
    - Konstruktionen
    - Präzisionsteile
  faq:
    - vraag: Welche Blechdicken können Sie laserschneiden?
      antwoord: Stahl von 0,5 bis 25 mm, Edelstahl von 0,5 bis 20 mm, Aluminium von 0,5 bis 15 mm und verzinkten
        Stahl von 0,5 bis 10 mm, auf der Trumpf TruLaser 3040. Liegt Ihre Anfrage außerhalb, legen Sie sie uns
        vor, dann prüfen wir, was innerhalb unserer Gruppe möglich ist.
    - vraag: Schneiden Sie auch verzinkten Stahl?
      antwoord: Ja, von 0,5 bis 10 mm. Beachten Sie, dass die Zinkschicht entlang des Schnitts angegriffen wird;
        wird das Teil danach geschweißt oder beschichtet, teilen Sie uns das mit, denn es beeinflusst, wie wir
        Schnitt und Nachbehandlung auslegen.
    - vraag: Müssen die Teile nach dem Schneiden entgratet werden?
      antwoord: Meist ja. Nach dem Schneiden befindet sich ein Grat an der Kante, den wir maschinell auf einer
        Timesavers 42 Series RB entfernen. Das macht die Kanten sicher in der Handhabung und verhindert
        Probleme beim Abkanten und Schweißen. Teilen Sie uns mit, ob Sie die Teile entgratet erhalten möchten.
    - vraag: Kann ich ein einzelnes Teil schneiden lassen oder muss es eine Serie sein?
      antwoord: Ein einzelnes Teil ist möglich. Es muss kein Werkzeug gebaut werden, Einzelstücke und Prototypen
        sind also gut machbar. Ein einzelnes Teil nehmen wir häufig auf einer ohnehin geöffneten Tafel mit,
        was die Kosten senkt.
    - vraag: Was bestimmt den Preis von Laserschneidarbeiten?
      antwoord: Die Schnittlänge, Werkstoff und Blechdicke sowie die Frage, wie gut sich die Teile über die Tafel
        verteilen lassen. Letzteres heißt Schachteln und bestimmt, wie viel Verschnitt übrig bleibt. Bei
        Serien bedeutet eine effiziente Aufteilung unmittelbar Materialersparnis.
