# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Laser cutting
  h1: Laser cutting
  intro: 2D laser cutting of steel, stainless steel and aluminium with high precision and minimal tolerances on
    our Trumpf TruLaser 3040.
  heroPhoto:
    subject: Trumpf TruLaser 3040 with a sheet on the shuttle table
  body:
    - Laser cutting is contactless, so no mechanical force acts on the material and the workpiece is not
      deformed by the operation itself. That makes fine contours, narrow webs and small holes achievable that
      punching or sawing cannot manage. The heat-affected zone along the cut stays narrow, which matters
      especially when bending or welding follows.
    - "One step precedes cutting that partly determines the price: nesting. By distributing parts cleverly
      across the sheet we make the best possible use of the material and limit the remnant. On series that
      translates directly into material savings, and for one-offs we can often include a part on a sheet that
      is being opened anyway."
    - After cutting, <a href="/en/plaatwerk/zetten/">press braking</a> usually follows, in which the cut edge
      becomes the outside of the bend and therefore stays visible. We account for that in the sequence.
  materials:
    - Steel
    - Stainless steel
    - Aluminium
    - Galvanised steel
  process:
    - step: Nesting
      desc: "Distributing parts cleverly across the sheet: it makes the best use of the material and limits the
        remnant — and so partly determines the price."
    - step: Cutting
      desc: Contactless laser cutting, without mechanical force on the material and with a narrow heat-affected
        zone.
    - step: Deburring
      desc: By machine on a Timesavers 42 Series RB, so that edges are safe and burr-free before anyone handles
        them.
  specs:
    - label: Machine
      value: Trumpf TruLaser 3040
    - label: Type
      value: 2D laser machine
    - label: Laser source
      value: 4 kW fibre laser
    - label: Materials
      value: steel, stainless steel, aluminium, galvanised steel
    - label: Maximum sheet size
      value: 4000 × 2000 mm
    - label: Sheet thickness, steel
      value: 0.5–25 mm
    - label: Sheet thickness, stainless steel
      value: 0.5–20 mm
    - label: Sheet thickness, aluminium
      value: 0.5–15 mm
    - label: Sheet thickness, galvanised steel
      value: 0.5–10 mm
    - label: Upper limit
      value: aluminium and stainless steel reflect and conduct heat differently from steel, which limits the range
        at the upper end
    - label: Outside this range
      value: put it to us — within our group more is often possible than on our own machine
  applications:
    - Sheet metal work
    - Welded constructions
    - Precision parts
  faq:
    - vraag: Which sheet thicknesses can you laser cut?
      antwoord: Steel from 0.5 to 25 mm, stainless steel from 0.5 to 20 mm, aluminium from 0.5 to 15 mm and
        galvanised steel from 0.5 to 10 mm, on the Trumpf TruLaser 3040. If your request falls outside that,
        put it to us and we will look at what is possible within our group.
    - vraag: Do you cut galvanised steel as well?
      antwoord: Yes, from 0.5 to 10 mm. Bear in mind that the zinc layer is affected along the cut; if the part is
        welded or coated afterwards, tell us, because it influences how we set up the cut and the subsequent
        treatment.
    - vraag: Do the parts have to be deburred after cutting?
      antwoord: Usually yes. After cutting there is a burr on the edge, which we remove by machine on a Timesavers
        42 Series RB. That makes the edges safe to handle and prevents problems during bending and welding.
        Let us know whether you want the parts supplied deburred.
    - vraag: Can I have a single part cut, or does it have to be a series?
      antwoord: A single part is fine. No tooling has to be made, so one-offs and prototypes are perfectly workable.
        We often include a single part on a sheet that is being opened anyway, which keeps the cost down.
    - vraag: What determines the price of laser cutting?
      antwoord: The cutting length, the material and sheet thickness, and how well the parts can be distributed
        across the sheet. That last part is called nesting and determines how much remnant is left. On series,
        an efficient layout translates directly into material savings.
  related:
    - label: Tube laser cutting
      desc: Cutting tube and profile.
    - label: Deburring
      desc: Edge finishing.
    - label: Machine park
      desc: View the machine.
  seo:
    title: Laser cutting on a Trumpf TruLaser 3040
    description: 2D laser cutting of steel, stainless steel and aluminium on the Trumpf TruLaser 3040 with high
      precision and consistent dimensioning.
