title: Lasersnijden
slug: plaatwerk/lasersnijden
template: service
group: snijden
order: 31
h1: Lasersnijden
intro: 2D-lasersnijden van staal, RVS en aluminium met hoge precisie en minimale toleranties op onze Trumpf
  TruLaser 3040.
heroPhoto:
  subject: Trumpf TruLaser 3040 met een plaat op de wisseltafel
  orient: Liggend 16:10
  crop: Machine-detail
  comp: Snijkop, vonken, plaatveld
body:
  - Lasersnijden is contactloos, dus er staat geen mechanische kracht op het materiaal en het werkstuk
    vervormt niet door de bewerking zelf. Dat maakt fijne contouren, smalle stegen en kleine gaten haalbaar
    die met ponsen of zagen niet lukken. De warmte-beïnvloede zone langs de snede blijft smal, wat vooral telt
    als er daarna nog gekant of gelast wordt.
  - "Voor het snijden gaat er een stap aan vooraf die de prijs mede bepaalt: het nesten. Door delen slim over
    de plaat te verdelen, benutten wij het materiaal zo goed mogelijk en beperken wij de restplaat. Bij series
    levert dat direct materiaalbesparing op, en bij enkelstuks kunnen wij een deel vaak meenemen op een plaat
    die toch al opengaat."
  - Na het snijden volgt meestal <a href="/plaatwerk/zetten/">kanten</a>, waarbij de snijkant de buitenzijde
    van de buiging wordt en dus zichtbaar blijft. Daar houden wij in de volgorde rekening mee.
materials:
  - Staal
  - RVS
  - Aluminium
  - Gegalvaniseerd staal
process:
  - step: Nesten
    desc: "Delen slim over de plaat verdelen: dat benut het materiaal en beperkt de restplaat — en bepaalt dus
      mede de prijs."
  - step: Snijden
    desc: Contactloos lasersnijden, zonder mechanische kracht op het materiaal en met een smalle warmte-beïnvloede
      zone.
  - step: Ontbramen
    desc: Machinaal op een Timesavers 42 Series RB, zodat de randen veilig en braamvrij zijn voordat er iemand mee
      verder werkt.
