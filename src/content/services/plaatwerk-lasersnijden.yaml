# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Laserschneiden
  kicker: Schneiden 2.1
  h1: Laserschneiden
  intro: 2D-Laserschneiden von Stahl, Edelstahl und Aluminium mit hoher Präzision und minimalen Toleranzen
    auf unserer Trumpf TruLaser 3040.
  heroPhoto:
    subject: Trumpf TruLaser 3040 mit einer Tafel auf dem Wechseltisch
  body:
  - Auf der Trumpf TruLaser 3040 schneiden wir Stahl, Edelstahl und Aluminium mit hoher Präzision und gleichbleibender
    Maßhaltigkeit. Das Laserschneiden ist häufig der erste Schritt im Produktionsprozess, gefolgt vom Entgraten
    und Abkanten.
  - 'Welche Blechdicke möglich ist, unterscheidet sich je Werkstoff. Auf der Trumpf TruLaser 3040, einem
    Faserlaser mit 4 kW, schneiden wir Stahl von 0,5 bis 25 mm, Edelstahl von 0,5 bis 20 mm, Aluminium von
    0,5 bis 15 mm und verzinkten Stahl von 0,5 bis 10 mm. Aluminium und Edelstahl reflektieren und leiten
    Wärme anders als Stahl, was den Bereich nach oben begrenzt. Liegt Ihre Anfrage außerhalb dieser Grenzen,
    legen Sie sie uns vor: innerhalb unserer Gruppe ist oft mehr möglich als auf unserer eigenen Maschine.'
  - Laserschneiden erfolgt berührungslos, es wirkt also keine mechanische Kraft auf das Material und das
    Werkstück verformt sich nicht durch die Bearbeitung selbst. Das macht feine Konturen, schmale Stege
    und kleine Bohrungen machbar, die mit Stanzen oder Sägen nicht gelingen. Die Wärmeeinflusszone entlang
    des Schnitts bleibt schmal, was besonders zählt, wenn danach noch gekantet oder geschweißt wird.
  - 'Dem Schneiden geht ein Schritt voraus, der den Preis mitbestimmt: das Schachteln. Indem wir die Teile
    geschickt über die Tafel verteilen, nutzen wir das Material bestmöglich aus und begrenzen den Verschnitt.
    Bei Serien bedeutet das unmittelbar Materialersparnis, bei Einzelstücken können wir ein Teil oft auf
    einer ohnehin geöffneten Tafel mitnehmen.'
  - Nach dem Schneiden befindet sich ein Grat an der Kante. Wir entgraten maschinell auf einer Timesavers
    42 Series RB, damit die Kanten sicher und gratfrei sind, bevor jemand damit weiterarbeitet — das ist
    nicht nur eine Frage der Oberfläche, sondern auch der Arbeitssicherheit bei Ihnen in der Linie. Meist
    folgt danach das <a href="/de/plaatwerk/zetten/">Abkanten</a>, wobei die Schnittkante zur Außenseite
    der Biegung wird und damit sichtbar bleibt.
  - 'Was wir für die Beurteilung von Laserschneidarbeiten benötigen: eine PDF-Zeichnung und eine 3D-STEP-Datei,
    Werkstoff und Blechdicke, die Stückzahl sowie die Angabe, ob die Teile entgratet oder weiterbearbeitet
    werden sollen. Sind Sie bei Werkstoff oder Dicke unsicher, denken wir gerne mit, bevor die Zeichnung
    endgültig ist.'
  materials:
  - Stahl
  - Edelstahl
  - Aluminium
  - Verzinkter Stahl
  process:
