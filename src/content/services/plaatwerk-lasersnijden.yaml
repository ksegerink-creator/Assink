body:
- Op de Trumpf TruLaser 3040 snijden we staal, RVS en aluminium met hoge precisie en constante maatvoering.
  Lasersnijden vormt vaak de eerste stap in het productieproces, gevolgd door ontbramen en zetten.
- 'Welke plaatdikte haalbaar is, verschilt per materiaal. Op de Trumpf TruLaser 3040, een fiberlaser van
  4 kW, snijden wij staal van 0,5 tot 25 mm, RVS van 0,5 tot 20 mm, aluminium van 0,5 tot 15 mm en gegalvaniseerd
  staal van 0,5 tot 10 mm. Aluminium en RVS reflecteren en geleiden warmte anders dan staal, wat het bereik
  aan de bovenkant begrenst. Valt uw aanvraag buiten deze grenzen, leg hem dan voor: binnen onze groep
  is vaak meer mogelijk dan op onze eigen machine.'
- Lasersnijden is contactloos, dus er staat geen mechanische kracht op het materiaal en het werkstuk vervormt
  niet door de bewerking zelf. Dat maakt fijne contouren, smalle stegen en kleine gaten haalbaar die met
  ponsen of zagen niet lukken. De warmte-beïnvloede zone langs de snede blijft smal, wat vooral telt als
  er daarna nog gezet of gelast wordt.
- 'Voor het snijden gaat er een stap aan vooraf die de prijs mede bepaalt: het nesten. Door delen slim
  over de plaat te verdelen, benutten wij het materiaal zo goed mogelijk en beperken wij de restplaat.
  Bij series levert dat direct materiaalbesparing op, en bij enkelstuks kunnen wij een deel vaak meenemen
  op een plaat die toch al opengaat.'
- Na het snijden zit er een braam op de rand. Wij ontbramen machinaal op een Timesavers 42 Series RB,
  zodat de randen veilig en braamvrij zijn voordat er iemand mee verder werkt — dat is niet alleen een
  kwestie van afwerking maar ook van arbeidsveiligheid bij u op de lijn. Daarna volgt meestal <a href="/plaatwerk/zetten/">zetten</a>,
  waarbij de snijkant de buitenzijde van de buiging wordt en dus zichtbaar blijft.
- 'Wat wij nodig hebben om lasersnijwerk te beoordelen: een tekening of 3D-model, het materiaal en de
  plaatdikte, het aantal stuks en of de delen ontbraamd of verder bewerkt moeten worden. Twijfelt u over
  de materiaalkeuze of de dikte, dan denken wij daar graag in mee voordat de tekening definitief is.'
