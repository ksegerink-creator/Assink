  faq:
  - vraag: Welche Blechdicken können Sie laserschneiden?
    antwoord: Stahl von 0,5 bis 25 mm, Edelstahl von 0,5 bis 20 mm, Aluminium von 0,5 bis 15 mm und verzinkten
      Stahl von 0,5 bis 10 mm, auf der Trumpf TruLaser 3040. Liegt Ihre Anfrage außerhalb, legen Sie sie
      uns vor, dann prüfen wir, was innerhalb unserer Gruppe möglich ist.
  - vraag: Schneiden Sie auch verzinkten Stahl?
    antwoord: Ja, von 0,5 bis 10 mm. Beachten Sie, dass die Zinkschicht entlang des Schnitts angegriffen
      wird; wird das Teil danach geschweißt oder beschichtet, teilen Sie uns das mit, denn es beeinflusst,
      wie wir Schnitt und Nachbehandlung auslegen.
  - vraag: Müssen die Teile nach dem Schneiden entgratet werden?
    antwoord: Meist ja. Nach dem Schneiden befindet sich ein Grat an der Kante, den wir maschinell auf einer
      Timesavers 42 Series RB entfernen. Das macht die Kanten sicher in der Handhabung und verhindert Probleme
      beim Abkanten und Schweißen. Teilen Sie uns mit, ob Sie die Teile entgratet erhalten möchten.
  - vraag: Kann ich ein einzelnes Teil schneiden lassen oder muss es eine Serie sein?
    antwoord: Ein einzelnes Teil ist möglich. Es muss kein Werkzeug gebaut werden, Einzelstücke und Prototypen
      sind also gut machbar. Ein einzelnes Teil nehmen wir häufig auf einer ohnehin geöffneten Tafel mit,
      was die Kosten senkt.
  - vraag: Was bestimmt den Preis von Laserschneidarbeiten?
    antwoord: Die Schnittlänge, Werkstoff und Blechdicke sowie die Frage, wie gut sich die Teile über die
      Tafel verteilen lassen. Letzteres heißt Schachteln und bestimmt, wie viel Verschnitt übrig bleibt.
      Bei Serien bedeutet eine effiziente Aufteilung unmittelbar Materialersparnis.
