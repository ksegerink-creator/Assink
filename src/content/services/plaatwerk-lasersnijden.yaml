faq:
- vraag: Welke plaatdiktes kunnen jullie lasersnijden?
  antwoord: 'Staal van 0,5 tot 25 mm, RVS van 0,5 tot 20 mm, aluminium van 0,5 tot 15 mm en gegalvaniseerd
    staal van 0,5 tot 10 mm, op de Trumpf TruLaser 3040. Ligt uw aanvraag daarbuiten, leg hem dan voor:
    dan kijken wij wat er binnen onze groep mogelijk is.'
- vraag: Snijden jullie ook gegalvaniseerd staal?
  antwoord: Ja, van 0,5 tot 10 mm. Houd er rekening mee dat de zinklaag langs de snede wordt aangetast;
    wordt het deel daarna gelast of gecoat, geef dat dan door, want het bepaalt mee hoe wij de snede en
    de nabehandeling inrichten.
- vraag: Moeten de delen na het snijden ontbraamd worden?
  antwoord: Meestal wel. Na het snijden zit er een braam op de rand, die wij machinaal verwijderen op
    een Timesavers 42 Series RB. Dat maakt de randen veilig om te hanteren en voorkomt problemen bij het
    zetten en lassen. Geef door of u de delen ontbraamd wilt ontvangen.
- vraag: Kan ik één onderdeel laten snijden of moet het een serie zijn?
  antwoord: Eén onderdeel kan. Er hoeft geen gereedschap gemaakt te worden, dus enkelstuks en prototypes
    zijn goed te doen. Wij nemen een enkel deel vaak mee op een plaat die toch al opengaat, wat de kosten
    drukt.
- vraag: Wat bepaalt de prijs van lasersnijwerk?
  antwoord: De snijlengte, het materiaal en de plaatdikte, en hoe goed de delen zich over de plaat laten
    verdelen. Dat laatste heet nesten en bepaalt hoeveel restplaat overblijft. Bij series levert een efficiënte
    indeling direct materiaalbesparing op.
