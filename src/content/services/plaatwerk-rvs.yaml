faq:
- vraag: Welke plaatdikte RVS kunnen jullie lasersnijden?
  antwoord: 'Op de Trumpf TruLaser 3040 snijden wij RVS van 0,5 tot 20 mm. Welke dikte in uw geval verstandig
    is, hangt af van de belasting en van de vervolgbewerkingen. Ligt uw aanvraag buiten dat bereik, leg
    hem dan voor: dan kijken we wat er binnen de groep mogelijk is.'
- vraag: Wat is het verschil tussen RVS 304 en RVS 316?
  antwoord: RVS 316 bevat molybdeen en is daardoor beter bestand tegen putcorrosie, vooral in omgevingen
    met chloriden of veel vocht. RVS 304 voldoet in drogere, minder agressieve toepassingen prima. Wij
    verwerken beide kwaliteiten; in ons kennisbankartikel over 304 en 316 zetten we de afweging uitgebreider
    op een rij.
- vraag: Leveren jullie geslepen RVS voor zichtwerk?
  antwoord: Ja. Voor zichtwerk leveren wij geslepen oppervlakken met een consistente korrel en letten
    we erop dat de korrelrichting over de losse delen van een samenstelling doorloopt. Tot en met de laatste
    bewerking blijft beschermfolie zitten, omdat RVS gevoelig is voor krassen.
- vraag: Passiveren jullie RVS na het lassen?
  antwoord: Ja. Lassen tast de beschermende oxidelaag rond de naad aan, wat de plek gevoeliger maakt voor
    corrosie. Wij verwijderen aanloopkleuren en passiveren na het lassen, zodat de corrosiebestendigheid
    van het oppervlak behouden blijft.
