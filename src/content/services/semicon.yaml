body:
  - "We maken frames, afschermpanelen, montageplaten en behuizingen voor machines en modules. Snijden gebeurt op de laser, kanten op de servo-elektrische kantpers met een nauwkeurigheid van ± 0,2 mm, en randen worden machinaal ontbraamd."
  - "Voor het oppervlak is gelijkmatigheid belangrijk: we leveren geslepen RVS met een consistente korrel of glasparelgestraald aluminium en RVS. Waar nodig passiveren we. Assemblage in een cleanroom hoort niet bij ons werk; wij leveren de delen en samenstellingen aan."
