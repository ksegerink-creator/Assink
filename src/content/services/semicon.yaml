h1: "Precisieplaatwerk voor de semiconindustrie"
intro: "Equipmentbouwers in de semicon vragen krappe toleranties en een schone, gelijkmatige afwerking. Wij leveren precisieplaatwerk, frames en panelen in RVS en aluminium."
