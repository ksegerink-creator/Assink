faq:
- vraag: Welke profielmaten en wanddiktes kunnen jullie snijden?
  antwoord: 'Ronde buis tot ø 150 mm en vierkante of rechthoekige profielen tot 120 × 120 mm. De wanddikte
    gaat tot 6 mm in staal en tot 4 mm in RVS. De haalbare lengte hangt af van het profiel en de opspanning;
    die beoordelen wij per aanvraag. Valt uw profiel buiten deze maten, neem dan contact op met onze werkvoorbereiding.'
- vraag: Wat levert buislasersnijden op ten opzichte van zagen en boren?
  antwoord: Vooral pasvorm. Contour, gaten en verbindingsvorm komen in één opspanning uit de machine,
    dus de afwijkingen van afkorten, boren en passend slijpen stapelen zich niet op. Delen vallen in elkaar,
    de lasspleet blijft klein en gelijkmatig, en dat scheelt lastijd, warmte-inbreng en vervorming.
- vraag: Kunnen jullie na het snijden ook lassen en samenstellen?
  antwoord: Ja, in dezelfde hal in Hengelo. Buislasersnijden, plaatwerk, lassen en afwerking zitten bij
    ons onder één dak, dus voor een frame is er één werkvoorbereiding en één aanspreekpunt. Zie ook onze
    pagina's over <a href="/constructies/">constructies</a> en <a href="/rvs-constructies/">RVS-constructies</a>.
- vraag: Doen jullie ook enkelstuks of alleen series?
  antwoord: Allebei. Omdat het programma uit het 3D-model komt en er geen gereedschap gemaakt hoeft te
    worden, is ook een enkel profiel of een kleine serie goed te doen. Bij grotere series ligt het accent
    meer op het nesten en de doorlooptijd.
- vraag: Wat heeft u nodig om een offerte te maken?
  antwoord: Een PDF-tekening en een 3D STEP-bestand van het profiel, de profielsoort en -maat, het materiaal, de lengtes
    en het aantal stuks. Gaat het om een complete constructie, stuur dan ook het samenstel mee; dan beoordelen
    wij meteen de lasvolgorde en de maakbaarheid van het geheel.
