body:
- Wij werken met een Trumpf buislaser voor staal, RVS en aluminium — geschikt voor complexe
  contouren, gaten en verbindingen in één bewerking.
- Dankzij contactloos lasersnijden ontstaat een zeer hoge maatvastheid en reproduceerbaarheid, minder
  nabewerking en kortere doorlooptijden. Ideaal voor zowel enkelstuks als seriewerk. Complexe verbindingen
  komen uit één bewerking — minder passen, sneller lassen.
- Het verschil met zagen en boren zit niet in de snelheid maar in de pasvorm. Bij de klassieke route wordt
  een profiel afgekort, daarna geboord, daarna passend geslepen — en elke stap voegt een afwijking toe
  die zich door de constructie heen opstapelt. Op de buislaser komen de contour, de gaten en de verbindingsvorm
  in één opspanning uit de machine, waardoor die opeenstapeling wegvalt.
- Dat werkt door in het laswerk. Delen die in elkaar vallen hoeven niet passend gemaakt te worden, de
  spleet blijft klein en gelijkmatig, en de lasser hoeft minder te overbruggen. Minder lastijd, minder
  warmte-inbreng en dus minder vervorming in het geheel. In een frame met tientallen verbindingen is dat
  het verschil tussen een constructie die klopt en een die achteraf gericht moet worden.
- Wij combineren buislasersnijden met <a href="/plaatwerk/lasersnijden/">2D-lasersnijden van plaat</a>
  en met het lassen en samenstellen in dezelfde hal in Hengelo. Voor een frame met plaatwerkdelen betekent
  dat één werkvoorbereiding, één planning en één aanspreekpunt, in plaats van afstemming tussen een buisleverancier,
  een plaatleverancier en een lasbedrijf. Voor klanten in Twente en de rest van Overijssel scheelt dat
  bovendien transportbewegingen.
- 'Wat wij nodig hebben voor een beoordeling: een PDF-tekening en een 3D STEP-bestand van het profiel, de profielsoort
  en -maat, het materiaal, de lengtes en het aantal stuks. Ronde buis snijden wij tot ø 150 mm, vierkante
  en rechthoekige profielen tot 120 × 120 mm; de wanddikte gaat tot 6 mm in staal en tot 4 mm in RVS.
  Valt uw profiel daarbuiten, leg het dan voor aan onze werkvoorbereiding. Gaat het om een complete constructie, stuur dan ook het samenstel mee, dan kijken
  we meteen naar de lasvolgorde.'
