h1: Staal plaatwerk
intro: Het werkpaard onder de plaatmaterialen — stijf, goed lasbaar en voordelig. Van losse delen tot
  gelaste samenstellingen, met of zonder nabewerking.
heroPhoto:
  subject: Vakman met een stalen profiel aan de lastafel in Hengelo
  orient: Liggend 4:3
  crop: Persoon aan de lastafel
  comp: Stalen profiel in beeld, afzuigarm erboven
body:
- Staal is bij plaatwerk meestal het uitgangspunt. Het is stijver dan aluminium bij dezelfde dikte, goed
  lasbaar en aanzienlijk voordeliger dan RVS. Waar geen corrosiebestendigheid of zichtwerk-eis speelt,
  is staal daarom vrijwel altijd de verstandige keuze.
- 'Op de Trumpf TruLaser 3040 snijden wij staal van 0,5 tot 25 mm en gegalvaniseerd staal van 0,5 tot
  10 mm, uit plaat tot 4000 × 2000 mm. Gegalvaniseerd staal vraagt om een andere aanpak: de zinklaag
  verdampt bij het snijden en het lassen, dus we stemmen de snijparameters daarop af en overleggen vooraf
  of er na het laswerk nog hersteld moet worden.'
- Kanten gebeurt op onze servo-elektrische Safan Darley E-Brake 150-3100 T3, met 150 ton perskracht en
  een werklengte tot 3100 mm. Toleranties houden wij aan volgens ISO 2768; zijn er krappere maten nodig,
  leg die dan voor aan onze werkvoorbereiding.
- 'Voor laswerk in staal is MAG het gangbare proces: lassen met actief gas, sneller dan TIG en geschikt
  voor dikker materiaal en grotere series. TIG zetten we in waar de naad er netjes uit moet zien of het
  materiaal dun is. Welke methode we kiezen, leest u op onze pagina over <a href="/plaatwerk/lassen/">lassen</a>.'
- 'Nabewerking is bij staal een keuze, geen vanzelfsprekendheid. Wij ontbramen machinaal op de Timesavers
  42 Series RB — bij staal niet alleen een kwestie van uiterlijk maar ook van arbeidsveiligheid verderop
  in de keten. Conserveren doen wij niet zelf: poedercoaten, verzinken en natlakken besteden wij uit aan
  vaste partners, zodat u één aanspreekpunt houdt.'
- Gaat het om een gelaste staalconstructie in plaats van losse plaatdelen, dan geldt een ander traject.
  Wij lassen onder ISO 3834-2 en zijn gecertificeerd volgens EN 1090-1, met een maximaal stukgewicht van
  10 ton. Kijk daarvoor op onze pagina over <a href="/constructies/">constructies</a>.
