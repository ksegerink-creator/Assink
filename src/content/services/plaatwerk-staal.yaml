  seo:
    title: Steel sheet metal — cutting and bending
    description: 'Steel sheet metal work from Hengelo: laser cutting up to 25 mm from sheet up to 4000 ×
      2000 mm, press braking up to 3100 mm and MAG welding. With or without finishing.'
  faq:
  - vraag: What steel thickness can you laser cut?
    antwoord: Steel from 0.5 to 25 mm and galvanised steel from 0.5 to 10 mm, on the Trumpf TruLaser 3040,
      a 4 kW fibre laser. Sheet may measure up to 4000 × 2000 mm.
  - vraag: What is the difference between MAG and MIG welding on steel?
    antwoord: Both are processes with filler wire; the difference is the shielding gas. MAG uses active
      gas and is the usual process for steel; MIG uses inert gas and is intended for stainless steel and
      aluminium. So for steel we weld with MAG, or with TIG where the seam has to be clean.
  - vraag: Do you also arrange powder coating or galvanising?
    antwoord: We arrange it but do not carry it out ourselves. Powder coating, galvanising and wet painting
      go to regular partners. Deburring we do in house, mechanically on the Timesavers 42 Series RB.
  - vraag: When do I choose steel and when stainless steel or aluminium?
    antwoord: Steel is stiffer than aluminium at the same thickness and considerably cheaper than stainless
      steel, but it corrodes without protection. If the part goes into moisture, outdoors or somewhere that
      is cleaned, stainless steel is the logical choice. If weight matters, aluminium. If neither applies,
      steel.
  - vraag: Can you process galvanised steel?
    antwoord: 'Yes, from 0.5 to 10 mm. One point to note: the zinc layer vaporises during cutting and welding.
      We adjust the cutting parameters accordingly and agree in advance whether the weld zones need restoring
      afterwards.'

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  menuLabel: "Stahl"
  title: Stahlblech-Bearbeitung
  h1: Stahlblech-Bearbeitung
  intro: Das Arbeitstier unter den Blechwerkstoffen — steif, gut schweißbar und günstig. Von Einzelteilen
    bis zu geschweißten Baugruppen, mit oder ohne Nachbearbeitung.
  heroPhoto:
    subject: Facharbeiter mit einem Stahlprofil am Schweißtisch in Hengelo
  body:
  - Stahl ist in der Blechbearbeitung meist der Ausgangspunkt. Er ist bei gleicher Dicke steifer als Aluminium,
    gut schweißbar und deutlich günstiger als Edelstahl. Wo keine Korrosionsbeständigkeit und keine Sichtfläche
    gefordert ist, ist Stahl daher fast immer die sinnvolle Wahl.
  - 'Auf der Trumpf TruLaser 3040 schneiden wir Stahl von 0,5 bis 25 mm und verzinkten Stahl von 0,5 bis
    10 mm, aus Tafeln bis 4000 × 2000 mm. Verzinkter Stahl verlangt ein anderes Vorgehen: Die Zinkschicht
    verdampft beim Schneiden und beim Schweißen, deshalb stimmen wir die Schneidparameter darauf ab und
    klären vorab, ob die Schweißzonen danach ausgebessert werden müssen.'
  - Abgekantet wird auf unserer servoelektrischen Safan Darley E-Brake 150-3100 T3 mit 150 Tonnen Presskraft
    und einer Arbeitslänge bis 3100 mm. Toleranzen halten wir nach ISO 2768 ein; sind engere Maße nötig,
    legen Sie diese unserer Arbeitsvorbereitung vor.
  - 'Beim Schweißen von Stahl ist MAG das übliche Verfahren: Schweißen mit aktivem Gas, schneller als WIG
    und geeignet für dickeres Material und größere Serien. WIG setzen wir ein, wo die Naht sauber aussehen
    muss oder das Material dünn ist. Wie wir wählen, lesen Sie auf unserer Seite über das <a href="/de/plaatwerk/lassen/">Schweißen</a>.'
  - 'Die Nachbearbeitung ist bei Stahl eine Entscheidung, keine Selbstverständlichkeit. Wir entgraten maschinell
    auf der Timesavers 42 Series RB — bei Stahl nicht nur eine Frage des Aussehens, sondern auch der Arbeitssicherheit
    weiter unten in der Kette. Den Korrosionsschutz führen wir nicht selbst aus: Pulverbeschichten, Verzinken
    und Nasslackieren vergeben wir an feste Partner, sodass Sie einen Ansprechpartner behalten.'
  - Geht es um eine geschweißte Stahlkonstruktion statt um einzelne Blechteile, gilt ein anderer Weg. Wir
    schweißen nach ISO 3834-2 und sind nach EN 1090-1 zertifiziert, bei einem maximalen Stückgewicht von
    10 Tonnen. Sehen Sie dazu unsere Seite über <a href="/de/constructies/">Konstruktionen</a>.
