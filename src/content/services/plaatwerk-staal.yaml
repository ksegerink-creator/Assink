faq:
- vraag: Welke plaatdikte staal kunnen jullie lasersnijden?
  antwoord: Staal van 0,5 tot 25 mm en gegalvaniseerd staal van 0,5 tot 10 mm, op de Trumpf TruLaser 3040,
    een fiberlaser van 4 kW. De plaat mag tot 4000 × 2000 mm meten.
- vraag: Wat is het verschil tussen MAG- en MIG-lassen bij staal?
  antwoord: Allebei zijn het processen met toevoegdraad, het verschil zit in het beschermgas. MAG gebruikt
    actief gas en is het gangbare proces voor staal; MIG gebruikt inert gas en is bedoeld voor RVS en aluminium.
    Voor staal lassen wij dus met MAG, of met TIG waar de naad netjes moet zijn.
- vraag: Verzorgen jullie ook het poedercoaten of verzinken?
  antwoord: Wij regelen het, maar voeren het niet zelf uit. Poedercoaten, verzinken en natlakken besteden
    wij uit aan vaste partners. Ontbramen doen wij wel in eigen huis, machinaal op de Timesavers 42 Series
    RB.
- vraag: Wanneer kies ik staal en wanneer RVS of aluminium?
  antwoord: Staal is stijver dan aluminium bij dezelfde dikte en beduidend voordeliger dan RVS, maar het
    corrodeert zonder conservering. Komt het deel in vocht, buiten of in een omgeving waar gereinigd wordt,
    dan ligt RVS voor de hand. Telt het gewicht, dan aluminium. Speelt geen van beide, dan staal.
- vraag: Kunnen jullie gegalvaniseerd staal verwerken?
  antwoord: 'Ja, van 0,5 tot 10 mm. Wel een aandachtspunt: de zinklaag verdampt bij het snijden en het
    lassen. Wij stemmen de snijparameters daarop af en overleggen vooraf of de laszones na afloop hersteld
    moeten worden.'

# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  menuLabel: "Steel"
  title: Steel sheet metal work
  h1: Steel sheet metal work
  intro: The workhorse among sheet materials — stiff, readily weldable and economical. From individual parts
    to welded assemblies, with or without finishing.
  heroPhoto:
    subject: Craftsman holding a steel profile at the welding bench in Hengelo
  body:
  - Steel is usually the starting point in sheet metal work. It is stiffer than aluminium at the same thickness,
    readily weldable and considerably cheaper than stainless steel. Where there is no corrosion or visible-surface
    requirement, steel is almost always the sensible choice.
  - 'On the Trumpf TruLaser 3040 we cut steel from 0.5 to 25 mm and galvanised steel from 0.5 to 10 mm,
    from sheet up to 4000 × 2000 mm. Galvanised steel calls for a different approach: the zinc layer vaporises
    during cutting and welding, so we adjust the cutting parameters accordingly and agree in advance whether
    the weld zones need to be restored afterwards.'
  - Press braking takes place on our servo-electric Safan Darley E-Brake 150-3100 T3, with 150 tonnes of
    press force and a working length up to 3100 mm. We hold tolerances to ISO 2768; if you need tighter
    dimensions, put them to our production engineering.
  - 'For welding steel, MAG is the usual process: welding with active gas, faster than TIG and suited to
    thicker material and larger series. We use TIG where the seam has to look clean or the material is thin.
    Our page on <a href="/en/plaatwerk/lassen/">welding</a> explains how we choose.'
  - 'Finishing is a choice with steel, not a given. We deburr mechanically on the Timesavers 42 Series RB
    — with steel that is a matter of workplace safety further down the line, not only of appearance. We
    do not apply protective coatings ourselves: powder coating, galvanising and wet painting go to regular
    partners, so you keep a single point of contact.'
  - If it concerns a welded steel structure rather than individual sheet parts, a different route applies.
    We weld under ISO 3834-2 and are certified to EN 1090-1, with a maximum piece weight of 10 tonnes. See
    our page on <a href="/en/constructies/">welded constructions</a>.
