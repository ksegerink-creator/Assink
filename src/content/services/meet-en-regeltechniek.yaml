body:
  - "We maken instrumentbehuizingen, montageplaten, beugels en frames — vaak in kleine series en in RVS of aluminium. Passingen voor sensoren, wartels en connectoren snijden we mee, zodat monteren zonder nabewerken kan."
  - "Bij dun plaatwerk is bevestiging een aandachtspunt: pers- en trekmoeren zetten we mee in, zodat er geen losse tapgaten of moeren nodig zijn. Randen worden machinaal ontbraamd, en waar het zichtwerk is leveren we geslepen of gestraald."
