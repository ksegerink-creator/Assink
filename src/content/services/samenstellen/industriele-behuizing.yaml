h1: Innovatief in industriële RVS-behuizing
intro: Heeft u behoefte aan maatwerk of seriematig vakwerk voor RVS- of aluminium behuizingen? Dan wordt u bij
  Assink & Schipholt van ontwerp en engineering tot eindproduct ontzorgd.
fotobank: "kantbank"
heroPhoto:
  subject: Afgewerkte RVS machineomkasting, montageklaar
  orient: Liggend 16:10
  crop: Product centraal
  comp: Behuizing op neutrale ondergrond
bodyHeading: Over RVS-behuizingen
body:
  - "Bij een behuizing bepaalt de maatvoering of het geheel klopt: deuren en panelen moeten vlak blijven,
    uitsparingen moeten op de millimeter passen en sluitingen moeten na montage nog soepel werken. Wij kanten
    op een servo-elektrische kantbank met een werklengte tot 3100 mm, zodat lange panelen in één keer gekant
    kunnen worden in plaats van uit delen te worden samengesteld."
  - De materiaalkeuze volgt uit de omgeving. <a href="/plaatwerk/rvs/">RVS</a> in kwaliteit 304 of 316 is de
    logische keuze bij vocht, reiniging of buitenopstelling; <a href="/plaatwerk/aluminium/">aluminium</a> is
    aanmerkelijk lichter en daarmee prettiger bij deuren en panelen die met de hand worden gehanteerd. Bij
    twijfel kijken we naar de belasting en de reinigingsmethode.
  - "Staat de behuizing buiten, dan verschuiven de eisen. Bij een kiosk, een laadpaal of een installatie in de
    infrastructuur telt vooral hoe het water eruit blijft: overlappende naden, een afwaterende bovenzijde en
    doordachte kabeldoorvoeren doen meer dan een zwaardere plaatdikte. In die omgevingen ligt RVS 316 voor de
    hand vanwege strooizout en regen."
  - In ons kennisbankartikel over <a
    href="/kennisbank/industriele-behuizingen-op-maat-rvs-aluminium/">industriële behuizingen op maat</a> gaan
    we dieper in op de afwegingen.
