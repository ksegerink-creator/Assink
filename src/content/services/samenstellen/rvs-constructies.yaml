    - label: Rohr und Profil
      value: Trumpf TruLaser Tube 3000; Aussparungen, Gehrungen und Durchführungen direkt aus der Maschine
    - label: Schweißen
      value: WIG- oder Laserschweißen
    - label: Nach dem Schweißen
      value: Beizen oder Strahlen der Anlauffarben, anschließend Passivieren
    - label: Strahlkabine
      value: 8 × 4 × 3 m, Glasperlen 100–200 μm
    - label: Hygienische Umgebung
      value: durchgeschweißte und glattgeschliffene Nähte, keine Hohlräume, nach Möglichkeit gerundete Übergänge
    - label: Kapazität
      value: bis 10 Tonnen Stückgewicht und 8 m Bauhöhe
    - label: Normen
      value: Schweißen nach ISO 3834-2, tragende Konstruktionen nach EN 1090-1, Qualitätssystem ISO 9001
  aanleveren:
    - PDF-Zeichnung und eine 3D-STEP-Datei
