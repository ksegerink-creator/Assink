      label: max. Stückgewicht
    - waarde: 8 m
      label: max. Bauhöhe
    - waarde: 304 / 316
      label: Edelstahlgüten
  specs:
    - label: Güten
      value: Edelstahl 304 und 316
    - label: Edelstahl 316
      value: enthält Molybdän; widerstandsfähiger gegen Lochkorrosion bei Chloriden — Meerwasser, Reinigungsmittel,
        Streusalz
    - label: Edelstahl 304
      value: genügt in trockeneren, weniger aggressiven Bedingungen und ist günstiger
    - label: Getrennt halten
