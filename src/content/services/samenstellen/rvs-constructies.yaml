# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Stainless steel constructions
  h1: Stainless steel constructions
  intro: Corrosion-resistant constructions in stainless steel — from frames to fully welded assemblies, with a
    hygienic and presentable finish.
  heroPhoto:
    subject: Welded stainless steel structure during final inspection
  body:
    - The choice between stainless steel 304 and 316 often determines the service life of the structure.
      Stainless steel 316 contains molybdenum and is therefore more resistant to pitting corrosion in
      environments with chlorides — seawater, cleaning agents, brine. Stainless steel 304 is sufficient in
      drier and less aggressive conditions and is more economical. We set out the trade-off in more detail in
      our article on <a href="/kennisbank/rvs-304-of-316-welke-kies-je-voor-plaatwerk-en-laswerk/">stainless
      steel 304 or 316</a> (in Dutch).
    - "What sets stainless steel construction work apart from steel is not the welding itself, but what
      happens around it. Stainless steel has to be kept separate from carbon steel: dedicated tools, dedicated
      brushes, a dedicated work area. Residual steel dust rusts and draws rust spots onto an otherwise perfect
      surface — a mistake that only becomes visible weeks later, when the structure has long since been
      delivered."
    - "After welding there is heat tint around the seam. That is not merely cosmetic: at that spot the
      chromium oxide layer has been damaged and the material is susceptible to corrosion. We pickle or blast
      that zone and then passivate, so that the oxide layer restores itself."
  materials:
    - Stainless steel 304
    - Stainless steel 316
  process:
    - step: Tube laser cutting
      desc: Ready-to-fit tube and profile.
    - step: Welding
      desc: TIG or laser welding.
    - step: Finishing
      desc: Pickling and passivation.
    - step: Inspection
      desc: Dimensional and weld seam inspection.
  applications:
    - Machine building
    - Food industry
    - Equipment manufacturing
    - Offshore & maritime
  faq:
    - vraag: Stainless steel 304 or 316 — which should I choose for my structure?
      antwoord: Stainless steel 316 contains molybdenum and is more resistant to pitting corrosion in environments
        with chlorides, such as seawater, brine or aggressive cleaning agents. Stainless steel 304 is adequate
        in drier and less aggressive conditions and is more economical. Tell us where the structure will be
        used and we will advise accordingly.
    - vraag: Why is passivation necessary after welding?
      antwoord: Welding damages the chromium oxide layer around the seam; at that spot the material becomes
        susceptible to corrosion. We remove heat tint by pickling or blasting and then passivate, so that the
        protective layer restores itself. Without that step a stainless steel structure will rust precisely at
        the weld.
    - vraag: Can you supply stainless steel structures for the food industry?
      antwoord: Yes. In hygienic environments we execute seams fully welded and smoothly ground instead of tack
        welded, avoid cavities in which moisture can stand and use rounded transitions where possible. Tell us
        which cleaning agents are used; that partly determines the material choice.
    - vraag: How heavy may a stainless steel structure be?
      antwoord: Up to 10 tonnes unit weight and 8 metres in height. Five overhead cranes of 5 tonnes are installed
        in the hall; by lifting in tandem we move assemblies of up to 10 tonnes.
    - vraag: Do you process stainless steel and carbon steel in the same workshop?
      antwoord: We keep stainless steel separate from carbon steel, with dedicated tools and dedicated brushes.
        Residual steel dust rusts and causes rust spots on an otherwise perfect stainless steel surface; that
        only becomes visible weeks later and is hard to repair by then.
  related:
    - label: Welded constructions
      desc: All construction work.
    - label: Stainless steel
      desc: Stainless steel sheet metal work.
    - label: Food industry
      desc: Hygienic applications.
  seo:
    title: Welded stainless steel constructions
    description: Corrosion-resistant welded stainless steel constructions and assemblies for machine building,
      food and demanding environments.
  kerncijfers:
    - waarde: 10 t
      label: max. piece weight
    - waarde: 8 m
      label: max. build height
    - waarde: 304 / 316
      label: stainless grades
  specs:
    - label: Grades
      value: stainless steel 304 and 316
    - label: Stainless 316
      value: contains molybdenum; more resistant to pitting with chlorides — seawater, cleaning agents, brine
    - label: Stainless 304
      value: sufficient in drier, less aggressive conditions and more economical
    - label: Kept separate
      value: from carbon steel — dedicated tools, dedicated brushes, dedicated work area
    - label: Tube and profile
      value: Trumpf TruLaser Tube 3000; cut-outs, mitres and pass-throughs straight off the machine
    - label: Welding
      value: TIG or laser welding
    - label: After welding
      value: pickling or blasting the heat tint, then passivation
    - label: Blast cabin
      value: 8 × 4 × 3 m, glass beads 100–200 μm
    - label: Hygienic environment
      value: fully welded and ground-smooth seams, no cavities, rounded transitions where possible
    - label: Capacity
      value: up to 10 tonnes piece weight and 8 m build height
    - label: Standards
      value: welding under ISO 3834-2, load-bearing structures under EN 1090-1, quality system ISO 9001
  aanleveren:
    - A PDF drawing and a 3D STEP file
    - The required stainless grade — 304 or 316
    - Whether the structure has to be cleanable, and with which agents
    - That determines both the material choice and the seam execution; we think along about profile choice and
      welding sequence before production starts

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Edelstahlkonstruktionen
  h1: Edelstahlkonstruktionen
  intro: Korrosionsbeständige Konstruktionen aus Edelstahl — von Rahmen bis zu vollständig geschweißten
    Baugruppen, hygienisch und repräsentativ ausgeführt.
  heroPhoto:
    subject: Geschweißte Edelstahlkonstruktion bei der Endkontrolle
  body:
    - Die Wahl zwischen Edelstahl 304 und 316 bestimmt in vielen Fällen die Lebensdauer der Konstruktion.
      Edelstahl 316 enthält Molybdän und ist dadurch widerstandsfähiger gegen Lochkorrosion in chloridhaltigen
      Umgebungen — Meerwasser, Reinigungsmittel, Streusalz. Edelstahl 304 genügt in trockeneren und weniger
      aggressiven Bedingungen und ist günstiger. Die Abwägung stellen wir ausführlicher in unserem Artikel
      über <a href="/kennisbank/rvs-304-of-316-welke-kies-je-voor-plaatwerk-en-laswerk/">Edelstahl 304 oder
      316</a> dar (auf Niederländisch).
    - "Was die Edelstahlkonstruktion vom Stahlbau unterscheidet, ist nicht das Schweißen selbst, sondern das
      Drumherum. Edelstahl muss von Kohlenstoffstahl getrennt bleiben: eigenes Werkzeug, eigene Bürsten, ein
      eigener Arbeitsplatz. Zurückbleibender Stahlstaub rostet und erzeugt Rostflecken auf einer sonst
      einwandfreien Oberfläche — ein Fehler, der erst Wochen später sichtbar wird, wenn die Konstruktion
      längst beim Kunden steht."
    - "Nach dem Schweißen befinden sich Anlauffarben rund um die Naht. Diese sind nicht nur kosmetisch: an
      dieser Stelle ist die Chromoxidschicht angegriffen und das Material korrosionsanfällig. Wir beizen oder
      strahlen diese Zone und passivieren anschließend, damit sich die Oxidschicht wieder aufbaut."
  materials:
    - Edelstahl 304
    - Edelstahl 316
  process:
    - step: Rohrlaserschneiden
      desc: Passgenaue Rohre und Profile.
    - step: Schweißen
      desc: WIG- oder Laserschweißen.
    - step: Nachbearbeitung
      desc: Beizen und Passivieren.
    - step: Prüfung
      desc: Maß- und Schweißnahtkontrolle.
  applications:
    - Maschinenbau
    - Lebensmittelindustrie
    - Apparatebau
    - Offshore & Maritim
  faq:
    - vraag: Edelstahl 304 oder 316 — was soll ich für meine Konstruktion wählen?
      antwoord: Edelstahl 316 enthält Molybdän und ist widerstandsfähiger gegen Lochkorrosion in chloridhaltigen
        Umgebungen wie Meerwasser, Streusalz oder aggressiven Reinigungsmitteln. Edelstahl 304 genügt in
        trockeneren und weniger aggressiven Bedingungen und ist günstiger. Nennen Sie uns die Einsatzumgebung,
        dann beraten wir entsprechend.
    - vraag: Warum ist das Passivieren nach dem Schweißen notwendig?
      antwoord: Das Schweißen greift die Chromoxidschicht rund um die Naht an; dort wird das Material
        korrosionsanfällig. Wir entfernen Anlauffarben durch Beizen oder Strahlen und passivieren
        anschließend, damit sich die Schutzschicht wieder aufbaut. Ohne diesen Schritt rostet eine
        Edelstahlkonstruktion gerade an der Schweißnaht.
    - vraag: Können Sie Edelstahlkonstruktionen für die Lebensmittelindustrie liefern?
      antwoord: Ja. In hygienischen Umgebungen führen wir Nähte durchgeschweißt und glattgeschliffen aus statt
        geheftet, vermeiden Hohlräume, in denen Feuchtigkeit stehen bleibt, und arbeiten wo möglich mit
        abgerundeten Übergängen. Teilen Sie uns mit, womit gereinigt wird; das bestimmt die Werkstoffwahl mit.
    - vraag: Wie schwer darf eine Edelstahlkonstruktion sein?
      antwoord: Bis 10 Tonnen Stückgewicht und 8 Meter Bauhöhe. In der Halle hängen fünf Hallenkrane mit je 5
        Tonnen; im Tandemhub bewegen wir Baugruppen bis 10 Tonnen.
    - vraag: Verarbeiten Sie Edelstahl und Stahl in derselben Werkstatt?
      antwoord: Wir halten Edelstahl von Kohlenstoffstahl getrennt, mit eigenem Werkzeug und eigenen Bürsten.
        Zurückbleibender Stahlstaub rostet und verursacht Rostflecken auf einer sonst einwandfreien
        Edelstahloberfläche; das zeigt sich erst Wochen später und ist dann schwer zu beheben.
  related:
    - label: Konstruktionen
      desc: Alle Konstruktionsarbeiten.
    - label: Edelstahl
      desc: Blechbearbeitung in Edelstahl.
    - label: Lebensmittelindustrie
      desc: Hygienische Anwendungen.
  seo:
    title: Geschweißte Edelstahlkonstruktionen
    description: Korrosionsbeständige geschweißte Edelstahlkonstruktionen und Baugruppen für Maschinenbau,
      Lebensmittel und anspruchsvolle Umgebungen.
  kerncijfers:
