title: RVS-constructies
slug: rvs-constructies
template: service
group: samenstellen
order: 52
h1: RVS-constructies
intro: Corrosiebestendig RVS-constructiewerk — van frames tot volledig gelaste samenstellingen, hygiënisch en
  representatief afgewerkt.
fotobank: "lasser-in-de-hal"
heroPhoto:
  subject: Gelaste RVS-constructie tijdens eindcontrole
  orient: Liggend 16:10
  crop: Constructie centraal
  comp: RVS-frame, controlemoment
body:
  - De keuze tussen RVS 304 en RVS 316 bepaalt in veel gevallen de levensduur van de constructie. RVS 316
    bevat molybdeen en is daardoor beter bestand tegen putcorrosie in omgevingen met chloriden — zeewater,
    reinigingsmiddelen, pekel. RVS 304 volstaat in drogere en minder agressieve omstandigheden en is
    voordeliger. De afweging zetten wij uitgebreider op een rij in ons artikel over <a
    href="/kennisbank/rvs-304-of-316-welke-kies-je-voor-plaatwerk-en-laswerk/">RVS 304 of 316</a>.
  - "Wat RVS-constructiewerk onderscheidt van staal is niet het lassen zelf, maar wat eromheen gebeurt. RVS
    moet gescheiden blijven van koolstofstaal: eigen gereedschap, eigen borstels, een eigen werkplek.
    Achterblijvend staalstof roest en trekt roestvlekken op een verder gaaf oppervlak — een fout die pas weken
    later zichtbaar wordt, als de constructie allang bij de klant staat."
  - "Na het lassen zitten er aanloopkleuren rond de naad. Die zijn niet alleen cosmetisch: op die plek is de
    chroomoxidelaag aangetast en is het materiaal gevoelig voor corrosie. Wij beitsen of stralen die zone en
    passiveren daarna, zodat de oxidelaag zich herstelt."
materials:
  - RVS 304
  - RVS 316
process:
  - step: Buislasersnijden
    desc: Passklare buis en profiel.
  - step: Lassen
    desc: TIG- of laserlassen.
  - step: Afwerking
    desc: Beitsen en passiveren.
  - step: Controle
    desc: Maat- en naadcontrole.
applications:
  - Machinebouw
  - Voedingsmiddelenindustrie
  - Apparatenbouw
  - Offshore & maritiem
faq:
  - vraag: RVS 304 of 316 — welke moet ik kiezen voor mijn constructie?
    antwoord: RVS 316 bevat molybdeen en is beter bestand tegen putcorrosie in omgevingen met chloriden, zoals
      zeewater, pekel of agressieve reinigingsmiddelen. RVS 304 voldoet in drogere en minder agressieve
      omstandigheden en is voordeliger. Geef door in welke omgeving de constructie komt te staan, dan
      adviseren wij daarop.
  - vraag: Waarom is passiveren na het lassen nodig?
    antwoord: Lassen tast de chroomoxidelaag rond de naad aan; op die plek is het materiaal gevoelig voor
      corrosie. Wij verwijderen aanloopkleuren door te beitsen of te stralen en passiveren daarna, zodat de
      beschermende laag zich herstelt. Zonder die stap gaat een RVS-constructie juist bij de las roesten.
  - vraag: Kunnen jullie RVS-constructies leveren voor de voedingsmiddelenindustrie?
    antwoord: Ja. In hygiënische omgevingen voeren wij naden doorgelast en gladgeslepen uit in plaats van
      hechtlassen, vermijden wij holle ruimtes waarin vocht blijft staan en werken wij waar mogelijk met
      afgeronde overgangen. Geef door met welke middelen gereinigd wordt; dat bepaalt de materiaalkeuze mede.
  - vraag: Hoe zwaar mag een RVS-constructie zijn?
    antwoord: Tot 10 ton stukgewicht en 8 meter bouwhoogte. In de hal hangen vijf bovenloopkranen van 5 ton; door
      in tandem te hijsen verplaatsen wij samenstellingen tot 10 ton.
  - vraag: Verwerken jullie RVS en staal in dezelfde werkplaats?
    antwoord: Wij houden RVS gescheiden van koolstofstaal, met eigen gereedschap en eigen borstels. Achterblijvend
      staalstof roest en veroorzaakt roestvlekken op een verder gaaf RVS-oppervlak; dat wordt pas weken later
      zichtbaar en is dan lastig te herstellen.
