title: Machinebouw
slug: machinebouw
template: service
group: samenstellen
order: 53
inFooter: true
h1: Machinebouw op maat
intro: Of u nu een complete machineoplossing zoekt of machinebouw op maat nodig heeft voor losse bouwgroepen —
  bij Assink & Schipholt bent u verzekerd van bewezen vakmanschap en technische expertise.
fotobank: "productiehal"
heroPhoto:
  subject: Gemonteerde bouwgroep / mechanische samenstelling gereed voor uitlevering
  orient: Liggend 16:10
  crop: Product centraal
  comp: Samenstelling op montagetafel
bodyHeading: Betrouwbare partner
body:
  - "In de praktijk begint zo'n traject meestal bij een bestaande tekeningenset of bij een bouwgroep die nu
    over meerdere leveranciers verdeeld is. Wij nemen dan de regie: plaatwerk en constructiewerk maken wij
    zelf, verspaand werk laten wij maken door een vaste partner, en het samenstellen gebeurt weer bij ons. U
    houdt één aanspreekpunt en één partij die verantwoordelijk is voor de maatvoering van het geheel."
  - Machinebouw stelt eisen die verder gaan dan de losse onderdelen. Een frame moet vlak blijven nadat het
    gelast is, gaten moeten na stralen en coaten nog passen, en een omkasting moet zich laten monteren zonder
    dat er op locatie iets bijgeslepen wordt. Daarom leggen wij lasvolgorde en meetpunten vast in de
    werkvoorbereiding en controleren wij de kritische maten direct na het lassen, niet pas bij de eindkeuring.
  - Voor OEM'ers die op afroep produceren leveren wij just-in-time, zodat afgeroepen bouwgroepen niet als
    voorraad bij u blijven staan. Het afroepritme en de bijbehorende afspraken leggen wij per klant vast.
process:
  - step: Volledige machines
    desc: Traject van ontwerp tot oplevering — plaatwerk, constructie en assemblage.
  - step: Losse bouwgroepen
    desc: Functionele modules zoals draagconstructies en frames.
  - step: Plaatwerkdelen
    desc: Omkastingen, panelen en behuizingen in RVS, aluminium of messing.
  - step: Verspaande onderdelen
    desc: CNC-bewerking van assen, bevestigingsdelen en componenten.
  - step: Mechanische assemblages
    desc: Samenstellen van onderdelen tot functionerende systemen.
materials:
  - RVS
  - Aluminium
  - Messing
  - Staal
applications:
  - OEM-machinebouw
  - Elektronica
  - Voedingsmiddelenindustrie
  - Apparatenbouw
faq:
  - vraag: Bouwen jullie complete machines of alleen losse onderdelen?
    antwoord: Allebei. Wij leveren complete machines van ontwerp tot oplevering, losse bouwgroepen zoals
      draagconstructies en frames, en losse plaatwerk- en constructiedelen. Welke vorm het beste past hangt af
      van hoeveel u zelf in huis wilt houden.
  - vraag: Voeren jullie het verspaningswerk zelf uit?
    antwoord: Nee. Draaien, frezen, boren en kotteren laten wij maken door een vaste partner. Wij verzorgen de
      regie, de ingangscontrole en het samenstellen, zodat het voor u één opdracht en één aanspreekpunt
      blijft.
  - vraag: Hoe zwaar en hoe groot mag een samenstelling zijn?
    antwoord: Tot 10 ton stukgewicht en 8 meter bouwhoogte. In de hal hangen vijf bovenloopkranen van 5 ton; door
      in tandem te hijsen verplaatsen wij lasten tot 10 ton.
  - vraag: Leveren jullie just-in-time op afroep?
    antwoord: Ja, dat doen wij voor meerdere OEM-klanten. Het afroepritme, de seriegrootte en de bijbehorende
      voorraadafspraken leggen wij per klant vast, zodat afgeroepen bouwgroepen niet onnodig bij u op voorraad
      komen te staan.
  - vraag: Welke certificeringen hebben jullie voor machinebouw?
    antwoord: Wij werken onder ISO 9001 voor het kwaliteitsmanagementsysteem, ISO 3834-2 voor smeltlassen en EN
      1090-1 voor de uitvoering van staal- en aluminiumconstructies.
related:
