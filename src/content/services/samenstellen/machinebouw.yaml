title: Machinebouw
slug: machinebouw
template: service
group: samenstellen
order: 53
inFooter: true
h1: Machinebouw op maat
intro: Of u nu een complete machineoplossing zoekt of machinebouw op maat nodig heeft voor losse bouwgroepen
  — bij Assink & Schipholt bent u verzekerd van bewezen vakmanschap en technische expertise.
heroPhoto:
  subject: Gemonteerde bouwgroep / mechanische samenstelling gereed voor uitlevering
  orient: Liggend 16:10
  crop: Product centraal
  comp: Samenstelling op montagetafel
bodyHeading: Betrouwbare partner
body:
- Assink & Schipholt is een langdurig partner voor complete machinebouw en assemblage. Wij leveren plaatwerk
  op maat, verspanende onderdelen en mechanische samenstellingen, met nadruk op just-in-time levering.
- Wij werken voor bedrijven met een uitbestedingsbehoefte, OEM'ers en technische partners die waarde hechten
  aan een flexibele aanpak en korte communicatielijnen.
- 'In de praktijk begint zo''n traject meestal bij een bestaande tekeningenset of bij een bouwgroep die
  nu over meerdere leveranciers verdeeld is. Wij nemen dan de regie: plaatwerk en constructiewerk maken
  wij zelf, verspaand werk laten wij maken door een vaste partner, en het samenstellen gebeurt weer bij
  ons. U houdt één aanspreekpunt en één partij die verantwoordelijk is voor de maatvoering van het geheel.'
- 'Voor de plaatwerk- en constructiedelen gebruiken wij ons eigen machinepark: een Trumpf TruLaser 3040
  fiberlaser voor 2D-snijwerk, een Trumpf TruLaser Tube 3000 voor buis en profiel en een servo-elektrische
  kantbank met een werklengte tot 3100 mm. Gelaste samenstellingen gaan bij ons tot 10 ton stukgewicht
  en 8 meter bouwhoogte.'
- Machinebouw stelt eisen die verder gaan dan de losse onderdelen. Een frame moet vlak blijven nadat het
  gelast is, gaten moeten na stralen en coaten nog passen, en een omkasting moet zich laten monteren zonder
  dat er op locatie iets bijgeslepen wordt. Daarom leggen wij lasvolgorde en meetpunten vast in de werkvoorbereiding
  en controleren wij de kritische maten direct na het lassen, niet pas bij de eindkeuring.
- Wij werken onder ISO 9001 en, voor het laswerk, onder ISO 3834-2; draagconstructies vallen onder EN
  1090-1. Voor OEM'ers die op afroep produceren leveren wij just-in-time, zodat afgeroepen bouwgroepen
  niet als voorraad bij u blijven staan. Het afroepritme en de bijbehorende afspraken leggen wij per klant
  vast.
- Overweegt u een bouwgroep uit te besteden? Stuur de PDF-tekeningenset en het 3D STEP-bestand mee met de gewenste
  aantallen en het afroepritme. Wij beoordelen de maakbaarheid, geven aan welke delen wij zelf maken en
  welke bij onze partner vandaan komen, en leggen dat vast voordat de productie begint.
