faq:
- vraag: Bouwen jullie complete machines of alleen losse onderdelen?
  antwoord: Allebei. Wij leveren complete machines van ontwerp tot oplevering, losse bouwgroepen zoals
    draagconstructies en frames, en losse plaatwerk- en constructiedelen. Welke vorm het beste past hangt
    af van hoeveel u zelf in huis wilt houden.
- vraag: Voeren jullie het verspaningswerk zelf uit?
  antwoord: Nee. Draaien, frezen, boren en kotteren laten wij maken door een vaste partner. Wij verzorgen
    de regie, de ingangscontrole en het samenstellen, zodat het voor u één opdracht en één aanspreekpunt
    blijft.
- vraag: Hoe zwaar en hoe groot mag een samenstelling zijn?
  antwoord: Tot 10 ton stukgewicht en 8 meter bouwhoogte. In de hal hangen vijf bovenloopkranen van 5
    ton; door in tandem te hijsen verplaatsen wij lasten tot 10 ton.
- vraag: Leveren jullie just-in-time op afroep?
  antwoord: Ja, dat doen wij voor meerdere OEM-klanten. Het afroepritme, de seriegrootte en de bijbehorende
    voorraadafspraken leggen wij per klant vast, zodat afgeroepen bouwgroepen niet onnodig bij u op voorraad
    komen te staan.
- vraag: Welke certificeringen hebben jullie voor machinebouw?
  antwoord: Wij werken onder ISO 9001 voor het kwaliteitsmanagementsysteem, ISO 3834-2 voor smeltlassen
    en EN 1090-1 voor de uitvoering van staal- en aluminiumconstructies.
