h1: "Perfectie in plaatwerk"
intro: "Plaatwerk op maat met nauwkeurigheid tot op de millimeter. Maatwerk in snijden, zetten en afwerken van fijnplaatmateriaal — enkelstuks én serie, uit Hengelo."
heroPhoto:
  subject: "Breedbeeld productievloer met plaatwerk in bewerking"
  orient: "Liggend 16:10"
  crop: "Breed overzicht"
  comp: "Werkvloer, machines op afstand"
body:
  - "Wij verwerken fijnplaat met CO₂-laser, kantpers en in-house afwerking. Van RVS-zichtwerk tot aluminium behuizingen — maatvast en reproduceerbaar."
  - "Plaatwerk bij Assink & Schipholt gaat verder dan snijden en zetten. Van eerste tekening tot afgewerkt onderdeel begeleiden wij het hele traject: materiaaladvies, engineering, productie en oppervlakteafwerking — onder één dak in Hengelo."
  - "Of het gaat om een enkel prototype of een jaarserie: plaatwerk op maat vraagt om precisie die reproduceerbaar blijft. Onze servo-elektrische kantpersen en lasersnijmachines zorgen voor constante maatvoering, ook bij grotere series."
