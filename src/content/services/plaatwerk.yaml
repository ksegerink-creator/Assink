# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  menuLabel: "Sheet metal"
  title: Sheet metal work
  kicker: Capability 1.0
  h1: Perfection in sheet metal work
  intro: Precision sheet metal with accuracy down to the millimetre. Custom cutting, press braking and finishing
    of thin sheet material — one-offs as well as series.
  heroPhoto:
    subject: Wide shot of the production floor with sheet metal being processed
  body:
  - We process thin sheet with a fiber laser (Trumpf TruLaser 3040, 4 kW), press brake and in-house finishing.
    From stainless steel visible work to aluminium enclosures — dimensionally stable and reproducible.
  - 'Sheet metal work at Assink & Schipholt goes further than cutting and bending. From the first drawing
    to the finished part we guide the whole process: material advice, engineering, production and surface
    finishing — all under one roof in Hengelo.'
  - 'Whether it is a single prototype or an annual series: custom sheet metal calls for precision that stays
    reproducible. Our servo-electric press brakes and laser cutting machines ensure consistent dimensions,
    even for larger series.'
  - 'Which sheet thickness is feasible depends on the material. On the Trumpf TruLaser 3040 — a 4 kW fibre
    laser — we cut steel from 0.5 to 25 mm, stainless steel from 0.5 to 20 mm, aluminium from 0.5 to 15
    mm and galvanised steel from 0.5 to 10 mm. If your request falls outside that range, put it to us: within
    our group more is often possible than on our own machine.'
  - 'A sheet metal part usually follows the same route with us: laser cutting, deburring, press braking
    and, where required, welding and finishing. Deburring is done by machine on a Timesavers 42 Series RB,
    so that edges are burr-free and safe before anyone handles them. Press braking is done on a servo-electric
    Safan Darley E-Brake 150-3100 T3 with 150 tonnes of press force and a working length of up to 3100 mm.'
  - 'One-offs and series call for different preparation. For a prototype the emphasis is on thinking along
    about manufacturability: moving a bend line or repositioning a cut-out often saves an entire operation.
    For series it is about repeatability — the same fixturing, the same sequence and the same inspection
    points, so that the hundredth part matches the first. We do both, on the same machines.'
  - Surface finishing is part of the job in most cases. For aluminium and stainless steel we have our own
    blasting cabin of 8 × 4 × 3 metres, in which we blast an even matt surface with glass beads of 100–200
    μm at 3.0 bar. Stainless steel is passivated after welding, so that the protective oxide layer around
    the seam is restored. We also arrange powder coating and anodising, so you receive a finished part rather
    than a semi-finished product.
  - In sheet metal work, quality is mainly a matter of process control. We work under ISO 9001, for welding
    under ISO 3834-2 and for load-bearing structures under EN 1090-1. In practice that means a fixed incoming
    inspection on material, documented welding parameters and a dimensional inspection before dispatch —
    not only on the first part.
  - Looking to have sheet metal made? Send a PDF drawing and a 3D STEP file together with the material grade
    and sheet thickness, the quantity, and whether it concerns visible surfaces and the finishing that requires.
    With that information we assess manufacturability and prepare a substantiated quotation. If you are
    unsure about material choice or sheet thickness, we are glad to think along before the drawing is final.
  cards:
  - label: Steel
    desc: Stiff, readily weldable and economical — the workhorse.
  - label: Stainless steel
    desc: Ground stainless steel 304 and 316 for corrosion-resistant visible work.
  - label: Aluminium
    desc: Lightweight and strong, including TIG and MIG welding.
  - label: Brass
    desc: Warm copper-zinc alloy for engineering and interiors.
  - label: Precision sheet metal
    desc: Dimensionally stable one-offs and series work.
  - label: Bending & forming
    desc: Accurate bending angles on the servo-electric press brake.
  - label: Laser cutting
    desc: 2D laser cutting of steel, stainless steel and aluminium.
  - label: Welding
    desc: TIG, MIG/MAG and robotic welding.
  - label: Laser welding
    desc: Clean, low-distortion welded joints.
  - label: Deburring
    desc: Burr-free edges after cutting.
  - label: Self-clinching nuts & rivet nuts
    desc: Self-clinching nuts for assembly-ready products.
  - label: Food industry
    desc: Hygienic stainless steel sheet metal work.
  - label: Stainless steel enclosures & cladding
    desc: Machine cladding and housings.
  faq:
  - vraag: Which sheet thicknesses can you laser cut?
    antwoord: 'On the Trumpf TruLaser 3040 we cut steel from 0.5 to 25 mm, stainless steel from 0.5 to 20
      mm, aluminium from 0.5 to 15 mm and galvanised steel from 0.5 to 10 mm. If your request falls outside
      that range, put it to us: we will then look at what is possible within our group.'
  - vraag: Do you also make one-offs, or only series?
    antwoord: Both, on the same machines. For one-offs and prototypes the emphasis is on thinking along
      about manufacturability; for series it is on repeatability of dimensions and finishing, so that the
      last part matches the first.
  - vraag: Which materials do you process in sheet metal work?
    antwoord: Stainless steel 304 and 316, aluminium, brass and steel, including galvanised steel. Which
      material suits best depends on the load, the environment and whether the part is a visible surface
      — we are glad to advise before the drawing is final.
  - vraag: Do you supply sheet metal finished and ready for assembly?
    antwoord: Yes. Deburring, glass bead blasting, passivation, powder coating and the insertion of self-clinching
      and rivet nuts are all part of the process. You receive a part ready for assembly rather than a semi-finished
      product that still needs work elsewhere.
  - vraag: What do you need in order to prepare a quotation?
    antwoord: A PDF drawing and a 3D STEP file, the material grade and sheet thickness, the quantity, and
      whether it concerns visible surfaces with the associated finishing. If information is missing we contact
      you before quoting a price.
  seo:
    title: Custom sheet metal work
    description: 'Precision sheet metal in stainless steel, aluminium and brass: laser cutting, press braking,
      welding and finishing down to the millimetre. One-offs and series from Hengelo.'

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  menuLabel: "Blechbearbeitung"
  title: Blechbearbeitung
  kicker: Möglichkeit 1.0
  h1: Perfektion in der Blechbearbeitung
  intro: Präzisionsblech mit Genauigkeit bis auf den Millimeter. Maßarbeit beim Schneiden, Abkanten und
    Veredeln von Feinblech — Einzelstücke und Serien.
  heroPhoto:
    subject: Breitbildaufnahme der Produktionshalle mit Blecharbeiten in Bearbeitung
  body:
  - Wir bearbeiten Feinblech mit einem Faserlaser (Trumpf TruLaser 3040, 4 kW), Abkantpresse und Veredelung
    im eigenen Haus. Von Edelstahl-Sichtflächen bis zu Aluminiumgehäusen — maßhaltig und reproduzierbar.
  - 'Blechbearbeitung bei Assink & Schipholt geht über Schneiden und Kanten hinaus. Von der ersten Zeichnung
    bis zum fertigen Teil begleiten wir den gesamten Prozess: Materialberatung, Engineering, Produktion
    und Oberflächenveredelung — unter einem Dach in Hengelo.'
  - 'Ob einzelnes Prototyp oder Jahresserie: Blecharbeiten nach Maß erfordern Präzision, die reproduzierbar
    bleibt. Unsere servoelektrischen Abkantpressen und Lasermaschinen sorgen für gleichbleibende Maßhaltigkeit,
    auch bei größeren Serien.'
  - 'Welche Blechdicke möglich ist, hängt vom Werkstoff ab. Auf der Trumpf TruLaser 3040 — einem Faserlaser
    mit 4 kW — schneiden wir Stahl von 0,5 bis 25 mm, Edelstahl von 0,5 bis 20 mm, Aluminium von 0,5 bis
    15 mm und verzinkten Stahl von 0,5 bis 10 mm. Liegt Ihre Anfrage außerhalb dieses Bereichs, legen Sie
    sie uns vor: innerhalb unserer Gruppe ist häufig mehr möglich als auf unserer eigenen Maschine.'
  - 'Ein Blechteil durchläuft bei uns meist denselben Weg: Laserschneiden, Entgraten, Abkanten und bei Bedarf
    Schweißen und Oberflächenbehandlung. Entgratet wird maschinell auf einer Timesavers 42 Series RB, damit
    die Kanten gratfrei und sicher sind, bevor jemand damit weiterarbeitet. Abgekantet wird auf einer servoelektrischen
    Safan Darley E-Brake 150-3100 T3 mit 150 Tonnen Presskraft und einer Arbeitslänge bis 3100 mm.'
  - 'Einzelstücke und Serien erfordern eine unterschiedliche Vorbereitung. Beim Prototyp liegt der Schwerpunkt
    auf der Fertigungsgerechtheit: eine Biegekante zu verschieben oder eine Aussparung anders zu positionieren
    spart oft einen ganzen Arbeitsgang. Bei der Serie geht es um Wiederholgenauigkeit — dieselbe Aufspannung,
    dieselbe Reihenfolge und dieselben Prüfpunkte, damit das hundertste Teil dem ersten gleicht. Wir fertigen
    beides, auf denselben Maschinen.'
  - Die Oberflächenbehandlung gehört in den meisten Fällen dazu. Für Aluminium und Edelstahl haben wir eine
    eigene Strahlkabine von 8 × 4 × 3 Metern, in der wir mit Glasperlen von 100–200 μm bei 3,0 bar eine
    gleichmäßig matte Oberfläche strahlen. Edelstahl passivieren wir nach dem Schweißen, damit die schützende
    Oxidschicht rund um die Naht wiederhergestellt wird. Pulverbeschichten und Eloxieren organisieren wir
    ebenfalls, sodass Sie ein fertiges Bauteil erhalten und kein Halbzeug.
  - Qualität ist in der Blechbearbeitung vor allem Prozesslenkung. Wir arbeiten nach ISO 9001, beim Schweißen
    nach ISO 3834-2 und bei tragenden Konstruktionen nach EN 1090-1. In der Praxis bedeutet das eine feste
    Eingangskontrolle des Materials, dokumentierte Schweißparameter und eine Maßkontrolle vor dem Versand
    — nicht nur am ersten Teil.
  - Möchten Sie Blechteile fertigen lassen? Senden Sie eine PDF-Zeichnung und eine 3D-STEP-Datei mit Werkstoff
    und Blechdicke, der Stückzahl sowie der Angabe, ob es sich um Sichtflächen handelt und welche Oberfläche
    dazugehört. Damit beurteilen wir die Fertigbarkeit und erstellen ein fundiertes Angebot. Sind Sie bei
    Werkstoff oder Blechdicke unsicher, denken wir gerne mit, bevor die Zeichnung endgültig ist.
  cards:
  - label: Stahl
    desc: Steif, gut schweißbar und günstig — das Arbeitstier.
  - label: Edelstahl
    desc: Geschliffener Edelstahl 304 und 316 für korrosionsbeständige Sichtflächen.
  - label: Aluminium
    desc: Leicht und stabil, inkl. WIG- und MIG-Schweißen.
  - label: Messing
    desc: Warme Kupfer-Zink-Legierung für Technik und Interieur.
  - label: Präzisionsblech
    desc: Maßhaltige Einzelstücke und Serienteile.
  - label: Kanten & Biegen
    desc: Präzise Biegewinkel auf der servoelektrischen Abkantpresse.
  - label: Laserschneiden
    desc: 2D-Laserschneiden von Stahl, Edelstahl und Aluminium.
  - label: Schweißen
    desc: WIG-, MIG/MAG- und Roboterschweißen.
  - label: Laserschweißen
    desc: Saubere, verzugsarme Schweißverbindungen.
  - label: Entgraten
    desc: Gratfreie Kanten nach dem Schneiden.
  - label: Einpress- & Blindnietmuttern
    desc: Einpressmuttern für montagefertige Produkte.
  - label: Lebensmittelindustrie
    desc: Hygienische Edelstahl-Blechbearbeitung.
  - label: Edelstahlgehäuse & Verkleidung
    desc: Maschinenverkleidungen und Gehäuse.
  faq:
  - vraag: Welche Blechdicken können Sie laserschneiden?
    antwoord: 'Auf der Trumpf TruLaser 3040 schneiden wir Stahl von 0,5 bis 25 mm, Edelstahl von 0,5 bis
      20 mm, Aluminium von 0,5 bis 15 mm und verzinkten Stahl von 0,5 bis 10 mm. Liegt Ihre Anfrage außerhalb
      dieses Bereichs, legen Sie sie uns vor: dann prüfen wir, was innerhalb unserer Gruppe möglich ist.'
  - vraag: Fertigen Sie auch Einzelstücke oder nur Serien?
    antwoord: Beides, auf denselben Maschinen. Bei Einzelstücken und Prototypen liegt der Schwerpunkt auf
      der Fertigungsgerechtheit, bei Serien auf der Wiederholgenauigkeit von Maßhaltigkeit und Oberfläche,
      damit das letzte Teil dem ersten gleicht.
  - vraag: Welche Werkstoffe verarbeiten Sie in der Blechbearbeitung?
    antwoord: Edelstahl 304 und 316, Aluminium, Messing und Stahl, einschließlich verzinktem Stahl. Welcher
      Werkstoff am besten passt, hängt von der Belastung, der Umgebung und davon ab, ob das Bauteil eine
      Sichtfläche ist — dazu beraten wir gerne, bevor die Zeichnung endgültig ist.
  - vraag: Liefern Sie Blechteile fertig bearbeitet und montagefertig?
    antwoord: Ja. Entgraten, Glasperlstrahlen, Passivieren, Pulverbeschichten und das Einpressen von Einpress-
      und Blindnietmuttern gehören zum Ablauf. Sie erhalten ein montagefertiges Teil und kein Halbzeug,
      das anderswo noch bearbeitet werden muss.
  - vraag: Was benötigen Sie für ein Angebot?
    antwoord: Eine PDF-Zeichnung und eine 3D-STEP-Datei, Werkstoff und Blechdicke, die Stückzahl sowie die
      Angabe, ob es sich um Sichtflächen handelt und welche Oberfläche dazugehört. Fehlen Angaben, melden
      wir uns, bevor wir einen Preis nennen.
  seo:
    title: Blechbearbeitung nach Maß
    description: 'Präzisionsblech in Edelstahl, Aluminium und Messing: Laserschneiden, Abkanten, Schweißen
      und Veredeln bis auf den Millimeter. Einzelstücke und Serien aus Hengelo.'
