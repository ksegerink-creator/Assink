kicker: Mogelijkheid 1.0
h1: Perfectie in plaatwerk
intro: Plaatwerk op maat met nauwkeurigheid tot op de millimeter. Maatwerk in snijden, kanten en afwerken
  van fijnplaatmateriaal — enkelstuks én serie, uit Hengelo.
heroPhoto:
  subject: Breedbeeld productievloer met plaatwerk in bewerking
  orient: Liggend 16:10
  crop: Breed overzicht
  comp: Werkvloer, machines op afstand
body:
- Wij verwerken fijnplaat met een fiberlaser (Trumpf TruLaser 3040, 4 kW), kantbank en in-house afwerking.
  Van RVS-zichtwerk tot aluminium behuizingen — maatvast en reproduceerbaar.
- 'Plaatwerk bij Assink & Schipholt gaat verder dan snijden en kanten. Van eerste tekening tot afgewerkt
  onderdeel begeleiden wij het hele traject: materiaaladvies, engineering, productie en oppervlakteafwerking
  — onder één dak in Hengelo.'
- 'Of het gaat om een enkel prototype of een jaarserie: plaatwerk op maat vraagt om precisie die reproduceerbaar
  blijft. Onze servo-elektrische kantbanken en lasersnijmachines zorgen voor constante maatvoering, ook
  bij grotere series.'
- 'Welke plaatdikte haalbaar is, hangt af van het materiaal. Op de Trumpf TruLaser 3040 — een fiberlaser
  van 4 kW — snijden wij staal van 0,5 tot 25 mm, RVS van 0,5 tot 20 mm, aluminium van 0,5 tot 15 mm en
  gegalvaniseerd staal van 0,5 tot 10 mm. Valt uw aanvraag buiten dat bereik, leg hem dan voor: binnen
  onze groep is vaak meer mogelijk dan op onze eigen machine.'
- 'Een plaatwerkdeel doorloopt bij ons meestal dezelfde route: lasersnijden, ontbramen, kanten en waar
  nodig lassen en afwerken. Ontbramen doen wij machinaal op een Timesavers 42 Series RB, zodat de randen
  braamvrij en veilig zijn voordat er iemand mee verder werkt. Kanten gebeurt op een servo-elektrische
  Safan Darley E-Brake 150-3100 T3 met 150 ton perskracht en een werklengte tot 3100 mm.'
- 'Enkelstuks en serie vragen om een andere voorbereiding. Bij een prototype ligt het accent op meedenken
  over maakbaarheid: een buighoek verplaatsen of een uitsparing anders positioneren scheelt vaak een hele
  bewerking. Bij serie draait het om herhaalbaarheid — dezelfde opspanning, dezelfde volgorde en dezelfde
  controlepunten, zodat het honderdste deel gelijk is aan het eerste. Wij doen allebei, op dezelfde machines.'
- Oppervlakteafwerking hoort er in de meeste gevallen bij. Voor aluminium en RVS hebben wij een eigen
  straalcabine van 8 × 4 × 3 meter, waarin wij met glasparels van 100–200 μm bij 3,0 bar een egaal mat
  oppervlak stralen. RVS passiveren wij na het lassen, zodat de beschermende oxidelaag rond de naad wordt
  hersteld. Poedercoaten en anodiseren verzorgen wij eveneens, zodat u een afgewerkt onderdeel ontvangt
  in plaats van een halffabricaat.
- Kwaliteit is bij plaatwerk vooral procesbeheersing. Wij werken onder ISO 9001, voor laswerk onder ISO
  3834-2 en voor draagconstructies onder EN 1090-1. In de praktijk betekent dat een vaste ingangscontrole
  op materiaal, vastgelegde lasparameters en een maatcontrole vóór verzending — niet alleen op het eerste
  stuk.
- Wilt u plaatwerk laten maken? Stuur een PDF-tekening en een 3D STEP-bestand mee met de materiaalsoort en plaatdikte,
  het aantal stuks, en of het zichtwerk betreft met de bijbehorende afwerking. Met die gegevens beoordelen
  wij de maakbaarheid en maken wij een onderbouwde offerte. Twijfelt u over materiaalkeuze of plaatdikte,
  dan denken wij daar graag in mee voordat de tekening definitief is.
