seo:
  title: Aluminium schweißen — WIG und MIG, verzugsarm
  description: Spezialisierte WIG- und MIG-Schweißarbeit in Aluminium für Maschinenbau, Gehäuse und Leichtbaukonstruktionen.
faq:
- vraag: Mit welchem Verfahren schweißen Sie Aluminium?
  antwoord: Mit WIG und MIG. WIG bietet die größte Kontrolle über die Wärmeeinbringung und eignet sich
    für dünnes Material und Sichtnähte; MIG ist schneller und passt zu dickerem Material und größeren
    Serien. Die Wahl treffen wir pro Auftrag.
- vraag: Warum ist das Schweißen von Aluminium schwieriger als bei Stahl?
  antwoord: Aluminium leitet Wärme deutlich schneller ab, sodass mehr Wärme nötig ist und sich diese weiter
    im Werkstück verteilt. Zudem schmilzt die Oxidschicht erst bei einer weit höheren Temperatur als das
    darunterliegende Aluminium und muss vor dem Schweißen entfernt werden.
- vraag: Wie begrenzen Sie den Verzug bei Aluminium?
  antwoord: Indem wir Teile aufspannen, zuerst heften und die Schweißfolge vorab festlegen. Nach dem Schweißen
    prüfen wir die Maße. Bei dünnem Blech und langen Nähten bestimmt diese Reihenfolge die Maßhaltigkeit
    des Endprodukts.
- vraag: Was geschieht nach dem Schweißen mit der Naht?
  antwoord: Das hängt von der Anwendung ab. Wo das Aussehen zählt, strahlen wir mit Glasperlen für eine
    gleichmäßig matte Oberfläche. Bleibt die Naht verdeckt, genügen Entgraten und eine Sichtprüfung. Geben
    Sie bei Ihrer Anfrage an, welche Seite die Sichtseite ist.
