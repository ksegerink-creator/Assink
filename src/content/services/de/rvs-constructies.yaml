title: Edelstahlkonstruktionen
kicker: Zusammenbau 4.2
h1: Edelstahlkonstruktionen
intro: Korrosionsbeständige Konstruktionen aus Edelstahl — von Rahmen bis zu vollständig geschweißten
  Baugruppen, hygienisch und repräsentativ ausgeführt.
heroPhoto:
  subject: Geschweißte Edelstahlkonstruktion bei der Endkontrolle
body:
- Edelstahlkonstruktionen verbinden Festigkeit mit Korrosionsbeständigkeit. Wir schweißen und montieren
  in Edelstahl 304 und 316, mit einer Nachbearbeitung (Beizen, Passivieren), die auf die Anwendung abgestimmt
  ist — zum Beispiel in der Lebensmittelindustrie.
- Unsere Edelstahl-Konstruktionsarbeit kombiniert Rohrlaserschneiden für passgenaue Profile mit WIG- und
  Laserschweißen, gefolgt von Beizen und Passivieren, damit die Korrosionsbeständigkeit des Materials
  nach der Bearbeitung erhalten bleibt.
- Möchten Sie einen Edelstahlrahmen fertigen lassen? Schicken Sie uns Ihre Zeichnung oder Skizze — wir
  prüfen die Machbarkeit und denken bei Profilwahl und Schweißreihenfolge mit, bevor die Produktion beginnt.
- Die Wahl zwischen Edelstahl 304 und 316 bestimmt in vielen Fällen die Lebensdauer der Konstruktion.
  Edelstahl 316 enthält Molybdän und ist dadurch widerstandsfähiger gegen Lochkorrosion in chloridhaltigen
  Umgebungen — Meerwasser, Reinigungsmittel, Streusalz. Edelstahl 304 genügt in trockeneren und weniger
  aggressiven Bedingungen und ist günstiger. Die Abwägung stellen wir ausführlicher in unserem Artikel
  über <a href="/kennisbank/rvs-304-of-316-welke-kies-je-voor-plaatwerk-en-laswerk/">Edelstahl 304 oder
  316</a> dar (auf Niederländisch).
- 'Was die Edelstahlkonstruktion vom Stahlbau unterscheidet, ist nicht das Schweißen selbst, sondern das
  Drumherum. Edelstahl muss von Kohlenstoffstahl getrennt bleiben: eigenes Werkzeug, eigene Bürsten, ein
  eigener Arbeitsplatz. Zurückbleibender Stahlstaub rostet und erzeugt Rostflecken auf einer sonst einwandfreien
  Oberfläche — ein Fehler, der erst Wochen später sichtbar wird, wenn die Konstruktion längst beim Kunden
  steht.'
- 'Nach dem Schweißen befinden sich Anlauffarben rund um die Naht. Diese sind nicht nur kosmetisch: an
  dieser Stelle ist die Chromoxidschicht angegriffen und das Material korrosionsanfällig. Wir beizen oder
  strahlen diese Zone und passivieren anschließend, damit sich die Oxidschicht wieder aufbaut. Für Aluminium
  und Edelstahl haben wir dafür eine eigene Strahlkabine von 8 × 4 × 3 Metern mit Glasperlen von 100–200
  μm.'
- Für die Profile nutzen wir die Trumpf TruLaser Tube 3000. Aussparungen, Gehrungen und Durchführungen
  kommen direkt aus dem Rohrlaser, sodass die Teile ohne Handarbeit passen und die Nähte gleichmäßig bleiben.
  Das spart Schweißzeit und — bei Edelstahl noch wichtiger — Nacharbeit, denn jeder zusätzliche Schleifvorgang
  ist eine weitere Stelle, die erneut behandelt werden muss.
- 'In hygienischen Umgebungen gelten zusätzliche Anforderungen an die Ausführung: durchgeschweißte und
  glattgeschliffene Nähte statt Heftnähte, keine Hohlräume, in denen Feuchtigkeit stehen bleibt, und wo
  möglich abgerundete Übergänge. Teilen Sie uns bei Ihrer Anfrage mit, ob die Konstruktion gereinigt werden
  muss und mit welchen Mitteln; das bestimmt sowohl die Werkstoffwahl als auch die Nahtausführung.'
- Unsere Konstruktionen gehen bis 10 Tonnen Stückgewicht und 8 Meter Bauhöhe. Beim Schweißen arbeiten
  wir nach ISO 3834-2, bei tragenden Konstruktionen nach EN 1090-1; unser Qualitätssystem ist nach ISO
  9001 zertifiziert.
