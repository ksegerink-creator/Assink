faq:
- vraag: Edelstahl 304 oder 316 — was soll ich für meine Konstruktion wählen?
  antwoord: Edelstahl 316 enthält Molybdän und ist widerstandsfähiger gegen Lochkorrosion in chloridhaltigen
    Umgebungen wie Meerwasser, Streusalz oder aggressiven Reinigungsmitteln. Edelstahl 304 genügt in trockeneren
    und weniger aggressiven Bedingungen und ist günstiger. Nennen Sie uns die Einsatzumgebung, dann beraten
    wir entsprechend.
- vraag: Warum ist das Passivieren nach dem Schweißen notwendig?
  antwoord: Das Schweißen greift die Chromoxidschicht rund um die Naht an; dort wird das Material korrosionsanfällig.
    Wir entfernen Anlauffarben durch Beizen oder Strahlen und passivieren anschließend, damit sich die
    Schutzschicht wieder aufbaut. Ohne diesen Schritt rostet eine Edelstahlkonstruktion gerade an der
    Schweißnaht.
- vraag: Können Sie Edelstahlkonstruktionen für die Lebensmittelindustrie liefern?
  antwoord: Ja. In hygienischen Umgebungen führen wir Nähte durchgeschweißt und glattgeschliffen aus statt
    geheftet, vermeiden Hohlräume, in denen Feuchtigkeit stehen bleibt, und arbeiten wo möglich mit abgerundeten
    Übergängen. Teilen Sie uns mit, womit gereinigt wird; das bestimmt die Werkstoffwahl mit.
- vraag: Wie schwer darf eine Edelstahlkonstruktion sein?
  antwoord: Bis 10 Tonnen Stückgewicht und 8 Meter Bauhöhe. In der Halle hängen fünf Hallenkrane mit je
    5 Tonnen; im Tandemhub bewegen wir Baugruppen bis 10 Tonnen.
- vraag: Verarbeiten Sie Edelstahl und Stahl in derselben Werkstatt?
  antwoord: Wir halten Edelstahl von Kohlenstoffstahl getrennt, mit eigenem Werkzeug und eigenen Bürsten.
    Zurückbleibender Stahlstaub rostet und verursacht Rostflecken auf einer sonst einwandfreien Edelstahloberfläche;
    das zeigt sich erst Wochen später und ist dann schwer zu beheben.
