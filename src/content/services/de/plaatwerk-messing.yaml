faq:
- vraag: Welche Messing-Blechdicken können Sie verarbeiten?
  antwoord: Das entscheiden wir je Anfrage. Die für unseren Faserlaser bestätigten Schneiddicken gelten
    für Stahl, Edelstahl, Aluminium und verzinkten Stahl; Messing ist eine Kupferlegierung und verhält
    sich unter dem Laser anders. Senden Sie Ihre Zeichnung mit Blechdicke und Messinggüte, dann geben
    wir an, was machbar ist.
- vraag: Verfärbt sich Messing mit der Zeit?
  antwoord: 'Ja. In Kontakt mit Luft und Feuchtigkeit bildet sich eine Patina: zunächst gelbbraun, später
    braun bis grünlich. Für manche Anwendungen ist das gerade erwünscht. Möchten Sie den ursprünglichen
    Glanz erhalten, ist eine Schutzlackierung nötig oder es muss regelmäßig poliert werden.'
- vraag: Können Sie Messing abkanten, ohne die Oberfläche zu beschädigen?
  antwoord: Ja. Messing ist weicher als Edelstahl und Stahl und verkratzt daher schneller. Wir belassen
    die Schutzfolie bis einschließlich des letzten Arbeitsgangs, arbeiten mit sauberem Werkzeug und berücksichtigen
    die Walzrichtung, weil eine Biegung quer zur Faser eher reißt.
- vraag: Wofür wird Messingblech vor allem eingesetzt?
  antwoord: Für den Innenausbau, Kunstobjekte und dekorative technische Bauteile — Anwendungen, bei denen
    der warme, gelbe Glanz den Unterschied macht. Für rein funktionale Teile ohne Sichtanforderung sind
    Edelstahl oder Aluminium meist günstiger.
- vraag: Können Sie Messing schweißen?
  antwoord: Messing ist bei uns als Werkstoff für das Laserschweißen gelistet. Wegen des Zinks in der
    Legierung erfordert es allerdings angepasste Parameter und eine gute Absaugung. Legen Sie uns Ihre
    Verbindung mit Blechdicke und Nahtform vor, dann geben wir an, ob Schweißen, Löten oder eine mechanische
    Verbindung in Ihrem Fall der bessere Weg ist.
