# Duitse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: Kanten & Biegen
kicker: Blechbearbeitung 1.4
h1: Kanten & Biegen
intro: Präzise Biegewinkel und konstante Maßhaltigkeit auf unserer servoelektrischen Abkantpresse.
heroPhoto:
  subject: Abkantpresse in Betrieb — Blech wird gekantet
body:
- Das Abkanten bestimmt die Form des Blechteils. Auf unserer Safan Darley E-Brake 150-3100 T3 kanten wir
  maßhaltig, mit Rücksicht auf Rückfederung und Biegeradius je Material.
- 'Das Kanten von Edelstahl erfordert eine andere Herangehensweise als bei Stahl: Edelstahl federt stärker
  zurück und ist empfindlicher für Kratzer auf der Sichtfläche. Wir passen Biegeradius und Werkzeugwahl
  entsprechend an, damit der Winkel stimmt und die Oberfläche intakt bleibt.'
- Der Biegeradius ist keine Nebensache, sondern eine Konstruktionsentscheidung. Ein zu enger Radius lässt
  das Material an der Außenseite reißen, ein großzügiger Radius macht den Winkel schwerer beherrschbar.
  Als Faustregel gilt bei Stahl ein Innenradius von mindestens der Materialdicke; bei Aluminium liegt
  er höher, weil es weniger dehnt, und bei Edelstahl spielt die Walzrichtung mit. Wir legen den Radius
  je Anfrage anhand von Werkstoff, Dicke und eingesetztem Werkzeug fest und melden es, wenn Ihre Zeichnung
  einen nicht machbaren Radius verlangt.
- Die Rückfederung ist der zweite Faktor. Jeder Werkstoff federt nach dem Biegen etwas zurück, sodass
  der gemessene Winkel größer ausfällt als der eingestellte. Edelstahl federt stärker zurück als Stahl,
  und je dicker und härter das Material, desto größer der Unterschied. Auf einer servoelektrischen Abkantpresse
  lässt sich das gut kompensieren, weil der Antrieb genau und wiederholbar positioniert; wir stellen darauf
  ein und prüfen die erste Biegung, bevor die Serie durchläuft.
- 'Die Abwicklung ist der Kern der Arbeitsvorbereitung. Beim Biegen dehnt sich das Material außen und
  staucht innen, die flache Länge ist also nicht einfach die Summe der Schenkel. Wir berechnen diese Biegekompensation
  selbst, Sie müssen also keine abgewickelte Zeichnung liefern: ein 3D-Modell oder eine Zeichnung des
  Endprodukts genügt. Liefern Sie doch eine Abwicklung, nennen Sie uns die zugrunde gelegte Kompensation,
  sonst weicht das Maß ab.'
- Auch die Reihenfolge zählt. Eine Biegung kann einer früheren im Weg stehen, und ein Schenkel zu nah
  an einer Bohrung oder Aussparung verformt den Rand. Deshalb beurteilen wir Biegefolge und den Abstand
  von Bohrungen zur Biegelinie bereits an der Zeichnung, zusammen mit der Frage, ob das Werkzeug überhaupt
  herankommt. Das verhindert, dass sich ein Teil erst auf der Presse als nicht fertigbar erweist.
- 'Bei Sichtflächen kommt eine Ebene hinzu. Die Oberfläche ist der empfindlichste Teil eines gekanteten
  Produkts: Werkzeuge hinterlassen Spuren, und Edelstahl und Messing verkratzen schnell. Wir belassen
  die Schutzfolie bis einschließlich des letzten Arbeitsgangs und arbeiten bei Bedarf mit angepasstem
  Werkzeug. Mehr zur Werkstoffseite auf unseren Seiten über <a href="/de/plaatwerk/rvs/">Edelstahlblech</a>
  und <a href="/de/plaatwerk/messing/">Messing</a>.'
- 'Was wir für die Beurteilung von Abkantarbeit benötigen: eine Zeichnung oder ein 3D-Modell des Endprodukts,
  Werkstoff und Blechdicke, den gewünschten Biegeradius, sofern er feststeht, die Angabe, ob es sich um
  Sichtflächen handelt, und die Stückzahl. Die maximale Länge einer einzelnen Biegung beträgt bei uns
  3100 mm; längere Teile setzen wir aus mehreren Stücken zusammen oder lösen sie anders.'
