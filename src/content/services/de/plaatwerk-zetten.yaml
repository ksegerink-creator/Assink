faq:
- vraag: Welchen Biegeradius können Sie abkanten?
  antwoord: Das hängt von Werkstoff, Blechdicke und Werkzeug ab. Als Faustregel gilt bei Stahl ein Innenradius
    von mindestens der Materialdicke; bei Aluminium liegt er höher, bei Edelstahl zählt die Walzrichtung
    mit. Steht Ihr Radius fest, nennen Sie ihn uns — dann beurteilen wir die Machbarkeit, bevor die Zeichnung
    endgültig ist.
- vraag: Muss ich die Abwicklung selbst berechnen?
  antwoord: Nein. Wir berechnen die Biegekompensation selbst, ein 3D-Modell oder eine Zeichnung des Endprodukts
    genügt also. Liefern Sie doch eine Abwicklung, nennen Sie uns die zugrunde gelegte Kompensation, sonst
    weicht das Endmaß ab.
- vraag: Wie lang darf eine Biegung sein?
  antwoord: Bis 3100 mm in einer Biegung, die Arbeitslänge unserer Safan Darley E-Brake 150-3100 T3 mit
    150 Tonnen Presskraft. Längere Teile setzen wir aus mehreren Stücken zusammen oder lösen sie in Absprache
    anders.
- vraag: Warum federt Edelstahl stärker zurück als Stahl?
  antwoord: Edelstahl hat eine höhere Streckgrenze und federt nach dem Biegen daher weiter zurück, sodass
    der gemessene Winkel größer ausfällt als der eingestellte. Je dicker und härter das Material, desto
    größer der Unterschied. Wir kompensieren das beim Einrichten und prüfen die erste Biegung, bevor die
    Serie durchläuft.
- vraag: Lässt sich ohne Kratzer auf Sichtflächen abkanten?
  antwoord: Ja. Wir belassen die Schutzfolie bis einschließlich des letzten Arbeitsgangs und arbeiten
    bei Bedarf mit angepasstem Werkzeug. Teilen Sie uns bei Ihrer Anfrage mit, welche Seite die Sichtseite
    ist, dann berücksichtigen wir das in der Biegefolge.
