title: "Roboterschweißen"
kicker: "Schweißtechnik 4.3"
h1: "Roboterschweißen — Cobot-Schweißen innerhalb unserer Gruppe"
intro: "Bei Serienschweißarbeit ist Gleichmäßigkeit kein Luxus, sondern eine Voraussetzung. Automatisiertes Schweißen (Cobot-Schweißen) führen wir innerhalb unserer Gruppe bei Baas Metaal aus — integriert mit unserer Blechbearbeitung, dem Zusammenbau und der Nachbearbeitung."
body:
  - "Beim Cobot-Schweißen werden die Schweißnähte unter voreingestellten Parametern gelegt, mit kontinuierlicher Überwachung von Strom, Spannung, Vorschubgeschwindigkeit und Wärmeeinbringung. Das ergibt eine gleichmäßige Schweißraupenform und einen konstanten Einbrand — ideal für wiederkehrende Produktion in Stahl, Edelstahl und Aluminium."
  - "Vorteile: weniger Streuung, geringerer Ausschuss, weniger Nachbearbeitung und verlässliche Lieferzeiten. Die Arbeitsvorbereitung bildet die Basis — Aufspannung, Schweißfolge, Zugänglichkeit und Materialverhalten bestimmen die Prozesseffizienz. Diese Arbeit führen wir innerhalb unserer Gruppe aus."
