title: "Roboterschweißen"
kicker: "Schweißtechnik 3.3"
h1: "Roboterschweißen — automatisiertes Schweißen in Serie"
intro: "Bei Serienschweißarbeit ist Gleichmäßigkeit kein Luxus, sondern eine Voraussetzung. Für größere Serien setzen wir automatisiertes Schweißen über einen festen Partner ein, während Blechbearbeitung, Zusammenbau und Nachbearbeitung bei uns in Hengelo erfolgen. Sie behalten einen Ansprechpartner für die gesamte Serie."
body:
  - "Beim automatisierten Schweißen werden die Schweißnähte unter voreingestellten Parametern gelegt, mit kontinuierlicher Überwachung von Strom, Spannung, Vorschubgeschwindigkeit und Wärmeeinbringung. Das ergibt eine gleichmäßige Schweißraupenform und einen konstanten Einbrand — ideal für wiederkehrende Produktion in Stahl, Edelstahl und Aluminium."
  - "Vorteile: weniger Streuung, geringerer Ausschuss, weniger Nachbearbeitung und verlässliche Lieferzeiten. Die Arbeitsvorbereitung bildet die Basis — Aufspannung, Schweißfolge, Zugänglichkeit und Materialverhalten bestimmen die Prozesseffizienz. Diese Vorbereitung übernehmen wir selbst."
materials: ["Stahl", "Edelstahl", "Aluminium"]
process:
