faq:
- vraag: Welche Profilmaße und Wandstärken können Sie schneiden?
  antwoord: 'Rundrohr bis ø 150 mm und quadratische oder rechteckige Profile bis 120 × 120 mm. Die Wandstärke
    geht bis 6 mm in Stahl und bis 4 mm in Edelstahl. Die machbare Länge hängt vom Profil und von der Aufspannung
    ab; das beurteilen wir je Anfrage. Liegt Ihr Profil außerhalb dieser Maße, wenden Sie sich an unsere Arbeitsvorbereitung.'
- vraag: Was bringt Rohrlaserschneiden gegenüber Sägen und Bohren?
  antwoord: Vor allem Passgenauigkeit. Kontur, Bohrungen und Verbindungsform kommen in einer Aufspannung
    aus der Maschine, die Abweichungen von Ablängen, Bohren und Passschleifen summieren sich also nicht
    auf. Teile greifen ineinander, der Schweißspalt bleibt klein und gleichmäßig, was Schweißzeit, Wärmeeinbringung
    und Verzug spart.
- vraag: Können Sie nach dem Schneiden auch schweißen und montieren?
  antwoord: Ja, in derselben Halle in Hengelo. Rohrlaserschneiden, Blechbearbeitung, Schweißen und Oberfläche
    liegen bei uns unter einem Dach, für einen Rahmen gibt es also eine Arbeitsvorbereitung und einen
    Ansprechpartner. Siehe auch unsere Seiten über <a href="/de/constructies/">Konstruktionen</a> und
    <a href="/de/rvs-constructies/">Edelstahlkonstruktionen</a>.
- vraag: Fertigen Sie auch Einzelstücke oder nur Serien?
  antwoord: Beides. Da das Programm aus dem 3D-Modell kommt und kein Werkzeug gebaut werden muss, ist
    auch ein einzelnes Profil oder eine kleine Serie gut machbar. Bei größeren Serien verschiebt sich
    der Schwerpunkt auf Schachtelung und Durchlaufzeit.
- vraag: Was benötigen Sie für ein Angebot?
  antwoord: Eine PDF-Zeichnung und eine 3D-STEP-Datei des Profils, Profilart und -größe, den Werkstoff, die Längen
    und die Stückzahl. Geht es um eine komplette Konstruktion, senden Sie auch die Baugruppe mit; dann
    beurteilen wir gleich Schweißfolge und Fertigbarkeit des Ganzen.
