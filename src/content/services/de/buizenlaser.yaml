title: Rohrlaserschneiden
kicker: Schneiden 2.2
h1: Rohrlaserschneiden
intro: Präzises Rohrlaserschneiden für maßhaltige Rohre und Profile, mit moderner CNC-Steuerung und hoher
  Genauigkeit.
heroPhoto:
  subject: Rohrlaserschneidmaschine in Betrieb mit rotierendem Profil
body:
- Wir arbeiten mit einem Trumpf-Rohrlaser für Stahl, Edelstahl und Aluminium — geeignet
  für komplexe Konturen, Bohrungen und Verbindungen in einem Arbeitsgang.
- Durch das berührungslose Laserschneiden entstehen eine sehr hohe Maßhaltigkeit und Reproduzierbarkeit,
  weniger Nacharbeit und kürzere Durchlaufzeiten. Ideal für Einzelstücke wie auch für Serienteile. Komplexe
  Verbindungen entstehen in einem Arbeitsgang — weniger Anpassen, schnelleres Schweißen.
- Der Unterschied zum Sägen und Bohren liegt nicht in der Geschwindigkeit, sondern in der Passgenauigkeit.
  Auf dem klassischen Weg wird ein Profil abgelängt, dann gebohrt, dann passend geschliffen — und jeder
  Schritt fügt eine Abweichung hinzu, die sich durch die Konstruktion hindurch aufsummiert. Auf dem Rohrlaser
  kommen Kontur, Bohrungen und Verbindungsform in einer Aufspannung aus der Maschine, wodurch diese Aufsummierung
  entfällt.
- Das wirkt sich auf das Schweißen aus. Teile, die ineinandergreifen, müssen nicht passend gemacht werden,
  der Spalt bleibt klein und gleichmäßig, und der Schweißer muss weniger überbrücken. Weniger Schweißzeit,
  weniger Wärmeeinbringung und damit weniger Verzug im Ganzen. Bei einem Rahmen mit Dutzenden Verbindungen
  ist das der Unterschied zwischen einer stimmigen Konstruktion und einer, die nachträglich gerichtet
  werden muss.
- Wir kombinieren das Rohrlaserschneiden mit dem <a href="/de/plaatwerk/lasersnijden/">2D-Laserschneiden
  von Blech</a> sowie mit Schweißen und Montage in derselben Halle in Hengelo. Für einen Rahmen mit Blechteilen
  bedeutet das eine Arbeitsvorbereitung, eine Planung und einen Ansprechpartner statt Abstimmung zwischen
  Rohrlieferant, Blechlieferant und Schweißbetrieb.
- 'Was wir für eine Beurteilung benötigen: eine PDF-Zeichnung und eine 3D-STEP-Datei des Profils, Profilart und
  -größe, den Werkstoff, die Längen und die Stückzahl. Rundrohr schneiden wir bis ø 150 mm, quadratische
  und rechteckige Profile bis 120 × 120 mm; die Wandstärke geht bis 6 mm in Stahl und bis 4 mm in Edelstahl.
  Liegt Ihr Profil außerhalb dieser Maße, legen Sie es unserer Arbeitsvorbereitung vor.
  Geht es um eine komplette Konstruktion, senden Sie auch die Baugruppe mit, dann prüfen wir gleich die
  Schweißfolge.'
