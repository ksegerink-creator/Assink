# Duitse vertaling — zie TERMINOLOGIE.md. Slug/foto's komen uit de NL-bron.
title: "Konstruktionen"
kicker: "Möglichkeit 5.1"
h1: "Konstruktiv in Konstruktionen"
intro: "Seit über 100 Jahren Spezialist für hochwertige Metallkonstruktionen. Von einzelnen Bauteilen bis zu vollständig geschweißten Baugruppen — traditionelle Handwerkskunst mit moderner Technik."
bodyHeading: "Spezialist für Konstruktionsarbeit"
body:
  - "Assink & Schipholt fertigt schwere und komplexe Schweißbaugruppen — von einzelnen Bauteilen bis zu vollständig geschweißten Baugruppen. Wir arbeiten für Maschinenbau, Apparatebau und Infrastrukturtechnik und verarbeiten Bauteile bis 5 Tonnen."
  - "Mit Hallenkran und einer geräumigen Halle fertigen wir Konstruktionen bis 4 Meter Höhe und 50 m² Fläche — sicher und effizient."
  - "Wir übernehmen nicht nur Schweiß- und Konstruktionsarbeiten, sondern auch Oberflächenbehandlungen wie Strahlen, Pulverbeschichten, Eloxieren und Edelstahl-Passivieren — vieles davon im eigenen Haus. So haben Sie einen Ansprechpartner von der Konstruktion bis zur Endbearbeitung."
materials: ["Edelstahl 304 / 316", "Aluminium", "Messing", "Stahl"]
process:
  - { step: "Engineering & Arbeitsvorbereitung", desc: "Prüfung von Zeichnung, Schweißfolge und Herstellbarkeit." }
  - { step: "Schneiden & Vorbereiten", desc: "Laserschneiden von Blech und Rohr, Kanten und Anpassen." }
  - { step: "Schweißen & Zusammenbau", desc: "Hand- und Laserschweißen bis zur vollständigen Baugruppe." }
  - { step: "Oberflächenbehandlung", desc: "Strahlen, Pulverbeschichten, Eloxieren oder Passivieren." }
  - { step: "Prüfung & Lieferung", desc: "Maßkontrolle und visuelle Prüfung, danach Just-in-time-Lieferung." }
specs:
  - { label: "Max. Gewicht pro Stück", value: "bis 5 Tonnen" }
  - { label: "Max. Höhe der Konstruktion", value: "± 4 m" }
  - { label: "Max. Fläche", value: "± 50 m²" }
  - { label: "Hebezeug", value: "Hallenkran" }
applications: ["Maschinenbau (Rahmen, Schutzhauben)", "Apparatebau", "Infrastrukturtechnik", "Lebensmittelindustrie", "Elektrotechnik", "Mechatronik"]
