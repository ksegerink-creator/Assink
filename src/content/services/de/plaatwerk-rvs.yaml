seo:
  title: Edelstahl-Blechbearbeitung — geschliffener Edelstahl 304 und 316
  description: 'Korrosionsbeständige, repräsentative Edelstahl-Blechbearbeitung in 304 und 316: Laserschneiden,
    Abkanten, Entgraten und Passivieren für Sichtflächen und Maschinenbau.'
faq:
- vraag: Welche Blechdicke in Edelstahl können Sie laserschneiden?
  antwoord: 'Auf der Trumpf TruLaser 3040 schneiden wir Edelstahl von 0,5 bis 20 mm. Welche Dicke in Ihrem
    Fall sinnvoll ist, hängt von der Belastung und den nachfolgenden Bearbeitungen ab. Liegt Ihre Anfrage
    außerhalb dieses Bereichs, sprechen Sie uns an: Dann prüfen wir, was innerhalb der Gruppe möglich
    ist.'
- vraag: Was ist der Unterschied zwischen Edelstahl 304 und 316?
  antwoord: Edelstahl 316 enthält Molybdän und ist dadurch beständiger gegen Lochkorrosion, insbesondere
    in Umgebungen mit Chloriden oder viel Feuchtigkeit. 304 genügt in trockeneren, weniger aggressiven
    Anwendungen. Wir verarbeiten beide Güten; in unserem Wissensbeitrag zu 304 und 316 stellen wir die
    Abwägung ausführlicher dar.
- vraag: Liefern Sie geschliffenen Edelstahl für Sichtflächen?
  antwoord: Ja. Für Sichtflächen liefern wir geschliffene Oberflächen mit einheitlicher Körnung und achten
    darauf, dass die Schliffrichtung über die einzelnen Teile einer Baugruppe durchläuft. Die Schutzfolie
    bleibt bis zur letzten Bearbeitung erhalten, da Edelstahl kratzempfindlich ist.
- vraag: Passivieren Sie Edelstahl nach dem Schweißen?
  antwoord: Ja. Das Schweißen beeinträchtigt die schützende Oxidschicht rund um die Naht, wodurch diese
    Stelle korrosionsanfälliger wird. Wir entfernen Anlauffarben und passivieren nach dem Schweißen, damit
    die Korrosionsbeständigkeit der Oberfläche erhalten bleibt.
