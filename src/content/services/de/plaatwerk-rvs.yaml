title: Edelstahl-Blechbearbeitung
kicker: Blechbearbeitung 1.1
h1: Edelstahl-Blechbearbeitung
intro: 'Geschliffenes Edelstahlblech für Sichtflächen: korrosionsbeständig, repräsentativ und maßhaltig.
  Unsere Edelstahl-Blechbearbeitung umfasst Laserschneiden, Abkanten, Entgraten und Passivieren.'
heroPhoto:
  subject: Nahaufnahme von geschliffenem Edelstahl-Kantteil mit scharfer Kante
body:
- Edelstahl (rostfreier Stahl) eignet sich besonders für Anwendungen, die sowohl korrosionsbeständig als
  auch repräsentativ sein müssen. Wir verarbeiten vor allem Edelstahl 304 und 316.
- Für Sichtflächen liefern wir geschliffene Oberflächen mit einheitlicher Körnung. Geschnitten wird mit
  dem Laser; Kanten werden entgratet und bei Bedarf passiviert.
- 'Die Edelstahl-Blechbearbeitung erfordert Sorgfalt: falsche Schweißparameter oder Rückstände von Kohlenstoffstahl
  auf der Oberfläche führen zu Rostbildung. Wir passivieren nach dem Schweißen, damit die korrosionsbeständige
  Oberfläche intakt bleibt.'
- 'Von Einzelstück-Sichtflächen bis zu seriellem Edelstahl-Blechwerk für die Lebensmittelindustrie oder
  den Maschinenbau: Jede Charge wird mit derselben Körnung und denselben Toleranzen ausgeführt.'
- 'Auf der Trumpf TruLaser 3040 schneiden wir Edelstahl von 0,5 bis 20 mm. Welche Dicke sinnvoll ist,
  hängt von der Belastung und von den nachfolgenden Bearbeitungen ab: dünneres Material ist leichter und
  günstiger, benötigt bei großen Flächen aber Versteifungen oder abgekantete Flansche, um eben zu bleiben.
  Bei Sichtflächen achten wir zusätzlich auf die Schliffrichtung, damit sie über die einzelnen Teile einer
  Baugruppe durchläuft.'
- 'Das Abkanten von Edelstahl erfordert mehr Sorgfalt als bei Stahl: Das Material federt stärker zurück
  und die Oberfläche ist kratzempfindlich. Wir kanten auf einer servoelektrischen Abkantpresse mit einer
  Arbeitslänge bis 3100 mm und arbeiten bei Sichtflächen mit Schutzfolie und angepasstem Werkzeug. Mehr
  dazu auf unserer Seite über das <a href="/de/plaatwerk/zetten/">Abkanten</a>.'
- 'Für eine belastbare Beurteilung Ihrer Anfrage benötigen wir: eine Zeichnung oder ein 3D-Modell, die
  gewünschte Werkstoffgüte, die Blechdicke, ob es sich um Sichtflächen handelt und welche Nachbehandlung
  dazugehört, sowie die Stückzahl. Falls Sie zwischen 304 und 316 abwägen, stellen wir den Unterschied
  in unserem Artikel <a href="/kennisbank/rvs-304-of-316-welke-kies-je-voor-plaatwerk-en-laswerk/">Edelstahl
  304 oder 316</a> gegenüber (niederländisch).'
- Nicht jede Verbindung muss geschweißt werden. Für Sichtflächen wählen wir häufig das <a href="/de/plaatwerk/laserlassen/">Laserschweißen</a>,
  weil die schmale Naht wenig Wärme einbringt und damit wenig Nacharbeit erfordert. Wo eine demontierbare
  oder dauerhaft belastete Verbindung nötig ist, arbeiten wir mit <a href="/de/plaatwerk/persmoeren-trekmoeren/">Einpress-
  und Blindnietmuttern</a>. Welcher Weg der beste ist, hängt von der Belastung, der Sichtseite und der
  Anzahl der Montagezyklen ab.
