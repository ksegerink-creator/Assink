  - "Bearbeitbar in Stahl, Edelstahl, Aluminium, Messing und Aluminiumguss — vom Prototyp bis zur Serie, kombiniert mit unserer eigenen Blechbearbeitung und Konstruktionsarbeit für komplette Produkte aus einer Hand."
