intro: "Dreh- und Fräsarbeiten führen wir nicht in Hengelo aus; diese geben wir an einen festen Partner. So liefern wir neben unserer eigenen Blechbearbeitung und Konstruktionsarbeit auch feinmechanische Bauteile — mit einem Ansprechpartner für das Ganze."
