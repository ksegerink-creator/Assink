seo:
  title: Industriegehäuse — Edelstahlgehäuse nach Maß
  description: Hochwertige Gehäuse aus Edelstahl und Aluminium für Steuerungssysteme, Maschinen und anspruchsvolle
    Umgebungen. Maßarbeit und Serie, inklusive ATEX.
faq:
- vraag: In welchen Werkstoffen fertigen Sie Gehäuse?
  antwoord: In Edelstahl 304 und 316 sowie in Aluminium. Edelstahl ist die logische Wahl bei Feuchtigkeit,
    Reinigung oder Außenaufstellung; Aluminium ist deutlich leichter und damit angenehmer bei Türen und
    Paneelen, die von Hand gehandhabt werden.
- vraag: Können Sie Ausschnitte und Montagepunkte mit ausführen?
  antwoord: Ja. Ausschnitte für Verschraubungen, Displays und Kühlung werden auf dem Laser mitgeschnitten,
    und für Montagepunkte arbeiten wir mit Einpress- und Blindnietmuttern. Das erspart separate Arbeitsgänge
    im Nachhinein und hält die Maßhaltigkeit unter Kontrolle.
- vraag: Liefern Sie Einzelstücke oder nur Serien?
  antwoord: Beides. Vom einzelnen Schaltschrank bis zur Serienfertigung desselben Gehäuses. Bei Serien
    achten wir besonders darauf, dass Oberfläche und Schliffrichtung über alle Exemplare gleich bleiben.
- vraag: Wie wird ein Gehäuse nachbehandelt?
  antwoord: Das hängt von Werkstoff und Anwendung ab. Edelstahl-Sichtflächen liefern wir geschliffen,
    und nach dem Schweißen entfernen wir Anlauffarben und passivieren. Aluminium kann glasperlgestrahlt
    werden für eine gleichmäßig matte Oberfläche.
