h1: (Cobot)robotlassen — geautomatiseerd lassen in serie
intro: Bij seriematig laswerk is consistentie geen luxe, maar een vereiste. Voor grotere series zetten
  we geautomatiseerd lassen in via een vaste partner, terwijl het plaatwerk, het samenstellen en de nabewerking
  bij ons in Hengelo gebeuren. U houdt één aanspreekpunt voor de hele serie.
heroPhoto:
  subject: Gelaste samenstelling uit serieproductie, lasnaad in beeld
  orient: Liggend 16:10
  crop: Werkstuk + lasnaad
  comp: Doorlopende lasnaad op een maatvast werkstuk
body:
- Geautomatiseerd lassen legt lasnaden onder vooraf ingestelde parameters, met continu monitoren van stroom,
  spanning, voortloopsnelheid en warmte-inbreng. Dat geeft een gelijkmatige lasrupsvorm en constante inbranding,
  ideaal voor repeterende productie in staal, RVS en aluminium.
- 'Voordelen: minder variatie, lagere uitval, minder nabewerking en betrouwbare levertijden. Engineering
  vormt de basis — opspanning, lasvolgorde, toegankelijkheid en materiaalgedrag bepalen de procesefficiëntie.
  Die voorbereiding doen wij.'
- 'Of geautomatiseerd lassen loont, hangt minder af van het aantal stuks dan van de herhaling. De tijd
  zit vooraf: opspanning bouwen, baan programmeren en parameters inregelen. Bij een serie die één keer
  langskomt weegt die voorbereiding zwaar; bij een product dat elk kwartaal terugkeert verdient hij zich
  telkens opnieuw terug. Leg uw jaarvolume en afroepritme voor, dan rekenen wij die afweging door.'
- 'De rolverdeling is bij ons expliciet. Engineering, werkvoorbereiding, plaatwerk, opspanning, samenstellen
  en nabewerking gebeuren in Hengelo. Het geautomatiseerde lassen zelf voeren wij niet in eigen huis uit:
  dat gebeurt binnen onze groep bij Baas Metaal. Wij hebben in Hengelo geen lasrobot en geen cobot staan.
  Voor u blijft het één opdracht, één aanspreekpunt en één partij die verantwoordelijk is voor de maatvoering
  van het geheel.'
- 'Niet elk product leent zich ervoor. Een lasrobot volgt een vaste baan, dus de naad moet bereikbaar
  zijn, de delen moeten elke keer identiek in de mal liggen en de voorbewerking moet strak zijn. Juist
  daar zit onze voorbereiding: wij snijden de delen op de laser, zodat de spleet klein en constant blijft.
  Grote of wisselende spleten zijn de belangrijkste reden dat geautomatiseerd lassen niet het verwachte
  resultaat geeft.'
- Bij kleine aantallen, prototypes en zichtwerk is handmatig <a href="/plaatwerk/lassen/">TIG- of MIG-lassen</a>
  of <a href="/plaatwerk/laserlassen/">laserlassen</a> meestal de betere route. Laserlassen brengt weinig
  warmte in en vraagt weinig nabewerking, wat bij een strakke zichtnaad zwaarder weegt dan snelheid.
- 'Voor een beoordeling hebben wij nodig: de PDF-tekening en het 3D STEP-bestand van de samenstelling, het materiaal
  en de plaatdikte, de lasnaden met hun eisen, het aantal per serie en het afroepritme. Daarmee bepalen
  wij of geautomatiseerd lassen in uw geval iets oplevert, of dat handlassen goedkoper uitvalt.'
materials:
- Staal
- RVS
- Aluminium
process:
- step: Engineering
