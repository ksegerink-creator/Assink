body:
  - "Cobotlassen legt lasnaden onder vooraf ingestelde parameters, met continu monitoren van stroom, spanning, voortloopsnelheid en warmte-inbreng. Dat geeft een gelijkmatige lasrupsvorm en constante inbranding, ideaal voor repeterende productie in staal, RVS en aluminium."
  - "Voordelen: minder variatie, lagere uitval, minder nabewerking en betrouwbare levertijden. Engineering vormt de basis — opspanning, lasvolgorde, toegankelijkheid en materiaalgedrag bepalen de procesefficiëntie. Dit werk voeren we uit binnen onze groep."
