intro: "Bij seriematig laswerk is consistentie geen luxe, maar een vereiste. Geautomatiseerd lassen (cobotlassen) verzorgen we binnen onze groep bij Baas Metaal — geïntegreerd met ons plaatwerk, samenstellen en nabewerking."
