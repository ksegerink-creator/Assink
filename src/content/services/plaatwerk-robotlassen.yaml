h1: "Robotlassen — geautomatiseerd lassen in serie"
intro: "Bij seriematig laswerk is consistentie geen luxe, maar een vereiste. Voor grotere series zetten we geautomatiseerd lassen in via een vaste partner, terwijl het plaatwerk, het samenstellen en de nabewerking bij ons in Hengelo gebeuren. U houdt één aanspreekpunt voor de hele serie."
heroPhoto:
  # Let op: in Hengelo staat geen cobot of lasrobot. Vraag hier dus geen foto
  # van een lasopstelling aan — die kan niet bij Assink gemaakt worden.
  subject: "Gelaste samenstelling uit serieproductie, lasnaad in beeld"
  orient: "Liggend 16:10"
  crop: "Werkstuk + lasnaad"
  comp: "Doorlopende lasnaad op een maatvast werkstuk"
body:
  - "Geautomatiseerd lassen legt lasnaden onder vooraf ingestelde parameters, met continu monitoren van stroom, spanning, voortloopsnelheid en warmte-inbreng. Dat geeft een gelijkmatige lasrupsvorm en constante inbranding, ideaal voor repeterende productie in staal, RVS en aluminium."
  - "Voordelen: minder variatie, lagere uitval, minder nabewerking en betrouwbare levertijden. Engineering vormt de basis — opspanning, lasvolgorde, toegankelijkheid en materiaalgedrag bepalen de procesefficiëntie. Die voorbereiding doen wij."
