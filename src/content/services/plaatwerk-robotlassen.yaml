faq:
- vraag: Vanaf welke serie is geautomatiseerd lassen interessant?
  antwoord: 'Daar is geen vast aantal voor. Bepalend is de herhaling: de tijd zit in het bouwen van de
    opspanning en het programmeren van de baan, en die voorbereiding verdient zich pas terug als het product
    vaker terugkomt. Geef uw jaarvolume en afroepritme door, dan rekenen wij de afweging door tegen handlassen.'
- vraag: Hebben jullie zelf een lasrobot in huis?
  antwoord: Nee. In Hengelo staat geen lasrobot en geen cobot. Het geautomatiseerde lassen gebeurt binnen
    onze groep bij Baas Metaal. Wij verzorgen de engineering, het plaatwerk, de opspanning, het samenstellen
    en de nabewerking, en houden de regie over de hele serie.
- vraag: In welke materialen kan seriematig gelast worden?
  antwoord: Staal, RVS en aluminium. Per materiaal verschillen de parameters en de warmte-inbreng; bij
    RVS hoort na het lassen altijd het verwijderen van aanloopkleuren en passiveren, omdat de corrosiebestendigheid
    rond de naad anders achteruitgaat.
- vraag: Wat bepaalt of mijn product zich leent voor robotlassen?
  antwoord: Bereikbaarheid van de naad, een herhaalbare opspanning en een strakke voorbewerking. Een robot
    volgt een vaste baan, dus de delen moeten elke keer identiek liggen en de spleet moet klein en constant
    zijn. Wij snijden de delen daarom op de laser.
- vraag: Wie is verantwoordelijk voor de kwaliteit als het lassen bij een partner gebeurt?
  antwoord: Wij. U heeft één opdracht en één aanspreekpunt. Wij verzorgen de ingangscontrole, de maatcontrole
    en het samenstellen, en zijn aanspreekbaar op de maatvoering van het geheel. Ons kwaliteitssysteem
    is ISO 9001-gecertificeerd en voor laswerk werken wij onder ISO 3834-2.
