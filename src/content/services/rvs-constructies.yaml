faq:
- vraag: RVS 304 of 316 — welke moet ik kiezen voor mijn constructie?
  antwoord: RVS 316 bevat molybdeen en is beter bestand tegen putcorrosie in omgevingen met chloriden,
    zoals zeewater, pekel of agressieve reinigingsmiddelen. RVS 304 voldoet in drogere en minder agressieve
    omstandigheden en is voordeliger. Geef door in welke omgeving de constructie komt te staan, dan adviseren
    wij daarop.
- vraag: Waarom is passiveren na het lassen nodig?
  antwoord: Lassen tast de chroomoxidelaag rond de naad aan; op die plek is het materiaal gevoelig voor
    corrosie. Wij verwijderen aanloopkleuren door te beitsen of te stralen en passiveren daarna, zodat
    de beschermende laag zich herstelt. Zonder die stap gaat een RVS-constructie juist bij de las roesten.
- vraag: Kunnen jullie RVS-constructies leveren voor de voedingsmiddelenindustrie?
  antwoord: Ja. In hygiënische omgevingen voeren wij naden doorgelast en gladgeslepen uit in plaats van
    hechtlassen, vermijden wij holle ruimtes waarin vocht blijft staan en werken wij waar mogelijk met
    afgeronde overgangen. Geef door met welke middelen gereinigd wordt; dat bepaalt de materiaalkeuze
    mede.
- vraag: Hoe zwaar mag een RVS-constructie zijn?
  antwoord: Tot 10 ton stukgewicht en 8 meter bouwhoogte. In de hal hangen vijf bovenloopkranen van 5
    ton; door in tandem te hijsen verplaatsen wij samenstellingen tot 10 ton.
- vraag: Verwerken jullie RVS en staal in dezelfde werkplaats?
  antwoord: Wij houden RVS gescheiden van koolstofstaal, met eigen gereedschap en eigen borstels. Achterblijvend
    staalstof roest en veroorzaakt roestvlekken op een verder gaaf RVS-oppervlak; dat wordt pas weken
    later zichtbaar en is dan lastig te herstellen.
