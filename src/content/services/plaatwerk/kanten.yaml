title: Kanten
slug: plaatwerk/zetten
template: service
group: plaatwerk
order: 25
h1: Kanten
intro: Nauwkeurige buighoeken en constante maatvoering op onze servo-elektrische kantbank.
fotobank: "kantbank"
heroPhoto:
  subject: Kantbank in bedrijf — plaat wordt gekant
  orient: Liggend 16:10
  crop: Machine + hand van operator
  comp: Kantbank, plaat onder de pers
body:
  - De buigradius is bij kanten geen bijzaak maar een ontwerpkeuze. Een te krappe radius laat het materiaal
    aan de buitenzijde scheuren, een ruime radius maakt de hoek moeilijker te beheersen. Wij bepalen de radius
    per aanvraag op basis van materiaal, dikte en gereedschap, en geven het door als uw tekening een radius
    vraagt die niet haalbaar is.
  - Terugvering is de tweede factor. Elk materiaal veert na het kanten een stukje terug, waardoor de gemeten
    hoek groter uitvalt dan de ingestelde. Op een servo-elektrische kantbank is dat goed te compenseren omdat
    de aandrijving nauwkeurig en herhaalbaar positioneert; wij stellen daarop in en controleren de eerste
    zetting voordat de serie doorloopt.
  - Ook de volgorde telt. Een zetting kan een eerdere zetting in de weg zitten, en een flens die te dicht op
    een gat of uitsparing ligt vervormt de rand. Daarom beoordelen wij de zetvolgorde en de afstand van gaten
    tot de buiglijn al op tekening, samen met de vraag of het gereedschap er überhaupt bij kan. Dat voorkomt
    dat een deel pas op de pers onmaakbaar blijkt.
  - "Bij zichtwerk komt er een laag bij. Het oppervlak is het kwetsbaarste deel van een gekant product:
    gereedschap laat sporen na en RVS en messing krassen snel. Wij laten de beschermfolie tot en met de
    laatste bewerking zitten en werken waar nodig met aangepast gereedschap. Meer over de materiaalkant staat
    op onze pagina's over <a href=\"/plaatwerk/rvs/\">RVS-plaatwerk</a> en <a
    href=\"/plaatwerk/messing/\">messing</a>."
materials:
  - RVS
  - Aluminium
  - Messing
  - Staal
process:
  - step: Uitslag bepalen
    desc: "Wij berekenen de buigcompensatie zelf: bij het buigen rekt het materiaal aan de buitenkant en stuikt
      het aan de binnenkant, dus de platte lengte is niet de som van de benen."
  - step: Instellen
    desc: Gereedschap en aanslag instellen, met de buigradius en de verwachte terugvering voor dit materiaal.
  - step: Kanten
    desc: Buigen met constante hoeknauwkeurigheid, in de volgorde die in de werkvoorbereiding is vastgelegd.
  - step: Controle
    desc: Hoek- en maatcontrole, te beginnen bij de eerste zetting voordat de serie doorloopt.
specs:
  - label: Machine
