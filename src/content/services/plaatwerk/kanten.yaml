    - Werkstoff und Blechdicke
    - Den gewünschten Biegeradius, sofern er feststeht
    - Ob es sich um Sichtflächen handelt
    - Stückzahl
    - "Liefern Sie doch eine Abwicklung: mit welcher Biegekompensation sie erstellt wurde"
