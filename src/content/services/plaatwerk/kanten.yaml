# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Bending & forming
  h1: Bending & forming
  intro: Precise bend angles and consistent dimensioning on our servo-electric press brake.
  heroPhoto:
    subject: Press brake in operation — sheet being bent
  body:
    - The bend radius is not a detail but a design choice. Too tight a radius cracks the material on the
      outside; too generous a radius makes the angle harder to control. We determine the radius per request
      based on material, thickness and tooling, and let you know if your drawing calls for a radius that is
      not achievable.
    - Springback is the second factor. Every material springs back a little after bending, so the measured
      angle ends up larger than the set one. On a servo-electric press brake this can be compensated well
      because the drive positions accurately and repeatably; we set up for it and check the first bend before
      the batch runs on.
    - The sequence matters too. One bend can get in the way of another, and a flange that sits too close to a
      hole or cut-out will distort the edge. That is why we assess the bending sequence and the distance from
      holes to the bend line on the drawing, together with the question of whether the tooling can even reach.
      That prevents a part turning out to be unmakeable only once it is on the press.
    - 'With visible work there is an extra layer. The surface is the most vulnerable part of a bent product:
      tooling leaves marks, and stainless steel and brass scratch easily. We keep the protective film on up to
      and including the last operation and use adapted tooling where required. There is more on the material
      side on our pages about <a href="/en/plaatwerk/rvs/">stainless steel sheet metal</a> and <a
      href="/en/plaatwerk/messing/">brass</a>.'
  materials:
    - Stainless steel
    - Aluminium
    - Brass
    - Steel
  process:
    - step: Determining the flat pattern
      desc: "We calculate the bend allowance ourselves: during bending the material stretches on the outside and
        compresses on the inside, so the flat length is not the sum of the legs."
    - step: Setting up
      desc: Setting the tooling and back gauge, with the bend radius and the expected springback for this material.
    - step: Press braking
      desc: Bending with consistent angular accuracy, in the sequence fixed during production engineering.
    - step: Inspection
      desc: Angle and dimensional inspection, starting with the first bend before the batch runs on.
  specs:
    - label: Machine
      value: Safan Darley E-Brake 150-3100 T3
    - label: Drive
      value: servo-electric
    - label: Press force
      value: 150 tonnes
    - label: Bend length
      value: up to 3100 mm per bend
    - label: Tolerances
      value: to ISO 2768
    - label: Bend radius, steel
      value: inside radius at least equal to the material thickness (rule of thumb)
    - label: Bend radius, aluminium
      value: wider than for steel — aluminium stretches less
    - label: Bend radius, stainless steel
      value: rolling direction plays a part
    - label: Springback
      value: stainless steel springs back more than steel; increases with thickness and hardness
    - label: Flat pattern
      value: we calculate the bend allowance ourselves
  applications:
    - Enclosures
    - Panels
    - Casings
    - Structural parts
  faq:
    - vraag: Which bend radius can you achieve?
      antwoord: That depends on material, sheet thickness and tooling. As a rule of thumb, an inside radius at least
        equal to the material thickness is used for steel; for aluminium it is higher, and with stainless
        steel the rolling direction counts. If your radius is fixed, tell us and we will assess whether it is
        achievable before the drawing is finalised.
    - vraag: Do I have to calculate the flat pattern myself?
      antwoord: No. We calculate the bend allowance ourselves, so a PDF drawing and a 3D STEP file of the finished
        product is enough. If you do supply a flat pattern, tell us which allowance it was made with,
        otherwise the final dimension will be off.
    - vraag: How long may a single bend be?
      antwoord: Up to 3100 mm in one bend, the working length of our Safan Darley E-Brake 150-3100 T3 with 150
        tonnes of press force. Longer parts we build up from several pieces or solve differently in
        consultation.
    - vraag: Why does stainless steel spring back more than steel?
      antwoord: Stainless steel has a higher yield strength and therefore springs back further after bending, so the
        measured angle ends up larger than the set one. The thicker and harder the material, the bigger the
        difference. We compensate for this during set-up and check the first bend before the batch runs on.
    - vraag: Can you bend without scratching visible surfaces?
      antwoord: Yes. We keep the protective film on up to and including the last operation and use adapted tooling
        where required. Tell us with your request which side is the visible side, and we will take that into
        account in the bending sequence.
  related:
    - label: Machinery
      desc: See our press brake.
    - label: Laser cutting
      desc: Cutting before bending.
  seo:
    title: Press braking and bending
    description: 'Dimensionally accurate press braking on the servo-electric Safan Darley E-Brake 150-3100 T3: 150
      tonnes press force, working length up to 3100 mm.'
  kerncijfers:
    - waarde: 150 t
      label: press force
    - waarde: 3100 mm
      label: max. bend length
    - waarde: ISO 2768
      label: tolerances
  aanleveren:
    - A PDF drawing and a 3D STEP file of the finished product — an unfolded drawing is not needed
    - Material and sheet thickness
    - The required bend radius, if it is fixed
    - Whether it concerns visible surfaces
    - Quantity
    - "If you do supply a flat pattern: which bend allowance it was made with"

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Kanten & Biegen
  h1: Kanten & Biegen
  intro: Präzise Biegewinkel und konstante Maßhaltigkeit auf unserer servoelektrischen Abkantpresse.
  heroPhoto:
    subject: Abkantpresse in Betrieb — Blech wird gekantet
  body:
    - Der Biegeradius ist keine Nebensache, sondern eine Konstruktionsentscheidung. Ein zu enger Radius lässt
      das Material an der Außenseite reißen, ein großzügiger Radius macht den Winkel schwerer beherrschbar.
      Wir legen den Radius je Anfrage anhand von Werkstoff, Dicke und Werkzeug fest und melden es, wenn Ihre
      Zeichnung einen nicht machbaren Radius verlangt.
    - Die Rückfederung ist der zweite Faktor. Jeder Werkstoff federt nach dem Biegen etwas zurück, sodass der
      gemessene Winkel größer ausfällt als der eingestellte. Auf einer servoelektrischen Abkantpresse lässt
      sich das gut kompensieren, weil der Antrieb genau und wiederholbar positioniert; wir stellen darauf ein
      und prüfen die erste Biegung, bevor die Serie durchläuft.
    - Auch die Reihenfolge zählt. Eine Biegung kann einer früheren im Weg stehen, und ein Schenkel zu nah an
      einer Bohrung oder Aussparung verformt den Rand. Deshalb beurteilen wir Biegefolge und den Abstand von
      Bohrungen zur Biegelinie bereits an der Zeichnung, zusammen mit der Frage, ob das Werkzeug überhaupt
      herankommt. Das verhindert, dass sich ein Teil erst auf der Presse als nicht fertigbar erweist.
    - 'Bei Sichtflächen kommt eine Ebene hinzu. Die Oberfläche ist der empfindlichste Teil eines gekanteten
      Produkts: Werkzeuge hinterlassen Spuren, und Edelstahl und Messing verkratzen schnell. Wir belassen die
      Schutzfolie bis einschließlich des letzten Arbeitsgangs und arbeiten bei Bedarf mit angepasstem
      Werkzeug. Mehr zur Werkstoffseite auf unseren Seiten über <a
      href="/de/plaatwerk/rvs/">Edelstahlblech</a> und <a href="/de/plaatwerk/messing/">Messing</a>.'
  materials:
    - Edelstahl
    - Aluminium
    - Messing
    - Stahl
  process:
    - step: Abwicklung festlegen
      desc: "Die Biegekompensation berechnen wir selbst: beim Biegen dehnt sich das Material außen und staucht
        innen, die flache Länge ist also nicht die Summe der Schenkel."
    - step: Einrichten
      desc: Werkzeug und Anschlag einstellen, mit dem Biegeradius und der erwarteten Rückfederung für diesen
        Werkstoff.
    - step: Abkanten
      desc: Biegen mit konstanter Winkelgenauigkeit, in der in der Arbeitsvorbereitung festgelegten Reihenfolge.
    - step: Kontrolle
      desc: Winkel- und Maßkontrolle, beginnend bei der ersten Biegung, bevor die Serie durchläuft.
  specs:
    - label: Maschine
      value: Safan Darley E-Brake 150-3100 T3
    - label: Antrieb
      value: servoelektrisch
    - label: Presskraft
      value: 150 Tonnen
    - label: Abkantlänge
      value: bis 3100 mm je Biegung
    - label: Toleranzen
      value: nach ISO 2768
    - label: Biegeradius Stahl
      value: Innenradius mindestens gleich der Materialdicke (Faustregel)
    - label: Biegeradius Aluminium
      value: größer als bei Stahl — Aluminium dehnt weniger
    - label: Biegeradius Edelstahl
      value: Walzrichtung spielt mit
    - label: Rückfederung
      value: Edelstahl federt stärker zurück als Stahl; nimmt mit Dicke und Härte zu
    - label: Abwicklung
      value: die Biegekompensation berechnen wir selbst
  applications:
    - Gehäuse
    - Paneele
    - Verkleidungen
    - Konstruktionsteile
  faq:
    - vraag: Welchen Biegeradius können Sie abkanten?
      antwoord: Das hängt von Werkstoff, Blechdicke und Werkzeug ab. Als Faustregel gilt bei Stahl ein Innenradius
        von mindestens der Materialdicke; bei Aluminium liegt er höher, bei Edelstahl zählt die Walzrichtung
        mit. Steht Ihr Radius fest, nennen Sie ihn uns — dann beurteilen wir die Machbarkeit, bevor die
        Zeichnung endgültig ist.
    - vraag: Muss ich die Abwicklung selbst berechnen?
      antwoord: Nein. Wir berechnen die Biegekompensation selbst, eine PDF-Zeichnung und eine 3D-STEP-Datei des
        Endprodukts genügt also. Liefern Sie doch eine Abwicklung, nennen Sie uns die zugrunde gelegte
        Kompensation, sonst weicht das Endmaß ab.
    - vraag: Wie lang darf eine Biegung sein?
      antwoord: Bis 3100 mm in einer Biegung, die Arbeitslänge unserer Safan Darley E-Brake 150-3100 T3 mit 150
        Tonnen Presskraft. Längere Teile setzen wir aus mehreren Stücken zusammen oder lösen sie in Absprache
        anders.
    - vraag: Warum federt Edelstahl stärker zurück als Stahl?
      antwoord: Edelstahl hat eine höhere Streckgrenze und federt nach dem Biegen daher weiter zurück, sodass der
        gemessene Winkel größer ausfällt als der eingestellte. Je dicker und härter das Material, desto größer
        der Unterschied. Wir kompensieren das beim Einrichten und prüfen die erste Biegung, bevor die Serie
        durchläuft.
    - vraag: Lässt sich ohne Kratzer auf Sichtflächen abkanten?
      antwoord: Ja. Wir belassen die Schutzfolie bis einschließlich des letzten Arbeitsgangs und arbeiten bei Bedarf
        mit angepasstem Werkzeug. Teilen Sie uns bei Ihrer Anfrage mit, welche Seite die Sichtseite ist, dann
        berücksichtigen wir das in der Biegefolge.
