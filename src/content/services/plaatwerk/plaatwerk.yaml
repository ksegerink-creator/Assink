faq:
- vraag: Welke plaatdiktes kunnen jullie lasersnijden?
  antwoord: 'Op de Trumpf TruLaser 3040 snijden wij staal van 0,5 tot 25 mm, RVS van 0,5 tot 20 mm, aluminium
    van 0,5 tot 15 mm en gegalvaniseerd staal van 0,5 tot 10 mm. Ligt uw aanvraag buiten dat bereik, leg
    hem dan voor: dan kijken we wat er binnen onze groep mogelijk is.'
- vraag: Maken jullie ook enkelstuks, of alleen series?
  antwoord: Allebei, op dezelfde machines. Bij enkelstuks en prototypes ligt het accent op meedenken over
    maakbaarheid; bij serie op herhaalbaarheid van maatvoering en afwerking, zodat het laatste deel gelijk
    is aan het eerste.
- vraag: Welke materialen verwerken jullie in plaatwerk?
  antwoord: RVS 304 en 316, aluminium, messing en staal, waaronder gegalvaniseerd staal. Welk materiaal
    het beste past hangt af van de belasting, de omgeving en of het onderdeel zichtwerk is — daar denken
    wij graag in mee voordat de tekening definitief is.
- vraag: Leveren jullie plaatwerk afgewerkt en montageklaar?
  antwoord: Ja. Ontbramen, glasparelstralen, passiveren, poedercoaten en het inpersen van pers- en trekmoeren
    horen bij het traject. U ontvangt een montageklaar deel in plaats van een halffabricaat dat elders
    nog bewerkt moet worden.
- vraag: Wat hebben jullie nodig om een offerte te maken?
  antwoord: Een PDF-tekening en een 3D STEP-bestand, de materiaalsoort en plaatdikte, het aantal stuks, en of het zichtwerk
    betreft met de bijbehorende afwerking. Ontbreken er gegevens, dan nemen wij contact op voordat we
    een prijs afgeven.
