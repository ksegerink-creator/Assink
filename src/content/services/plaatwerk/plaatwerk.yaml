- step: Ontbramen
  desc: Machinaal op een Timesavers 42 Series RB, zodat de randen braamvrij en veilig zijn voordat er iemand
    mee verder werkt.
- step: Kanten
  desc: Op een servo-elektrische Safan Darley E-Brake 150-3100 T3 met 150 ton perskracht en een werklengte
    tot 3100 mm.
- step: Lassen
  desc: Waar nodig, onder ISO 3834-2 met vastgelegde lasparameters.
- step: Afwerken
  desc: Stralen, passiveren, poedercoaten of anodiseren — u ontvangt een afgewerkt onderdeel, geen halffabricaat.
