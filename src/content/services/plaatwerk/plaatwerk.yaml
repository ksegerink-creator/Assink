# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  menuLabel: "Sheet metal"
  title: Sheet metal work
  kicker: Capability 1.0
  h1: Perfection in sheet metal work
  intro: Precision sheet metal with accuracy down to the millimetre. Custom cutting, press braking and finishing
    of thin sheet material — one-offs as well as series.
  heroPhoto:
    subject: Wide shot of the production floor with sheet metal being processed
  body:
  - 'From the first drawing to the finished part we guide the whole process: material advice, engineering,
    production and surface finishing — all under one roof in Hengelo.'
  - 'One-offs and series run on the same machines, with different preparation. For a prototype the emphasis
    is on thinking along about manufacturability: moving a bend line or repositioning a cut-out often saves
    an entire operation. For series it is about repeatability — the same fixturing, the same sequence and
    the same inspection points, so that the hundredth part matches the first.'
  - 'If your request falls outside the range below, put it to us: within our group more is often possible
    than on our own machine.'
  kerncijfers:
  - waarde: 25 mm
    label: max. sheet thickness, steel
  - waarde: 3100 mm
    label: press brake length
  - waarde: 150 t
    label: press force
  - waarde: 4 kW
    label: fibre laser
  process:
  - step: Laser cutting
    desc: On a Trumpf TruLaser 3040, a 4 kW fibre laser.
  - step: Deburring
    desc: By machine on a Timesavers 42 Series RB, so that edges are burr-free and safe before anyone handles
      them.
  - step: Press braking
    desc: On a servo-electric Safan Darley E-Brake 150-3100 T3 with 150 tonnes of press force and a working
      length of up to 3100 mm.
  - step: Welding
    desc: Where required, under ISO 3834-2 with documented welding parameters.
  - step: Finishing
    desc: Blasting, passivating, powder coating or anodising — you receive a finished part, not a semi-finished
      one.
  specs:
  - label: Steel
    value: 0.5 – 25 mm
  - label: Stainless steel
    value: 0.5 – 20 mm
  - label: Aluminium
    value: 0.5 – 15 mm
  - label: Galvanised steel
    value: 0.5 – 10 mm
  - label: Press brake length
    value: up to 3100 mm, 150 tonnes press force
  - label: Blasting
    value: glass beads 100–200 μm at 3.0 bar, cabin 8 × 4 × 3 m
  - label: Finishing
    value: passivating, powder coating, anodising
  - label: Certification
    value: ISO 9001, ISO 3834-2, EN 1090-1
  aanleveren:
  - PDF drawing and a 3D STEP file
  - Material and sheet thickness
  - Number of parts
  - Whether it is visible work, and the finish required
  cards:
  - label: Steel
    desc: Stiff, readily weldable and economical — the workhorse.
  - label: Stainless steel
    desc: Ground stainless steel 304 and 316 for corrosion-resistant visible work.
  - label: Aluminium
    desc: Lightweight and strong, including TIG and MIG welding.
  - label: Brass
    desc: Warm copper-zinc alloy for engineering and interiors.
  - label: Precision sheet metal
    desc: Dimensionally stable one-offs and series work.
  - label: Bending & forming
    desc: Accurate bending angles on the servo-electric press brake.
  - label: Laser cutting
    desc: 2D laser cutting of steel, stainless steel and aluminium.
  - label: Welding
    desc: TIG, MIG/MAG and robotic welding.
  - label: Laser welding
    desc: Clean, low-distortion welded joints.
  - label: Deburring
    desc: Burr-free edges after cutting.
  - label: Self-clinching nuts & rivet nuts
    desc: Self-clinching nuts for assembly-ready products.
  - label: Food industry
    desc: Hygienic stainless steel sheet metal work.
  - label: Stainless steel enclosures & cladding
    desc: Machine cladding and housings.
  faq:
  - vraag: Which sheet thicknesses can you laser cut?
    antwoord: 'On the Trumpf TruLaser 3040 we cut steel from 0.5 to 25 mm, stainless steel from 0.5 to 20
      mm, aluminium from 0.5 to 15 mm and galvanised steel from 0.5 to 10 mm. If your request falls outside
      that range, put it to us: we will then look at what is possible within our group.'
  - vraag: Do you also make one-offs, or only series?
    antwoord: Both, on the same machines. For one-offs and prototypes the emphasis is on thinking along
      about manufacturability; for series it is on repeatability of dimensions and finishing, so that the
      last part matches the first.
  - vraag: Which materials do you process in sheet metal work?
    antwoord: Stainless steel 304 and 316, aluminium, brass and steel, including galvanised steel. Which
      material suits best depends on the load, the environment and whether the part is a visible surface
      — we are glad to advise before the drawing is final.
  - vraag: Do you supply sheet metal finished and ready for assembly?
    antwoord: Yes. Deburring, glass bead blasting, passivation, powder coating and the insertion of self-clinching
      and rivet nuts are all part of the process. You receive a part ready for assembly rather than a semi-finished
      product that still needs work elsewhere.
  - vraag: What do you need in order to prepare a quotation?
    antwoord: A PDF drawing and a 3D STEP file, the material grade and sheet thickness, the quantity, and
      whether it concerns visible surfaces with the associated finishing. If information is missing we contact
      you before quoting a price.
  seo:
    title: Custom sheet metal work
    description: 'Precision sheet metal in stainless steel, aluminium and brass: laser cutting, press braking,
      welding and finishing down to the millimetre. One-offs and series from Hengelo.'

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  menuLabel: "Blechbearbeitung"
  title: Blechbearbeitung
  kicker: Möglichkeit 1.0
  h1: Perfektion in der Blechbearbeitung
  intro: Präzisionsblech mit Genauigkeit bis auf den Millimeter. Maßarbeit beim Schneiden, Abkanten und
    Veredeln von Feinblech — Einzelstücke und Serien.
  heroPhoto:
    subject: Breitbildaufnahme der Produktionshalle mit Blecharbeiten in Bearbeitung
  body:
  - 'Von der ersten Zeichnung bis zum fertigen Teil begleiten wir den gesamten Ablauf: Materialberatung,
    Engineering, Fertigung und Oberflächenbehandlung — unter einem Dach in Hengelo.'
  - 'Einzelstück und Serie laufen bei uns über dieselben Maschinen, mit unterschiedlicher Vorbereitung.
    Beim Prototyp liegt der Schwerpunkt auf der Fertigungsgerechtheit: eine Biegekante zu verschieben oder
    einen Ausschnitt anders zu setzen spart oft einen ganzen Arbeitsgang. Bei Serie zählt Wiederholbarkeit
    — dieselbe Aufspannung, dieselbe Reihenfolge und dieselben Prüfpunkte, damit das hundertste Teil dem
    ersten gleicht.'
  - 'Liegt Ihre Anfrage außerhalb des unten genannten Bereichs, legen Sie sie uns vor: innerhalb unserer
    Gruppe ist oft mehr möglich als auf unserer eigenen Maschine.'
  kerncijfers:
  - waarde: 25 mm
    label: max. Blechdicke Stahl
  - waarde: 3100 mm
    label: Abkantlänge
  - waarde: 150 t
    label: Presskraft
  - waarde: 4 kW
    label: Faserlaser
  process:
  - step: Laserschneiden
    desc: Auf einer Trumpf TruLaser 3040, Faserlaser mit 4 kW.
  - step: Entgraten
    desc: Maschinell auf einer Timesavers 42 Series RB, damit die Kanten gratfrei und sicher sind, bevor
      jemand damit weiterarbeitet.
  - step: Abkanten
    desc: Auf einer servoelektrischen Safan Darley E-Brake 150-3100 T3 mit 150 t Presskraft und einer Arbeitslänge
      bis 3100 mm.
  - step: Schweißen
    desc: Wo erforderlich, nach ISO 3834-2 mit dokumentierten Schweißparametern.
  - step: Oberfläche
    desc: Strahlen, Passivieren, Pulverbeschichten oder Eloxieren — Sie erhalten ein fertiges Teil, kein
      Halbzeug.
  specs:
  - label: Stahl
    value: 0,5 – 25 mm
  - label: Edelstahl
    value: 0,5 – 20 mm
  - label: Aluminium
    value: 0,5 – 15 mm
  - label: Verzinkter Stahl
    value: 0,5 – 10 mm
  - label: Abkantlänge
    value: bis 3100 mm, 150 t Presskraft
  - label: Strahlen
    value: Glasperlen 100–200 μm bei 3,0 bar, Kabine 8 × 4 × 3 m
  - label: Oberfläche
    value: Passivieren, Pulverbeschichten, Eloxieren
  - label: Zertifizierung
    value: ISO 9001, ISO 3834-2, EN 1090-1
  aanleveren:
  - PDF-Zeichnung und eine 3D-STEP-Datei
  - Werkstoff und Blechdicke
  - Stückzahl
  - Ob es sich um Sichtteile handelt, und die gewünschte Oberfläche
  cards:
  - label: Stahl
    desc: Steif, gut schweißbar und günstig — das Arbeitstier.
  - label: Edelstahl
    desc: Geschliffener Edelstahl 304 und 316 für korrosionsbeständige Sichtflächen.
  - label: Aluminium
    desc: Leicht und stabil, inkl. WIG- und MIG-Schweißen.
  - label: Messing
    desc: Warme Kupfer-Zink-Legierung für Technik und Interieur.
  - label: Präzisionsblech
    desc: Maßhaltige Einzelstücke und Serienteile.
  - label: Kanten & Biegen
    desc: Präzise Biegewinkel auf der servoelektrischen Abkantpresse.
  - label: Laserschneiden
    desc: 2D-Laserschneiden von Stahl, Edelstahl und Aluminium.
  - label: Schweißen
    desc: WIG-, MIG/MAG- und Roboterschweißen.
  - label: Laserschweißen
    desc: Saubere, verzugsarme Schweißverbindungen.
  - label: Entgraten
    desc: Gratfreie Kanten nach dem Schneiden.
  - label: Einpress- & Blindnietmuttern
    desc: Einpressmuttern für montagefertige Produkte.
  - label: Lebensmittelindustrie
    desc: Hygienische Edelstahl-Blechbearbeitung.
  - label: Edelstahlgehäuse & Verkleidung
    desc: Maschinenverkleidungen und Gehäuse.
  faq:
  - vraag: Welche Blechdicken können Sie laserschneiden?
    antwoord: 'Auf der Trumpf TruLaser 3040 schneiden wir Stahl von 0,5 bis 25 mm, Edelstahl von 0,5 bis
      20 mm, Aluminium von 0,5 bis 15 mm und verzinkten Stahl von 0,5 bis 10 mm. Liegt Ihre Anfrage außerhalb
      dieses Bereichs, legen Sie sie uns vor: dann prüfen wir, was innerhalb unserer Gruppe möglich ist.'
  - vraag: Fertigen Sie auch Einzelstücke oder nur Serien?
    antwoord: Beides, auf denselben Maschinen. Bei Einzelstücken und Prototypen liegt der Schwerpunkt auf
      der Fertigungsgerechtheit, bei Serien auf der Wiederholgenauigkeit von Maßhaltigkeit und Oberfläche,
      damit das letzte Teil dem ersten gleicht.
  - vraag: Welche Werkstoffe verarbeiten Sie in der Blechbearbeitung?
    antwoord: Edelstahl 304 und 316, Aluminium, Messing und Stahl, einschließlich verzinktem Stahl. Welcher
      Werkstoff am besten passt, hängt von der Belastung, der Umgebung und davon ab, ob das Bauteil eine
      Sichtfläche ist — dazu beraten wir gerne, bevor die Zeichnung endgültig ist.
  - vraag: Liefern Sie Blechteile fertig bearbeitet und montagefertig?
    antwoord: Ja. Entgraten, Glasperlstrahlen, Passivieren, Pulverbeschichten und das Einpressen von Einpress-
      und Blindnietmuttern gehören zum Ablauf. Sie erhalten ein montagefertiges Teil und kein Halbzeug,
      das anderswo noch bearbeitet werden muss.
  - vraag: Was benötigen Sie für ein Angebot?
    antwoord: Eine PDF-Zeichnung und eine 3D-STEP-Datei, Werkstoff und Blechdicke, die Stückzahl sowie die
      Angabe, ob es sich um Sichtflächen handelt und welche Oberfläche dazugehört. Fehlen Angaben, melden
      wir uns, bevor wir einen Preis nennen.
  seo:
    title: Blechbearbeitung nach Maß
    description: 'Präzisionsblech in Edelstahl, Aluminium und Messing: Laserschneiden, Abkanten, Schweißen
      und Veredeln bis auf den Millimeter. Einzelstücke und Serien aus Hengelo.'
