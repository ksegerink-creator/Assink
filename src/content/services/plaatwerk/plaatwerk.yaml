kicker: Mogelijkheid 1.0
h1: Perfectie in plaatwerk
intro: Plaatwerk op maat met nauwkeurigheid tot op de millimeter. Maatwerk in snijden, kanten en afwerken
  van fijnplaatmateriaal — enkelstuks én serie, uit Hengelo.
fotobank: "productiehal"
heroPhoto:
  subject: Breedbeeld productievloer met plaatwerk in bewerking
  orient: Liggend 16:10
  crop: Breed overzicht
  comp: Werkvloer, machines op afstand
body:
- 'Van eerste tekening tot afgewerkt onderdeel begeleiden wij het hele traject: materiaaladvies, engineering,
  productie en oppervlakteafwerking — onder één dak in Hengelo.'
- 'Enkelstuks en serie doen wij op dezelfde machines, met een andere voorbereiding. Bij een prototype
  denken wij mee over maakbaarheid: een buighoek verplaatsen of een uitsparing anders positioneren scheelt
  vaak een hele bewerking. Bij serie draait het om herhaalbaarheid — dezelfde opspanning, dezelfde volgorde
  en dezelfde controlepunten, zodat het honderdste deel gelijk is aan het eerste.'
- 'Valt uw aanvraag buiten onderstaand bereik, leg hem dan voor: binnen onze groep is vaak meer mogelijk
  dan op onze eigen machine.'
