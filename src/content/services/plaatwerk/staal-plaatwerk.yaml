  seo:
    title: Stahlblech — Schneiden und Abkanten
    description: 'Stahlblech aus Hengelo: Laserschneiden bis 25 mm aus Tafeln bis 4000 × 2000 mm, Abkanten bis
      3100 mm und MAG-Schweißen. Mit oder ohne Nachbearbeitung.'
  faq:
    - vraag: Welche Blechdicke in Stahl können Sie laserschneiden?
      antwoord: Stahl von 0,5 bis 25 mm und verzinkten Stahl von 0,5 bis 10 mm, auf der Trumpf TruLaser 3040, einem
        Faserlaser mit 4 kW. Die Tafel darf bis 4000 × 2000 mm messen.
    - vraag: Was ist der Unterschied zwischen MAG- und MIG-Schweißen bei Stahl?
      antwoord: Beides sind Verfahren mit Zusatzdraht, der Unterschied liegt im Schutzgas. MAG verwendet aktives Gas
        und ist das übliche Verfahren für Stahl; MIG verwendet inertes Gas und ist für Edelstahl und Aluminium
        gedacht. Für Stahl schweißen wir also mit MAG, oder mit WIG, wo die Naht sauber sein muss.
    - vraag: Übernehmen Sie auch das Pulverbeschichten oder Verzinken?
      antwoord: Wir organisieren es, führen es aber nicht selbst aus. Pulverbeschichten, Verzinken und Nasslackieren
        vergeben wir an feste Partner. Das Entgraten erledigen wir im eigenen Haus, maschinell auf der
        Timesavers 42 Series RB.
    - vraag: Wann wähle ich Stahl und wann Edelstahl oder Aluminium?
      antwoord: Stahl ist bei gleicher Dicke steifer als Aluminium und deutlich günstiger als Edelstahl, korrodiert
        aber ohne Schutz. Kommt das Teil in Feuchtigkeit, ins Freie oder in eine Umgebung, in der gereinigt
        wird, liegt Edelstahl nahe. Zählt das Gewicht, dann Aluminium. Trifft beides nicht zu, dann Stahl.
    - vraag: Können Sie verzinkten Stahl verarbeiten?
      antwoord: 'Ja, von 0,5 bis 10 mm. Ein Punkt ist zu beachten: Die Zinkschicht verdampft beim Schneiden und beim
        Schweißen. Wir stimmen die Schneidparameter darauf ab und klären vorab, ob die Schweißzonen danach
        ausgebessert werden müssen.'
