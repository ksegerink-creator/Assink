title: Staal plaatwerk
menuLabel: "Staal"
slug: plaatwerk/staal
template: service
group: plaatwerk
order: 21
h1: Staal plaatwerk
intro: Het werkpaard onder de plaatmaterialen — stijf, goed lasbaar en voordelig. Van losse delen tot gelaste
  samenstellingen, met of zonder nabewerking.
fotobank: "vakman-met-profiel"
heroPhoto:
  subject: Vakman met een stalen profiel aan de lastafel in Hengelo
  orient: Liggend 4:3
  crop: Persoon aan de lastafel
  comp: Stalen profiel in beeld, afzuigarm erboven
body:
  - Staal is bij plaatwerk meestal het uitgangspunt. Het is stijver dan aluminium bij dezelfde dikte, goed
    lasbaar en aanzienlijk voordeliger dan RVS. Waar geen corrosiebestendigheid of zichtwerk-eis speelt, is
    staal daarom vrijwel altijd de verstandige keuze.
  - "Gegalvaniseerd staal vraagt om een andere aanpak: de zinklaag verdampt bij het snijden en het lassen. Wij
    stemmen de snijparameters daarop af en overleggen vooraf of er na het laswerk nog hersteld moet worden."
  - Nabewerking is bij staal een keuze, geen vanzelfsprekendheid. Ontbramen doen wij zelf — bij staal niet
    alleen een kwestie van uiterlijk maar ook van arbeidsveiligheid verderop in de keten. Conserveren besteden
    wij uit aan vaste partners, zodat u één aanspreekpunt houdt.
  - Gaat het om een gelaste staalconstructie in plaats van losse plaatdelen, dan geldt een ander traject; kijk
    daarvoor op onze pagina over <a href="/constructies/">constructies</a>. Welke lasmethode wij kiezen, leest
    u op onze pagina over <a href="/plaatwerk/lassen/">lassen</a>.
