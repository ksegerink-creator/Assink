de:
  menuLabel: "Stahl"
  title: Stahlblech-Bearbeitung
  h1: Stahlblech-Bearbeitung
  intro: Das Arbeitstier unter den Blechwerkstoffen — steif, gut schweißbar und günstig. Von Einzelteilen bis zu
    geschweißten Baugruppen, mit oder ohne Nachbearbeitung.
  heroPhoto:
    subject: Facharbeiter mit einem Stahlprofil am Schweißtisch in Hengelo
  body:
    - Stahl ist in der Blechbearbeitung meist der Ausgangspunkt. Er ist bei gleicher Dicke steifer als
      Aluminium, gut schweißbar und deutlich günstiger als Edelstahl. Wo keine Korrosionsbeständigkeit und
      keine Sichtfläche gefordert ist, ist Stahl daher fast immer die sinnvolle Wahl.
    - "Verzinkter Stahl verlangt ein anderes Vorgehen: Die Zinkschicht verdampft beim Schneiden und beim
      Schweißen. Wir stimmen die Schneidparameter darauf ab und klären vorab, ob die Schweißzonen danach
      ausgebessert werden müssen."
    - Die Nachbearbeitung ist bei Stahl eine Entscheidung, keine Selbstverständlichkeit. Entgraten führen wir
      selbst aus — bei Stahl nicht nur eine Frage des Aussehens, sondern auch der Arbeitssicherheit weiter
      unten in der Kette. Den Korrosionsschutz vergeben wir an feste Partner, sodass Sie einen Ansprechpartner
      behalten.
    - Geht es um eine geschweißte Stahlkonstruktion statt um einzelne Blechteile, gilt ein anderer Weg; sehen
      Sie dazu unsere Seite über <a href="/de/constructies/">Konstruktionen</a>. Wie wir das Schweißverfahren
      wählen, lesen Sie auf unserer Seite über das <a href="/de/plaatwerk/lassen/">Schweißen</a>.
  materials:
