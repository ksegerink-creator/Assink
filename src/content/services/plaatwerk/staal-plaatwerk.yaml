faq:
  - vraag: Welke plaatdikte staal kunnen jullie lasersnijden?
    antwoord: Staal van 0,5 tot 25 mm en gegalvaniseerd staal van 0,5 tot 10 mm, op de Trumpf TruLaser 3040, een
      fiberlaser van 4 kW. De plaat mag tot 4000 × 2000 mm meten.
  - vraag: Wat is het verschil tussen MAG- en MIG-lassen bij staal?
    antwoord: Allebei zijn het processen met toevoegdraad, het verschil zit in het beschermgas. MAG gebruikt
      actief gas en is het gangbare proces voor staal; MIG gebruikt inert gas en is bedoeld voor RVS en
      aluminium. Voor staal lassen wij dus met MAG, of met TIG waar de naad netjes moet zijn.
  - vraag: Verzorgen jullie ook het poedercoaten of verzinken?
    antwoord: Wij regelen het, maar voeren het niet zelf uit. Poedercoaten, verzinken en natlakken besteden wij
      uit aan vaste partners. Ontbramen doen wij wel in eigen huis, machinaal op de Timesavers 42 Series RB.
  - vraag: Wanneer kies ik staal en wanneer RVS of aluminium?
    antwoord: Staal is stijver dan aluminium bij dezelfde dikte en beduidend voordeliger dan RVS, maar het
      corrodeert zonder conservering. Komt het deel in vocht, buiten of in een omgeving waar gereinigd wordt,
      dan ligt RVS voor de hand. Telt het gewicht, dan aluminium. Speelt geen van beide, dan staal.
  - vraag: Kunnen jullie gegalvaniseerd staal verwerken?
    antwoord: 'Ja, van 0,5 tot 10 mm. Wel een aandachtspunt: de zinklaag verdampt bij het snijden en het lassen.
      Wij stemmen de snijparameters daarop af en overleggen vooraf of de laszones na afloop hersteld moeten
      worden.'

# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  menuLabel: "Steel"
  title: Steel sheet metal work
  h1: Steel sheet metal work
  intro: The workhorse among sheet materials — stiff, readily weldable and economical. From individual parts to
    welded assemblies, with or without finishing.
  heroPhoto:
    subject: Craftsman holding a steel profile at the welding bench in Hengelo
  body:
    - Steel is usually the starting point in sheet metal work. It is stiffer than aluminium at the same
      thickness, readily weldable and considerably cheaper than stainless steel. Where there is no corrosion
      or visible-surface requirement, steel is almost always the sensible choice.
    - "Galvanised steel calls for a different approach: the zinc layer vaporises during cutting and welding.
      We adjust the cutting parameters accordingly and agree in advance whether the weld zones need to be
      restored afterwards."
    - Finishing is a choice with steel, not a given. We deburr in house — with steel that is a matter of
      workplace safety further down the line, not only of appearance. Protective coating goes to regular
      partners, so you keep a single point of contact.
    - If it concerns a welded steel structure rather than individual sheet parts, a different route applies;
      see our page on <a href="/en/constructies/">welded constructions</a>. Our page on <a
      href="/en/plaatwerk/lassen/">welding</a> explains how we choose the process.
  materials:
    - Steel (S235, S355)
    - Galvanised steel
  process:
    - step: Laser cutting
      desc: Steel 0.5–25 mm, sheet up to 4000 × 2000 mm.
    - step: Press braking
      desc: Up to 3100 mm, tolerances to ISO 2768.
    - step: Welding
      desc: MAG for steel, TIG for thin and visible work.
    - step: Finishing
      desc: We deburr in house; coating goes to partners.
  applications:
    - Machine building
    - Structural parts
    - Frames & supports
    - Industrial applications
  related:
    - label: Laser cutting
      desc: Steel 0.5–25 mm.
    - label: Welding
      desc: TIG, MIG/MAG or laser.
    - label: Welded constructions
      desc: Welded steel structures up to 10 tonnes.
  seo:
    title: Steel sheet metal — cutting and bending
    description: 'Steel sheet metal work from Hengelo: laser cutting up to 25 mm from sheet up to 4000 × 2000 mm,
      press braking up to 3100 mm and MAG welding. With or without finishing.'
  faq:
    - vraag: What steel thickness can you laser cut?
      antwoord: Steel from 0.5 to 25 mm and galvanised steel from 0.5 to 10 mm, on the Trumpf TruLaser 3040, a 4 kW
        fibre laser. Sheet may measure up to 4000 × 2000 mm.
    - vraag: What is the difference between MAG and MIG welding on steel?
      antwoord: Both are processes with filler wire; the difference is the shielding gas. MAG uses active gas and is
        the usual process for steel; MIG uses inert gas and is intended for stainless steel and aluminium. So
        for steel we weld with MAG, or with TIG where the seam has to be clean.
    - vraag: Do you also arrange powder coating or galvanising?
      antwoord: We arrange it but do not carry it out ourselves. Powder coating, galvanising and wet painting go to
        regular partners. Deburring we do in house, mechanically on the Timesavers 42 Series RB.
    - vraag: When do I choose steel and when stainless steel or aluminium?
      antwoord: Steel is stiffer than aluminium at the same thickness and considerably cheaper than stainless steel,
        but it corrodes without protection. If the part goes into moisture, outdoors or somewhere that is
        cleaned, stainless steel is the logical choice. If weight matters, aluminium. If neither applies,
        steel.
    - vraag: Can you process galvanised steel?
      antwoord: 'Yes, from 0.5 to 10 mm. One point to note: the zinc layer vaporises during cutting and welding. We
        adjust the cutting parameters accordingly and agree in advance whether the weld zones need restoring
        afterwards.'
