    - label: Press braking
      value: springs back more than steel; bend angle and tooling decide the final dimension
    - label: Press brake length
      value: up to 3100 mm, 150 tonnes press force
    - label: Deburring
      value: by machine on the Timesavers 42 Series RB
    - label: Blasting
      value: glass beads 100–200 μm, blast cabin 8 × 4 × 3 m
