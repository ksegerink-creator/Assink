de:
  menuLabel: "Aluminium"
  title: Aluminium-Blechbearbeitung
  h1: Aluminium-Blechbearbeitung
  intro: Laserschneiden, Abkanten und Veredeln von Aluminiumblech von 0,5 bis 15 mm — leicht,
    korrosionsbeständig und nach Maß für Maschinenbau und Gehäuse.
  heroPhoto:
    subject: Abgekantetes Aluminium-Blechteil an der Abkantpresse, Detail
  body:
    - "Die Aluminium-Blechbearbeitung erfordert andere Maschineneinstellungen als Stahl oder Edelstahl. Wir
      schneiden Aluminium von 0,5 bis 15 mm auf der Trumpf TruLaser 3040, entgraten maschinell und kanten
      auf der servoelektrischen Abkantpresse. Aluminium federt beim Abkanten stärker zurück als Stahl; das
      berücksichtigen wir bei der Abwicklung und der Werkzeugwahl."
    - "Bei engen Toleranzen berücksichtigen wir die Rückfederung in der Arbeitsvorbereitung, statt sie
      nachträglich zu korrigieren. Aluminium ist außerdem kratzempfindlicher als Stahl: bei Sichtflächen
      belassen wir die Schutzfolie bis zur letzten Bearbeitung und berücksichtigen das in der
      Bearbeitungsreihenfolge."
    - Die Entscheidung für Aluminium statt Stahl oder Edelstahl ist meist eine Abwägung zwischen Gewicht und
      Belastung. Aluminium ist deutlich leichter, was bei bewegten Teilen, Türen und von Hand gehandhabten
      Paneelen zählt, und es korrodiert ohne zusätzlichen Schutz nicht. Stahl und Edelstahl sind bei gleicher
      Dicke steifer; ist die Steifigkeit ausschlaggebend, gleichen wir das durch eine größere Dicke oder durch
      abgekantete Flansche und Versteifungen aus.
    - Müssen die Teile anschließend zu einer Baugruppe geschweißt werden, erledigen wir das ebenfalls im
      eigenen Haus. Worauf wir beim Schweißen von Aluminium achten, lesen Sie auf unserer Seite über das <a
      href="/de/aluminium-lassen/">Aluminiumschweißen</a>.
  materials:
    - Aluminium (verschiedene Legierungen)
  process:
    - step: Laserschneiden
      desc: Aluminium von 0,5 bis 15 mm auf der Trumpf TruLaser 3040.
    - step: Entgraten
      desc: Maschinell auf der Timesavers 42 Series RB, vor dem Abkanten.
    - step: Abkanten
      desc: Auf der servoelektrischen Abkantpresse, mit der Rückfederung in der Abwicklung berücksichtigt.
    - step: Nachbearbeitung
      desc: Strahlen im eigenen Haus; Eloxieren und Pulverbeschichten geben wir extern.
