title: Aluminium plaatwerk
menuLabel: "Aluminium"
slug: plaatwerk/aluminium
template: service
group: plaatwerk
order: 23
h1: Aluminium plaatwerk
intro: Lasersnijden, kanten en afwerken van aluminium plaat van 0,5 tot 15 mm — lichtgewicht, corrosiebestendig
  en op maat voor machinebouw en behuizingen.
fotobank: "kantbank-detail"
heroPhoto:
  subject: Gekant aluminium plaatdeel bij de kantbank, detail
  orient: Liggend 16:10
  crop: Detail op de buiging
  comp: Mat aluminium, strakke kantlijn
body:
  - "Aluminium plaatbewerking vraagt om andere machine-instellingen dan staal of RVS. Wij snijden aluminium
    van 0,5 tot 15 mm op de Trumpf TruLaser 3040, ontbramen machinaal en kanten op de servo-elektrische
    kantbank. Aluminium veert bij het kanten sterker terug dan staal; daar houden wij rekening mee in de
    uitslag en de gereedschapskeuze."
  - "Bij een strakke maatvoering nemen we de terugvering mee in de werkvoorbereiding in plaats van het
    achteraf te corrigeren. Aluminium is ook krasgevoeliger dan staal: bij zichtwerk laten we de beschermfolie
    tot en met de laatste bewerking zitten en houden we daar in de volgorde van bewerkingen rekening mee."
  - De keuze voor aluminium in plaats van staal of RVS is meestal een afweging tussen gewicht en belasting.
    Aluminium is beduidend lichter, wat telt bij bewegende delen, deuren en panelen die met de hand worden
    gehanteerd, en het corrodeert niet zonder aanvullende bescherming. Staal en RVS zijn stijver bij dezelfde
    dikte; is stijfheid bepalend, dan compenseren we dat met een grotere dikte of met kantflenzen en
    verstijvingen.
  - Moeten de delen daarna gelast worden tot een samenstelling, dan doen wij dat ook in eigen huis. Waar
    wij bij het lassen van aluminium op letten, leest u op onze pagina over <a
    href="/aluminium-lassen/">aluminium lassen</a>.
materials:
