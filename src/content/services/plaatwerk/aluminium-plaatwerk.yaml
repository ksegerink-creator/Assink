de:
  menuLabel: "Aluminium"
  title: Aluminium-Blechbearbeitung
  h1: Aluminium-Blechbearbeitung
  intro: Leicht, fest und korrosionsbeständig. Wir sind auf Aluminium-Schweißarbeiten für Maschinenbau und
    Gehäuse spezialisiert.
  heroPhoto:
    subject: Aluminium-Blechteil mit WIG-Schweißnaht, Detail
  body:
    - "Die Aluminium-Blechbearbeitung erfordert andere Maschineneinstellungen als Stahl oder Edelstahl:
      Aluminium federt beim Kanten stärker zurück, und beim Schweißen fließt die Wärme schneller ab. Das
      berücksichtigen wir bei Abwicklung, Werkzeug und Schweißparametern."
    - "Bei engen Toleranzen berücksichtigen wir die Rückfederung in der Arbeitsvorbereitung, statt sie
      nachträglich zu korrigieren. Aluminium ist außerdem kratzempfindlicher als Stahl: bei Sichtflächen
      belassen wir die Schutzfolie bis zur letzten Bearbeitung und berücksichtigen das in der
      Bearbeitungsreihenfolge."
    - Die Entscheidung für Aluminium statt Stahl oder Edelstahl ist meist eine Abwägung zwischen Gewicht und
      Belastung. Aluminium ist deutlich leichter, was bei bewegten Teilen, Türen und von Hand gehandhabten
      Paneelen zählt, und es korrodiert ohne zusätzlichen Schutz nicht. Stahl und Edelstahl sind bei gleicher
      Dicke steifer; ist die Steifigkeit ausschlaggebend, gleichen wir das durch eine größere Dicke oder durch
      abgekantete Flansche und Versteifungen aus.
    - Geht es um geschweißte Baugruppen, finden Sie mehr auf unserer Seite über das <a
      href="/de/aluminium-lassen/">Aluminiumschweißen</a>.
  materials:
    - Aluminium (verschiedene Legierungen)
  process:
    - step: Laserschneiden
      desc: Schneiden von Aluminiumblech.
    - step: Abkanten
      desc: Kanten mit Rücksicht auf die Rückfederung.
    - step: Aluminium-Schweißen
      desc: WIG-/MIG-Schweißen, verzugsarm.
    - step: Nachbearbeitung
      desc: Strahlen im eigenen Haus; Eloxieren und Pulverbeschichten geben wir extern.
  applications:
    - Maschinenbau
    - Gehäuse
    - Transport & Leichtbaukonstruktionen
  related:
