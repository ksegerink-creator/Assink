slug: plaatwerk/aluminium
template: service
group: plaatwerk
order: 23
h1: Aluminium plaatwerk
intro: Lichtgewicht, sterk en corrosiebestendig. Wij zijn gespecialiseerd in aluminium laswerk voor
  machinebouw en behuizingen.
fotobank: "kantbank-detail"
heroPhoto:
  subject: Aluminium plaatwerkdeel met TIG-lasnaad, detail
  orient: Liggend 16:10
  crop: Detail op lasnaad
  comp: Mat aluminium, gelijkmatige rups
body:
  - "Aluminium plaatbewerking vraagt om andere machine-instellingen dan staal of RVS: aluminium veert meer
    terug bij het kanten en warmte loopt sneller weg bij het lassen. Wij houden daar rekening mee in uitslag,
    gereedschap en lasparameters."
  - "Bij een strakke maatvoering nemen we de terugvering mee in de werkvoorbereiding in plaats van het
    achteraf te corrigeren. Aluminium is ook krasgevoeliger dan staal: bij zichtwerk laten we de beschermfolie
    tot en met de laatste bewerking zitten en houden we daar in de volgorde van bewerkingen rekening mee."
  - De keuze voor aluminium in plaats van staal of RVS is meestal een afweging tussen gewicht en belasting.
    Aluminium is beduidend lichter, wat telt bij bewegende delen, deuren en panelen die met de hand worden
    gehanteerd, en het corrodeert niet zonder aanvullende bescherming. Staal en RVS zijn stijver bij dezelfde
    dikte; is stijfheid bepalend, dan compenseren we dat met een grotere dikte of met kantflenzen en
    verstijvingen.
  - Gaat het om gelaste samenstellingen, dan leest u meer op onze pagina over <a
    href="/aluminium-lassen/">aluminium lassen</a>.
