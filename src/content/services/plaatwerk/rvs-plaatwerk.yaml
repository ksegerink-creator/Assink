faq:
  - vraag: Welke plaatdikte RVS kunnen jullie lasersnijden?
    antwoord: 'Op de Trumpf TruLaser 3040 snijden wij RVS van 0,5 tot 20 mm. Welke dikte in uw geval verstandig
      is, hangt af van de belasting en van de vervolgbewerkingen. Ligt uw aanvraag buiten dat bereik, leg hem
      dan voor: dan kijken we wat er binnen de groep mogelijk is.'
  - vraag: Wat is het verschil tussen RVS 304 en RVS 316?
    antwoord: RVS 316 bevat molybdeen en is daardoor beter bestand tegen putcorrosie, vooral in omgevingen met
      chloriden of veel vocht. RVS 304 voldoet in drogere, minder agressieve toepassingen prima. Wij verwerken
      beide kwaliteiten; in ons kennisbankartikel over 304 en 316 zetten we de afweging uitgebreider op een
      rij.
  - vraag: Leveren jullie geslepen RVS voor zichtwerk?
    antwoord: Ja. Voor zichtwerk leveren wij geslepen oppervlakken met een consistente korrel en letten we erop
      dat de korrelrichting over de losse delen van een samenstelling doorloopt. Tot en met de laatste
      bewerking blijft beschermfolie zitten, omdat RVS gevoelig is voor krassen.
  - vraag: Passiveren jullie RVS na het lassen?
    antwoord: Ja. Lassen tast de beschermende oxidelaag rond de naad aan, wat de plek gevoeliger maakt voor
      corrosie. Wij verwijderen aanloopkleuren en passiveren na het lassen, zodat de corrosiebestendigheid van
      het oppervlak behouden blijft.

# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  menuLabel: "Stainless steel"
  title: Stainless steel sheet metal
  h1: Stainless steel sheet metal
  intro: 'Stainless steel sheet metal with or without finishing: corrosion-resistant, presentable and
    dimensionally stable. Our stainless steel sheet processing covers laser cutting and press braking, and
    deburring, blasting and passivation where you want it.'
  heroPhoto:
    subject: Close-up of ground stainless steel bent work with a sharp edge
  body:
    - "Stainless steel sheet processing calls for care: incorrect welding parameters or carbon steel residue
      on the surface lead to rust formation. We passivate after welding, so the corrosion-resistant surface
      stays intact."
    - Which thickness makes sense depends on the load and on the subsequent operations. Thinner material is
      lighter and cheaper, but across large surfaces it needs stiffeners or bent flanges to stay flat. For
      visible surfaces we also consider the grain direction, so that it runs consistently across the separate
      parts of an assembly.
    - 'Press braking stainless steel calls for more care than steel: the material springs back more and the
      surface is sensitive to scratches. We use protective film and adapted tooling for that. Read more on our
      page about <a href="/en/plaatwerk/zetten/">press braking</a>.'
    - Not every joint has to be welded. For visible work we often choose <a
      href="/en/plaatwerk/laserlassen/">laser welding</a>, because the narrow seam introduces little heat and
      therefore requires little finishing. Where a demountable or continuously loaded connection is needed, we
      work with <a href="/en/plaatwerk/persmoeren-trekmoeren/">self-clinching and rivet nuts</a>. If you are
      weighing 304 against 316, we set out the difference in our article on <a
      href="/kennisbank/rvs-304-of-316-welke-kies-je-voor-plaatwerk-en-laswerk/">stainless steel 304 or
      316</a> (in Dutch).
  materials:
    - Stainless steel 304
    - Stainless steel 316
    - Ground / brushed
  process:
    - step: Laser cutting
      desc: 2D laser cutting with minimal tolerances.
    - step: Press braking
      desc: Precise bend angles on the press brake.
    - step: Deburring
      desc: Burr-free, safe edges.
    - step: Welding & finishing
      desc: Laser/TIG welding and passivation for visible surfaces.
  applications:
    - Food industry
    - Machine building
    - Enclosures
    - Visible surfaces
  related:
    - label: Food industry
      desc: Hygienic stainless steel sheet metal.
    - label: Laser welding
      desc: Low-distortion seams.
    - label: Stainless steel constructions
      desc: Welded stainless steel assemblies.
  seo:
    title: Stainless sheet metal in 304 and 316
    description: 'Corrosion-resistant, presentable stainless steel sheet metal in 304 and 316: laser cutting,
      press braking, deburring and passivation for visible surfaces and machine building.'
  faq:
    - vraag: What sheet thickness in stainless steel can you laser cut?
      antwoord: On the Trumpf TruLaser 3040 we cut stainless steel from 0.5 to 20 mm. Which thickness makes sense in
        your case depends on the load and on the subsequent operations. If your request falls outside that
        range, put it to us and we will see what is possible within the group.
    - vraag: What is the difference between stainless steel 304 and 316?
      antwoord: Stainless steel 316 contains molybdenum and is therefore more resistant to pitting corrosion,
        particularly in environments with chlorides or a lot of moisture. 304 performs well in drier, less
        aggressive applications. We process both grades; our knowledge base article on 304 and 316 sets out
        the trade-off in more detail.
    - vraag: Do you supply ground stainless steel for visible surfaces?
      antwoord: Yes. For visible work we supply ground finishes with a consistent grain and make sure the grain
        direction runs across the separate parts of an assembly. Protective film stays in place through to the
        final operation, because stainless steel is sensitive to scratching.
    - vraag: Do you passivate stainless steel after welding?
      antwoord: Yes. Welding affects the protective oxide layer around the seam, which makes that area more
        susceptible to corrosion. We remove heat tint and passivate after welding, so that the corrosion
        resistance of the surface is retained.
