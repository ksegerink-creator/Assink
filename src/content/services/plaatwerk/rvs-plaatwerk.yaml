order: 22
h1: RVS-plaatwerk
intro: 'RVS-plaatwerk met of zonder nabewerking: corrosiebestendig, representatief en maatvast. Onze
  RVS-plaatbewerking omvat lasersnijden en kanten, en desgewenst ontbramen, stralen en passiveren.'
fotobank: "rvs-product"
heroPhoto:
  subject: Close-up van geslepen RVS kantwerk met scherpe kant
  orient: Liggend 16:10
  crop: Detailcrop op oppervlak
  comp: Strijklicht over geborsteld RVS
body:
  - "RVS-plaatbewerking vraagt om zorgvuldigheid: verkeerde lasparameters of resten koolstofstaal op het
    oppervlak leiden tot roestvorming. Wij passiveren na het lassen, zodat het corrosiebestendige oppervlak
    intact blijft."
  - Welke dikte verstandig is, hangt af van de belasting en van de vervolgbewerkingen. Dun materiaal is
    lichter en goedkoper, maar vraagt bij grote vlakken om verstijvingen of kantflenzen om vlak te blijven.
    Bij zichtwerk kijken we daarnaast naar de korrelrichting, zodat die over de losse delen van een
    samenstelling doorloopt.
  - 'Kanten vraagt bij RVS meer aandacht dan bij staal: het materiaal veert sterker terug en het oppervlak is
    gevoelig voor krassen. Wij werken daarbij met beschermfolie en aangepast gereedschap. Meer daarover staat
    op onze pagina over <a href="/plaatwerk/zetten/">kanten en zetten</a>.'
  - Niet elke verbinding hoeft gelast te worden. Voor zichtwerk kiezen we vaak <a
    href="/plaatwerk/laserlassen/">laserlassen</a>, omdat de smalle naad weinig warmte inbrengt en dus weinig
    nabewerking vraagt. Waar een demontabele of doorlopend belaste verbinding nodig is, werken we met <a
    href="/plaatwerk/persmoeren-trekmoeren/">pers- en trekmoeren</a>. Twijfelt u tussen 304 en 316, dan zetten
    we het verschil op een rij in ons artikel over <a
    href="/kennisbank/rvs-304-of-316-welke-kies-je-voor-plaatwerk-en-laswerk/">RVS 304 of 316</a>.
