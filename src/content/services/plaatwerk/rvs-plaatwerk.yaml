de:
  menuLabel: "Edelstahl"
  title: Edelstahl-Blechbearbeitung
  h1: Edelstahl-Blechbearbeitung
  intro: 'Edelstahlblech mit oder ohne Nachbearbeitung: korrosionsbeständig, repräsentativ und maßhaltig. Unsere
    Edelstahl-Blechbearbeitung umfasst Laserschneiden und Abkanten sowie auf Wunsch Entgraten, Strahlen und
    Passivieren.'
  heroPhoto:
    subject: Nahaufnahme von geschliffenem Edelstahl-Kantteil mit scharfer Kante
  body:
    - "Die Edelstahl-Blechbearbeitung erfordert Sorgfalt: falsche Schweißparameter oder Rückstände von
      Kohlenstoffstahl auf der Oberfläche führen zu Rostbildung. Wir passivieren nach dem Schweißen, damit die
      korrosionsbeständige Oberfläche intakt bleibt."
    - Welche Dicke sinnvoll ist, hängt von der Belastung und von den nachfolgenden Bearbeitungen ab. Dünneres
      Material ist leichter und günstiger, benötigt bei großen Flächen aber Versteifungen oder abgekantete
      Flansche, um eben zu bleiben. Bei Sichtflächen achten wir zusätzlich auf die Schliffrichtung, damit sie
      über die einzelnen Teile einer Baugruppe durchläuft.
    - 'Das Abkanten von Edelstahl erfordert mehr Sorgfalt als bei Stahl: Das Material federt stärker zurück
      und die Oberfläche ist kratzempfindlich. Wir arbeiten dabei mit Schutzfolie und angepasstem Werkzeug.
      Mehr dazu auf unserer Seite über das <a href="/de/plaatwerk/zetten/">Abkanten</a>.'
    - Nicht jede Verbindung muss geschweißt werden. Für Sichtflächen wählen wir häufig das <a
      href="/de/plaatwerk/laserlassen/">Laserschweißen</a>, weil die schmale Naht wenig Wärme einbringt und
      damit wenig Nacharbeit erfordert. Wo eine demontierbare oder dauerhaft belastete Verbindung nötig ist,
      arbeiten wir mit <a href="/de/plaatwerk/persmoeren-trekmoeren/">Einpress- und Blindnietmuttern</a>.
      Falls Sie zwischen 304 und 316 abwägen, stellen wir den Unterschied in unserem Artikel <a
      href="/kennisbank/rvs-304-of-316-welke-kies-je-voor-plaatwerk-en-laswerk/">Edelstahl 304 oder 316</a>
      gegenüber (niederländisch).
  materials:
    - Edelstahl 304
    - Edelstahl 316
    - Geschliffen / gebürstet
  process:
