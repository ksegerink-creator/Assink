# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  menuLabel: "Brass"
  title: Brass sheet metal
  h1: Brass sheet metal
  intro: Brass is a copper-zinc alloy with a warm colour. We process it while preserving its natural lustre, for
    technical and visible applications alike.
  heroPhoto:
    subject: Brass sheet metal part with a warm sheen, detail
  body:
    - Where brass stands out is its appearance. The surface has a warm, yellow lustre that no coating on
      stainless steel can match. That makes it attractive for visible work in interiors, for art objects and
      for decorative technical parts — but it also makes the surface the most vulnerable part of the product.
    - Brass discolours over time. In contact with air and moisture a darker patina forms, first yellow-brown
      and later brown to greenish. For some applications that is exactly what is wanted; for others it is not.
      Tell us which of the two you want, because it determines the finishing.
    - Brass combines well with other materials. If you are looking for corrosion-resistant visible work
      without the warm colour, <a href="/en/plaatwerk/rvs/">ground stainless steel</a> is often the logical
      choice; if low weight is decisive, <a href="/en/plaatwerk/aluminium/">aluminium</a> comes into play. We
      process all three, so the material choice need not be dictated by the supplier.
  materials:
    - Brass (copper-zinc alloy)
  process:
    - step: Cutting
      desc: "Precise cutting of brass sheet. We choose the cutting method per request: reflectivity and thermal
        conductivity make copper alloys harder to cut than steel or stainless steel."
    - step: Press braking
      desc: Bending without damaging the surface, with attention to the rolling direction — a bend across the grain
        is more likely to crack.
    - step: Finishing
      desc: Deburring and protecting the lustre. The protective film stays on up to and including the last
        operation.
  applications:
    - Interior fit-out
    - Art objects
    - Decorative technical components
  faq:
    - vraag: Which brass sheet thicknesses can you process?
      antwoord: We determine that per request. The cutting thicknesses we have confirmed for our fibre laser apply
        to steel, stainless steel, aluminium and galvanised steel; brass is a copper alloy and behaves
        differently under the laser. Send your drawing with the sheet thickness and brass grade and we will
        indicate what is feasible.
    - vraag: Does brass discolour over time?
      antwoord: 'Yes. In contact with air and moisture a patina forms: first yellow-brown, later brown to greenish.
        For some applications that is exactly what is wanted. If you want to keep the original lustre, a
        protective lacquer is needed or the part has to be polished periodically.'
    - vraag: Can you press brake brass without damaging the surface?
      antwoord: Yes. Brass is softer than stainless steel and steel and therefore scratches more quickly. We keep
        protective film on up to and including the last operation, work with clean tooling and take the
        rolling direction into account, because a bend across the grain is more likely to crack.
    - vraag: What is brass sheet metal mainly used for?
      antwoord: For interior construction, art objects and decorative technical components — applications in which
        the warm, yellow lustre makes the difference. For purely functional parts without a visual
        requirement, stainless steel or aluminium is usually more economical.
    - vraag: Can you weld brass?
      antwoord: Brass is listed with us as a material for laser welding. Because of the zinc in the alloy it does
        call for adapted parameters and good extraction. Put your joint to us with the sheet thickness and the
        joint geometry and we will indicate whether welding, brazing or a mechanical joint is the better route
        in your case.
  related:
    - label: Stainless steel
      desc: Corrosion-resistant visible surfaces.
    - label: Precision sheet metal
      desc: Dimensionally stable one-offs and series.
  seo:
    title: Custom brass sheet metal
    description: Brass sheet metal with its natural lustre preserved, for interior fit-out, art objects and
      decorative technical components.
  specs:
    - label: Alloy
      value: copper and zinc
    - label: More zinc
      value: stronger and easier to form
    - label: More copper
      value: warmer, redder colour
    - label: For sheet metal work
      value: usually a readily formable grade, so it does not crack during press braking
    - label: Surface
      value: warm yellow lustre; softer than stainless steel and steel, so it scratches more easily
    - label: Patina
      value: first yellow-brown, later brown to greenish
    - label: Keeping the lustre
      value: a protective lacquer, or allowing for periodic polishing
    - label: Cutting method
      value: decided per request — reflectivity and thermal conductivity make brass harder than steel
    - label: When press braking
      value: rolling direction matters; a bend across the grain cracks sooner
    - label: In the workshop
      value: kept separate from steel, to prevent iron contamination
  aanleveren:
    - Drawing with the sheet thickness
    - The required brass grade
    - The surface requirement
    - Whether you want to keep the lustre or allow a patina

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  menuLabel: "Messing"
  title: Messing-Blechbearbeitung
  h1: Messing-Blechbearbeitung
  intro: Messing ist eine Kupfer-Zink-Legierung mit warmer Farbe. Wir verarbeiten es unter Erhalt des
    natürlichen Glanzes — für technische wie auch für Sichtanwendungen.
  heroPhoto:
    subject: Messing-Blechteil mit warmem Glanz, Detail
  body:
    - Wo Messing sich abhebt, ist die Ausstrahlung. Die Oberfläche hat einen warmen, gelben Glanz, den keine
      Beschichtung auf Edelstahl erreicht. Das macht den Werkstoff attraktiv für Sichtflächen im Innenausbau,
      für Kunstobjekte und für dekorative technische Bauteile — es macht die Oberfläche aber auch zum
      empfindlichsten Teil des Produkts.
    - Messing verfärbt sich. In Kontakt mit Luft und Feuchtigkeit bildet sich eine dunklere Patina, zunächst
      gelbbraun, später braun bis grünlich. Für manche Anwendungen ist das gerade erwünscht, für andere nicht.
      Teilen Sie uns mit, was Sie wünschen, denn das bestimmt die Oberflächenbehandlung.
    - Messing lässt sich gut mit anderen Werkstoffen kombinieren. Suchen Sie korrosionsbeständige Sichtflächen
      ohne die warme Farbe, ist <a href="/de/plaatwerk/rvs/">geschliffener Edelstahl</a> oft die naheliegende
      Wahl; ist geringes Gewicht entscheidend, kommt <a href="/de/plaatwerk/aluminium/">Aluminium</a> ins
      Spiel. Wir verarbeiten alle drei, die Werkstoffwahl muss also nicht vom Lieferanten bestimmt werden.
  materials:
    - Messing (Kupfer-Zink-Legierung)
  process:
    - step: Schneiden
      desc: "Präzises Ausschneiden von Messingblech. Das Schneidverfahren wählen wir je Anfrage: Reflexion und
        Wärmeleitfähigkeit machen Kupferlegierungen schwieriger als Stahl oder Edelstahl."
    - step: Abkanten
      desc: Kanten ohne Beschädigung der Oberfläche, mit Rücksicht auf die Walzrichtung — eine Biegung quer zur
        Faser reißt eher.
    - step: Nachbearbeitung
      desc: Entgraten und Schutz des Glanzes. Die Schutzfolie bleibt bis einschließlich des letzten Arbeitsgangs
        darauf.
  applications:
    - Innenausbau
    - Kunstobjekte
    - Dekorative technische Komponenten
  faq:
    - vraag: Welche Messing-Blechdicken können Sie verarbeiten?
      antwoord: Das entscheiden wir je Anfrage. Die für unseren Faserlaser bestätigten Schneiddicken gelten für
        Stahl, Edelstahl, Aluminium und verzinkten Stahl; Messing ist eine Kupferlegierung und verhält sich
        unter dem Laser anders. Senden Sie Ihre Zeichnung mit Blechdicke und Messinggüte, dann geben wir an,
        was machbar ist.
    - vraag: Verfärbt sich Messing mit der Zeit?
      antwoord: 'Ja. In Kontakt mit Luft und Feuchtigkeit bildet sich eine Patina: zunächst gelbbraun, später braun
        bis grünlich. Für manche Anwendungen ist das gerade erwünscht. Möchten Sie den ursprünglichen Glanz
        erhalten, ist eine Schutzlackierung nötig oder es muss regelmäßig poliert werden.'
    - vraag: Können Sie Messing abkanten, ohne die Oberfläche zu beschädigen?
      antwoord: Ja. Messing ist weicher als Edelstahl und Stahl und verkratzt daher schneller. Wir belassen die
        Schutzfolie bis einschließlich des letzten Arbeitsgangs, arbeiten mit sauberem Werkzeug und
        berücksichtigen die Walzrichtung, weil eine Biegung quer zur Faser eher reißt.
    - vraag: Wofür wird Messingblech vor allem eingesetzt?
      antwoord: Für den Innenausbau, Kunstobjekte und dekorative technische Bauteile — Anwendungen, bei denen der
        warme, gelbe Glanz den Unterschied macht. Für rein funktionale Teile ohne Sichtanforderung sind
        Edelstahl oder Aluminium meist günstiger.
    - vraag: Können Sie Messing schweißen?
      antwoord: Messing ist bei uns als Werkstoff für das Laserschweißen gelistet. Wegen des Zinks in der Legierung
        erfordert es allerdings angepasste Parameter und eine gute Absaugung. Legen Sie uns Ihre Verbindung
        mit Blechdicke und Nahtform vor, dann geben wir an, ob Schweißen, Löten oder eine mechanische
        Verbindung in Ihrem Fall der bessere Weg ist.
  related:
    - label: Edelstahl
      desc: Rostfreie Sichtflächen.
    - label: Präzisionsblech
      desc: Maßhaltige Einzelstücke und Serien.
  seo:
    title: Messingblech nach Maß
    description: Messing-Blechbearbeitung unter Erhalt des natürlichen Glanzes für Innenausbau, Kunstobjekte und
      dekorative technische Komponenten.
  specs:
    - label: Legierung
      value: Kupfer und Zink
    - label: Mehr Zink
      value: fester und besser umformbar
    - label: Mehr Kupfer
      value: wärmere, rötlichere Farbe
    - label: Für die Blechbearbeitung
      value: meist eine gut umformbare Güte, damit sie beim Abkanten nicht reißt
    - label: Oberfläche
      value: warmer gelber Glanz; weicher als Edelstahl und Stahl, daher kratzempfindlicher
    - label: Patina
      value: zunächst gelbbraun, später braun bis grünlich
    - label: Glanz erhalten
      value: eine Schutzlackierung, oder regelmäßiges Polieren einplanen
    - label: Schneidverfahren
      value: je Anfrage festgelegt — Reflexion und Wärmeleitfähigkeit machen Messing schwieriger als Stahl
    - label: Beim Abkanten
      value: Walzrichtung zählt; quer zur Faser reißt es eher
    - label: In der Werkstatt
      value: von Stahl getrennt gehalten, um Eisenkontamination zu vermeiden
  aanleveren:
    - Zeichnung mit der Blechdicke
    - Die gewünschte Messinggüte
    - Die Anforderung an die Oberfläche
    - Ob Sie den Glanz erhalten möchten oder eine Patina zulassen
