title: Messing plaatwerk
menuLabel: "Messing"
slug: plaatwerk/messing
template: service
group: plaatwerk
order: 24
h1: Messing plaatwerk
intro: Messing is een koperzink-legering met een warme kleur. Wij verwerken het met behoud van de natuurlijke
  glans voor techniek én zichttoepassingen.
fotobank: "boren"
heroPhoto:
  subject: Messing plaatwerkonderdeel met warme glans, detail
  orient: Liggend 16:10
  crop: Detailcrop
  comp: Strijklicht over messing oppervlak
body:
  - Waar messing zich onderscheidt, is de uitstraling. Het oppervlak heeft een warme, gele glans die met geen
    enkele coating op RVS te benaderen is. Dat maakt het aantrekkelijk voor zichtwerk in interieurs, voor
    kunstobjecten en voor decoratieve technische onderdelen — maar het maakt het oppervlak ook het
    kwetsbaarste deel van het product.
  - Messing verkleurt. In contact met lucht en vocht vormt zich een donkerder patina, eerst geelbruin en later
    bruin tot groenig. Voor sommige toepassingen is dat juist gewenst; voor andere niet. Geef bij uw aanvraag
    door welke van de twee u wilt, want dat bepaalt de afwerking.
  - Messing laat zich goed combineren met andere materialen. Zoekt u corrosiebestendig zichtwerk zonder de
    warme kleur, dan is <a href="/plaatwerk/rvs/">geslepen RVS</a> vaak de logische keuze; is licht gewicht
    doorslaggevend, dan komt <a href="/plaatwerk/aluminium/">aluminium</a> in beeld. Wij verwerken alle drie,
    dus de materiaalkeuze hoeft niet door de leverancier bepaald te worden.
materials:
  - Messing (koperzink-legering)
process:
  - step: Snijden
    desc: "Nauwkeurig uitsnijden van messing plaat. De snijmethode kiezen wij per aanvraag: reflectie en
      warmtegeleiding maken koperlegeringen lastiger te snijden dan staal of RVS."
  - step: Kanten
    desc: Kanten zonder beschadiging van het oppervlak, met aandacht voor de walsrichting — een buiging dwars op
      de vezel scheurt eerder.
  - step: Afwerking
    desc: Ontbramen en beschermen van de glans. De beschermfolie blijft tot en met de laatste bewerking zitten.
applications:
  - Interieurbouw
  - Kunstobjecten
  - Decoratieve technische componenten
faq:
  - vraag: Welke plaatdiktes messing kunnen jullie verwerken?
    antwoord: Dat bepalen wij per aanvraag. De snijdiktes die wij op onze fiberlaser bevestigd hebben, gelden voor
      staal, RVS, aluminium en gegalvaniseerd staal; messing is een koperlegering en gedraagt zich onder de
      laser anders. Stuur uw tekening met de plaatdikte en de messingkwaliteit mee, dan geven wij aan wat
      haalbaar is.
  - vraag: Verkleurt messing na verloop van tijd?
    antwoord: 'Ja. In contact met lucht en vocht vormt zich een patina: eerst geelbruin, later bruin tot groenig.
      Voor sommige toepassingen is dat juist gewenst. Wilt u de oorspronkelijke glans behouden, dan is een
      beschermende laklaag nodig of moet er periodiek gepoetst worden.'
  - vraag: Kunnen jullie messing kanten zonder het oppervlak te beschadigen?
    antwoord: Ja. Messing is zachter dan RVS en staal en krast dus sneller. Wij laten beschermfolie tot en met de
      laatste bewerking zitten, werken met schoon gereedschap en houden rekening met de walsrichting, omdat
      een buiging dwars op de vezel eerder scheurt.
  - vraag: Waarvoor wordt messing plaatwerk vooral gebruikt?
    antwoord: Voor interieurbouw, kunstobjecten en decoratieve technische componenten — toepassingen waarin de
      warme, gele glans het verschil maakt. Voor puur functionele delen zonder zichteis is RVS of aluminium
      meestal voordeliger.
  - vraag: Kunnen jullie messing lassen?
    antwoord: Messing staat bij ons als materiaal voor laserlassen. Wel vraagt het vanwege het zink in de legering
      om aangepaste parameters en goede afzuiging. Leg uw verbinding voor met de plaatdikte en de naadvorm,
      dan geven wij aan of lassen, solderen of een mechanische verbinding in uw geval de betere route is.
related:
  - slug: plaatwerk/rvs
    label: RVS
    desc: Roestvast zichtwerk.
  - slug: plaatwerk/precisieplaatwerk
    label: Precisieplaatwerk
    desc: Maatvast enkelstuks- en seriewerk.
seo:
  title: Messing plaatwerk op maat
  description: Messing plaatwerk met behoud van de natuurlijke glans voor interieurbouw, kunstobjecten en
    decoratieve technische componenten.
translated:
