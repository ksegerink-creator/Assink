# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  menuLabel: "Self-clinching & rivet nuts"
  title: Self-clinching nuts & rivet nuts
  h1: Self-clinching nuts & rivet nuts
  intro: 'With self-clinching nuts and rivet nuts we make sheet metal ready for assembly: dependable threads,
    even in thin material.'
  heroPhoto:
    subject: Close-up of a self-clinching nut pressed into sheet metal
  body:
  - Self-clinching nuts and rivet nuts give sheet metal a strong threaded connection without loose fasteners.
    This allows us to supply assembly-ready parts that can go straight into your line.
  - We install self-clinching nuts by machine and square, with a press force matched to sheet thickness
    and nut type — so the thread stays secure even with regular disassembly and reassembly.
  - 'The difference between the two lies in how the joint is created. A self-clinching nut is pressed cold
    into a pre-cut hole: the knurl on the nut displaces sheet material, which flows back into a groove and
    locks the nut against pull-out and rotation. A rivet nut (blind rivet nut) is deformed from one side
    and clamps behind the sheet. Self-clinching nuts give the strongest and flattest joint; rivet nuts are
    the answer when the reverse side is not accessible or must not be deformed.'
  - 'Sheet thickness largely determines what is possible. For a self-clinching nut the sheet material has
    to be softer than the nut, otherwise it will not flow into the groove; the combination of hard material
    and a fine thread is therefore critical. The distance to the edge and to surrounding cut-outs matters
    too: too close to the edge and the material bulges. We assess that on the drawing beforehand, so that
    it is not a surprise on the first batch.'
  - Material and nut choice have to match. In stainless steel sheet metal we fit stainless steel nuts, to
    avoid galvanic corrosion. In aluminium, stainless steel or zinc-plated steel is chosen depending on
    the environment. If the part is powder coated after insertion, the thread has to be masked or re-worked
    afterwards — otherwise the coating runs into the thread and the bolt no longer fits.
  - Insertion is done by machine and square to the sheet, with a press force matched to sheet thickness
    and nut type. We then check for flatness around the nut and for the seating of the thread. That way
    the joint stays firm, even if the part is regularly dismantled and reassembled in service.
  - 'Self-clinching and rivet nuts are part of a larger whole: the hole comes from the <a href="/en/plaatwerk/lasersnijden/">laser</a>,
    the edges are deburred and the part is often <a href="/en/plaatwerk/zetten/">press braked</a> before
    the nut goes in. That sequence is not arbitrary — a nut fitted too early gets in the way during bending
    or is deformed in the press. We fix that sequence during production engineering.'
  - 'To assess a request we need: the drawing with the hole positions, the sheet thickness and material,
    the required thread size, whether the nut sits on the visible or the reverse side, and the finishing.
    If you are not sure whether a self-clinching or a rivet nut fits, tell us what the joint has to carry
    and how often it needs to come apart; we will advise on that basis.'
  materials:
  - Stainless steel
  - Aluminium
  - Steel
  process:
  - step: Preparation
    desc: Cutting holes to size.
  - step: Clinching
    desc: Fitting the self-clinching or rivet nut.
  - step: Inspection
    desc: Checking flatness and strength.
  applications:
  - Enclosures
  - Panels
  - Assembly-ready sheet metal
  faq:
  - vraag: What is the difference between a self-clinching nut and a rivet nut?
    antwoord: A self-clinching nut is pressed cold into the sheet; the knurl displaces material that flows
      back into a groove, locking the nut against pull-out and rotation. A rivet nut is deformed from one
      side and clamps behind the sheet. The self-clinching nut gives the strongest and flattest joint; the
      rivet nut is the choice when the reverse side is not accessible.
  - vraag: From what sheet thickness can you fit a self-clinching nut?
    antwoord: That depends on the nut type, the sheet material and the thread size. The sheet has to be
      softer than the nut, so hard material or a fine thread in thin sheet can be a reason to choose a different
      size or a rivet nut instead. We assess that combination on the drawing for each request.
  - vraag: In which materials do you fit self-clinching and rivet nuts?
    antwoord: 'In stainless steel, aluminium and steel. We match the nut material to the sheet: stainless
      steel nuts in stainless steel sheet metal to avoid galvanic corrosion, and in aluminium either stainless
      steel or zinc-plated steel depending on the environment.'
  - vraag: Does the thread stay put under repeated dismantling?
    antwoord: Yes, provided the nut has been fitted square and with the correct press force. A properly
      inserted nut resists both pull-out and rotation, which makes it suitable for parts that have to be
      opened regularly in service. After insertion we check flatness and the seating of the thread.
  - vraag: Can the part still be powder coated once the nuts are in?
    antwoord: Yes, but the thread then has to be masked or re-worked after coating, otherwise the coating
      runs into the thread. Tell us which finishing the part receives and we will set the sequence accordingly.
  related:
  - label: Precision sheet metal
    desc: Dimensionally stable sheet metal.
  - label: Bending & forming
    desc: Press brake work.
  seo:
    title: Self-clinching and rivet nuts in sheet
    description: 'Self-clinching and rivet nuts for dependable threaded connections in thin sheet: assembly-ready
      sheet metal.'

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  menuLabel: "Einpress- & Blindnietmuttern"
  title: Einpress- & Blindnietmuttern
  h1: Einpress- & Blindnietmuttern
  intro: 'Mit Einpress- und Blindnietmuttern machen wir Blechteile montagefertig: zuverlässige Gewinde,
    auch in dünnem Material.'
  heroPhoto:
    subject: Nahaufnahme einer eingepressten Mutter im Blechteil
  body:
  - Einpressmuttern und Blindnietmuttern geben Blechteilen eine feste Gewindeverbindung ohne loses Befestigungsmaterial.
    So liefern wir montagefertige Teile, die in Ihrer Linie direkt weiterverarbeitet werden können.
  - Einpressmuttern setzen wir maschinell und rechtwinklig ein, mit einer Presskraft, die auf Blechdicke
    und Mutterntyp abgestimmt ist — sodass das Gewinde auch bei regelmäßigem Demontieren und Montieren fest
    sitzen bleibt.
  - 'Der Unterschied liegt in der Art der Verbindung. Eine Einpressmutter wird kalt in eine vorgeschnittene
    Bohrung eingepresst: die Rändelung verdrängt Blechmaterial, das in eine Nut zurückfließt und die Mutter
    auszieh- und verdrehsicher festsetzt. Eine Blindnietmutter wird von einer Seite verformt und klemmt
    hinter dem Blech. Einpressmuttern ergeben die festeste und flachste Verbindung; Blindnietmuttern sind
    die Lösung, wenn die Rückseite nicht zugänglich ist oder nicht verformt werden darf.'
  - 'Die Blechdicke bestimmt weitgehend, was möglich ist. Für eine Einpressmutter muss das Blech weicher
    sein als die Mutter, sonst fließt es nicht in die Nut; die Kombination aus hartem Werkstoff und feinem
    Gewinde ist damit kritisch. Auch der Abstand zur Kante und zu umliegenden Aussparungen zählt: zu nah
    am Rand wölbt sich das Material auf. Wir beurteilen das vorab an der Zeichnung, damit es bei der ersten
    Serie keine Überraschung gibt.'
  - Werkstoff und Mutternwahl müssen zueinander passen. In Edelstahlblech setzen wir Edelstahlmuttern, um
    Kontaktkorrosion zu vermeiden. In Aluminium wird je nach Umgebung Edelstahl oder verzinkter Stahl gewählt.
    Wird das Teil nach dem Einpressen noch pulverbeschichtet, muss das Gewinde abgedeckt oder nachgearbeitet
    werden — sonst läuft die Beschichtung ins Gewinde und die Schraube passt nicht mehr.
  - Das Einpressen erfolgt bei uns maschinell und rechtwinklig, mit einer Presskraft, die auf Blechdicke
    und Mutterntyp abgestimmt ist. Anschließend prüfen wir die Ebenheit rund um die Mutter und den Sitz
    des Gewindes. So bleibt die Verbindung fest, auch wenn das Teil im Betrieb regelmäßig demontiert und
    wieder montiert wird.
  - 'Einpress- und Blindnietmuttern sind Teil eines größeren Ganzen: die Bohrung kommt vom <a href="/de/plaatwerk/lasersnijden/">Laser</a>,
    die Kanten werden entgratet und das Teil wird häufig noch <a href="/de/plaatwerk/zetten/">abgekantet</a>,
    bevor die Mutter hineinkommt. Diese Reihenfolge ist nicht beliebig — eine zu früh gesetzte Mutter stört
    beim Abkanten oder wird in der Presse verformt. Wir legen die Reihenfolge in der Arbeitsvorbereitung
    fest.'
  - 'Für eine Beurteilung benötigen wir: die Zeichnung mit den Bohrungspositionen, Blechdicke und Werkstoff,
    die gewünschte Gewindegröße, ob die Mutter auf der Sicht- oder der Rückseite sitzt, und die Nachbehandlung.
    Wissen Sie noch nicht, ob eine Einpress- oder eine Blindnietmutter passt, nennen Sie uns die Belastung
    und wie oft die Verbindung gelöst werden muss; darauf beraten wir.'
  materials:
  - Edelstahl
  - Aluminium
  - Stahl
  process:
  - step: Vorbereiten
    desc: Löcher maßgenau schneiden.
  - step: Einpressen
    desc: Einpress- oder Blindnietmutter setzen.
  - step: Kontrolle
    desc: Prüfung auf Planheit und Festigkeit.
  applications:
  - Gehäuse
  - Paneele
  - Montagefertige Blechteile
  faq:
  - vraag: Was ist der Unterschied zwischen Einpressmutter und Blindnietmutter?
    antwoord: Eine Einpressmutter wird kalt ins Blech gepresst; die Rändelung verdrängt Material, das in
      eine Nut zurückfließt und die Mutter auszieh- und verdrehsicher festsetzt. Eine Blindnietmutter wird
      von einer Seite verformt und klemmt hinter dem Blech. Die Einpressmutter ergibt die festeste und flachste
      Verbindung, die Blindnietmutter ist die Wahl, wenn die Rückseite nicht zugänglich ist.
  - vraag: Ab welcher Blechdicke können Sie eine Einpressmutter setzen?
    antwoord: Das hängt vom Mutterntyp, vom Blechwerkstoff und von der Gewindegröße ab. Das Blech muss weicher
      sein als die Mutter; ein harter Werkstoff oder ein feines Gewinde in dünnem Blech kann daher ein Grund
      sein, eine andere Größe oder eine Blindnietmutter zu wählen. Wir beurteilen diese Kombination je Anfrage
      an der Zeichnung.
  - vraag: In welchen Werkstoffen setzen Sie Einpress- und Blindnietmuttern?
    antwoord: 'In Edelstahl, Aluminium und Stahl. Wir stimmen den Mutternwerkstoff auf das Blech ab: in
      Edelstahlblech Edelstahlmuttern, um Kontaktkorrosion zu vermeiden, in Aluminium je nach Umgebung Edelstahl
      oder verzinkter Stahl.'
  - vraag: Hält das Gewinde bei wiederholter Demontage?
    antwoord: Ja, sofern die Mutter rechtwinklig und mit der richtigen Presskraft gesetzt wurde. Eine korrekt
      eingepresste Mutter ist auszieh- und verdrehsicher und damit für Bauteile geeignet, die im Betrieb
      regelmäßig geöffnet werden. Nach dem Einpressen prüfen wir Ebenheit und Gewindesitz.
  - vraag: Kann nach dem Einpressen noch pulverbeschichtet werden?
    antwoord: Ja, das Gewinde muss dann jedoch abgedeckt oder nach dem Beschichten nachgearbeitet werden,
      sonst läuft die Beschichtung ins Gewinde. Teilen Sie uns mit, welche Nachbehandlung das Teil erhält,
      dann legen wir die Reihenfolge entsprechend fest.
  related:
  - label: Präzisionsblech
    desc: Maßhaltige Blechteile.
  - label: Kanten & Biegen
    desc: Kantarbeiten.
  seo:
    title: Einpress- und Blindnietmuttern im Blech
    description: 'Einpress- und Blindnietmuttern für zuverlässige Gewindeverbindungen in dünnem Blech: montagefertige
      Blechteile.'
