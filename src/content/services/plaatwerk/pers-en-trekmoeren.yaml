    label: Precisieplaatwerk
    desc: Maatvast plaatwerk.
  - slug: plaatwerk/zetten
    label: Kanten
    desc: Kantwerk.
seo:
  title: Pers- en trekmoeren in plaatwerk
  description: 'Inpers- en trekmoeren voor betrouwbare schroefdraadverbindingen in dunne plaat: montageklaar plaatwerk.'
