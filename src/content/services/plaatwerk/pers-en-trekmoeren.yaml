title: Pers- en trekmoeren
menuLabel: "Pers- & trekmoeren"
slug: plaatwerk/persmoeren-trekmoeren
template: service
group: plaatwerk
order: 27
h1: Pers- en trekmoeren
intro: 'Met pers- en trekmoeren maken we plaatwerk montageklaar: betrouwbare schroefdraad, ook in dun materiaal.'
fotobank: "boren"
heroPhoto:
  subject: Close-up van ingeperste moer in plaatwerk
  orient: Liggend 16:10
  crop: Macro op moer
  comp: Persmoer in plaat, bovenaanzicht
body:
  - Het verschil tussen beide zit in de manier waarop de verbinding tot stand komt. Een persmoer wordt koud in
    een voorgesneden gat geperst en zet zich vast doordat verdrongen plaatmateriaal in een groef terugvloeit.
    Een trekmoer wordt vanaf één zijde vervormd en klemt zich achter de plaat.
  - De plaatdikte bepaalt in hoge mate wat er mogelijk is, en de afstand tot de rand en tot omliggende
    uitsparingen telt mee. Wij beoordelen dat vooraf op tekening, zodat het bij de eerste serie geen
    verrassing is.
  - 'Pers- en trekmoeren zijn onderdeel van een groter geheel: het gat komt van de <a
    href="/plaatwerk/lasersnijden/">laser</a>, de randen worden ontbraamd en het deel wordt vaak nog <a
    href="/plaatwerk/zetten/">gekant</a> voordat de moer erin gaat. Die volgorde is niet vrijblijvend — een
    moer die te vroeg geplaatst wordt, zit in de weg bij het kanten of vervormt in de pers. Wij leggen die
    volgorde vast in de werkvoorbereiding.'
materials:
  - RVS
  - Aluminium
  - Staal
process:
  - step: Voorbereiden
    desc: Gaten op maat snijden op de laser, randen ontbramen en waar nodig eerst kanten — een te vroeg geplaatste
      moer zit in de weg.
  - step: Inpersen
    desc: Machinaal en haaks, met een perskracht die is afgestemd op plaatdikte en moertype.
  - step: Controle
    desc: Vlakheid rond de moer en de zit van de schroefdraad, zodat de verbinding ook na herhaald demonteren en
      monteren vast blijft zitten.
applications:
  - Behuizingen
  - Panelen
  - Montageklaar plaatwerk
faq:
  - vraag: Wat is het verschil tussen een persmoer en een trekmoer?
    antwoord: Een persmoer wordt koud in de plaat geperst; de kartel verdringt materiaal dat in een groef
      terugvloeit, waardoor de moer uittrek- en verdraaiingsvast zit. Een trekmoer wordt vanaf één zijde
      vervormd en klemt achter de plaat. De persmoer geeft de sterkste en vlakste verbinding, de trekmoer is
      de keuze als de achterzijde niet bereikbaar is.
  - vraag: Vanaf welke plaatdikte kunnen jullie een persmoer plaatsen?
    antwoord: Dat hangt af van het moertype, het plaatmateriaal en de schroefdraadmaat. Het plaatmateriaal moet
      zachter zijn dan de moer, dus een harde plaat of een fijne draad in dun materiaal kan reden zijn om voor
      een andere maat of voor een trekmoer te kiezen. Wij beoordelen die combinatie per aanvraag op tekening.
  - vraag: In welke materialen plaatsen jullie pers- en trekmoeren?
    antwoord: 'In RVS, aluminium en staal. Wij stemmen het moermateriaal af op de plaat: in RVS-plaatwerk
      RVS-moeren om contactcorrosie te voorkomen, in aluminium afhankelijk van de omgeving RVS of verzinkt
      staal.'
  - vraag: Blijft de schroefdraad zitten bij herhaald demonteren?
    antwoord: Ja, mits de moer haaks en met de juiste perskracht is geplaatst. Een correct ingeperste moer is
      uittrek- en verdraaiingsvast en is daarmee geschikt voor onderdelen die in gebruik regelmatig open
      moeten. Wij controleren na het inpersen op vlakheid en op de zit van de draad.
  - vraag: Kan er nog gepoedercoat worden nadat de moeren erin zitten?
    antwoord: Ja, maar de schroefdraad moet dan afgedekt worden of na het coaten worden nabewerkt, anders loopt de
      coating in de draad. Geef bij uw aanvraag door welke nabehandeling het deel krijgt, dan leggen wij de
      volgorde daarop vast.
related:
