faq:
  - vraag: Waarom moeten lasergesneden delen ontbraamd worden?
    antwoord: >-
      Een braam is scherp en maakt een deel onveilig om te hanteren. Daarnaast
      zit hij in de weg bij de volgende bewerkingen: het deel ligt niet vlak
      tegen de aanslag van de kantbank, lasnaden sluiten minder goed aan en
      een coating hecht slechter op een scherpe rand.
  - vraag: Kunnen jullie ook gekante delen ontbramen?
    antwoord: >-
      Onze Timesavers is een machine voor platte werkstukken. Daarom ontbramen
      wij direct na het lasersnijden, vóór het kanten. Levert u zelf al gekante
      delen aan die nog ontbraamd moeten worden, neem dan contact op, dan
      kijken we per geval wat mogelijk is.
  - vraag: Is ontbramen standaard bij jullie plaatwerk?
    antwoord: >-
      Bij plaatwerk dat bij ons verder gekant, gelast of afgewerkt wordt, hoort
      het bij de route. Bestelt u alleen gesneden delen, geef dan in uw
      aanvraag door of u ze ontbraamd wilt ontvangen.
  - vraag: Wat is het verschil tussen ontbramen en stralen?
    antwoord: >-
      Ontbramen verwijdert de braam en rondt de randen af. Glasparelstralen is
      een oppervlaktebehandeling die onder meer aanloopkleuren en
      verontreiniging na het lassen verwijdert en een egaal mat oppervlak
      geeft. Bij RVS volgen ze vaak na elkaar.
