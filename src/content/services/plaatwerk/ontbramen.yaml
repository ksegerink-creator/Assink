inFooter: false
h1: Ontbramen
intro: >-
  Na het lasersnijden zit er een braam op de snijrand. Wij verwijderen die
  machinaal, zodat uw plaatdelen veilig te hanteren zijn en zonder problemen
  door kanten, lassen en afwerken gaan.
fotobank: nabewerken
foto: /src/assets/uploads/services/ontbramen/foto.png
heroPhoto:
  subject: Plaatdeel gaat door de ontbraam-/borstelmachine
  orient: Liggend 16:10
  crop: Machine-invoer
  comp: Plaat op transportband in machine
body:
  - >-
    Bij het lasersnijden stolt een klein deel van het gesmolten materiaal aan
    de onderkant van de snijrand. Die braam is scherp genoeg om je aan te
    snijden en zit in de weg bij de volgende bewerkingen: een deel met braam
    ligt niet vlak tegen de aanslag van de kantbank, een lasnaad sluit minder
    goed aan en een poedercoatlaag hecht slechter op een scherpe rand.
  - >-
    Wij ontbramen in eigen huis op een Timesavers 42 Series RB, een
    breedbandmachine voor platte werkstukken. De plaatdelen gaan na het snijden
    op de transportband door de machine, die de braam verwijdert, de randen
    licht afrondt en het oppervlak egaliseert. Omdat dit machinaal gebeurt, is
    het resultaat gelijk over de hele serie — ook bij honderden delen.
  - >-
    Ontbramen gebeurt vóór het kanten, zolang het deel nog vlak is. Dat is
    ook de reden dat het direct na het lasersnijden in onze route zit: een
    gekant deel past niet meer plat door de machine.
  - >-
    Per materiaal ligt het accent anders. Bij staal gaat het naast uiterlijk
    vooral om arbeidsveiligheid verderop in de keten. Bij RVS volgt na het
    ontbramen waar nodig glasparelstralen en, na het lassen, passiveren. Bij
    aluminium volstaan ontbramen en een visuele controle als de rand uit het
    zicht blijft. Bij zichtwerk in messing blijft de beschermfolie zo lang
    mogelijk zitten.
materials:
