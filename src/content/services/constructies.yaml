  comp: "Frame op bok, lasser op achtergrond"
bodyHeading: "Specialist in constructiewerk"
body:
  - "Assink & Schipholt voert zware en complexe lassamenstellingen uit — van losse onderdelen tot volledig gelaste samenstellingen. Wij werken voor machinebouw, apparatenbouw en infratechniek en verwerken onderdelen tot 5 ton."
  - "Met bovenloopkraan en een ruime hal produceren we constructies tot 4 meter hoogte en 50 m² oppervlakte — veilig en efficiënt."
  - "Wij verzorgen niet alleen las- en constructiewerk, maar ook oppervlaktebehandelingen zoals stralen, poedercoaten, anodiseren en RVS-passiveren — veel in eigen beheer. Zo heeft u één aanspreekpunt van engineering tot afwerking."
