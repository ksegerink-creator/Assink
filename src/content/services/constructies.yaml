title: Constructies
slug: constructies
template: service
group: samenstellen
order: 20
kicker: Mogelijkheid 4.1
h1: Constructief in constructies
intro: Meer dan 100 jaar specialist in hoogwaardige metaalconstructies. Van losse onderdelen tot volledig
  gelaste samenstellingen — traditioneel vakmanschap met moderne techniek.
heroPhoto:
  subject: Gelast frame tijdens kwaliteitscontrole in de constructiehal
  orient: Liggend 16:10
  crop: Halfrontaal
  comp: Frame op bok, lasser op achtergrond
bodyHeading: Specialist in constructiewerk
body:
- Assink & Schipholt voert zware en complexe lassamenstellingen uit — van losse onderdelen tot volledig
  gelaste samenstellingen. Wij werken voor machinebouw, apparatenbouw en infratechniek en verwerken onderdelen
  tot 10 ton.
- In de hal hangen vijf bovenloopkranen van 5 ton. Door in tandem te hijsen — met twee kranen aan één
  last — verplaatsen we samenstellingen tot 10 ton, tot 8 meter hoogte.
- Wij verzorgen niet alleen las- en constructiewerk, maar ook oppervlaktebehandelingen zoals stralen,
  poedercoaten, anodiseren en RVS-passiveren — veel in eigen beheer. Zo heeft u één aanspreekpunt van
  engineering tot afwerking.
- 'Een constructie is meer dan de som van de losse delen. De grootste risico''s zitten in vervorming door
  warmte-inbreng en in maatafwijkingen die zich door een samenstelling heen opstapelen. Daarom bepalen
  wij de lasvolgorde in de werkvoorbereiding en niet op de vloer: symmetrisch lassen waar het kan, in
  stappen waar dat nodig is, en met opspanning op de maten die er echt toe doen.'
- 'Wij snijden plaat op de fiberlaser en buis en profiel op de Trumpf TruLaser Tube 3000. Dat laatste
  scheelt in een constructie veel handwerk: uitsparingen, verstekken en pasvormen komen direct uit de
  machine, waardoor delen in elkaar vallen in plaats van dat ze passend gemaakt moeten worden. Het resultaat
  is een kortere lastijd en een nauwkeuriger geheel.'
- Voor het laswerk werken wij onder ISO 3834-2, de norm die kwaliteitseisen stelt aan smeltlassen. Draagconstructies
  vallen onder EN 1090-1, waarmee wij staal- en aluminiumconstructies CE-conform mogen uitvoeren. In de
  praktijk betekent dat gekwalificeerde lassers, vastgelegde lasmethodebeschrijvingen en herleidbaar materiaal.
- Materiaalkeuze is een afweging tussen belasting, omgeving en kosten. Staal is sterk en voordelig, maar
  heeft een coating nodig. RVS 304 en 316 zijn corrosiebestendig en geschikt voor natte of hygiënische
  omgevingen — daarover leest u meer op onze pagina over <a href="/rvs-constructies/">RVS-constructies</a>.
  Aluminium is licht, maar vraagt om een andere lasaanpak en om aandacht voor de sterkte rond de las.
- 'Wat wij nodig hebben om een constructie te beoordelen: een PDF-tekening en een 3D STEP-bestand van de samenstelling,
  het materiaal en de gewenste kwaliteit, de eisen aan maatvoering, en de gewenste afwerking. Weet u nog
  niet welke oppervlaktebehandeling passend is, dan denken wij mee — die keuze bepaalt namelijk mede hoe
  de constructie gelast en opgehangen moet worden.'
materials:
- RVS 304 / 316
- Aluminium
- Messing
- Staal
