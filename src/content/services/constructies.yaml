intro: "Meer dan 100 jaar specialist in hoogwaardige metaalconstructies. Van losse onderdelen tot volledig gelaste samenstellingen — traditioneel vakmanschap met moderne techniek."
heroPhoto:
  subject: "Gelast frame tijdens kwaliteitscontrole in de constructiehal"
  orient: "Liggend 16:10"
  crop: "Halfrontaal"
  comp: "Frame op bok, lasser op achtergrond"
bodyHeading: "Specialist in constructiewerk"
body:
  - "Assink & Schipholt voert zware en complexe lassamenstellingen uit — van losse onderdelen tot volledig gelaste samenstellingen. Wij werken voor machinebouw, apparatenbouw en infratechniek en verwerken onderdelen tot 10 ton."
  - "In de hal hangen vijf bovenloopkranen van 5 ton. Door in tandem te hijsen — met twee kranen aan één last — verplaatsen we samenstellingen tot 10 ton, tot 8 meter hoogte."
  - "Wij verzorgen niet alleen las- en constructiewerk, maar ook oppervlaktebehandelingen zoals stralen, poedercoaten, anodiseren en RVS-passiveren — veel in eigen beheer. Zo heeft u één aanspreekpunt van engineering tot afwerking."
