# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Welded constructions
  kicker: Capability 4.1
  h1: Constructive in constructions
  intro: More than 100 years as a specialist in high-quality metal constructions. From individual parts
    to fully welded assemblies — traditional craftsmanship with modern technology.
  heroPhoto:
    subject: Welded frame during quality inspection in the structural workshop
  bodyHeading: Specialist in structural work
  body:
  - Assink & Schipholt carries out heavy and complex welded assemblies — from individual parts to fully
    welded assemblies. We work for machine building, equipment manufacturing and infrastructure engineering,
    and handle parts up to 10 tonnes.
  - The hall has five 5-tonne overhead cranes. By lifting in tandem — two cranes on a single load — we move
    assemblies of up to 10 tonnes, to a height of 8 metres.
  - We take care of not only welding and structural work but also surface treatments such as shot blasting,
    powder coating, anodising and stainless steel passivation — much of it in house. That gives you a single
    point of contact from engineering to finishing.
  - 'A welded construction is more than the sum of its parts. The biggest risks lie in distortion caused
    by heat input and in dimensional deviations that accumulate through an assembly. That is why we determine
    the welding sequence during production engineering and not on the shop floor: welding symmetrically
    where possible, in stages where necessary, and with fixturing on the dimensions that really matter.'
  - 'We cut sheet on the fibre laser and tube and profile on the Trumpf TruLaser Tube 3000. The latter saves
    a great deal of manual work in a construction: cut-outs, mitres and mating shapes come straight off
    the machine, so parts fit together instead of having to be made to fit. The result is a shorter welding
    time and a more accurate whole.'
  - For welding we work under ISO 3834-2, the standard that sets quality requirements for fusion welding.
    Load-bearing structures fall under EN 1090-1, which allows us to produce steel and aluminium structures
    in conformity with CE marking. In practice that means qualified welders, documented welding procedure
    specifications and traceable material.
  - Material choice is a trade-off between load, environment and cost. Steel is strong and economical, but
    needs a coating. Stainless steel 304 and 316 are corrosion-resistant and suited to wet or hygienic environments
    — you can read more on our page about <a href="/en/rvs-constructies/">stainless steel constructions</a>.
    Aluminium is light, but calls for a different welding approach and for attention to the strength around
    the weld.
  - 'What we need in order to assess a construction: a PDF drawing and a 3D STEP file of the assembly, the
    material and required grade, the dimensional requirements, and the desired finishing. If you do not
    yet know which surface treatment is appropriate, we will think along — that choice partly determines
    how the construction has to be welded and lifted.'
  materials:
  - Stainless steel 304 / 316
  - Aluminium
  - Brass
  - Steel
  process:
  - step: Engineering & production engineering
    desc: Assessment of the drawing, welding sequence and manufacturability.
  - step: Cutting & preparation
    desc: Laser cutting of sheet and tube, bending and fitting.
  - step: Welding & assembly
    desc: Manual and laser welding through to the complete assembly.
  - step: Surface treatment
    desc: Shot blasting, powder coating, anodising or passivation.
  - step: Inspection & delivery
    desc: Dimensional inspection and visual inspection, followed by just-in-time delivery.
  specs:
  - label: Max. weight per piece
    value: up to 10 tonnes
  - label: Max. height of construction
    value: 8 m
  - label: Lifting equipment
    value: 5 overhead cranes of 5 tonnes; tandem lifting up to 10 tonnes
  applications:
  - Machine building (frames, guards)
  - Equipment manufacturing
  - Infrastructure engineering
  - Food industry
  - Electrical engineering
  - Mechatronics
  faq:
  - vraag: How heavy and how tall may a construction be?
    antwoord: We handle parts up to 10 tonnes unit weight and constructions up to 8 metres in height. Five
      overhead cranes of 5 tonnes are installed in the hall; by lifting in tandem — two cranes on one load
      — we move assemblies of up to 10 tonnes.
  - vraag: Do you work in accordance with EN 1090?
    antwoord: Yes. We are certified to EN 1090-1, the standard for the execution of steel and aluminium
      structures with CE marking. For the welding itself we work under ISO 3834-2, and our quality system
      is certified to ISO 9001.
  - vraag: Do you also take care of the surface treatment?
    antwoord: Yes. Blasting, powder coating, anodising and the passivation of stainless steel are part of
      the process, much of it in house. That gives you a single point of contact from production engineering
      through to the finished construction, without having to move the work between suppliers yourself.
  - vraag: In which materials do you weld constructions?
    antwoord: Steel, stainless steel 304 and 316, aluminium and brass. Which material suits best depends
      on the load, the environment and the required finish; stainless steel is the obvious choice for wet
      or hygienic environments, aluminium for weight-sensitive structures.
  - vraag: Can you work from a sketch as well?
    antwoord: Yes. We then first assess manufacturability and record the starting points — material, profile
      selection, welding sequence and dimensions — before production begins. That avoids changes after the
      fact, which are expensive in a welded construction.
  related:
  - label: Stainless steel constructions
    desc: Corrosion-resistant constructions in stainless steel.
  - label: Machine building
    desc: Complete machines and assemblies.
  - label: Robotic welding
    desc: Automated welding for series production.
  seo:
    title: Welded constructions up to 10 tonnes
    description: Heavy and complex welded metal constructions up to 10 tonnes in stainless steel, aluminium
      and steel for machine building, equipment manufacturing and infrastructure engineering.

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Konstruktionen
  kicker: Möglichkeit 4.1
  h1: Konstruktiv in Konstruktionen
  intro: Seit über 100 Jahren Spezialist für hochwertige Metallkonstruktionen. Von einzelnen Bauteilen bis
    zu vollständig geschweißten Baugruppen — traditionelle Handwerkskunst mit moderner Technik.
  heroPhoto:
    subject: Geschweißter Rahmen bei der Qualitätskontrolle in der Konstruktionshalle
  bodyHeading: Spezialist für Konstruktionsarbeit
  body:
  - Assink & Schipholt fertigt schwere und komplexe Schweißbaugruppen — von einzelnen Bauteilen bis zu vollständig
    geschweißten Baugruppen. Wir arbeiten für Maschinenbau, Apparatebau und Infrastrukturtechnik und verarbeiten
    Bauteile bis 10 Tonnen.
  - In der Halle hängen fünf Hallenkrane von je 5 Tonnen. Durch Tandemhub — zwei Krane an einer Last — bewegen
    wir Baugruppen bis 10 Tonnen, bis 8 Meter Höhe.
  - Wir übernehmen nicht nur Schweiß- und Konstruktionsarbeiten, sondern auch Oberflächenbehandlungen wie
    Strahlen, Pulverbeschichten, Eloxieren und Edelstahl-Passivieren — vieles davon im eigenen Haus. So
    haben Sie einen Ansprechpartner von der Konstruktion bis zur Endbearbeitung.
  - 'Eine Konstruktion ist mehr als die Summe ihrer Teile. Die größten Risiken liegen im Verzug durch Wärmeeinbringung
    und in Maßabweichungen, die sich über eine Baugruppe hinweg aufsummieren. Deshalb legen wir die Schweißfolge
    in der Arbeitsvorbereitung fest und nicht in der Werkstatt: symmetrisch schweißen, wo es geht, in Schritten,
    wo es nötig ist, und mit Aufspannung auf den Maßen, auf die es wirklich ankommt.'
  - 'Blech schneiden wir auf dem Faserlaser, Rohre und Profile auf der Trumpf TruLaser Tube 3000. Letzteres
    spart in einer Konstruktion viel Handarbeit: Aussparungen, Gehrungen und Passformen kommen direkt aus
    der Maschine, sodass die Teile ineinandergreifen, statt passend gemacht werden zu müssen. Das Ergebnis
    sind kürzere Schweißzeiten und ein genaueres Ganzes.'
  - Beim Schweißen arbeiten wir nach ISO 3834-2, der Norm für Qualitätsanforderungen an das Schmelzschweißen.
    Tragende Konstruktionen fallen unter EN 1090-1, wodurch wir Stahl- und Aluminiumkonstruktionen CE-konform
    ausführen dürfen. In der Praxis bedeutet das qualifizierte Schweißer, dokumentierte Schweißanweisungen
    und rückverfolgbares Material.
  - Die Werkstoffwahl ist eine Abwägung zwischen Belastung, Umgebung und Kosten. Stahl ist fest und günstig,
    benötigt aber eine Beschichtung. Edelstahl 304 und 316 sind korrosionsbeständig und für feuchte oder
    hygienische Umgebungen geeignet — mehr dazu auf unserer Seite über <a href="/de/rvs-constructies/">Edelstahlkonstruktionen</a>.
    Aluminium ist leicht, verlangt aber eine andere Schweißstrategie und Aufmerksamkeit für die Festigkeit
    rund um die Naht.
  - 'Was wir für die Beurteilung einer Konstruktion benötigen: eine PDF-Zeichnung und eine 3D-STEP-Datei
    der Baugruppe, den Werkstoff und die gewünschte Güte, die Anforderungen an die Maßhaltigkeit sowie die
    gewünschte Oberfläche. Wissen Sie noch nicht, welche Oberflächenbehandlung passt, denken wir mit — diese
    Wahl bestimmt nämlich mit, wie die Konstruktion geschweißt und angeschlagen werden muss.'
  materials:
  - Edelstahl 304 / 316
  - Aluminium
  - Messing
  - Stahl
  process:
  - step: Engineering & Arbeitsvorbereitung
    desc: Prüfung von Zeichnung, Schweißfolge und Herstellbarkeit.
  - step: Schneiden & Vorbereiten
    desc: Laserschneiden von Blech und Rohr, Kanten und Anpassen.
  - step: Schweißen & Zusammenbau
    desc: Hand- und Laserschweißen bis zur vollständigen Baugruppe.
  - step: Oberflächenbehandlung
    desc: Strahlen, Pulverbeschichten, Eloxieren oder Passivieren.
  - step: Prüfung & Lieferung
    desc: Maßkontrolle und visuelle Prüfung, danach Just-in-time-Lieferung.
  specs:
  - label: Max. Gewicht pro Stück
    value: bis 10 Tonnen
  - label: Max. Höhe der Konstruktion
    value: 8 m
  - label: Hebezeuge
    value: 5 Hallenkrane von je 5 Tonnen; Tandemhub bis 10 Tonnen
  applications:
  - Maschinenbau (Rahmen, Schutzhauben)
  - Apparatebau
  - Infrastrukturtechnik
  - Lebensmittelindustrie
  - Elektrotechnik
  - Mechatronik
  faq:
  - vraag: Wie schwer und wie hoch darf eine Konstruktion sein?
    antwoord: Wir verarbeiten Bauteile bis 10 Tonnen Stückgewicht und Konstruktionen bis 8 Meter Höhe. In
      der Halle hängen fünf Hallenkrane mit je 5 Tonnen; im Tandemhub — zwei Krane an einer Last — bewegen
      wir Baugruppen bis 10 Tonnen.
  - vraag: Arbeiten Sie nach EN 1090?
    antwoord: Ja. Wir sind nach EN 1090-1 zertifiziert, der Norm für die Ausführung von Stahl- und Aluminiumkonstruktionen
      mit CE-Kennzeichnung. Für das Schweißen selbst arbeiten wir nach ISO 3834-2, unser Qualitätssystem
      ist nach ISO 9001 zertifiziert.
  - vraag: Übernehmen Sie auch die Oberflächenbehandlung?
    antwoord: Ja. Strahlen, Pulverbeschichten, Eloxieren und das Passivieren von Edelstahl gehören zum Ablauf,
      vieles davon in eigener Regie. So haben Sie einen Ansprechpartner von der Arbeitsvorbereitung bis
      zur fertigen Konstruktion und müssen die Teile nicht selbst zwischen Betrieben hin- und herbewegen.
  - vraag: In welchen Werkstoffen schweißen Sie Konstruktionen?
    antwoord: Stahl, Edelstahl 304 und 316, Aluminium und Messing. Welcher Werkstoff am besten passt, hängt
      von Belastung, Umgebung und gewünschter Oberfläche ab; für feuchte oder hygienische Umgebungen liegt
      Edelstahl nahe, für gewichtskritische Konstruktionen Aluminium.
  - vraag: Können Sie auch anhand einer Skizze arbeiten?
    antwoord: Ja. Wir beurteilen dann zunächst die Fertigbarkeit und halten die Ausgangspunkte — Werkstoff,
      Profilwahl, Schweißfolge und Maßhaltigkeit — fest, bevor die Produktion beginnt. Das vermeidet nachträgliche
      Änderungen, die bei einer geschweißten Konstruktion teuer sind.
  related:
  - label: Edelstahlkonstruktionen
    desc: Korrosionsbeständige Konstruktionen aus Edelstahl.
  - label: Maschinenbau
    desc: Komplette Maschinen und Baugruppen.
  - label: Roboterschweißen
    desc: Automatisiertes Schweißen für Serien.
  seo:
    title: Geschweißte Baugruppen bis 10 Tonnen
    description: Schwere und komplexe geschweißte Metallkonstruktionen bis 10 Tonnen in Edelstahl, Aluminium
      und Stahl für Maschinenbau, Apparatebau und Infrastrukturtechnik.
