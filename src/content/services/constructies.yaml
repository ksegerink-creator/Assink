faq:
- vraag: Hoe zwaar en hoe hoog mag een constructie zijn?
  antwoord: Wij verwerken onderdelen tot 10 ton stukgewicht en constructies tot 8 meter hoogte. In de
    hal hangen vijf bovenloopkranen van 5 ton; door in tandem te hijsen — twee kranen aan één last — verplaatsen
    wij samenstellingen tot 10 ton.
- vraag: Werken jullie volgens EN 1090?
  antwoord: Ja. Wij zijn gecertificeerd voor EN 1090-1, de norm voor de uitvoering van staal- en aluminiumconstructies
    met CE-markering. Voor het laswerk zelf werken wij onder ISO 3834-2 en ons kwaliteitssysteem is ISO
    9001-gecertificeerd.
- vraag: Verzorgen jullie ook de oppervlaktebehandeling?
  antwoord: Ja. Stralen, poedercoaten, anodiseren en het passiveren van RVS horen bij het traject, veel
    daarvan in eigen beheer. Zo heeft u één aanspreekpunt van werkvoorbereiding tot afgewerkte constructie
    en hoeft u het werk niet zelf tussen partijen te verplaatsen.
- vraag: In welke materialen lassen jullie constructies?
  antwoord: Staal, RVS 304 en 316, aluminium en messing. Welk materiaal het beste past hangt af van de
    belasting, de omgeving en de gewenste afwerking; voor natte of hygiënische omgevingen ligt RVS voor
    de hand, voor gewichtsgevoelige constructies aluminium.
- vraag: Kunnen jullie ook op basis van een schets werken?
  antwoord: Ja. Wij beoordelen dan eerst de maakbaarheid en leggen de uitgangspunten — materiaal, profielkeuze,
    lasvolgorde en maatvoering — vast voordat de productie begint. Dat voorkomt aanpassingen achteraf,
    die in een gelaste constructie duur zijn.
