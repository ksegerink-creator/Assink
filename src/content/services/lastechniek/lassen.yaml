translated:
  - nl
faq:
  - vraag: Welke lasmethoden hebben jullie in huis?
    antwoord: Wij lassen met TIG, MIG en MAG en beschikken over laserlassen. TIG geeft de meeste controle over de
      warmte-inbreng en past bij dun materiaal en zichtwerk. MIG en MAG zijn sneller bij dikker materiaal en
      grotere series — MIG met inert gas voor RVS en aluminium, MAG met actief gas voor staal. Robotlassen
      doen wij niet in Hengelo — dat gebeurt binnen de groep bij Baas Metaal.
  - vraag: Zijn jullie gecertificeerd voor laswerk?
    antwoord: Wij werken voor lassen onder ISO 3834-2 en zijn gecertificeerd volgens EN 1090-1. Daarnaast is ons
      kwaliteitssysteem gecertificeerd volgens ISO 9001. Wat dat per opdracht betekent voor vastlegging en
      controle, leest u op onze kwaliteitspagina.
  - vraag: Hoe voorkomen jullie vervorming bij het lassen?
    antwoord: Door de warmte-inbreng te doseren, delen op te spannen en de lasvolgorde vooraf te bepalen. Na het
      lassen controleren wij de maten, zodat een afwijking niet pas bij de montage aan het licht komt.
      Achteraf rechttrekken kost altijd meer tijd dan vooraf plannen.
  - vraag: Welke materialen lassen jullie?
    antwoord: 'Staal, RVS in de kwaliteiten 304 en 316, en aluminium. De lasmethode en de nabehandeling stemmen
      wij af op het materiaal: bij RVS verwijderen wij aanloopkleuren en passiveren wij, aluminium en staal
      worden ontbraamd en waar nodig gestraald.'

# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Welding
  h1: Welding
  intro: From manual TIG, MIG and MAG welding to automated and laser welding. We choose the welding method that
    suits the material, the batch size and the quality requirement.
  heroPhoto:
    subject: Welder at work on a stainless steel assembly
  body:
    - Which welding process we choose depends on material, sheet thickness and the requirement for the seam.
      The table below sets out the four; we make the call per order.
    - Distortion is the greatest risk to dimensional accuracy when welding. We limit it by metering the heat
      input, clamping parts and determining the welding sequence in advance. After welding we check the
      dimensions, so that a deviation does not first come to light during assembly.
    - Finishing differs per material. On stainless steel we remove heat tint and passivate, so that corrosion
      resistance around the seam is retained — we explain <a
      href="/kennisbank/waarom-rvs-passiveren-na-het-lassen/">why that is necessary</a> separately (in Dutch).
      Aluminium and steel are deburred and, where required, blasted in our blast cabin.
  materials:
    - Stainless steel
    - Aluminium
    - Steel
  process:
    - step: Preparation
      desc: Fitting up and fixturing.
    - step: Welding
      desc: TIG, MIG/MAG or laser.
    - step: Finishing
      desc: Grinding, pickling and passivating where required.
    - step: Inspection
      desc: Visual inspection of the weld seams.
  applications:
    - Welded constructions
    - Enclosures
    - Machine parts
  related:
    - label: Laser welding
      desc: Low-distortion seams.
    - label: Robot welding
      desc: Consistent quality in series.
    - label: Aluminium welding
      desc: TIG/MIG in aluminium.
  seo:
    title: Welding — manual and laser welding
    description: 'Manual and laser welding in stainless steel, aluminium and steel: from one-offs to series, with
      consistent weld seam quality.'
  faq:
    - vraag: Which welding methods do you have in house?
      antwoord: We weld with TIG, MIG and MAG and have laser welding available. TIG gives the most control over heat
        input and suits thin material and visible work; MIG and MAG are faster for thicker material and larger
        series. We do not carry out robot welding in Hengelo — that takes place within the group at Baas
        Metaal.
    - vraag: Are you certified for welding work?
      antwoord: For welding we work under ISO 3834-2 and we are certified to EN 1090-1. In addition, our quality
        system is certified to ISO 9001. What that means per order for documentation and inspection is set out
        on our quality page.
    - vraag: How do you prevent distortion when welding?
      antwoord: By metering the heat input, clamping parts and determining the welding sequence in advance. After
        welding we check the dimensions, so that a deviation does not first come to light during assembly.
        Straightening afterwards always costs more time than planning up front.
    - vraag: Which materials do you weld?
      antwoord: 'Steel, stainless steel in grades 304 and 316, and aluminium. We match the welding method and the
        finishing to the material: on stainless steel we remove heat tint and passivate, while aluminium and
        steel are deburred and, where required, blasted.'
  specs:
    - label: TIG
      value: controlled heat input and a clean seam — thin material and visible work in stainless steel and
        aluminium
    - label: MIG
      value: inert gas, faster — stainless steel and aluminium, thicker material and larger series
    - label: MAG
      value: active gas, faster — steel, thicker material and larger series
    - label: Laser welding
      value: narrow seam with little distortion
    - label: Standards
      value: welding under ISO 3834-2, certified to EN 1090-1
    - label: Finishing, stainless steel
      value: remove heat tint and passivate
    - label: Finishing, aluminium and steel
      value: deburring and, where required, blasting
    - label: Robot welding
      value: not in house; within the group at Baas Metaal
  aanleveren:
    - The drawing with the required joint shape
    - Material and sheet thickness
    - Which dimensions are critical
    - Whether there are appearance requirements for the seam
    - Whether documentation is part of the delivery
    - The earlier those requirements are known, the better we can set up the welding sequence and finishing —
      straightening afterwards always costs more time

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Schweißen
  h1: Schweißen
  intro: Vom manuellen WIG-, MIG- und MAG-Schweißen bis zum automatisierten Schweißen und Laserschweißen. Wir
    wählen das Schweißverfahren, das zu Material, Serie und Qualitätsanforderung passt.
  heroPhoto:
    subject: Schweißer bei der Arbeit an einer Edelstahl-Baugruppe
  body:
    - Welches Schweißverfahren wir wählen, hängt von Werkstoff, Blechdicke und der Anforderung an die Naht ab.
      Die Tabelle unten stellt die vier gegenüber; die Abwägung treffen wir je Auftrag.
    - Verzug ist beim Schweißen das größte Risiko für die Maßhaltigkeit. Wir begrenzen ihn, indem wir die
      Wärmeeinbringung dosieren, Teile aufspannen und die Schweißfolge vorab festlegen. Nach dem Schweißen
      prüfen wir die Maße, damit eine Abweichung nicht erst bei der Montage auffällt.
    - Die Nachbehandlung unterscheidet sich je nach Werkstoff. Bei Edelstahl entfernen wir Anlauffarben und
      passivieren, damit die Korrosionsbeständigkeit rund um die Naht erhalten bleibt — <a
      href="/kennisbank/waarom-rvs-passiveren-na-het-lassen/">warum das nötig ist</a>, erläutern wir gesondert
      (niederländisch). Aluminium und Stahl werden entgratet und bei Bedarf in unserer Strahlkabine gestrahlt.
  materials:
    - Edelstahl
    - Aluminium
    - Stahl
  process:
    - step: Vorbereitung
      desc: Anpassen und Aufspannen.
    - step: Schweißen
      desc: WIG, MIG/MAG oder Laser.
    - step: Nachbearbeitung
      desc: Schleifen, Beizen und Passivieren, wo erforderlich.
    - step: Kontrolle
      desc: Visuelle Prüfung der Schweißnähte.
  applications:
    - Konstruktionen
    - Gehäuse
    - Maschinenteile
  related:
    - label: Laserschweißen
      desc: Verzugsarme Nähte.
    - label: Roboterschweißen
      desc: Gleichbleibende Serienqualität.
    - label: Aluminium schweißen
      desc: WIG/MIG in Aluminium.
  seo:
    title: Schweißen — Hand- und Laserschweißen
    description: 'Hand- und Laserschweißen in Edelstahl, Aluminium und Stahl: von Einzelstücken bis zu Serien, mit
      gleichbleibender Schweißnahtqualität.'
  faq:
    - vraag: Welche Schweißverfahren haben Sie im Haus?
      antwoord: Wir schweißen mit WIG, MIG und MAG und verfügen über das Laserschweißen. WIG bietet die größte
        Kontrolle über die Wärmeeinbringung und eignet sich für dünnes Material und Sichtflächen; MIG ist
        schneller bei dickerem Material und größeren Serien. Roboterschweißen führen wir nicht in Hengelo aus
        — das geschieht innerhalb der Gruppe bei Baas Metaal.
    - vraag: Sind Sie für Schweißarbeiten zertifiziert?
      antwoord: Für das Schweißen arbeiten wir nach ISO 3834-2 und sind nach EN 1090-1 zertifiziert. Darüber hinaus
        ist unser Qualitätssystem nach ISO 9001 zertifiziert. Was das pro Auftrag für Dokumentation und
        Prüfung bedeutet, lesen Sie auf unserer Qualitätsseite.
    - vraag: Wie vermeiden Sie Verzug beim Schweißen?
      antwoord: Indem wir die Wärmeeinbringung dosieren, Teile aufspannen und die Schweißfolge vorab festlegen. Nach
        dem Schweißen prüfen wir die Maße, damit eine Abweichung nicht erst bei der Montage auffällt.
        Nachträgliches Richten kostet immer mehr Zeit als vorausschauende Planung.
    - vraag: Welche Werkstoffe schweißen Sie?
      antwoord: 'Stahl, Edelstahl in den Güten 304 und 316 sowie Aluminium. Schweißverfahren und Nachbehandlung
        stimmen wir auf den Werkstoff ab: Bei Edelstahl entfernen wir Anlauffarben und passivieren, Aluminium
        und Stahl werden entgratet und bei Bedarf gestrahlt.'
  specs:
    - label: WIG
      value: kontrollierte Wärmeeinbringung und saubere Naht — dünnes Material und Sichtflächen in Edelstahl und
        Aluminium
    - label: MIG
      value: inertes Gas, schneller — Edelstahl und Aluminium, dickeres Material und größere Serien
    - label: MAG
      value: aktives Gas, schneller — Stahl, dickeres Material und größere Serien
    - label: Laserschweißen
      value: schmale Naht mit wenig Verzug
    - label: Normen
      value: Schweißen nach ISO 3834-2, zertifiziert nach EN 1090-1
    - label: Nachbehandlung Edelstahl
      value: Anlauffarben entfernen und passivieren
    - label: Nachbehandlung Aluminium und Stahl
      value: Entgraten und bei Bedarf Strahlen
    - label: Roboterschweißen
      value: nicht im eigenen Haus; innerhalb der Gruppe bei Baas Metaal
  aanleveren:
    - Die Zeichnung mit der gewünschten Nahtform
    - Werkstoff und Blechdicke
    - Welche Maße kritisch sind
    - Ob es Sichtanforderungen an die Naht gibt
    - Ob Dokumentation zur Lieferung gehört
    - Je früher diese Anforderungen bekannt sind, desto besser stimmen wir Schweißfolge und Nachbehandlung
      darauf ab — nachträgliches Richten kostet immer mehr Zeit
