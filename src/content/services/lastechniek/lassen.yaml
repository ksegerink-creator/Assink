  seo:
    title: Welding — manual and laser welding
    description: 'Manual and laser welding in stainless steel, aluminium and steel: from one-offs to series,
      with consistent weld seam quality.'
  faq:
  - vraag: Which welding methods do you have in house?
    antwoord: We weld with TIG, MIG and MAG and have laser welding available. TIG gives the most control
      over heat input and suits thin material and visible work; MIG and MAG are faster for thicker material
      and larger series. We do not carry out robot welding in Hengelo — that takes place within the group
      at Baas Metaal.
  - vraag: Are you certified for welding work?
    antwoord: For welding we work under ISO 3834-2 and we are certified to EN 1090-1. In addition, our quality
      system is certified to ISO 9001. What that means per order for documentation and inspection is set
      out on our quality page.
  - vraag: How do you prevent distortion when welding?
    antwoord: By metering the heat input, clamping parts and determining the welding sequence in advance.
      After welding we check the dimensions, so that a deviation does not first come to light during assembly.
      Straightening afterwards always costs more time than planning up front.
  - vraag: Which materials do you weld?
    antwoord: 'Steel, stainless steel in grades 304 and 316, and aluminium. We match the welding method
      and the finishing to the material: on stainless steel we remove heat tint and passivate, while aluminium
      and steel are deburred and, where required, blasted.'

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Schweißen
  h1: Schweißen
  intro: Vom manuellen WIG-, MIG- und MAG-Schweißen bis zum automatisierten Schweißen und Laserschweißen.
    Wir wählen das Schweißverfahren, das zu Material, Serie und Qualitätsanforderung passt.
  heroPhoto:
    subject: Schweißer bei der Arbeit an einer Edelstahl-Baugruppe
  body:
  - Schweißen ist Kernhandwerk bei Assink & Schipholt. Je nach Anwendung setzen wir Hand- oder Laserschweißen
    ein — immer mit Augenmerk auf Einbrand, Verzug und Nahtqualität. Automatisiertes Schweißen für größere
    Serien geben wir an einen festen Partner; in Hengelo schweißen wir von Hand und mit dem Laser.
  - Welches Schweißverfahren wir wählen, hängt vom Werkstoff, der Blechdicke und den Anforderungen an die
    Naht ab. WIG-Schweißen bietet eine kontrollierte Wärmeeinbringung und eine saubere Naht und eignet sich
    damit für dünnes Material und Sichtflächen in Edelstahl und Aluminium. MIG- und MAG-Schweißen sind schneller
    — MIG mit inertem Gas für Edelstahl und Aluminium, MAG mit aktivem Gas für Stahl — und passt zu dickerem
    Material und größeren Serien. <a href="/de/plaatwerk/laserlassen/">Laserschweißen</a> liefert eine schmale
    Naht mit geringem Verzug.
  - Verzug ist beim Schweißen das größte Risiko für die Maßhaltigkeit. Wir begrenzen ihn, indem wir die
    Wärmeeinbringung dosieren, Teile aufspannen und die Schweißfolge vorab festlegen. Nach dem Schweißen
    prüfen wir die Maße, damit eine Abweichung nicht erst bei der Montage auffällt.
  - Die Nachbehandlung unterscheidet sich je nach Werkstoff. Bei Edelstahl entfernen wir Anlauffarben und
    passivieren, damit die Korrosionsbeständigkeit rund um die Naht erhalten bleibt — <a href="/kennisbank/waarom-rvs-passiveren-na-het-lassen/">warum
    das nötig ist</a>, erläutern wir gesondert (niederländisch). Aluminium und Stahl werden entgratet und
    bei Bedarf in unserer Strahlkabine gestrahlt.
  - Für das Schweißen arbeiten wir nach ISO 3834-2 und sind nach EN 1090-1 zertifiziert. Was das für Dokumentation
    und Prüfung pro Auftrag bedeutet, steht auf unserer <a href="/de/kwaliteit/">Qualitätsseite</a>. Roboterschweißen
    führen wir nicht im eigenen Haus aus; das geschieht innerhalb der Gruppe bei Baas Metaal.
  - 'Was wir bei einer Schweißanfrage gerne mitbekommen: die Zeichnung mit der gewünschten Nahtform, den
    Werkstoff und die Blechdicke, welche Maße kritisch sind, ob es Sichtanforderungen an die Naht gibt und
    ob Dokumentation zur Lieferung gehört. Je früher diese Anforderungen bekannt sind, desto besser können
    wir Schweißfolge und Nachbehandlung darauf abstimmen — nachträgliches Richten kostet immer mehr Zeit
    als vorausschauende Planung.'
