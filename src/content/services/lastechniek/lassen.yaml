title: Lassen
slug: plaatwerk/lassen
template: service
group: lastechniek
order: 41
h1: Lassen
intro: Van handmatig TIG-, MIG- en MAG-lassen tot laserlassen. Wij kiezen de lasmethode die past bij
  materiaal, serie en kwaliteitseis.
fotobank: "tig-lassen"
heroPhoto:
  subject: Lasser aan het werk aan RVS-samenstelling
  orient: Liggend 16:10
  crop: Persoon centraal
  comp: Lasvlam, vonken, beschermkleding
body:
  - Welke lasmethode we kiezen, hangt af van materiaal, plaatdikte en de eis aan de naad. De tabel hieronder
    zet de vier op een rij; de afweging maken wij per opdracht.
  - Vervorming is bij lassen het grootste risico voor de maatvoering. Wij beperken die door de warmte-inbreng
    te doseren, delen op te spannen en de lasvolgorde vooraf te bepalen. Na het lassen controleren we de
    maten, zodat een afwijking niet pas bij de montage aan het licht komt.
  - De nabehandeling verschilt per materiaal. Bij RVS verwijderen we aanloopkleuren en passiveren we, zodat de
    corrosiebestendigheid rond de naad behouden blijft — <a
    href="/kennisbank/waarom-rvs-passiveren-na-het-lassen/">waarom dat nodig is</a> leggen we apart uit.
    Aluminium en staal worden ontbraamd en waar nodig gestraald in onze straalcabine.
materials:
  - RVS
  - Aluminium
  - Staal
