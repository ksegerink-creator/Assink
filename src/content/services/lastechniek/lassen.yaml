    desc: Passend maken en opspannen.
  - step: Lassen
    desc: TIG, MIG/MAG of laser.
  - step: Nabewerking
    desc: Slijpen, beitsen en passiveren waar nodig.
  - step: Controle
    desc: Visuele controle van de lasnaden.
