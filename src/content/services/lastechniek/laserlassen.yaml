# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Laser welding
  h1: Perfection in laser welding
  intro: Precision welding for OEMs and industrial customers that need extreme accuracy and short lead times.
    Specialised in laser welding of stainless steel and aluminium.
  heroPhoto:
    subject: Close-up of a laser-welded stainless steel product with a clean seam
  body:
  - Laser welding with minimal heat input results in clean, low-distortion welded joints that are immediately
    suitable for assembly. That is a major advantage particularly on visible surfaces and thin material.
  - Finishing, bending work and integration into complete assemblies take place in house. With our own stock,
    just-in-time delivery, short lines of communication and a single point of contact.
  - In laser welding the heat is introduced into a very narrow zone. The heat-affected zone therefore stays
    small and the workpiece hardly distorts — exactly what you want with thin material and with parts that
    must remain dimensionally stable after welding. With conventional TIG welding the heat input is higher
    and you have to allow more often for straightening and rework.
  - 'The difference is most visible on the outside. A laser seam is narrow and even and needs little to
    no grinding on visible surfaces. That saves more than time: every grinding operation removes material
    and, on ground stainless steel, disturbs the grain direction, which then has to be rebuilt across the
    whole assembly.'
  - 'Laser welding does place higher demands on preparation. Because the beam is small, there is little
    gap bridging: the parts have to fit tightly and be firmly fixtured. We therefore cut the parts on the
    laser and use fixturing where required. For larger gaps or for a seam that has to fill volume, <a href="/en/plaatwerk/lassen/">TIG
    or MIG welding</a> is the better choice; we make that assessment per product.'
  - 'In stainless steel the same rule applies after every welding operation: the heat attacks the protective
    oxide layer around the seam. We remove heat tint and then passivate, so that corrosion resistance returns.
    With laser welding that zone is narrower than with TIG, but it is there — skipping it is not an option,
    certainly not in a wet or hygienic environment.'
  - We laser weld in stainless steel 304 and 316, aluminium and brass, and build the welded parts up into
    complete assemblies. Want to know whether your product lends itself to laser welding? Send the drawing
    with the sheet thickness, the joint geometry and the requirement for the visible side; we will indicate
    which welding method suits best and what that means for finishing.
  materials:
  - Stainless steel 304 / 316
  - Aluminium
  - Brass
  process:
  - step: Preparation
    desc: Fitting up and fixing in place.
  - step: Laser welding
    desc: Concentrated, low-distortion seam.
  - step: Finishing
    desc: Grinding and passivating where required.
  - step: Integration
    desc: Build-up into a complete assembly.
  applications:
  - Food industry
  - Machine building
  - Visible surfaces
  faq:
  - vraag: What is the advantage of laser welding over TIG welding?
    antwoord: The heat input is far lower, so the heat-affected zone stays small and the workpiece hardly
      distorts. The seam is narrow and even and needs little finishing on visible surfaces. TIG remains
      the better choice for larger gaps or when the seam has to fill volume.
  - vraag: Which materials can you laser weld?
    antwoord: Stainless steel 304 and 316, aluminium and brass. Which material and joint geometry are feasible
      depends on the sheet thickness and on how accurately the parts fit together; we assess that on the
      drawing.
  - vraag: Does a laser-welded seam still need finishing?
    antwoord: 'Usually very little: the seam is narrow and even, so grinding is often unnecessary. With
      stainless steel one step always applies — removing heat tint and passivating — because the heat attacks
      the protective oxide layer around the seam.'
  - vraag: How accurately do the parts have to fit for laser welding?
    antwoord: More accurately than for TIG. The laser beam is small and bridges little gap, so the parts
      have to fit tightly and be fixtured. We therefore cut them on the laser and use fixturing where required.
      If a tight fit is not achievable, we advise TIG or MIG.
  - vraag: Do you also offer robot welding?
    antwoord: Not in house. Robot welding is done within our group at Baas Metaal. We handle the coordination
      and the assembly, so that it remains a single order for you. For smaller batches and visible work,
      laser welding with us is often the more logical route.
  related:
  - label: Stainless steel
    desc: Corrosion-resistant visible surfaces.
  - label: Robot welding
    desc: Automated series welding.
  - label: Industrial enclosures
    desc: Enclosures with clean visible surfaces.
  seo:
    title: Laser welding — clean seams
    description: 'Precision welding in stainless steel and aluminium with minimal heat input: clean, low-distortion
      seams, ready for assembly for OEM and industry.'

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Laserschweißen
  h1: Perfektion im Laserschweißen
  intro: Präzisionsschweißarbeit für OEMs und Industriekunden, die höchste Genauigkeit und kurze Durchlaufzeiten
    benötigen. Spezialisiert auf das Laserschweißen von Edelstahl und Aluminium.
  heroPhoto:
    subject: Nahaufnahme eines lasergeschweißten Edelstahlprodukts mit sauberer Naht
  body:
  - Laserschweißen mit minimaler Wärmeeinbringung führt zu sauberen, verzugsarmen Schweißverbindungen, die
    direkt für die Montage geeignet sind. Besonders bei Sichtflächen und dünnem Material ist das ein großer
    Vorteil.
  - Nachbearbeitung, Kantarbeit und Integration in komplette Baugruppen erfolgen im eigenen Haus. Mit eigenem
    Lagerbestand, Just-in-time-Lieferung, kurzen Kommunikationswegen und einem Ansprechpartner.
  - Beim Laserschweißen wird die Wärme in eine sehr schmale Zone eingebracht. Dadurch bleibt die Wärmeeinflusszone
    klein und das Werkstück verzieht sich kaum — genau das, was man bei dünnem Material und bei Teilen braucht,
    die nach dem Schweißen maßhaltig bleiben müssen. Beim konventionellen WIG-Schweißen ist die Wärmeeinbringung
    höher und man muss häufiger mit Richten und Nacharbeit rechnen.
  - 'Der Unterschied zeigt sich vor allem an der Außenseite. Eine Lasernaht ist schmal und gleichmäßig und
    erfordert bei Sichtflächen wenig bis kein Schleifen. Das spart mehr als nur Zeit: jeder Schleifvorgang
    trägt Material ab und stört bei geschliffenem Edelstahl die Kornrichtung, die dann über die gesamte
    Baugruppe neu aufgebaut werden muss.'
  - 'Das Laserschweißen stellt allerdings höhere Anforderungen an die Vorbereitung. Weil der Strahl klein
    ist, wird wenig Spalt überbrückt: die Teile müssen eng passen und fest aufgespannt sein. Deshalb schneiden
    wir die Teile auf dem Laser und setzen bei Bedarf Vorrichtungen ein. Bei größeren Spalten oder bei einer
    Naht, die Volumen füllen muss, ist <a href="/de/plaatwerk/lassen/">WIG- oder MIG-Schweißen</a> die bessere
    Wahl; diese Abwägung treffen wir je Produkt.'
  - 'Bei Edelstahl gilt nach jedem Schweißvorgang dieselbe Regel: die Wärme greift die schützende Oxidschicht
    rund um die Naht an. Wir entfernen Anlauffarben und passivieren anschließend, sodass die Korrosionsbeständigkeit
    zurückkehrt. Beim Laserschweißen ist diese Zone schmaler als beim WIG-Schweißen, aber sie ist vorhanden
    — Auslassen ist keine Option, erst recht nicht in feuchter oder hygienischer Umgebung.'
  - Wir laserschweißen Edelstahl 304 und 316, Aluminium und Messing und bauen die geschweißten Teile zu
    kompletten Baugruppen aus. Möchten Sie wissen, ob sich Ihr Produkt zum Laserschweißen eignet? Senden
    Sie die Zeichnung mit Blechdicke, Nahtform und der Anforderung an die Sichtseite; wir geben an, welches
    Schweißverfahren am besten passt und was das für die Nacharbeit bedeutet.
  materials:
  - Edelstahl 304 / 316
  - Aluminium
  - Messing
  process:
  - step: Vorbereitung
    desc: Anpassen und Fixieren.
  - step: Laserschweißen
    desc: Konzentrierte, verzugsarme Naht.
  - step: Nachbearbeitung
    desc: Wo erforderlich Schleifen und Passivieren.
  - step: Integration
    desc: Aufbau zur kompletten Baugruppe.
  applications:
  - Lebensmittelindustrie
  - Maschinenbau
  - Sichtflächen
  faq:
  - vraag: Was ist der Vorteil des Laserschweißens gegenüber dem WIG-Schweißen?
    antwoord: Die Wärmeeinbringung ist deutlich geringer, sodass die Wärmeeinflusszone klein bleibt und
      sich das Werkstück kaum verzieht. Die Naht ist schmal und gleichmäßig und erfordert bei Sichtflächen
      wenig Nacharbeit. WIG bleibt die bessere Wahl bei größeren Spalten oder wenn die Naht Volumen füllen
      muss.
  - vraag: Welche Werkstoffe können Sie laserschweißen?
    antwoord: Edelstahl 304 und 316, Aluminium und Messing. Welcher Werkstoff und welche Nahtform möglich
      sind, hängt von der Blechdicke und von der Passgenauigkeit der Teile ab; das beurteilen wir anhand
      der Zeichnung.
  - vraag: Muss eine lasergeschweißte Naht noch nachbearbeitet werden?
    antwoord: 'Meist nur wenig: die Naht ist schmal und gleichmäßig, Schleifen ist oft nicht nötig. Bei
      Edelstahl gehört jedoch immer ein Schritt dazu — Anlauffarben entfernen und passivieren — weil die
      Wärme die schützende Oxidschicht rund um die Naht angreift.'
  - vraag: Wie genau müssen die Teile beim Laserschweißen passen?
    antwoord: Genauer als beim WIG-Schweißen. Der Laserstrahl ist klein und überbrückt wenig Spalt, die
      Teile müssen also eng passen und aufgespannt sein. Deshalb schneiden wir sie auf dem Laser und setzen
      bei Bedarf Vorrichtungen ein. Ist eine enge Passung nicht machbar, empfehlen wir WIG oder MIG.
  - vraag: Bieten Sie auch Roboterschweißen an?
    antwoord: Nicht im eigenen Haus. Roboterschweißen erfolgt innerhalb unserer Gruppe bei Baas Metaal.
      Wir übernehmen die Regie und den Zusammenbau, sodass es für Sie ein Auftrag bleibt. Bei kleineren
      Serien und Sichtflächen ist das Laserschweißen bei uns oft der naheliegendere Weg.
  related:
  - label: Edelstahl
    desc: Korrosionsbeständige Sichtflächen.
  - label: Roboterschweißen
    desc: Automatisiertes Serienschweißen.
  - label: Industriegehäuse
    desc: Gehäuse mit sauberen Sichtflächen.
  seo:
    title: Laserschweißen — saubere Nähte
    description: 'Präzisionsschweißarbeit in Edelstahl und Aluminium mit minimaler Wärmeeinbringung: saubere,
      verzugsarme Nähte, montagefertig für OEM und Industrie.'
