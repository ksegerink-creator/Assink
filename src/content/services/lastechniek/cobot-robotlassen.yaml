# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: (Cobot) robot welding
  h1: (Cobot) robot welding — automated welding in series
  intro: For series welding work, consistency is not a luxury but a requirement. For larger series we bring
    in automated welding through a regular partner, while the sheet metal work, assembly and finishing take
    place with us in Hengelo. You keep a single point of contact for the whole series.
  heroPhoto:
    subject: Welded assembly from series production, weld seam in view
  body:
  - Automated welding lays weld seams under preset parameters, with continuous monitoring of current, voltage,
    travel speed and heat input. This gives an even weld bead shape and consistent penetration, ideal for
    repetitive production in steel, stainless steel and aluminium.
  - 'Advantages: less variation, fewer rejects, less finishing work and reliable lead times. Engineering
    forms the basis — fixturing, welding sequence, accessibility and material behaviour determine process
    efficiency. That preparation we do ourselves.'
  - 'Whether automated welding pays off depends less on the number of parts than on the repetition. The
    time goes in up front: building the fixture, programming the path and dialling in the parameters. For
    a batch that comes past once, that preparation weighs heavily; for a product that returns every quarter,
    it earns itself back each time. Give us your annual volume and call-off rhythm and we will work that
    trade-off through.'
  - 'We are explicit about the division of roles. Engineering, production engineering, sheet metal work,
    fixturing, assembly and finishing all happen in Hengelo. The automated welding itself we do not carry
    out in house: that is done within our group at Baas Metaal. We have no welding robot and no cobot in
    Hengelo. For you it remains a single order, a single point of contact and one party responsible for
    the dimensions of the whole.'
  - 'Not every product lends itself to it. A welding robot follows a fixed path, so the seam has to be accessible,
    the parts have to sit identically in the fixture every time, and the preparation has to be tight. That
    is precisely where our preparation comes in: we cut the parts on the laser, so the gap stays small and
    consistent. Large or varying gaps are the main reason automated welding fails to deliver the expected
    result.'
  - For small quantities, prototypes and visible work, manual <a href="/en/plaatwerk/lassen/">TIG or MIG
    welding</a> or <a href="/en/plaatwerk/laserlassen/">laser welding</a> is usually the better route. Laser
    welding introduces little heat and needs little finishing, which counts for more than speed on a tight
    visible seam.
  - 'To assess a request we need: the PDF drawing and the 3D STEP file of the assembly, the material and
    sheet thickness, the weld seams with their requirements, the quantity per batch and the call-off rhythm.
    With that we determine whether automated welding gains you anything in your case, or whether manual
    welding works out cheaper.'
  materials:
  - Steel
  - Stainless steel
  - Aluminium
  process:
  - step: Engineering
    desc: Determining fixturing, welding sequence and accessibility.
  - step: Programming
    desc: Setting parameters and the welding path.
  - step: Automated welding
    desc: Carried out by our partner, with monitoring.
  - step: Inspection
    desc: Seam inspection and dimensional stability.
  applications:
  - Medium to large series
  - Products with recurring weld seams
  - Constructions with strict dimensional stability
  faq:
  - vraag: From what batch size does automated welding become worthwhile?
    antwoord: 'There is no fixed number. What matters is repetition: the time goes into building the fixture
      and programming the path, and that preparation only pays off if the product comes back regularly.
      Tell us your annual volume and call-off rhythm and we will weigh it against manual welding.'
  - vraag: Do you have a welding robot in house?
    antwoord: No. There is no welding robot and no cobot in Hengelo. The automated welding is done within
      our group at Baas Metaal. We handle the engineering, the sheet metal work, the fixturing, the assembly
      and the finishing, and keep control of the whole batch.
  - vraag: In which materials can series welding be done?
    antwoord: Steel, stainless steel and aluminium. Parameters and heat input differ per material; with
      stainless steel, removing heat tint and passivating always follows welding, because otherwise corrosion
      resistance around the seam deteriorates.
  - vraag: What determines whether my product suits robot welding?
    antwoord: Accessibility of the seam, a repeatable fixture and tight preparation. A robot follows a fixed
      path, so the parts have to sit identically every time and the gap has to be small and consistent.
      That is why we cut the parts on the laser.
  - vraag: Who is responsible for quality if the welding is done by a partner?
    antwoord: We are. You have a single order and a single point of contact. We handle incoming inspection,
      dimensional inspection and assembly, and are accountable for the dimensions of the whole. Our quality
      system is certified to ISO 9001 and for welding we work under ISO 3834-2.
  related:
  - label: Welding
    desc: All welding methods.
  - label: Welded constructions
    desc: Welded assemblies.
  - label: Machine park
    desc: Our machine park.
  seo:
    title: (Cobot) robot welding in series
    description: 'Automated robot welding with consistent weld seam quality for medium to large series:
      fewer rejects, reliable lead times.'

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: (Cobot-)Roboterschweißen
  h1: (Cobot-)Roboterschweißen — automatisiertes Schweißen in Serie
  intro: Bei Serienschweißarbeit ist Gleichmäßigkeit kein Luxus, sondern eine Voraussetzung. Für größere
    Serien setzen wir automatisiertes Schweißen über einen festen Partner ein, während Blechbearbeitung,
    Zusammenbau und Nachbearbeitung bei uns in Hengelo erfolgen. Sie behalten einen Ansprechpartner für
    die gesamte Serie.
  heroPhoto:
    subject: Geschweißte Baugruppe aus der Serienproduktion, Schweißnaht im Bild
  body:
  - Beim automatisierten Schweißen werden die Schweißnähte unter voreingestellten Parametern gelegt, mit
    kontinuierlicher Überwachung von Strom, Spannung, Vorschubgeschwindigkeit und Wärmeeinbringung. Das
    ergibt eine gleichmäßige Schweißraupenform und einen konstanten Einbrand — ideal für wiederkehrende
    Produktion in Stahl, Edelstahl und Aluminium.
  - 'Vorteile: weniger Streuung, geringerer Ausschuss, weniger Nachbearbeitung und verlässliche Lieferzeiten.
    Die Arbeitsvorbereitung bildet die Basis — Aufspannung, Schweißfolge, Zugänglichkeit und Materialverhalten
    bestimmen die Prozesseffizienz. Diese Vorbereitung übernehmen wir selbst.'
  - 'Ob sich automatisiertes Schweißen lohnt, hängt weniger von der Stückzahl ab als von der Wiederholung.
    Die Zeit steckt im Vorfeld: Vorrichtung bauen, Bahn programmieren und Parameter einfahren. Bei einer
    Serie, die einmal vorbeikommt, wiegt diese Vorbereitung schwer; bei einem Produkt, das jedes Quartal
    wiederkehrt, rechnet sie sich jedes Mal aufs Neue. Nennen Sie uns Jahresvolumen und Abrufrhythmus, dann
    rechnen wir diese Abwägung durch.'
  - 'Die Rollenverteilung ist bei uns eindeutig. Engineering, Arbeitsvorbereitung, Blechbearbeitung, Aufspannung,
    Zusammenbau und Nacharbeit erfolgen in Hengelo. Das automatisierte Schweißen selbst führen wir nicht
    im eigenen Haus aus: das geschieht innerhalb unserer Gruppe bei Baas Metaal. In Hengelo steht weder
    ein Schweißroboter noch ein Cobot. Für Sie bleibt es ein Auftrag, ein Ansprechpartner und eine Stelle,
    die für die Maßhaltigkeit des Ganzen verantwortlich ist.'
  - 'Nicht jedes Produkt eignet sich dafür. Ein Schweißroboter folgt einer festen Bahn, die Naht muss also
    zugänglich sein, die Teile müssen jedes Mal identisch in der Vorrichtung liegen und die Vorbereitung
    muss eng toleriert sein. Genau dort setzt unsere Vorbereitung an: wir schneiden die Teile auf dem Laser,
    damit der Spalt klein und gleichmäßig bleibt. Große oder wechselnde Spalte sind der häufigste Grund,
    warum automatisiertes Schweißen nicht das erwartete Ergebnis liefert.'
  - Bei kleinen Stückzahlen, Prototypen und Sichtflächen ist manuelles <a href="/de/plaatwerk/lassen/">WIG-
    oder MIG-Schweißen</a> oder <a href="/de/plaatwerk/laserlassen/">Laserschweißen</a> meist der bessere
    Weg. Laserschweißen bringt wenig Wärme ein und erfordert wenig Nacharbeit, was bei einer engen Sichtnaht
    schwerer wiegt als Geschwindigkeit.
  - 'Für eine Beurteilung benötigen wir: die Zeichnung oder das 3D-Modell der Baugruppe, Werkstoff und Blechdicke,
    die Schweißnähte mit ihren Anforderungen, die Stückzahl je Serie und den Abrufrhythmus. Damit bestimmen
    wir, ob automatisiertes Schweißen in Ihrem Fall etwas bringt oder ob Handschweißen günstiger ausfällt.'
  materials:
  - Stahl
  - Edelstahl
  - Aluminium
  process:
  - step: Arbeitsvorbereitung
    desc: Aufspannung, Schweißfolge und Zugänglichkeit festlegen.
  - step: Programmieren
    desc: Parameter und Bahn einstellen.
  - step: Automatisiertes Schweißen
    desc: Bei unserem Partner ausgeführt, mit Überwachung.
  - step: Kontrolle
    desc: Nahtprüfung und Maßhaltigkeit.
  applications:
  - Mittlere bis große Serien
  - Produkte mit wiederkehrenden Schweißnähten
  - Konstruktionen mit strenger Maßhaltigkeit
  faq:
  - vraag: Ab welcher Serie lohnt sich automatisiertes Schweißen?
    antwoord: 'Dafür gibt es keine feste Stückzahl. Entscheidend ist die Wiederholung: die Zeit steckt im
      Bau der Vorrichtung und im Programmieren der Bahn, und diese Vorbereitung rechnet sich erst, wenn
      das Produkt regelmäßig wiederkehrt. Nennen Sie uns Jahresvolumen und Abrufrhythmus, dann wägen wir
      es gegen Handschweißen ab.'
  - vraag: Haben Sie einen eigenen Schweißroboter im Haus?
    antwoord: Nein. In Hengelo steht weder ein Schweißroboter noch ein Cobot. Das automatisierte Schweißen
      erfolgt innerhalb unserer Gruppe bei Baas Metaal. Wir übernehmen Engineering, Blechbearbeitung, Aufspannung,
      Zusammenbau und Nacharbeit und behalten die Regie über die gesamte Serie.
  - vraag: In welchen Werkstoffen kann seriell geschweißt werden?
    antwoord: Stahl, Edelstahl und Aluminium. Parameter und Wärmeeinbringung unterscheiden sich je Werkstoff;
      bei Edelstahl folgt nach dem Schweißen immer das Entfernen von Anlauffarben und das Passivieren, da
      sonst die Korrosionsbeständigkeit rund um die Naht nachlässt.
  - vraag: Was entscheidet, ob sich mein Produkt für das Roboterschweißen eignet?
    antwoord: Die Zugänglichkeit der Naht, eine wiederholbare Aufspannung und eine eng tolerierte Vorbereitung.
      Ein Roboter folgt einer festen Bahn, die Teile müssen also jedes Mal identisch liegen und der Spalt
      muss klein und gleichmäßig sein. Deshalb schneiden wir die Teile auf dem Laser.
  - vraag: Wer haftet für die Qualität, wenn bei einem Partner geschweißt wird?
    antwoord: Wir. Sie haben einen Auftrag und einen Ansprechpartner. Wir übernehmen Eingangskontrolle,
      Maßkontrolle und Zusammenbau und sind für die Maßhaltigkeit des Ganzen verantwortlich. Unser Qualitätssystem
      ist nach ISO 9001 zertifiziert, beim Schweißen arbeiten wir nach ISO 3834-2.
