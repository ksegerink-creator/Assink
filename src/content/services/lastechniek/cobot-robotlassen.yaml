  - label: Schweißen
    desc: Alle Schweißverfahren.
  - label: Konstruktionen
    desc: Geschweißte Baugruppen.
  - label: Maschinenpark
    desc: Unser Maschinenpark.
  seo:
    title: (Cobot-)Roboterschweißen in Serie
    description: 'Automatisiertes Roboterschweißen mit gleichbleibender Schweißnahtqualität für mittlere
      bis große Serien: geringerer Ausschuss, verlässliche Lieferzeiten.'
