title: Aluminium lassen
slug: aluminium-lassen
template: service
group: lastechniek
order: 44
h1: Aluminium lassen
intro: 'Aluminium vraagt om vakmanschap: de juiste warmte-inbreng, voorbewerking en techniek. Wij lassen
  aluminium met TIG en MIG, vervormingsarm en netjes.'
fotobank: "tig-lassen"
heroPhoto:
  subject: Aluminium lasnaad in detail met gelijkmatige rups
  orient: Liggend 16:10
  crop: Macro op naad
  comp: Egale aluminium lasrups
body:
  - "Aluminium gedraagt zich bij het lassen wezenlijk anders dan staal of RVS. Het geleidt warmte veel
    sneller, waardoor er meer warmte nodig is om te smelten en die warmte zich verder door het werkstuk
    verspreidt. Daar komt de oxidehuid bij: die smelt pas bij een veel hogere temperatuur dan het aluminium
    eronder en moet vóór het lassen worden verwijderd."
  - Om vervorming te beperken spannen we delen op, hechten we eerst en bepalen we de lasvolgorde vooraf; na
    het lassen controleren we de maten. Het plaatwerk dat aan zo'n samenstelling voorafgaat — snijden, kanten
    en afwerken — beschrijven we op onze pagina over <a href="/plaatwerk/aluminium/">aluminium plaatwerk</a>.
  - Na het lassen bepaalt de toepassing hoever we gaan met de afwerking. Waar het uiterlijk telt, stralen we
    in onze straalcabine met glasparels, wat een egaal mat oppervlak geeft. Waar de naad functioneel is en uit
    het zicht blijft, volstaat ontbramen en visueel controleren.
materials:
  - Aluminium (diverse legeringen)
process:
  - step: Voorbereiding
    desc: Reinigen en oxidelaag verwijderen.
  - step: Lassen
    desc: TIG/MIG met beheerste warmte-inbreng.
  - step: Nabewerking
    desc: Slijpen en afwerken.
applications:
