seo:
  title: Aluminium lassen met TIG en MIG
  description: Specialistisch TIG- en MIG-laswerk in aluminium voor machinebouw, behuizingen en lichtgewicht constructies.
translated:
  - nl
faq:
  - vraag: Met welke techniek lassen jullie aluminium?
    antwoord: Met TIG en MIG. TIG geeft de meeste controle over de warmte-inbreng en past bij dun materiaal en
      zichtnaden; MIG is sneller en past bij dikker materiaal en grotere series. De keuze maken wij per
      opdracht.
  - vraag: Waarom is aluminium lassen lastiger dan staal?
    antwoord: Aluminium geleidt warmte veel sneller, waardoor er meer warmte nodig is en die zich verder door het
      werkstuk verspreidt. Daarnaast smelt de oxidehuid pas bij een veel hogere temperatuur dan het aluminium
      eronder; die moet vóór het lassen worden verwijderd.
  - vraag: Hoe beperken jullie vervorming bij aluminium?
    antwoord: Door delen op te spannen, eerst te hechten en de lasvolgorde vooraf te bepalen. Na het lassen
      controleren wij de maten. Bij dunne plaat en lange naden is die volgorde bepalend voor de maatvastheid
      van het eindproduct.
  - vraag: Wat gebeurt er met de naad na het lassen?
    antwoord: Dat hangt af van de toepassing. Waar het uiterlijk telt, stralen wij met glasparels voor een egaal
      mat oppervlak. Blijft de naad uit het zicht, dan volstaan ontbramen en een visuele controle. Geef bij uw
      aanvraag door welke zijde de zichtzijde is.

# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Aluminium welding
  h1: Aluminium welding
  intro: 'Aluminium calls for craftsmanship: the right heat input, preparation and technique. We weld aluminium
    with TIG and MIG, low-distortion and cleanly finished.'
  heroPhoto:
    subject: Aluminium weld seam in detail with an even bead
  body:
    - "Aluminium behaves fundamentally differently from steel or stainless steel when welded. It conducts heat
      far more quickly, so more heat is needed to melt it and that heat spreads further through the workpiece.
      On top of that comes the oxide layer: it only melts at a far higher temperature than the aluminium
      beneath it and has to be removed before welding."
    - To limit distortion we clamp parts, tack first and determine the welding sequence in advance; after
      welding we check the dimensions. The sheet metal work preceding such an assembly — cutting, press
      braking and finishing — is described on our page about <a href="/en/plaatwerk/aluminium/">aluminium
      sheet metal</a>.
    - After welding, the application determines how far we take the finishing. Where appearance matters, we
      blast with glass beads in our blast cabin, which gives an even matt surface. Where the seam is
      functional and stays out of sight, deburring and visual inspection are sufficient.
  materials:
    - Aluminium (various alloys)
  process:
    - step: Preparation
      desc: Cleaning and removing the oxide layer.
    - step: Welding
      desc: TIG/MIG with controlled heat input.
    - step: Finishing
      desc: Grinding and finishing.
  applications:
    - Machine building
    - Enclosures
    - Lightweight constructions
  related:
    - label: Aluminium sheet metal work
      desc: Aluminium processing.
    - label: Welding
      desc: All welding methods.
  seo:
    title: Aluminium welding with TIG and MIG
    description: Specialised TIG and MIG welding work in aluminium for machine building, enclosures and
      lightweight constructions.
  faq:
    - vraag: Which technique do you use to weld aluminium?
      antwoord: TIG and MIG. TIG gives the most control over heat input and suits thin material and visible seams;
        MIG is faster and suits thicker material and larger series. We make the choice per order.
    - vraag: Why is welding aluminium harder than steel?
      antwoord: Aluminium conducts heat far more quickly, so more heat is needed and it spreads further through the
        workpiece. In addition, the oxide layer only melts at a far higher temperature than the aluminium
        beneath it, and has to be removed before welding.
    - vraag: How do you limit distortion in aluminium?
      antwoord: By clamping parts, tacking first and determining the welding sequence in advance. After welding we
        check the dimensions. With thin sheet and long seams, that sequence determines the dimensional
        stability of the end product.
    - vraag: What happens to the seam after welding?
      antwoord: That depends on the application. Where appearance matters, we blast with glass beads for an even
        matt surface. If the seam stays out of sight, deburring and a visual inspection are sufficient. Please
        indicate with your request which side is the visible side.
  specs:
    - label: TIG
      value: the most control over heat input — thin material and visible seams
    - label: MIG
      value: faster — thicker material and larger series
    - label: Chosen per order
      value: based on sheet thickness, joint shape and the requirements for appearance
    - label: Heat conduction
      value: far faster than steel; more heat needed, spreading further
    - label: Oxide layer
      value: melts only at a far higher temperature and has to be removed before welding
    - label: Risk with too much heat
      value: distortion
    - label: Risk with poor preparation
      value: porous seams
    - label: Against distortion
      value: clamping, tacking first, welding sequence set in advance, dimensions checked after
    - label: Finishing, visible side
      value: blasting with glass beads in our blast cabin — even matt surface
    - label: Finishing, out of sight
      value: deburring and visual inspection
  aanleveren:
    - The drawing with the sheet thickness and the alloy
    - The joint geometry
    - Which side is the visible side — that determines both the welding choice and the finishing
    - Quantity

# Duitse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
de:
  title: Aluminiumschweißen
  h1: Aluminium schweißen
  intro: 'Aluminium verlangt Handwerkskunst: die richtige Wärmeeinbringung, Vorbehandlung und Technik. Wir
    schweißen Aluminium mit WIG und MIG, verzugsarm und sauber.'
  heroPhoto:
    subject: Aluminium-Schweißnaht im Detail mit gleichmäßiger Raupe
  body:
    - "Aluminium verhält sich beim Schweißen grundlegend anders als Stahl oder Edelstahl. Es leitet Wärme
      deutlich schneller ab, sodass mehr Wärme zum Aufschmelzen nötig ist und sich diese Wärme weiter im
      Werkstück verteilt. Hinzu kommt die Oxidschicht: Sie schmilzt erst bei einer weit höheren Temperatur als
      das darunterliegende Aluminium und muss vor dem Schweißen entfernt werden."
    - Um Verzug zu begrenzen, spannen wir Teile auf, heften zuerst und legen die Schweißfolge vorab fest; nach
      dem Schweißen prüfen wir die Maße. Die Blechbearbeitung, die einer solchen Baugruppe vorausgeht —
      Schneiden, Abkanten und Veredeln — beschreiben wir auf unserer Seite über <a
      href="/de/plaatwerk/aluminium/">Aluminium-Blechbearbeitung</a>.
    - Nach dem Schweißen bestimmt die Anwendung, wie weit wir bei der Nachbehandlung gehen. Wo das Aussehen
      zählt, strahlen wir in unserer Strahlkabine mit Glasperlen, was eine gleichmäßig matte Oberfläche
      ergibt. Wo die Naht funktional ist und verdeckt bleibt, genügen Entgraten und Sichtprüfung.
  materials:
    - Aluminium (verschiedene Legierungen)
  process:
    - step: Vorbereitung
      desc: Reinigen und Oxidschicht entfernen.
    - step: Schweißen
      desc: WIG/MIG mit beherrschter Wärmeeinbringung.
    - step: Nachbearbeitung
      desc: Schleifen und Endbearbeitung.
  applications:
    - Maschinenbau
    - Gehäuse
    - Leichtbaukonstruktionen
  related:
    - label: Aluminium-Blechbearbeitung
      desc: Aluminiumverarbeitung.
    - label: Schweißen
      desc: Alle Schweißverfahren.
  seo:
    title: Aluminium schweißen mit WIG und MIG
    description: Spezialisierte WIG- und MIG-Schweißarbeit in Aluminium für Maschinenbau, Gehäuse und
      Leichtbaukonstruktionen.
  faq:
    - vraag: Mit welchem Verfahren schweißen Sie Aluminium?
      antwoord: Mit WIG und MIG. WIG bietet die größte Kontrolle über die Wärmeeinbringung und eignet sich für
        dünnes Material und Sichtnähte; MIG ist schneller und passt zu dickerem Material und größeren Serien.
        Die Wahl treffen wir pro Auftrag.
    - vraag: Warum ist das Schweißen von Aluminium schwieriger als bei Stahl?
      antwoord: Aluminium leitet Wärme deutlich schneller ab, sodass mehr Wärme nötig ist und sich diese weiter im
        Werkstück verteilt. Zudem schmilzt die Oxidschicht erst bei einer weit höheren Temperatur als das
        darunterliegende Aluminium und muss vor dem Schweißen entfernt werden.
    - vraag: Wie begrenzen Sie den Verzug bei Aluminium?
      antwoord: Indem wir Teile aufspannen, zuerst heften und die Schweißfolge vorab festlegen. Nach dem Schweißen
        prüfen wir die Maße. Bei dünnem Blech und langen Nähten bestimmt diese Reihenfolge die Maßhaltigkeit
        des Endprodukts.
    - vraag: Was geschieht nach dem Schweißen mit der Naht?
      antwoord: Das hängt von der Anwendung ab. Wo das Aussehen zählt, strahlen wir mit Glasperlen für eine
        gleichmäßig matte Oberfläche. Bleibt die Naht verdeckt, genügen Entgraten und eine Sichtprüfung. Geben
        Sie bei Ihrer Anfrage an, welche Seite die Sichtseite ist.
  specs:
    - label: WIG
      value: die größte Kontrolle über die Wärmeeinbringung — dünnes Material und Sichtnähte
    - label: MIG
      value: schneller — dickeres Material und größere Serien
    - label: Wahl je Auftrag
      value: anhand von Blechdicke, Nahtform und Anforderungen an das Aussehen
    - label: Wärmeleitung
      value: deutlich schneller als Stahl; mehr Wärme nötig, die sich weiter verteilt
    - label: Oxidschicht
      value: schmilzt erst bei weit höherer Temperatur und muss vor dem Schweißen entfernt werden
    - label: Risiko bei zu viel Wärme
      value: Verzug
    - label: Risiko bei falscher Vorbereitung
      value: poröse Nähte
    - label: Gegen Verzug
      value: Aufspannen, zuerst heften, Schweißfolge vorab festlegen, Maße danach prüfen
    - label: Nachbehandlung Sichtseite
      value: Strahlen mit Glasperlen in unserer Strahlkabine — gleichmäßig matte Oberfläche
    - label: Nachbehandlung verdeckt
      value: Entgraten und Sichtprüfung
  aanleveren:
    - Die Zeichnung mit der Blechdicke und der Legierung
    - Die Nahtform
    - Welche Seite die Sichtseite ist — das bestimmt sowohl die Verfahrenswahl als auch die Nachbehandlung
    - Stückzahl
specs:
  - label: TIG
    value: de meeste controle over de warmte-inbreng — dun materiaal en zichtnaden
  - label: MIG
    value: sneller — dikker materiaal en grotere series
  - label: Keuze per opdracht
    value: op basis van plaatdikte, naadvorm en de eis aan het uiterlijk
  - label: Warmtegeleiding
    value: veel sneller dan staal; meer warmte nodig, die zich verder verspreidt
  - label: Oxidehuid
    value: smelt pas bij een veel hogere temperatuur en moet vóór het lassen worden verwijderd
  - label: Risico bij te veel warmte
    value: vervorming
  - label: Risico bij verkeerde voorbereiding
    value: poreuze naden
  - label: Tegen vervorming
    value: opspannen, eerst hechten, lasvolgorde vooraf bepalen, maten na controleren
  - label: Afwerking zichtzijde
    value: stralen met glasparels in onze straalcabine — egaal mat oppervlak
  - label: Afwerking uit het zicht
    value: ontbramen en visueel controleren
aanleveren:
