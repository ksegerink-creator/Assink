title: 'Persmoeren of trekmoeren: wanneer kies je welke verbinding?'
slug: persmoeren-of-trekmoeren-wanneer-kies-je-welke-verbinding
date: '2026-10-05'
intro: >-
  Bij plaatwerk met schroefdraad kiest u tussen persmoeren en trekmoeren. Beide
  zorgen voor een duurzame draadverbinding in dun materiaal, maar het verschil
  in montagemethode heeft gevolgen voor plaatdikte, toegankelijkheid en
  belastbaarheid. In dit artikel zetten we de verschillen op een rij, zodat u de
  juiste keuze kunt maken voordat de tekening naar productie gaat.
secties:
  - kop: Wat is het verschil tussen een persmoer en een trekmoer?
    alineas:
      - >-
        Een persmoer wordt in een voorgeponst gat in de plaat gedrukt, meestal
        met een pers of een hydraulisch gereedschap. Door de druk vervormt het
        materiaal rond de moer zich in de kartelring of groeven van de persmoer,
        waardoor deze verankerd raakt en verdraaiing en uittrekken wordt
        tegengegaan. Persmoeren worden doorgaans aangebracht vóór het lassen of
        poedercoaten, in een vlakke plaat die nog goed bereikbaar is.
      - >-
        Een trekmoer wordt met een speciaal trekgereedschap in het gat
        getrokken: het gereedschap vervormt de rand van het gat zodat de moer
        zich vastzet in de plaat. Trekmoeren zijn met name geschikt voor
        situaties waarin de achterzijde van de plaat lastig of niet bereikbaar
        is, omdat het aanbrengen in één beweging vanaf één kant gebeurt, ook na
        het buigen of samenstellen van een constructie.
    lijst: []
  - kop: Plaatdikte en materiaalgeschiktheid
    alineas:
      - >-
        Persmoeren vragen om voldoende materiaaldikte om de kartelring goed te
        laten verankeren. Bij te dun materiaal bestaat het risico dat de moer
        onvoldoende grip krijgt of dat de plaat rond het gat vervormt.
        Trekmoeren zijn vaak een geschikter alternatief bij dunnere plaat, omdat
        de trekmethode minder afhankelijk is van de hoeveelheid materiaal rond
        het gat.
      - >-
        Welke oplossing het beste past, hangt mede af van het materiaal: RVS,
        aluminium en staal reageren verschillend op de vervormingskrachten die
        bij het aanbrengen vrijkomen. Dit bepalen we het liefst in overleg, aan
        de hand van uw tekening.
    lijst: []
  - kop: Toegankelijkheid van de achterzijde
    alineas:
      - >-
        Dit is vaak de doorslaggevende factor. Kunt u bij het ontwerp nog bij de
        achterkant van de plaat, dan is een persmoer een logische keuze: deze
        wordt meestal in een vroeg stadium van het proces aangebracht. Is de
        achterzijde na montage of buigwerk niet meer bereikbaar, bijvoorbeeld in
        een gesloten behuizing of een frame met meerdere gesloten zijden, dan
        biedt een trekmoer uitkomst omdat deze volledig vanaf de voorzijde wordt
        geplaatst.
    lijst: []
  - kop: Uittrekkracht, doldraaikracht en aantal montagecycli
    alineas:
      - >-
        Persmoeren en trekmoeren verschillen in de manier waarop ze belasting
        opnemen. Een persmoer zet zich doorgaans over een groter oppervlak vast,
        wat gunstig kan zijn bij hogere uittrek- of doldraaikrachten. Een
        trekmoer is vooral ontworpen voor toepassingen waarbij bereikbaarheid
        vanaf één zijde telt, en kan afhankelijk van uitvoering en plaatdikte
        net iets anders presteren op uittrek- en doldraaikracht.
      - >-
        Ook het aantal montage- en demontagecycli dat een verbinding moet
        doorstaan, speelt mee: bij veelvuldig vast- en losdraaien is een goede
        verankering in de plaat essentieel om los raken of doldraaien te
        voorkomen. Concrete kracht- en cycluswaarden hangen sterk af van
        moertype, materiaal en plaatdikte, en bespreken we het liefst per
        project zodat we geen cijfers noemen die voor uw situatie niet kloppen.
    lijst: []
  - kop: Zichtzijde en afwerking
    alineas:
      - >-
        Bij zichtwerk speelt mee dat een persmoer en een trekmoer een net iets
        andere afdruk achterlaten aan de voor- en achterzijde van de plaat. Als
        de esthetiek van een zichtzijde belangrijk is, bijvoorbeeld bij een RVS
        frame of een industriële behuizing, geven wij daar in de
        werkvoorbereiding advies over, afgestemd op waar de verbinding straks
        zichtbaar is in de uiteindelijke toepassing.
    lijst: []
  - kop: Welke informatie hebben wij nodig?
    alineas:
      - >-
        Om de juiste keuze tussen persmoer en trekmoer te maken, hebben wij van
        u nodig: de plaatdikte en het materiaal, de locatie van de verbinding en
        de bereikbaarheid van de achterzijde na montage, de gewenste draadmaat,
        en of de verbinding regelmatig losgedraaid wordt of eenmalig blijft
        zitten. Ook is relevant of de positie in het zicht komt te liggen. Op
        basis daarvan adviseren wij welke oplossing het beste past bij uw
        constructie. Meer informatie over onze opties voor persmoeren en
        trekmoeren vindt u op <a href="/plaatwerk/persmoeren-trekmoeren/">onze
        pagina over persmoeren en trekmoeren</a>.
      - >-
        Bij een frame of behuizing waar schroefdraadverbindingen samenkomen met
        andere eisen, zoals maatvastheid na lassen, is het raadzaam dit in een
        vroeg stadium te bespreken. Zie ook ons artikel over <a
        href="/kennisbank/rvs-frame-laten-maken-wat-de-werkvoorbereider-van-u-nodig-heeft/">wat
        de werkvoorbereider nodig heeft bij een RVS frame</a>.
    lijst: []
faq:
  - vraag: Kan ik persmoeren en trekmoeren in dezelfde plaat combineren?
    antwoord: >-
      Ja, dat komt voor, bijvoorbeeld wanneer een deel van de plaat tijdens
      productie nog bereikbaar is en een ander deel pas na montage wordt
      voorzien van schroefdraad. Wij bepalen per verbinding wat het beste past.
  - vraag: Is een trekmoer altijd een goed alternatief als een persmoer niet past?
    antwoord: >-
      Niet per definitie. De keuze hangt af van plaatdikte, materiaal, belasting
      en het aantal keer dat de verbinding wordt gebruikt. Daarom bekijken wij
      dit per situatie aan de hand van uw tekening.
  - vraag: Werkt dit ook in RVS en aluminium?
    antwoord: >-
      Persmoeren en trekmoeren worden toegepast in verschillende materialen,
      waaronder RVS en aluminium. Het materiaal beïnvloedt wel hoe de moer zich
      bij het aanbrengen in de plaat vastzet, dus dit nemen we mee in het
      advies.
  - vraag: Wat moet ik aanleveren om een advies te krijgen?
    antwoord: >-
      Een PDF-tekening en een 3D STEP-bestand geven ons voldoende inzicht in
      plaatdikte, locatie en bereikbaarheid om een onderbouwd advies te geven.
