title: 'Verspaning uitbesteden: wat wij zelf doen en wat de partner doet'
slug: verspaning-uitbesteden-wat-wij-zelf-doen-en-wat-de-partner-doet
date: '2026-09-07'
intro: >-
  Wie draai- of freeswerk laat maken als onderdeel van een grotere
  samenstelling, krijgt te maken met een keten van partijen: plaatwerk,
  constructie, verspaning en eindmontage. Voor een werkvoorbereider of inkoper
  is het dan belangrijk om te weten wie welke stap doet, welke informatie waar
  nodig is, en wie het aanspreekpunt blijft als er iets moet worden afgestemd.
  Dit artikel beschrijft die keten vanuit de praktijk, en waar Assink &
  Schipholt daarin precies staat.
secties:
  - kop: Wat wij zelf doen, en wat niet
    alineas:
      - >-
        Assink & Schipholt voert verspaningswerk zoals draaien, frezen, boren en
        kotteren niet zelf uit. Dat werk laten wij maken door een vaste partner
        waarmee wij al langer samenwerken. Zelf verzorgen wij de regie over dat
        proces, het plaat- en constructiewerk, en de samenstelling van het
        complete product.
      - >-
        Dat betekent dat een aanvraag waarin plaatwerk, constructie en
        verspaande onderdelen samenkomen bij ons als één traject wordt
        behandeld. U hoeft niet zelf te schakelen tussen een plaatwerkbedrijf en
        een verspaner: wij stemmen dat onderling af en bewaken dat de onderdelen
        op elkaar aansluiten in maatvoering, planning en kwaliteit.
      - >-
        Meer over onze aanpak van verspaning en de samenwerking met onze partner
        leest u op <a href="/verspaning/">de dienstpagina over verspaning</a>.
    lijst: []
  - kop: Welke informatie moet mee met een aanvraag
    alineas:
      - >-
        Hoe vollediger de aanvraag, hoe minder heen-en-weer later in het
        traject. Voor draai- en freeswerk is in ieder geval onderstaande
        informatie nodig om een goede inschatting van doorlooptijd en
        haalbaarheid te maken.
    lijst:
      - Tekening of 3D-model met alle relevante maten, aanzichten en doorsnedes
      - >-
        Materiaalspecificatie: soort en kwaliteit (bijvoorbeeld RVS 304, RVS
        316, aluminium, messing of staal)
      - >-
        Aantallen: gaat het om een prototype, een kleine serie of een
        terugkerende bestelling
      - >-
        Toleranties per maat of vlak, waar deze afwijken van algemene
        toleranties
      - >-
        Gewenste nabewerking, zoals ontbramen, stralen, passiveren of een
        oppervlaktebehandeling
      - Of het onderdeel losstaat of onderdeel is van een grotere samenstelling
  - kop: Waarom het uitmaakt of een onderdeel deel is van een samenstelling
    alineas:
      - >-
        Een verspaand onderdeel dat op zichzelf staat, wordt anders beoordeeld
        dan een onderdeel dat later moet passen in een gelaste of gemonteerde
        constructie. Bij een samenstelling telt niet alleen de maatvoering van
        het losse deel, maar ook hoe het aansluit op aangrenzende plaatdelen,
        lasnaden of andere verspaande componenten.
      - >-
        Dat heeft gevolgen voor de volgorde van bewerkingen. Een verspaand deel
        dat na het lassen nog moet passen, vraagt om afstemming over wanneer het
        gemaakt wordt en met welke marge. Ook nabehandeling speelt hierin mee:
        bij RVS dat gelast wordt, hoort altijd passiveren na het lassen, naast
        ontbramen en waar nodig glasparelstralen. Dat geldt voor het geheel,
        niet alleen voor het verspaande onderdeel.
      - >-
        Door dit vooraf te melden, kan de volgorde van verspanen, plaatwerk,
        lassen en nabehandelen zo worden ingericht dat onderdelen elkaar niet in
        de weg zitten en het eindresultaat binnen tolerantie past.
    lijst: []
  - kop: Wat een vaste partner betekent voor doorlooptijd en aanspreekpunt
    alineas:
      - >-
        Een vaste samenwerking met een verspaningspartner heeft praktische
        voordelen ten opzichte van telkens wisselende toeleveranciers. Doordat
        de partner bekend is met onze manier van werken en aanleveren, verloopt
        de afstemming over tekeningen, materialen en planning sneller dan bij
        een eenmalige inkooprelatie.
      - >-
        Voor u als opdrachtgever blijft er één aanspreekpunt: Assink &
        Schipholt. Wij bewaken de planning van het verspaningswerk in relatie
        tot het plaatwerk en de samenstelling, en communiceren over voortgang of
        eventuele afwijkingen. U hoeft niet zelf te schakelen tussen meerdere
        leveranciers om te weten waar een order staat.
    lijst: []
faq:
  - vraag: Voert Assink & Schipholt verspaningswerk zelf uit?
    antwoord: >-
      Nee. Draaien, frezen, boren en kotteren laten wij uitvoeren door een vaste
      partner. Wij verzorgen zelf de regie, het plaat- en constructiewerk en de
      samenstelling van het complete product.
  - vraag: Welke gegevens heb ik nodig om verspaningswerk aan te vragen?
    antwoord: >-
      Minimaal een tekening of 3D-model, de materiaalspecificatie, de gewenste
      aantallen, toleranties waar relevant en de gewenste nabewerking. Geef ook
      aan of het onderdeel op zichzelf staat of deel uitmaakt van een grotere
      samenstelling.
  - vraag: >-
      Waarom is het belangrijk te melden dat een verspaand onderdeel bij een
      samenstelling hoort?
    antwoord: >-
      Dan kan de volgorde van verspanen, plaatwerk, lassen en nabehandelen op
      elkaar worden afgestemd, zodat het onderdeel na montage of laswerk nog
      binnen tolerantie past.
  - vraag: Wordt RVS na het lassen altijd nabehandeld?
    antwoord: >-
      Ja. Bij RVS volgt na het lassen altijd passiveren, naast ontbramen en waar
      nodig glasparelstralen. Passiveren herstelt de beschermende oxidelaag die
      door het lassen is aangetast.
gepubliceerd: true
