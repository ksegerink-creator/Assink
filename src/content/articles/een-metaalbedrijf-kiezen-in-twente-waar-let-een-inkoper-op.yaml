title: 'Een metaalbedrijf kiezen in Twente: waar let een inkoper op?'
slug: een-metaalbedrijf-kiezen-in-twente-waar-let-een-inkoper-op
date: '2026-10-12'
intro: >-
  Wie in Twente op zoek gaat naar een metaalbedrijf, vindt een flink aanbod aan
  plaatwerkers, lasbedrijven en constructiebedrijven. Voor een inkoper of
  werkvoorbereider is de vraag niet wie het hardste roept, maar wie aantoonbaar
  levert wat is afgesproken: de juiste kwaliteit, op tijd, met vastgelegde
  procesborging. Dit artikel zet de belangrijkste afwegingen op een rij, van
  certificeringen tot de vraag of bewerkingen onder één dak plaatsvinden.
secties:
  - kop: 'Certificeringen: wat zeggen ze echt?'
    alineas:
      - >-
        Certificaten worden vaak als vinkje behandeld, terwijl ze ieder iets
        anders borgen. Het loont om te weten wat je precies afdwingt als je een
        certificaat vraagt.
      - >-
        ISO 9001 zegt iets over het kwaliteitsmanagementsysteem van een bedrijf
        in brede zin: zijn processen beschreven, worden afwijkingen vastgelegd
        en opgevolgd, is er een structuur voor continue verbetering. Het zegt
        niets specifieks over lassen of constructiewerk.
      - >-
        ISO 3834-2 is wél specifiek voor laswerk. Deze norm stelt eisen aan
        laskwalificaties van personeel, lasprocedures (WPS/WPQR), apparatuur en
        controle tijdens het hele lasproces. Voor wie laswerk uitbesteedt waar
        maatvastheid en herhaalbaarheid toe doen, is dit een relevantere
        indicator dan ISO 9001 alleen.
      - >-
        EN 1090-1 is verplicht voor het vervaardigen van draagconstructies die
        onder de CE-markering vallen. Dit certificaat is vooral van belang bij
        constructiewerk: staalconstructies, frames en andere dragende elementen.
        Zonder EN 1090-1 mag een leverancier dit type werk formeel niet
        CE-markeren.
      - >-
        Vraag dus niet alleen óf een leverancier gecertificeerd is, maar welke
        certificering bij welk deel van de opdracht hoort. Meer over hoe wij dit
        invullen staat op <a href="/kwaliteit/">onze kwaliteitspagina</a>.
    lijst: []
  - kop: 'Bewerkingen onder één dak: waarom dat uitmaakt'
    alineas:
      - >-
        Een opdracht die langs meerdere onderaannemers gaat — snijden bij de ene
        partij, kanten bij de andere, lassen en nabehandelen bij een derde —
        kent meer overdrachtsmomenten. Elk overdrachtsmoment is een kans op
        planningsverlies, afwijkende interpretatie van de tekening of een
        kwaliteitsissue dat pas laat aan het licht komt.
      - >-
        Wanneer lasersnijden, kanten, lassen en nabehandelen (ontbramen,
        stralen, passiveren) onder één dak gebeuren, ligt de
        verantwoordelijkheid voor het complete traject bij één partij. Dat
        vereenvoudigt niet alleen de communicatie, maar ook de
        kwaliteitsborging: er is één partij die het hele proces kan overzien en
        documenteren.
      - >-
        Dit geldt ook voor bewerkingen die een metaalbedrijf bewust niet zelf
        doet. Verspaning zoals draaien, frezen en boren wordt bij veel
        plaatwerkers uitbesteed aan een vaste partner, waarbij het metaalbedrijf
        de regie en de uiteindelijke samenstelling voert. Vraag een leverancier
        dus concreet welke stappen intern gebeuren en welke extern, en wie de
        eindverantwoordelijkheid draagt voor de samengestelde constructie.
      - >-
        Meer achtergrond over hoe wij dit organiseren vindt u in <a
        href="/kennisbank/verspaning-uitbesteden-wat-wij-zelf-doen-en-wat-de-partner-doet/">dit
        artikel over verspaning uitbesteden</a>.
    lijst: []
  - kop: Eén aanspreekpunt en wat dat oplevert voor doorlooptijd
    alineas:
      - >-
        Naast de technische kant is er de organisatorische kant: met hoeveel
        contactpersonen heeft u te maken bij vertraging, een tekeningwijziging
        of een vraag over nabehandeling? Bij een leverancier met één
        aanspreekpunt voor het hele traject hoeft u niet zelf te schakelen
        tussen snijbedrijf, lasbedrijf en straalbedrijf.
      - >-
        Dat is vooral merkbaar bij wijzigingen tijdens productie. Eén
        aanspreekpunt dat het hele proces overziet, kan sneller inschatten wat
        een wijziging betekent voor planning en doorlooptijd, zonder dat eerst
        meerdere partijen moeten worden geraadpleegd.
      - >-
        Voor een indruk van hoe lang wij als metaalbedrijf in Hengelo al in deze
        rol opereren, zie <a href="/over-ons/">onze bedrijfspagina</a>.
    lijst: []
  - kop: Vragen die u een leverancier stelt over capaciteit
    alineas:
      - >-
        Capaciteit is lastig te beoordelen op basis van een website alleen. Een
        paar concrete vragen helpen om dit scherp te krijgen.
      - >-
        Vraag naar het eigen machinepark: welke machines heeft de leverancier in
        huis, en voor welke materialen en afmetingen zijn die geschikt? Een
        leverancier die zelf lasersnijdt, buislasersnijdt en kant, is minder
        afhankelijk van de planning van derden dan een partij die dit
        uitbesteedt.
      - >-
        Vraag ook naar hijs- en transportcapaciteit als het om zwaardere
        constructies gaat, en naar maximale plaatmaten en wanddiktes als het om
        plaatwerk of buiswerk gaat. Dit bepaalt direct of een onderdeel in één
        stuk gemaakt kan worden of dat er gelast moet worden, wat weer gevolgen
        heeft voor doorlooptijd en kosten.
    lijst:
      - Welke materialen en materiaaldiktes worden in eigen huis verwerkt?
      - Wat is de maximale plaatmaat, buislengte en het maximale stukgewicht?
      - >-
        Welke lasmethoden zijn in huis beschikbaar, en zijn lassers
        gekwalificeerd volgens ISO 3834-2?
      - >-
        Hoe wordt nabehandeling van RVS geregeld, inclusief passiveren na het
        lassen?
      - Welke stukken van het proces worden uitbesteed, en aan wie?
  - kop: Vragen over kwaliteitsvastlegging
    alineas:
      - >-
        Capaciteit zegt iets over wát een leverancier kan maken;
        kwaliteitsvastlegging zegt iets over hoe aantoonbaar dat gebeurt. Vraag
        hoe lasprocedures worden vastgelegd en getoetst, en of er
        inspectierapporten of keuringscertificaten beschikbaar zijn per order.
      - >-
        Vraag ook specifiek door op materiaalcertificaten: kan de leverancier
        aantonen welk materiaal (bijvoorbeeld RVS 304 of 316) daadwerkelijk is
        verwerkt? En hoe wordt dit administratief gekoppeld aan de order? Dit is
        vooral relevant in sectoren met strengere eisen, zoals voedingsmiddelen
        of installaties waar RVS wordt toegepast.
      - >-
        Tot slot: vraag hoe afwijkingen tijdens productie worden gemeld en
        opgevolgd. Een leverancier die dit proactief doet, voorkomt dat een
        afwijking pas bij aflevering aan het licht komt.
    lijst: []
faq:
  - vraag: Is ISO 9001 voldoende als certificering voor een metaalbedrijf?
    antwoord: >-
      ISO 9001 zegt iets over het kwaliteitsmanagementsysteem in algemene zin,
      maar niets specifiek over lasprocessen of constructiewerk. Voor laswerk is
      ISO 3834-2 relevanter, en voor dragende staalconstructies is EN 1090-1 van
      belang.
  - vraag: >-
      Waarom is het gunstig als snijden, kanten en lassen bij dezelfde
      leverancier gebeuren?
    antwoord: >-
      Minder overdrachtsmomenten betekent minder kans op planningsverlies of
      afwijkende interpretatie van de tekening, en één partij die het hele
      proces kan overzien en documenteren.
  - vraag: >-
      Welke documenten heeft een metaalbedrijf nodig om een aanvraag te
      beoordelen?
    antwoord: >-
      Doorgaans een PDF-tekening én een 3D STEP-bestand. Beide zijn nodig: de
      tekening voor maatvoering en toleranties, het 3D-model voor productie en
      eventuele nestings bij het snijden.
  - vraag: >-
      Is een metaalbedrijf in Twente per definitie geschikter dan een landelijke
      partij?
    antwoord: >-
      Niet per definitie, maar de nabijheid kan de communicatielijnen korter
      maken, vooral bij wijzigingen tijdens productie of bij spoedorders. De
      beoordelingscriteria op het gebied van certificering, capaciteit en
      kwaliteitsvastlegging blijven echter hetzelfde, ongeacht de regio.
gepubliceerd: true
seo:
  title: 'Metaalbedrijf kiezen: afwegingskader voor inkopers'
  description: >-
    Waar let een inkoper op bij het kiezen van een metaalbedrijf?
    Certificeringen, capaciteit en kwaliteitsvastlegging op een rij, met focus
    op Twente.
