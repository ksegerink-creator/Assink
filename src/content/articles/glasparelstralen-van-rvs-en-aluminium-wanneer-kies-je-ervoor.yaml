title: "Glasparelstralen van RVS en aluminium: wanneer kies je ervoor?"
slug: glasparelstralen-van-rvs-en-aluminium-wanneer-kies-je-ervoor
date: "2026-11-09"
intro: Glasparelstralen is een nabehandeling die een egaal, mat oppervlak
  oplevert en lasverkleuringen en verontreiniging van RVS en aluminium
  verwijdert. Het is een veelgevraagde stap na laswerk, maar wordt regelmatig
  verward met passiveren. In dit artikel leggen we uit wat glasparelstralen
  precies doet, wanneer je het inzet en waarom het bij RVS geen vervanging is
  voor passiveren.
secties:
  - kop: Wat gebeurt er bij glasparelstralen
    alineas:
      - Bij glasparelstralen worden kleine glasparels met perslucht op het
        oppervlak geschoten. Dit haalt aanloopkleuren (de verkleuring die na
        lassen rond de las ontstaat), oppervlakteverontreiniging en kleine
        onregelmatigheden weg. Het resultaat is een visueel egaal, mat
        oppervlak, zonder de glans die bij gepolijst RVS hoort.
      - Wij voeren dit uit in een straalcabine van 8 x 4 x 3 m, met glasparels
        van 100-200 μm en een werkdruk van 3,0 bar. Deze cabine is geschikt voor
        zowel RVS als aluminium. Omdat de werkstukken rondom bereikbaar zijn,
        kan ook grotere constructies in één keer gelijkmatig worden behandeld.
  - kop: Wanneer kies je voor glasparelstralen
    alineas:
      - "Glasparelstralen wordt vooral toegepast als onderdeel van de
        nabehandeling na lassen, als tussenstap na ontbramen en vóór een
        eventuele vervolgbewerking. Het is met name relevant wanneer:"
    lijst:
      - lasnaden en aanloopkleuren esthetisch ongewenst zijn, bijvoorbeeld bij
        zichtbare frames of panelen
      - een gelijkmatige, matte uitstraling gewenst is over het hele oppervlak
      - kleine oppervlakteverontreinigingen (zoals slijpstof of resten van
        bewerking) verwijderd moeten worden voordat een volgende stap volgt
  - kop: Stralen is niet hetzelfde als passiveren
    alineas:
      - "Een veelgemaakte misvatting is dat glasparelstralen de
        corrosiebestendigheid van RVS herstelt. Dat is niet zo: stralen
        verwijdert verontreiniging en verkleuring, maar herstelt de beschermende
        oxidelaag niet. Die oxidelaag kan juist beschadigd raken door de
        warmte-inbreng van het lassen, en dat vraagt om een aparte stap:
        passiveren."
      - 'Bij RVS en laswerk hanteren wij daarom standaard deze volgorde: eerst
        ontbramen, waar nodig glasparelstralen, en na het lassen passiveren.
        Stralen zorgt voor het visuele en oppervlaktetechnische resultaat;
        passiveren zorgt dat de chroomoxidelaag hersteld wordt en het materiaal
        weer de corrosiebestendigheid heeft die bij RVS hoort. Meer over waarom
        die stap na lassen nodig is, lees je in <a
        href="/kennisbank/waarom-rvs-passiveren-na-het-lassen/">ons artikel over
        passiveren van RVS</a>.'
      - "Voor een opdracht in RVS met laswerk adviseren wij dan ook altijd om
        beide stappen te benoemen in de specificatie: glasparelstralen voor het
        oppervlak, passiveren voor de corrosiebestendigheid."
  - kop: Toepassing bij aluminium
    alineas:
      - Bij aluminium speelt passivering in dezelfde zin niet, maar
        glasparelstralen wordt hier evengoed toegepast om een gelijkmatig, mat
        oppervlak te krijgen en lasverkleuring of oppervlaktevervuiling weg te
        werken. Houd er rekening mee dat aluminium zich qua warmte-inbreng en
        bewerking anders gedraagt dan RVS en staal; meer hierover staat in ons
        artikel over <a
        href="/kennisbank/aluminium-plaatbewerking-wat-anders-gaat-dan-bij-staal-en-rvs/">aluminium
        plaatbewerking</a>.
faq:
  - vraag: Vervangt glasparelstralen het passiveren van RVS?
    antwoord: Nee. Stralen verwijdert aanloopkleuren en verontreiniging en geeft een
      egaal, mat oppervlak, maar herstelt de beschermende oxidelaag niet.
      Passiveren is de stap die dat wel doet en is bij laswerk in RVS een
      aparte, noodzakelijke bewerking.
  - vraag: Kan glasparelstralen op zowel RVS als aluminium?
    antwoord: Ja. Onze straalcabine is geschikt voor beide materialen en werkt met
      glasparels van 100-200 μm bij een werkdruk van 3,0 bar.
  - vraag: In welke volgorde vinden ontbramen, stralen en passiveren plaats?
    antwoord: "Bij RVS hanteren wij de volgorde: eerst ontbramen, waar nodig
      glasparelstralen, en na het lassen passiveren. Elke stap heeft een eigen
      functie en vervangt de andere niet."
  - vraag: Geeft glasparelstralen een glanzend of mat resultaat?
    antwoord: Glasparelstralen levert een mat, egaal oppervlak op, geen glans. Voor
      een glanzend resultaat is een andere afwerking nodig.
gepubliceerd: false
seo:
  title: "Glasparelstralen RVS: wat doet het en wanneer kiezen?"
  description: "Glasparelstralen van RVS en aluminium: egaal, mat oppervlak en
    verwijdering van aanloopkleuren. Lees waarom dit geen vervanging is voor
    passiveren."
