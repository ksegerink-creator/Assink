# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Structural fitter / welder (junior)
  employmentType: Full-time
  hours: 32 to 40 hours per week
  education: Level 2 (Dutch MBO)
  intro: Fresh out of school or a few years in the trade, and keen to see and learn more? With us you
    mainly do TIG welding and get to know every process in our workshop.
  seoOmschrijving: 'Junior structural fitter/welder vacancy in Hengelo: TIG welding of custom parts, €2,400–3,500
    gross per month, Dutch metal industry CLA.'
  responsibilities:
  - Mainly TIG welding of custom parts, including for the food and medical industries
  - Getting to know MIG/MAG welding, glass bead blasting, laser cutting, press braking and bending
  - Working from technical drawings
  - Building products together with your colleagues, with help whenever you need it
  requirements:
  - TIG welding certificate, level 2
  - 'You work carefully and accurately: quality is not an empty word to you'
  - A team player who can also work independently and with focus
  - You want to keep developing in the metal industry
  aanbod:
  - An informal atmosphere in a close-knit, mostly young team
  - A salary between €2,400 and €3,500 gross per month, in line with your skills
  - Collective agreement for the metal and engineering industry (CAO Metaal en Techniek) with all its
    terms
  - Room to grow, with a training budget under the collective agreement
  - Flexible working hours by arrangement
  photo:
    subject: Welder working on a stainless steel assembly

