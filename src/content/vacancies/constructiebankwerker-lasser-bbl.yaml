title: Constructiebankwerker / lasser (BBL)
slug: constructiebankwerker-lasser-bbl
order: 13
employmentType: Parttime
hours: 24 tot 40 uur per week
education: Niveau 2 (BBL)
intro: Volg je een BBL-opleiding metaal of lastechniek, of ben je dat van plan? Bij ons draai je mee op
  de werkvloer en leer je het vak in de praktijk, met ervaren collega's naast je.
seoOmschrijving: 'BBL-plek constructiebankwerker/lasser in Hengelo: leer TIG-lassen en meer in de praktijk,
  begeleid door vakmensen, CAO Metaal en Techniek.'
responsibilities:
- Meedraaien op de werkvloer, met TIG-lassen als basis
- Kennismaken met MIG/MAG-lassen, glasstralen, lasersnijden, kanten en zetten
- Technische tekeningen leren lezen en begrijpen
- Een kijkje nemen bij de andere metaalbedrijven in de groep, om te ontdekken welke richting bij je past
requirements:
- Je volgt een BBL-opleiding metaalbewerking of lastechniek, of bent dat van plan
- 'Nieuwsgierig en leergierig: je wilt het vak écht leren'
- Je werkt secuur en begrijpt dat kwaliteit belangrijk is
- 'Ervaring is niet nodig: enthousiasme en werkhouding zijn het belangrijkst'
open: true
salarisMin: 950
salarisMax: 2400
salarisPer: maand
aanbod:
- Een leerplek waar je het vak echt leert, in een informele werksfeer
- Een salaris tussen € 950 en € 2.400 per maand, afhankelijk van leeftijd, leerjaar en niveau
- Begeleiding door ervaren vakmensen die tijd voor je maken
- Kennismaken met de specialismen van de andere bedrijven in de groep
- Klikt het van beide kanten, dan is er uitzicht op een vaste plek na je opleiding
- CAO Metaal en Techniek, met een opleidingsbudget
sollicitatieLink: https://www.twentekracht.nl/vacatures/constructiebankwerker-lasser-bbl
geplaatst: '2026-10-14'
