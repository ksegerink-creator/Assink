de:
  title: Konstruktionsschlosser / Schweißer (Senior)
  employmentType: Vollzeit
  hours: 32 bis 40 Stunden pro Woche
  intro: Schon viele Jahre im Beruf und Sie möchten Ihr Wissen an die nächste Generation weitergeben?
    Sie schweißen vor allem WIG und sind Ansprechpartner und Coach für jüngere Kollegen.
  seoOmschrijving: 'Stelle Senior-Konstruktionsschlosser/Schweißer in Hengelo (NL): WIG-Schweißen und
    jüngere Kollegen anleiten, Tarifvertrag, flexible Arbeitszeiten.'
  responsibilities:
  - Vor allem WIG-Schweißen von Maßanfertigungen
  - Sicher in MIG/MAG-Schweißen, Glasperlenstrahlen, Laserschneiden, Kanten und Abkanten
  - 'Ansprechpartner und Coach für jüngere Kollegen: erklären, vormachen und Schritt für Schritt weiterhelfen'
  - Kollegen beim Verstehen technischer Zeichnungen helfen
  requirements:
  - WIG-Schweißzertifikat Niveau 1 oder höher, in der Praxis vielfach bewiesen
  - Sorgfältig und genau, und Sie können das an andere weitergeben
  - Sie leiten gern jüngere oder weniger erfahrene Kollegen an
  - Erfahrung im Lesen und Erklären technischer Zeichnungen
  aanbod:
  - Ein informelles Arbeitsklima in einem engen Team, mit Raum für Ihre Rolle als Coach
  - Ein Gehalt, das zu Ihrer Erfahrung und Ihrem Mehrwert passt
  - Tarifvertrag Metall und Technik (CAO Metaal en Techniek) mit allen Arbeitsbedingungen
  - Weiterbildungsbudget aus dem Tarifvertrag, auch für das Anleiten anderer
  - Flexible Arbeitszeiten nach Absprache
  photo:
    subject: Erfahrener Schweißer leitet einen jungen Kollegen an
