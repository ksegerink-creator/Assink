# Engelse vertaling. Alleen tekst: foto's, slug en volgorde komen uit het Nederlands hierboven.
en:
  title: Structural fitter / welder (senior)
  employmentType: Full-time
  hours: 32 to 40 hours per week
  intro: Years of experience in the trade and keen to pass your knowledge on to the next generation? You
    mainly do TIG welding and act as go-to person and coach for younger colleagues.
  seoOmschrijving: 'Senior structural fitter/welder vacancy in Hengelo: TIG welding and coaching younger
    colleagues, Dutch metal industry CLA, flexible hours.'
  responsibilities:
  - Mainly TIG welding of custom parts
  - At home in MIG/MAG welding, glass bead blasting, laser cutting, press braking and bending
  - 'Go-to person and coach for younger colleagues: explaining, demonstrating and helping them step by
    step'
  - Helping colleagues understand technical drawings
  requirements:
  - TIG welding certificate level 1 or higher, amply proven in practice
  - Careful and accurate, and able to pass that on to others
  - You enjoy guiding and training younger or less experienced colleagues
  - Experience reading and explaining technical drawings
  aanbod:
  - An informal atmosphere in a close-knit team, with room for your role as coach and go-to person
  - A salary in line with your experience and added value
  - Collective agreement for the metal and engineering industry (CAO Metaal en Techniek) with all its
    terms
  - Training budget under the collective agreement, including for coaching others
  - Flexible working hours by arrangement
  photo:
    subject: Experienced welder guiding a young colleague

